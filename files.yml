# Grammar: actions/plan/files_config.ts; tree checks: .github/scripts/sync/writer/files_config.ts;
# contract: docs/sync.md. The modules block's key order is the canonical module order the plan emits.

placeholders:
  - project_name
  - project_slug
  - description
  - github_username
  - github_username_lower
  - copyright_holder
  - fuzzer_label
  - nightly_label

modules:
  bun:
    description: TypeScript/bun toolchain (gitignore, dependabot, CodeQL JS)
    codeql_language: javascript-typescript
    pin: {file: .bun-version, version: 1.4.0}
    dependabot_ecosystems: [bun]
    dependabot_label: {name: javascript, color: "168700"}
    gitignore_sources: [Node, bun]
    agents_toolchain: [toolchain]
    toolchain_steps: [toolchain]
  deno:
    description: Deno toolchain (deno fmt/lint, deno dependabot, CodeQL JS)
    codeql_language: javascript-typescript
    pin: {file: .dvmrc, version: 2.9.5}
    dependabot_ecosystems: [deno]
    dependabot_label: {name: deno, color: "70ffaf"}
    gitignore_sources: [Deno, Node]
    agents_toolchain: [toolchain]
    toolchain_steps: [toolchain]
  uv:
    description: Python/uv toolchain (gitignore, dependabot, CodeQL Python)
    codeql_language: python
    dependabot_ecosystems: [uv]
    dependabot_label: {name: "python:uv", color: "2b67c6"}
    gitignore_sources: [Python]
    agents_toolchain: [toolchain]
    toolchain_steps: [toolchain]
  rust:
    description: Rust/cargo toolchain (cargo dependabot, Rust gitignore; no CodeQL)
    dependabot_ecosystems: [cargo]
    dependabot_label: {name: rust, color: "000000"}
    gitignore_sources: [Rust]
    agents_toolchain: [toolchain]
  site:
    description: one GitHub Pages site per repository (the repo-owned site-build hook's website at the root, docs/ rendered under the central fleet theme)
    path: docs
    tracking_label: {key: site, default: docs-link-rot, color: D4A72C, description: Automated docs-site link-rot report}
  release-please:
    description: release-please releases through the fleet's release pipeline, plus autorelease labels
  pr-title:
    description: Conventional Commit PR title check, its own required workflow
  fuzzer:
    description: nightly fuzz starter with issue filing, replay inputs, auto-close
    gitignore_sources: [fuzzer]
    tracking_label: {key: fuzzer, default: fuzz-nightly, color: B60205, description: Automated nightly fuzz failure}
  nightly:
    description: nightly CI starter with failure issue filing and auto-close
    tracking_label: {key: nightly, default: nightly-failure, color: D93F0B, description: Automated nightly CI failure}
  custom-license:
    description: repo carries its own license in LICENSE.md; the fleet license is not written

# The settings layers (docs/settings.md): the baseline, then each layer whose
# `when` holds in this order, folded under the repository's
# .github/settings.local.yml overlay into its rendered .github/settings.yml;
# the override merges above the overlay. A layer file is DECLARED here, never
# discovered from the tree.
settings:
  baseline: files/settings/baseline.yml
  layers:
    - {source: files/settings/public.yml, when: {private: false}}
    - {source: files/settings/private.yml, when: {private: true}}
    - {source: files/bun/settings.yml, when: {modules: [bun]}}
    - {source: files/deno/settings.yml, when: {modules: [deno]}}
    - {source: files/uv/settings.yml, when: {modules: [uv]}}
    - {source: files/rust/settings.yml, when: {modules: [rust]}}
    - {source: files/site/settings.yml, when: {modules: [site]}}
    - {source: files/release-please/settings.yml, when: {modules: [release-please]}}
    - {source: files/pr-title/settings.yml, when: {modules: [pr-title]}}
    - {source: files/settings/codeql-public.yml, when: {private: false, any: {declaring: codeql_language}}}
  override: files/settings/override.yml

files:
  # --- base: every repository
  - {path: .editorconfig, class: split, region: hash}
  - {path: .gitattributes, class: split, region: hash}
  - {path: .gitignore, class: split, region: hash, blocks: gitignore_sources}
  - {path: .github/CODEOWNERS, class: split, region: hash}
  - {path: .github/dependabot.yml, class: managed, blocks: dependabot_ecosystems}
  - {path: .github/actionlint.yaml, class: starter}
  - {path: .github/instructions/review.instructions.md, class: managed}
  # The overlay starters precede the rendered document, which reads the
  # overlay they seed in the same run.
  - {path: .github/settings.local.yml, class: starter, when: {private: false}}
  - {path: .github/settings.local.yml, class: starter, when: {private: true}, source: files/base/.github/settings.local.private.yml}
  - {path: .github/settings.yml, class: managed, render: settings, overlay: .github/settings.local.yml}
  - {path: .github/workflows/ci.yml, class: managed}
  - {path: .github/workflows/checks.yml, class: starter, blocks: toolchain_steps}
  - {path: .github/workflows/post-green.yml, class: starter}
  - {path: .github/workflows/update-release.yml, class: starter}
  - {path: .github/workflows/update-release-pr.yml, class: starter}
  - {path: .github/actions/site-build/action.yml, class: starter}
  - {path: .github/workflows/copilot-setup-steps.yml, class: starter, blocks: toolchain_steps}
  - {path: .gitleaks.toml, class: starter}
  - {path: .yamllint, class: managed}
  - {path: .github/workflows/auto-assign.yml, class: managed}
  - {path: .github/workflows/auto-format.yml, class: starter, when: {any: {declaring: toolchain_steps}}, blocks: toolchain_steps}
  - {path: .typography-allow, class: managed, when: {without: [release-please]}}
  - {path: .typography-allow, class: managed, when: {modules: [release-please]}}
  - {path: AGENTS.md, class: split, region: html, when: {without: {declaring: agents_toolchain}}}
  - {path: AGENTS.md, class: split, region: html, when: {any: {declaring: agents_toolchain}}, source: files/base/AGENTS.toolchain.md, blocks: agents_toolchain}
  - {path: LICENSE.md, class: split, region: html, when: {without: [custom-license]}}
  - {path: CLAUDE.md, class: link, target: AGENTS.md}
  - {path: .github/agents.md, class: link, target: ../AGENTS.md}
  - {path: .github/copilot-instructions.md, class: link, target: ../AGENTS.md}
  # --- modules
  - {path: .bun-version, class: managed, when: {modules: [bun]}}
  - {path: .dvmrc, class: managed, when: {modules: [deno]}}
  - {path: .github/workflows/deno-audit.yml, class: managed, when: {modules: [deno]}}
  - {path: .release-please-manifest.json, class: starter, when: {modules: [release-please]}}
  - {path: release-please-config.json, class: starter, when: {modules: [release-please]}}
  - {path: .github/workflows/pr-title.yml, class: managed, when: {modules: [pr-title]}}
  - {path: .github/workflows/nightly-fuzz.yml, class: starter, when: {modules: [fuzzer]}}
  - {path: .github/workflows/nightly.yml, class: starter, when: {modules: [nightly]}}

# Starters are never retired: a recorded starter is repo-owned and the writer
# only reports it kept, so the ISSUE_TEMPLATE forms (starters, now served by
# the account's .github repository) stay where each repository left them.
retired:
  - {path: CONTRIBUTING.md}
  - {path: .github/SECURITY.md}
  - {path: .node-version}
  - {path: .github/workflows/validate-skills.yml}
  - {path: .github/workflows/dependabot-bun-lockfile.yml}
