# Grammar: actions/plan/files_config.ts (mirrors: actions/plan/registration.ts); tree checks: .github/scripts/sync/writer/files_config.ts;
# contract: docs/sync.md. The modules block's key order is the canonical module order the plan emits.

placeholders:
  - project_name
  - project_slug
  - description
  - github_username
  - github_username_lower
  - copyright_holder
  - fuzzer_label
  - fuzzer_label_color
  - fuzzer_label_description
  - nightly_label
  - nightly_label_color
  - nightly_label_description
  - private

modules:
  bun:
    description: TypeScript/bun toolchain (gitignore, dependabot, CodeQL JS)
    pin:
      file: files/bun/.bun-version
      repository: oven-sh/bun
      tag: bun-v{version}
    codeql_languages: [javascript-typescript]
    dependabot_ecosystems: [bun]
    gitignore_sources: [Node, bun]
    agents_toolchain: [bun]
    toolchain_steps: [bun]
  deno:
    description: Deno toolchain (deno fmt/lint, deno dependabot, CodeQL JS)
    pin:
      file: files/deno/.dvmrc
      repository: denoland/deno
      tag: v{version}
    codeql_languages: [javascript-typescript]
    dependabot_ecosystems: [deno]
    gitignore_sources: [Deno, Node]
    agents_toolchain: [deno]
    toolchain_steps: [deno]
  uv:
    description: Python/uv toolchain (gitignore, dependabot, CodeQL Python)
    codeql_languages: [python]
    dependabot_ecosystems: [uv]
    gitignore_sources: [Python]
    agents_toolchain: [uv]
    toolchain_steps: [uv]
  rust:
    description: Rust/cargo toolchain (cargo dependabot, Rust gitignore; no CodeQL)
    dependabot_ecosystems: [cargo]
    gitignore_sources: [Rust]
    agents_toolchain: [rust]
  site:
    description: one GitHub Pages site per repository (the repo-owned site-build hook's website at the root, docs/ rendered under the central fleet theme)
    path: docs
    tracking_label: {key: site, default: docs-link-rot, color: D4A72C, description: Automated docs-site link-rot report}
  release-please:
    description: release-please releases through the fleet's release pipeline, plus autorelease labels
  pr-title:
    description: Conventional Commit PR title check, its own required workflow
  fuzzer:
    description: nightly fuzz starter with issue filing, replay inputs, auto-close
    gitignore_sources: [fuzzer]
    tracking_label: {key: fuzzer, default: fuzz-nightly, color: B60205, description: Automated nightly fuzz failure}
  nightly:
    description: nightly CI starter with failure issue filing and auto-close
    tracking_label: {key: nightly, default: nightly-failure, color: D93F0B, description: Automated nightly CI failure}
  custom-license:
    description: repo carries its own license in LICENSE.md; the fleet license is not written

# The settings layers (docs/settings.md): the baseline, then each layer whose
# `when` holds in this order, folded under the repository's
# .github/settings.local.yml overlay into its rendered .github/settings.yml;
# the override merges above the overlay. A layer file is DECLARED here, never
# discovered from the tree.
settings:
  baseline: files/settings/baseline.yml
  layers:
    - {source: files/settings/public.yml, when: {private: false}}
    - {source: files/settings/private.yml, when: {private: true}}
    - {source: files/bun/settings.yml, when: {modules: [bun]}}
    - {source: files/deno/settings.yml, when: {modules: [deno]}}
    - {source: files/uv/settings.yml, when: {modules: [uv]}}
    - {source: files/rust/settings.yml, when: {modules: [rust]}}
    - {source: files/site/settings.yml, when: {modules: [site]}}
    - {source: files/release-please/settings.yml, when: {modules: [release-please]}}
    - {source: files/pr-title/settings.yml, when: {modules: [pr-title]}}
    - {source: files/settings/codeql-public.yml, when: {private: false, any: {declaring: codeql_languages}}}
  override: files/settings/override.yml

files:
  # --- base: every repository
  - {path: .editorconfig, class: split, region: hash}
  - {path: .gitattributes, class: split, region: hash}
  # The github/gitignore templates are fetched at the pin by every sync; refresh-upstream.yml moves the pin weekly, as
  # it moves each module's `pin` above.
  # macOS names its Finder icon file "Icon\r", which the template spells as a class holding a bare CR byte; text gates
  # refuse the byte, so the rendered line matches the file by a one-character glob instead.
  - path: .gitignore
    class: split
    region: hash
    blocks: gitignore_sources
    replace: {"[\r]": "?"}
    always: [Windows, macOS, Linux]
    sources:
      Windows: {repository: github/gitignore, sha: 356fd7baab4c05e092194a41f64dbd5afc8817e4, path: Global/Windows.gitignore}
      macOS: {repository: github/gitignore, sha: 356fd7baab4c05e092194a41f64dbd5afc8817e4, path: Global/macOS.gitignore}
      Linux: {repository: github/gitignore, sha: 356fd7baab4c05e092194a41f64dbd5afc8817e4, path: Global/Linux.gitignore}
      Node: {repository: github/gitignore, sha: 356fd7baab4c05e092194a41f64dbd5afc8817e4, path: Node.gitignore}
      bun: {repository: github/gitignore, sha: 356fd7baab4c05e092194a41f64dbd5afc8817e4, path: bun.gitignore}
      Deno: {repository: github/gitignore, sha: 356fd7baab4c05e092194a41f64dbd5afc8817e4, path: Deno.gitignore}
      Python: {repository: github/gitignore, sha: 356fd7baab4c05e092194a41f64dbd5afc8817e4, path: Python.gitignore}
      Rust: {repository: github/gitignore, sha: 356fd7baab4c05e092194a41f64dbd5afc8817e4, path: Rust.gitignore}
      fuzzer: files/fuzzer/fuzzer.gitignore
  - {path: .github/CODEOWNERS, class: split, region: hash}
  - path: .github/dependabot.yml
    class: managed
    blocks: dependabot_ecosystems
    sources:
      bun: files/bun/.github/dependabot.bun.yml
      deno: files/deno/.github/dependabot.deno.yml
      uv: files/uv/.github/dependabot.uv.yml
      cargo: files/rust/.github/dependabot.cargo.yml
  - {path: .github/actionlint.yaml, class: starter}
  - {path: .github/instructions/review.instructions.md, class: managed}
  # The overlay starter precedes the rendered document, which reads the
  # overlay it seeds in the same run.
  - {path: .github/settings.local.yml, class: starter}
  - {path: .github/settings.yml, class: managed, render: settings, overlay: .github/settings.local.yml}
  - {path: .github/workflows/ci.yml, class: managed}
  - path: .github/workflows/checks.yml
    class: starter
    blocks: toolchain_steps
    sources:
      bun: files/bun/.github/workflows/checks.toolchain.yml
      deno: files/deno/.github/workflows/checks.toolchain.yml
      uv: files/uv/.github/workflows/checks.toolchain.yml
  - {path: .github/workflows/post-green.yml, class: starter}
  - {path: .github/workflows/update-release.yml, class: starter}
  - {path: .github/workflows/update-release-pr.yml, class: starter}
  - {path: .github/actions/site-build/action.yml, class: starter}
  - path: .github/workflows/copilot-setup-steps.yml
    class: starter
    blocks: toolchain_steps
    sources:
      bun: files/bun/.github/workflows/copilot-setup-steps.toolchain.yml
      deno: files/deno/.github/workflows/copilot-setup-steps.toolchain.yml
      uv: files/uv/.github/workflows/copilot-setup-steps.toolchain.yml
  - {path: .gitleaks.toml, class: starter}
  - {path: .yamllint, class: managed}
  - {path: .github/workflows/auto-assign.yml, class: managed}
  - {path: .github/workflows/sync-branch.yml, class: managed}
  - path: .github/workflows/auto-format.yml
    class: starter
    when: {any: {declaring: toolchain_steps}}
    blocks: toolchain_steps
    sources:
      bun: files/bun/.github/workflows/auto-format.toolchain.yml
      deno: files/deno/.github/workflows/auto-format.toolchain.yml
      uv: files/uv/.github/workflows/auto-format.toolchain.yml
  - {path: .typography-allow, class: managed, when: {without: [release-please]}}
  - {path: .typography-allow, class: managed, when: {modules: [release-please]}}
  - {path: AGENTS.md, class: split, region: html, when: {without: {declaring: agents_toolchain}}}
  - path: AGENTS.md
    class: split
    region: html
    when: {any: {declaring: agents_toolchain}}
    source: files/base/AGENTS.toolchain.md
    blocks: agents_toolchain
    sources:
      bun: files/bun/AGENTS.toolchain.md
      deno: files/deno/AGENTS.toolchain.md
      uv: files/uv/AGENTS.toolchain.md
      rust: files/rust/AGENTS.toolchain.md
  - {path: LICENSE.md, class: split, region: html, when: {without: [custom-license]}}
  # --- modules
  - {path: .bun-version, class: managed, when: {modules: [bun]}}
  - {path: .dvmrc, class: managed, when: {modules: [deno]}}
  - {path: .github/workflows/deno-audit.yml, class: managed, when: {modules: [deno]}}
  - {path: .release-please-manifest.json, class: starter, when: {modules: [release-please]}}
  - {path: release-please-config.json, class: starter, when: {modules: [release-please]}}
  - {path: .github/workflows/pr-title.yml, class: managed, when: {modules: [pr-title]}}
  - {path: .github/workflows/nightly-fuzz.yml, class: starter, when: {modules: [fuzzer]}}
  - {path: .github/workflows/nightly.yml, class: starter, when: {modules: [nightly]}}

# The fleet's mirrors, in the registration's grammar, written by the mirror pass before the repository's own; a
# target the registration excepts is left to the repository.
mirrors:
  - source: AGENTS.md
    kind: symlink
    targets: [CLAUDE.md, .github/agents.md, .github/copilot-instructions.md]
