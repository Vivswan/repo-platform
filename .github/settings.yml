---
# Vivswan/repo-platform's OWN settings, applied by its settings-repos run
# via Vivswan/github-settings-as-code. The managed baseline (the shared
# repository policy block, the module-derived label roster, the fleet
# rulesets) is computed by .github/scripts/fleet/render_managed_settings.ts
# - for this operator repo from .repo-platform-answers.yml, since it is not
# generated from the template - and this file merges OVER it: keys here
# win, a same-name label replaces the fleet one wholesale, and a same-name
# ruleset merges field by field with its rules appended by type. Then
# .github/settings-override.yml merges over THIS file, so what it declares
# cannot be changed from here. Undeclared labels are deleted against the
# MERGED roster; undeclared rulesets are left alone.

repository:
  description: Copier template + reusable workflows managing standards across Vivswan's repositories
  # Declared empty so the apply owns the field: an out-of-band homepage
  # URL is cleared on the next run.
  homepage: ""
  topics: copier, template, github-actions, reusable-workflows, standards
  # Declared so the apply manages visibility; without it an out-of-band
  # flip to private would never be healed.
  private: false

# Only this repository's OWN ruleset lives here. The fleet protection
# rulesets (main, non-bypassable) come from .github/settings-override.yml,
# which merges ABOVE this file - redeclaring one here would be silently
# overridden, so this repository does not.
rulesets:
  # The generated build branch is append-only: the builder's plain pushes
  # are fast-forwards and pass; force-pushes and deletion are blocked for
  # everyone, the publisher included (no bypass actors on purpose). The
  # retired split-channel refs (template, actions) were deleted in the
  # same change that dropped them from this ruleset (2026-08-29,
  # user-ordered): both had been frozen since the single-build-branch
  # consolidation, and ruleset conditions replace wholesale on apply, so
  # the drop and the deletion had to travel together.
  #
  # A stricter publish-only ruleset (every write blocked, sole bypass the
  # GitHub Actions integration the publisher pushed with at the time)
  # was declared here once, and GitHub rejected it at apply time: POST
  # /rulesets returns 422 "Actor GitHub Actions integration must be part
  # of the ruleset source or owner organization" - an Integration bypass
  # actor is valid only on org-owned rulesets, and bypass-free
  # write-blocking rules would block the publisher itself. (The main
  # ruleset's required-check integration_id pins are a DIFFERENT field
  # and stay valid here.) What the ref gets instead, stated plainly:
  # template CONSUMPTION is guarded sync-side by
  # .github/scripts/sync/verify_build_provenance.ts, which rejects any
  # tip the builder did not produce; the executable channel (`uses:
  # ...@build`) runs directly with NO
  # publisher-identity enforcement - any push-capable principal can
  # fast-forward it, bounded only by push access and this ruleset
  # blocking deletion and force-pushes. A dedicated publisher identity
  # (an App whose key only main-branch workflows can mint) is the tracked
  # structural fix. Sequencing note: this ruleset exists on the live repo
  # only after a Settings Repos apply; refs/heads/build itself was
  # hand-seeded as a user-authorized bootstrap (PR #42's deployment
  # section) so it exists before anything pins it, and once this ruleset
  # applies its deletion rule keeps the ref from ever being absent again.
  - name: build-branches
    target: branch
    enforcement: active
    conditions:
      ref_name:
        include:
          - build
        exclude: []
    rules:
      - type: deletion
      - type: non_fast_forward
    # Declared EMPTY on purpose, like the override layer's non-bypassable
    # ruleset: an omitted key is invisible to drift detection, so the
    # explicit empty list is what lets the nightly heal clear an
    # out-of-band bypass actor added to these rules.
    bypass_actors: []
