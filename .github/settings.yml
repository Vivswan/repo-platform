---
# Vivswan/repo-platform's OWN settings, applied by its settings-repos run
# via Vivswan/github-settings-as-code. The managed baseline (the shared
# repository policy block, the module-derived label roster, the fleet
# rulesets) is computed by .github/scripts/fleet/render_managed_settings.ts
# - for this operator repo from .repo-platform-answers.yml, since it is not
# generated from the template - and this file merges OVER it: keys here
# win, a same-name label replaces the fleet one wholesale, and a same-name
# ruleset merges field by field with its rules appended by type. Then
# .github/settings-override.yml merges over THIS file, so what it declares
# cannot be changed from here. Undeclared labels are deleted against the
# MERGED roster; undeclared rulesets are left alone.

repository:
  description: Copier template + reusable workflows managing standards across Vivswan's repositories
  # Declared empty so the apply owns the field: an out-of-band homepage
  # URL is cleared on the next run.
  homepage: ""
  topics: copier, template, github-actions, reusable-workflows, standards
  # Declared so the apply manages visibility; without it an out-of-band
  # flip to private would never be healed.
  private: false

# Only this repository's OWN rulesets live here. The fleet protection
# rulesets (main, non-bypassable) come from .github/settings-override.yml,
# which merges ABOVE this file - redeclaring one here would be silently
# overridden, so this repository does not.
rulesets:
  # The generated build branches are append-only: the builder's plain
  # pushes are fast-forwards and pass; force-pushes and deletion are
  # blocked for everyone (no bypass actors on purpose). The publisher is
  # NOT exempt either - this ruleset stays bypass-free, and the
  # update-blocking ruleset below is a separate ruleset precisely so its
  # bypass actor cannot leak into these rules.
  - name: build-branches
    target: branch
    enforcement: active
    conditions:
      ref_name:
        include:
          - template
          - actions
        exclude: []
    rules:
      - type: deletion
      - type: non_fast_forward
    # Declared EMPTY on purpose, like the override layer's non-bypassable
    # ruleset: an omitted key is invisible to drift detection, so the
    # explicit empty list is what lets the nightly heal clear an
    # out-of-band bypass actor added to these rules.
    bypass_actors: []
  # The `actions` ref is EXECUTABLE: fleet workflows pin `@actions` and run
  # its tree directly, with no provenance verify like the sync-side check
  # that guards `template` consumption. So this ref additionally blocks ALL
  # updates (fast-forwards included), with the sole bypass being the GitHub
  # Actions integration - the identity of the GITHUB_TOKEN that
  # build-branches.yml publishes with. That is the narrowest actor the
  # ruleset dialect can express: GitHub cannot scope a bypass to one
  # workflow, so any workflow in THIS repository running with a
  # write-scoped GITHUB_TOKEN shares the identity. Residual, stated
  # honestly: an on:push or on:pull_request workflow runs the PUSHED
  # branch's own definition under that same app identity, so a write actor
  # can reach this ref from a topic branch without ever landing code on
  # main. Closing that structurally (a dedicated publisher identity the
  # bypass names, nothing else able to assume it) is tracked separately;
  # this ruleset raises the bar without claiming to seal it.
  # The bypass exempts the publisher only from THIS ruleset's update rule;
  # deletion and force-pushes stay blocked for it by build-branches above.
  - name: actions-ref-publish-only
    target: branch
    enforcement: active
    conditions:
      ref_name:
        include:
          - actions
        exclude: []
    rules:
      - type: update
    bypass_actors:
      - actor_id: 15368
        actor_type: Integration
        bypass_mode: always
