---
# Vivswan/repo-platform's OWN settings, applied by its settings-repos run
# via Vivswan/github-settings-as-code. The managed baseline (the shared
# repository policy block, the module-derived label roster, the fleet
# rulesets) is computed by .github/scripts/fleet/render_managed_settings.ts
# - for this operator repo from .repo-platform-answers.yml, since it is not
# generated from the template - and this file merges OVER it: keys here
# win, a same-name label replaces the fleet one wholesale, and a same-name
# ruleset merges field by field with its rules appended by type. Then
# .github/settings-override.yml merges over THIS file, so what it declares
# cannot be changed from here. Undeclared labels are deleted against the
# MERGED roster; undeclared rulesets are left alone.

repository:
  description: Copier template + reusable workflows managing standards across Vivswan's repositories
  # Declared empty so the apply owns the field: an out-of-band homepage
  # URL is cleared on the next run.
  homepage: ""
  topics: copier, template, github-actions, reusable-workflows, standards
  # Declared so the apply manages visibility; without it an out-of-band
  # flip to private would never be healed.
  private: false

# Only this repository's OWN rulesets live here. The fleet protection
# rulesets (main, non-bypassable) come from .github/settings-override.yml,
# which merges ABOVE this file - redeclaring one here would be silently
# overridden, so this repository does not.
rulesets:
  # The generated build branch is append-only: the builder's plain pushes
  # are fast-forwards and pass; force-pushes and deletion are blocked for
  # everyone (no bypass actors on purpose - the writer ruleset below is a
  # separate ruleset precisely so its bypass actor cannot leak into these
  # rules). The retired split-channel branches stay protected until they
  # are DELIBERATELY deleted post-cutover: `build` seeds from template's
  # history on first publish, and un-synced repos still pin @actions until
  # their next sync PR lands. Ruleset conditions replace wholesale on
  # apply, so dropping those refs here would unprotect them early - remove
  # the two entries in the same change that deletes the branches.
  - name: build-branches
    target: branch
    enforcement: active
    conditions:
      ref_name:
        include:
          - build
          - template
          - actions
        exclude: []
    rules:
      - type: deletion
      - type: non_fast_forward
    # Declared EMPTY on purpose, like the override layer's non-bypassable
    # ruleset: an omitted key is invisible to drift detection, so the
    # explicit empty list is what lets the nightly heal clear an
    # out-of-band bypass actor added to these rules.
    bypass_actors: []
  # The `build` ref is EXECUTABLE: fleet workflows pin `@build` and run
  # its actions/ subtree directly, with no provenance verify like the
  # sync-side check that guards template consumption. So this ref blocks
  # EVERY write - creation included, since GitHub treats creating an
  # absent ref as a separate rule from updating it, and without it any
  # push-capable principal could CLAIM the ref whenever it is absent
  # (initial rollout, or recovery after an out-of-band deletion). The
  # pending-build branches ride the same ruleset: the publisher promotes a
  # pending tree into `build` on name-match alone, so plain contents write
  # must not be enough to park one (pending.ts's header has the namespace
  # rationale). The sole bypass is the GitHub Actions integration - the
  # identity of the GITHUB_TOKEN that build-branches.yml publishes with.
  # That is the narrowest actor the ruleset dialect can express: GitHub
  # cannot scope a bypass to one workflow, so any workflow in THIS
  # repository running with a write-scoped GITHUB_TOKEN shares the
  # identity. Residual, stated honestly: an on:push or on:pull_request
  # workflow runs the PUSHED branch's own definition under that same app
  # identity, so a write actor can reach this ref from a topic branch
  # without ever landing code on main. Closing that structurally (a
  # dedicated publisher identity the bypass names, nothing else able to
  # assume it) is tracked separately; this ruleset raises the bar without
  # claiming to seal it.
  # The bypass exempts the publisher only from THIS ruleset's copies of
  # the rules; its own force-pushes and deletions stay blocked by the
  # bypass-free build-branches ruleset above, which carries the same two
  # rules over the same ref.
  - name: build-branches-writer
    target: branch
    enforcement: active
    conditions:
      ref_name:
        include:
          - build
          - build-pending/**
        exclude: []
    rules:
      - type: creation
      - type: update
      - type: deletion
      - type: non_fast_forward
    bypass_actors:
      - actor_id: 15368
        actor_type: Integration
        bypass_mode: always
  # The retired `actions` ref keeps the chain-era publish-only ruleset for
  # the same reason, until its deliberate post-cutover deletion (see the
  # note on the build-branches ruleset above): un-synced repos still
  # execute @actions. Remove this whole ruleset in the same change that
  # deletes the branch.
  - name: actions-ref-publish-only
    target: branch
    enforcement: active
    conditions:
      ref_name:
        include:
          - actions
        exclude: []
    rules:
      - type: creation
      - type: update
      - type: deletion
      - type: non_fast_forward
    bypass_actors:
      - actor_id: 15368
        actor_type: Integration
        bypass_mode: always
