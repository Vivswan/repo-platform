# This repo's counterpart of the template's dependabot.yml.

version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"
    cooldown:
      default-days: 7
    # Conventional PR titles so the commit-names/pr-title gates pass; action
    # bumps are workflow changes, hence ci (the bun entries use build).
    commit-message:
      prefix: "ci"
      include: "scope"

  # Root tooling manifest (biome, husky).
  - package-ecosystem: "bun"
    directory: "/"
    schedule:
      interval: "monthly"
    cooldown:
      default-days: 7
    commit-message:
      prefix: "build"
      include: "scope"

  # monaco-editor dependency of the check-typography action. The action dir
  # commits bun.lock, so the bun ecosystem keeps both manifest and lockfile
  # current.
  - package-ecosystem: "bun"
    directory: "/actions/check-typography"
    schedule:
      interval: "monthly"
    cooldown:
      default-days: 7
    commit-message:
      prefix: "build"
      include: "scope"

  # Dev-only manifest (@types/node, typescript) for the commit-names action.
  - package-ecosystem: "bun"
    directory: "/actions/validate-commit-names"
    schedule:
      interval: "monthly"
    cooldown:
      default-days: 7
    commit-message:
      prefix: "build"
      include: "scope"
