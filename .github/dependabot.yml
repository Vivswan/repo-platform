version: 2
updates:
  # Every action bump lands in ONE PR (multi-directory alone still opens one PR per directory), so every site
  # Dependabot reaches moves at once.
  # Pins under files/** are invisible to Dependabot; tests/workflows/delivery_pins.test.ts holds them to the root's sha.
  - package-ecosystem: "github-actions"
    # Dependabot expands these with Ruby's Dir.glob, where `/actions/**` alone matches one level: `**/*` also
    # reaches an action nested under another. A matched directory with no manifest is skipped.
    directories:
      - "/"
      - "/actions/**/*"
    groups:
      actions:
        patterns: ["*"]
    schedule:
      interval: "monthly"
    cooldown:
      default-days: 7
    # Conventional PR titles so the commit-names/pr-title gates pass; action
    # bumps are workflow changes, hence ci (package-manifest entries use build).
    commit-message:
      prefix: "ci"
      include: "scope"

  - package-ecosystem: "bun"
    directories:
      - "/"
      - "/actions/**/*"
    # @types/bun is published per bun release and rides the runtime pin exactly: the refresh-upstream workflow bumps it with files/bun/.bun-version.
    ignore:
      - dependency-name: "@types/bun"
    schedule:
      interval: "monthly"
    cooldown:
      default-days: 7
    commit-message:
      prefix: "build"
      include: "scope"

  - package-ecosystem: "pip"
    directories:
      - "/actions/**/*"
    schedule:
      interval: "monthly"
    cooldown:
      default-days: 7
    commit-message:
      prefix: "build"
      include: "scope"
