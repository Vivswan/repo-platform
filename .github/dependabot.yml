# This repo's counterpart of the template's dependabot.yml.

version: 2
updates:
  # One entry covering the workflows AND the composite actions' action.yml
  # files: the ssot action-pins rule requires one ref per action repo-wide,
  # and the catch-all group folds every action bump across every listed
  # directory into ONE PR per cycle (multi-directory alone still opens one
  # PR per directory). Pins inside templates/**.jinja are invisible to
  # dependabot and must be bumped BY HAND in that PR before all-green
  # passes.
  - package-ecosystem: "github-actions"
    directories:
      - "/"
      - "/actions/all-green"
      - "/actions/bun-setup"
      - "/actions/check-file-size"
      - "/actions/check-typography"
      - "/actions/dedupe-bun-lockfile"
      - "/actions/dependency-review"
      - "/actions/fuzz-issue"
      - "/actions/knip"
      - "/actions/module-render"
      - "/actions/pages-site"
      - "/actions/plan"
      - "/actions/release-health"
      - "/actions/semgrep"
      - "/actions/trivy"
      - "/actions/typos"
      - "/actions/validate-commit-names"
      - "/actions/validate-skills"
      - "/actions/validate-template-report"
      - "/actions/yamllint"
      - "/actions/zizmor"
    groups:
      actions:
        patterns: ["*"]
    schedule:
      interval: "monthly"
    cooldown:
      default-days: 7
    # Conventional PR titles so the commit-names/pr-title gates pass; action
    # bumps are workflow changes, hence ci (package-manifest entries use build).
    commit-message:
      prefix: "ci"
      include: "scope"

  # Root tooling manifest (biome, husky).
  - package-ecosystem: "bun"
    directory: "/"
    schedule:
      interval: "monthly"
    cooldown:
      default-days: 7
    commit-message:
      prefix: "build"
      include: "scope"

  # Dev-only manifest (@types/bun, typescript) for the check-file-size action.
  - package-ecosystem: "bun"
    directory: "/actions/check-file-size"
    schedule:
      interval: "monthly"
    cooldown:
      default-days: 7
    commit-message:
      prefix: "build"
      include: "scope"

  # monaco-editor dependency of the check-typography action. The action dir
  # commits bun.lock, so the bun ecosystem keeps both manifest and lockfile
  # current.
  - package-ecosystem: "bun"
    directory: "/actions/check-typography"
    schedule:
      interval: "monthly"
    cooldown:
      default-days: 7
    commit-message:
      prefix: "build"
      include: "scope"

  # Dev-only manifest (@types/bun, typescript) for the dedupe-bun-lockfile action.
  - package-ecosystem: "bun"
    directory: "/actions/dedupe-bun-lockfile"
    schedule:
      interval: "monthly"
    cooldown:
      default-days: 7
    commit-message:
      prefix: "build"
      include: "scope"

  # Dev-only manifest (@types/node, typescript) for the commit-names action.
  - package-ecosystem: "bun"
    directory: "/actions/validate-commit-names"
    schedule:
      interval: "monthly"
    cooldown:
      default-days: 7
    commit-message:
      prefix: "build"
      include: "scope"

  # Dev-only manifest (@types/bun, typescript) for the fuzz-issue action.
  - package-ecosystem: "bun"
    directory: "/actions/fuzz-issue"
    schedule:
      interval: "monthly"
    cooldown:
      default-days: 7
    commit-message:
      prefix: "build"
      include: "scope"

  # The module-render action: its yaml runtime dependency plus its dev-only
  # typing manifest. It commits bun.lock, so the bun ecosystem keeps both
  # manifest and lockfile current.
  - package-ecosystem: "bun"
    directory: "/actions/module-render"
    schedule:
      interval: "monthly"
    cooldown:
      default-days: 7
    commit-message:
      prefix: "build"
      include: "scope"

  # Runtime deps of the pages-site action (vitepress - pinned EXACT while
  # 2.x is prerelease, so a bump is always a deliberate PR - plus the llms
  # plugin, mermaid, linkinator, vue) and its dev-only typing manifest.
  - package-ecosystem: "bun"
    directory: "/actions/pages-site"
    schedule:
      interval: "monthly"
    cooldown:
      default-days: 7
    commit-message:
      prefix: "build"
      include: "scope"

  # The plan action: its yaml and zod runtime dependencies plus its dev-only
  # typing manifest. It commits bun.lock, so the bun ecosystem keeps both
  # manifest and lockfile current.
  - package-ecosystem: "bun"
    directory: "/actions/plan"
    schedule:
      interval: "monthly"
    cooldown:
      default-days: 7
    commit-message:
      prefix: "build"
      include: "scope"

  # Dev-only manifest (@types/bun, typescript) for the release-health action.
  - package-ecosystem: "bun"
    directory: "/actions/release-health"
    schedule:
      interval: "monthly"
    cooldown:
      default-days: 7
    commit-message:
      prefix: "build"
      include: "scope"

  # Dev-only manifest (@types/bun, typescript) for the trivy action.
  - package-ecosystem: "bun"
    directory: "/actions/trivy"
    schedule:
      interval: "monthly"
    cooldown:
      default-days: 7
    commit-message:
      prefix: "build"
      include: "scope"

  # Dev-only manifest (@types/bun, typescript) for the validate-skills action.
  - package-ecosystem: "bun"
    directory: "/actions/validate-skills"
    schedule:
      interval: "monthly"
    cooldown:
      default-days: 7
    commit-message:
      prefix: "build"
      include: "scope"

  # The validate-template-report action: the validator's yaml runtime
  # dependency plus its dev-only typing manifest. It commits bun.lock, so
  # the bun ecosystem keeps both manifest and lockfile current.
  - package-ecosystem: "bun"
    directory: "/actions/validate-template-report"
    schedule:
      interval: "monthly"
    cooldown:
      default-days: 7
    commit-message:
      prefix: "build"
      include: "scope"
