version: 2
updates:
  # One sha per action repo-wide rests on this group alone: every action bump lands in ONE PR
  # (multi-directory alone still opens one PR per directory), so no two sites can drift apart.
  # Pins under files/** are invisible to dependabot and nothing compares them with the bumped ones: bump them by
  # hand in that PR, the commented toolchain examples in checks.block.toolchain.yml included.
  - package-ecosystem: "github-actions"
    directories:
      - "/"
      - "/actions/all-green"
      - "/actions/bun-setup"
      - "/actions/check-file-size"
      - "/actions/check-typography"
      - "/actions/dedupe-bun-lockfile"
      - "/actions/dependency-review"
      - "/actions/fuzz-issue"
      - "/actions/knip"
      - "/actions/pages-site"
      - "/actions/pages-site/check-links"
      - "/actions/plan"
      - "/actions/release-health"
      - "/actions/semgrep"
      - "/actions/trivy"
      - "/actions/typos"
      - "/actions/validate-commit-names"
      - "/actions/validate-managed-files"
      - "/actions/yamllint"
      - "/actions/zizmor"
    groups:
      actions:
        patterns: ["*"]
    schedule:
      interval: "monthly"
    cooldown:
      default-days: 7
    # Conventional PR titles so the commit-names/pr-title gates pass; action
    # bumps are workflow changes, hence ci (package-manifest entries use build).
    commit-message:
      prefix: "ci"
      include: "scope"

  - package-ecosystem: "bun"
    directory: "/"
    schedule:
      interval: "monthly"
    cooldown:
      default-days: 7
    commit-message:
      prefix: "build"
      include: "scope"

  - package-ecosystem: "bun"
    directory: "/actions/check-file-size"
    schedule:
      interval: "monthly"
    cooldown:
      default-days: 7
    commit-message:
      prefix: "build"
      include: "scope"

  - package-ecosystem: "bun"
    directory: "/actions/check-typography"
    schedule:
      interval: "monthly"
    cooldown:
      default-days: 7
    commit-message:
      prefix: "build"
      include: "scope"

  - package-ecosystem: "bun"
    directory: "/actions/dedupe-bun-lockfile"
    schedule:
      interval: "monthly"
    cooldown:
      default-days: 7
    commit-message:
      prefix: "build"
      include: "scope"

  - package-ecosystem: "bun"
    directory: "/actions/validate-commit-names"
    schedule:
      interval: "monthly"
    cooldown:
      default-days: 7
    commit-message:
      prefix: "build"
      include: "scope"

  - package-ecosystem: "bun"
    directory: "/actions/fuzz-issue"
    schedule:
      interval: "monthly"
    cooldown:
      default-days: 7
    commit-message:
      prefix: "build"
      include: "scope"

  - package-ecosystem: "bun"
    directory: "/actions/pages-site"
    schedule:
      interval: "monthly"
    cooldown:
      default-days: 7
    commit-message:
      prefix: "build"
      include: "scope"

  - package-ecosystem: "bun"
    directory: "/actions/plan"
    schedule:
      interval: "monthly"
    cooldown:
      default-days: 7
    commit-message:
      prefix: "build"
      include: "scope"

  - package-ecosystem: "bun"
    directory: "/actions/release-health"
    schedule:
      interval: "monthly"
    cooldown:
      default-days: 7
    commit-message:
      prefix: "build"
      include: "scope"

  - package-ecosystem: "bun"
    directory: "/actions/trivy"
    schedule:
      interval: "monthly"
    cooldown:
      default-days: 7
    commit-message:
      prefix: "build"
      include: "scope"

  - package-ecosystem: "bun"
    directory: "/actions/validate-managed-files"
    schedule:
      interval: "monthly"
    cooldown:
      default-days: 7
    commit-message:
      prefix: "build"
      include: "scope"
