---
# Layer 2 of the settings merge, applied to PUBLIC repositories only
# (docs/settings.md). Private repositories without Advanced Security
# reject the security_and_analysis keys with a 422, and the code_quality
# rule gates a feature family unavailable there, which is why neither can
# live in the unconditional baseline.
#
# security_and_analysis is declared so the apply heals an out-of-band
# disable: GitHub enables both keys by default on public repositories.

repository:
  security_and_analysis:
    secret_scanning:
      status: enabled
    secret_scanning_push_protection:
      status: enabled

rulesets:
  # The main ruleset's code_quality rule lives HERE, fleet-wide for public
  # repos, not in the toolchain modules' overlays next to code_scanning.
  # Placement reasoning - the evidence is GitHub's docs plus ONE live
  # specimen (checked 2026-08), not a guarantee GitHub keeps behaving
  # this way:
  #
  # - The rule gates on GitHub Code Quality's OWN analysis (a per-repo
  #   enablement, Team/GHEC-only product), not on code-scanning uploads.
  #   Unlike code_scanning, its documented blocking conditions omit "a
  #   required tool is not configured" - an argument from the docs'
  #   silence - and the one specimen matches: copilot-env has carried
  #   exactly this rule since 2026-08-21 (ruleset history v47188788) on a
  #   personal account where Code Quality cannot be enabled at all, and
  #   PRs kept auto-merging under it (auto-merge does not bypass rules).
  #   On that evidence it is declared on every public repo regardless of
  #   toolchain - no module gate, no local re-declaration. If GitHub ever
  #   starts blocking on an unconfigured analysis, the failure mode is
  #   loud (blocked merges fleet-wide), not silent.
  # - Public-only, mirroring code_scanning: the Code Quality feature
  #   family needs Advanced Security on private repositories, which this
  #   fleet does not carry, so the private overlay stays silent.
  #
  # Rules of a same-name ruleset APPEND across layers keyed by `type`, so
  # this adds to the main ruleset that .github/settings-override.yml
  # declares rather than replacing it. severity `warnings`: quality
  # warnings gate merges once Code Quality analysis exists on a repo
  # (matching copilot-env's live rule, the fleet's one specimen).
  - name: main
    rules:
      - type: code_quality
        parameters:
          severity: warnings
      # Automatically request Copilot code review on PRs to main, including
      # on each new push and on draft PRs - PUBLIC repositories only:
      # Copilot reviews are disabled on the fleet's private repos, where a
      # request could never be answered (and the managed wrapper renders
      # require-copilot-review: false there, so no verdict waits on one).
      # On public repos, each review run creates the check run the
      # all-green VERDICT waits for (the wrapper's require-copilot-review
      # expectation), and its review SUBMISSION is the wake that re-judges
      # the sha - so this rule is what keeps the merge box moving on its
      # own. Verified edges: bot-authored PRs (Dependabot) and new pushes
      # to DRAFT PRs get no automatic run despite this rule - a bot PR's
      # verdict resolves once any review is submitted after CI completes
      # (the verdict stands its expectation down for bot AUTHORS), and a
      # draft needs the review requested from the reviewers panel (one
      # click; correct semantics, since nothing merges unreviewed).
      - type: copilot_code_review
        parameters:
          review_on_push: true
          review_draft_pull_requests: true
