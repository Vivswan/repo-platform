# Push-only template sync: runs in repo-platform and pushes a template
# update into one managed repo - target checkout in a subdirectory, `copier
# update` against the build branch head, then a branch + PR opened in
# the target with the REPO_PLATFORM_TOKEN PAT stored here. Called only by
# sync-repos.yml.
#
# Permission-adaptive token model: the token itself is REQUIRED (a missing
# secret is a misconfiguration and fails loudly), but a deliberately
# narrowed token adapts: without the Workflows scope, workflow-file
# changes are withheld from the PR with a warning; Contents + Pull
# requests write are the core the sync cannot work without.
#
# The rolling branch (automation/repo-platform)
# is regenerated on every run: sync-repos.yml's concurrency group is the
# only automated writer, and the push uses --force-with-lease so an
# out-of-band push racing this run surfaces instead of vanishing. Manual
# commits on the branch are overwritten by design; the PR body says so.
# The post-update pipeline is fixed: copier update -> clean renders at
# the old and new refs -> structural rebuild of split-class files (a
# marker line separates the sync-owned half from the repo-owned half,
# which never rides copier's three-way merge: managed half from the clean
# render at the new ref, repo-owned half byte-for-byte from the
# pre-update HEAD; the rebuilt paths are --skip'd by the conflict
# resolver) -> remaining conflicts resolved toward the template ->
# retired-file cleanup -> repo-owned files preserved -> ownership
# manifest stamped -> tail tripwire (every repo-owned half must still
# hold each non-blank line it held at HEAD, HEAD's copy split with
# HEAD's own manifest markers) -> validation. Clean updates arm squash
# auto-merge (the target's all-green check gates the actual merge);
# conflicts in non-split files resolve toward the template with the
# dropped local lines in the PR body and stay MANUAL, as do split-file
# carries needing review (an appendix, reset managed-half edits, duplicate
# markers), a tripped tail tripwire, withheld workflow files, failed
# validation, and out-of-band settings drift (live visibility or
# description differing from the recorded copier answers) -
# auto-resolution warns; only validation failures (and broken inputs) go
# red.

name: Reusable Template Sync

on:
  workflow_call:
    inputs:
      target_repo:
        description: >-
          owner/name of the managed repo to sync - or its redaction hint
          when target_redact_name is true (the resolve step recovers the
          real repository from target_verify; docs/private-repos.md)
        required: true
        type: string
      target_redact_name:
        description: target_repo is a hint, not a slug
        required: false
        type: boolean
        default: false
      target_hide_details:
        description: hide target-derived values from this public log
        required: false
        type: boolean
        default: false
      target_verify:
        description: HMAC resolution tag for a redacted target_repo
        required: false
        type: string
        default: ""
      recover:
        description: >-
          "recopy" = full re-render with no three-way merge, for a repo
          whose recorded _commit base is unusable. The PR is forced onto
          the manual-review path (auto-merge disarmed).
        required: false
        type: string
        default: ""
      force_manual:
        description: Never arm auto-merge - the PR waits for human review
        required: false
        type: boolean
        default: false
    secrets:
      REPO_PLATFORM_TOKEN:
        required: true

# The workflow's own token only reads this repo; every target-repo write
# (checkout, push, PR) uses the REPO_PLATFORM_TOKEN PAT. Actions read has
# two consumers: the build provenance check (resolve_refs.ts verifies the
# build run stamped on the shipped ref, the build branch tip) and the
# green-source gate (shared/all_green.ts proves the shipped build's own
# source commit passed CI).
permissions:
  contents: read
  actions: read

env:
  # Single knob for pinning copier (pipx spec, e.g. "copier==9.10.1").
  COPIER_SPEC: copier

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      HIDE_DETAILS: ${{ inputs.target_hide_details }}
    steps:
      # No token presence check here: the secret is declared required
      # above, and the only caller (sync-repos.yml) fails its plan job
      # loudly when REPO_PLATFORM_TOKEN is unset, before any leg starts.
      - name: Check out repo-platform
        uses: actions/checkout@v7
        with:
          # Full history: repos generated before the build-branch
          # architecture record a main-history _commit, which must resolve
          # for the update base and the cleanup's old render.
          fetch-depth: 0

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: .bun-version

      # Before the resolve step: the resolver is a bun script and imports
      # the registry/redaction modules, which need the yaml dependency.
      - name: Install script dependencies
        run: bun install --frozen-lockfile --silent

      # Sets TARGET (the real slug) and TARGET_DISPLAY for every later
      # step. For a redacted target it re-discovers the fleet, matches the
      # HMAC tag, and registers the slug with the runner's masker FIRST -
      # so later env-group prints, the target checkout's own log, and API
      # error bodies all render it as ***.
      - name: Resolve the target repository
        env:
          TARGET_INPUT: ${{ inputs.target_repo }}
          REDACT_NAME: ${{ inputs.target_redact_name }}
          VERIFY: ${{ inputs.target_verify }}
          GH_TOKEN: ${{ secrets.REPO_PLATFORM_TOKEN }}
          PAT: ${{ secrets.REPO_PLATFORM_TOKEN }}
        run: bun .github/scripts/fleet/resolve_private_repo.ts

      # The description lands in a RUNNER_TEMP file, not a step output:
      # step outputs ride into later steps' env-group prints, and a
      # hidden target's description must not. Masks for the description
      # and a non-default branch name register before either value is
      # written anywhere.
      - name: Read live target repo data
        id: target
        env:
          GH_TOKEN: ${{ secrets.REPO_PLATFORM_TOKEN }}
        run: bun .github/scripts/sync/read_target.ts

      - name: Check out the target repo
        uses: actions/checkout@v7
        with:
          repository: ${{ env.TARGET }}
          ref: ${{ steps.target.outputs.default_branch }}
          token: ${{ secrets.REPO_PLATFORM_TOKEN }}
          path: target
          fetch-depth: 0
          # copier --trust executes template tasks in this tree; the PAT must
          # not sit in .git/config while they run. Pushes authenticate at
          # push time instead.
          persist-credentials: false

      - name: Require registration files
        run: |
          test -f target/.repo-platform.yml || { echo "::error::${TARGET_DISPLAY} is not registered with repo-platform: .repo-platform.yml is missing from its default branch. Restore the file from git history, or regenerate the repo with 'copier copy gh:${GITHUB_REPOSITORY} . --vcs-ref build'."; exit 1; }
          test -f target/.copier-answers.yml || { echo "::error::${TARGET_DISPLAY} has no .copier-answers.yml on its default branch, so copier has no recorded answers to update from. Restore the file from git history, or regenerate the repo with 'copier copy gh:${GITHUB_REPOSITORY} . --vcs-ref build'."; exit 1; }

      # Live visibility and description feed the render on purpose (adopt
      # semantics: the visibility-gated renders - CONTRIBUTING.md and the
      # other public-only files, the CodeQL and dependency-review jobs - must
      # follow the repo's real state), so a value changed out-of-band in
      # the GitHub UI would otherwise auto-merge into declared truth.
      # Drift against the recorded answers warns here and forces the PR
      # onto the manual-review path (open_pr.ts), with the details
      # prepended to its body. MUST stay ahead of "Apply copier update":
      # that step
      # passes the live values to copier, which rewrites the answers file
      # with them, and the comparison would find nothing ever after.
      - name: Detect out-of-band settings drift
        env:
          PRIVATE: ${{ steps.target.outputs.private }}
        run: |
          bun .github/scripts/sync/settings_drift.ts \
            --answers target/.copier-answers.yml \
            --repo "$TARGET" \
            --display "$TARGET_DISPLAY" \
            --hide-details "$HIDE_DETAILS" \
            --in-repo-settings target/.github/settings.yml \
            --live-private "$PRIVATE" \
            --live-description "$(cat "$RUNNER_TEMP/description.txt")" \
            --summary "$RUNNER_TEMP/settings-drift.md"

      # copier update and the cleanup renders fetch the template from the
      # answers file's _src_path and execute its tasks with --trust. That
      # value is target-controlled (and repos generated from a local
      # checkout record a filesystem path), so it is never trusted OR
      # required to be right: it is rewritten to the canonical source
      # before any copier command, and the rewrite lands in the PR diff.
      - name: Normalize the recorded template source
        id: src
        run: bun .github/scripts/sync/normalize_src.ts

      - name: Resolve refs and template copier configs
        id: versions
        env:
          GH_TOKEN: ${{ github.token }}
          RECOVER: ${{ inputs.recover }}
        run: bun .github/scripts/sync/resolve_refs.ts

      # The selection lands in a RUNNER_TEMP file, not a step output: the
      # module list is a target-derived fact, and step outputs ride into
      # later steps' env-group prints.
      - name: Select modules
        run: bun .github/scripts/sync/select_modules.ts

      - name: Install copier
        run: pipx install "$COPIER_SPEC"

      - name: Create update branch
        env:
          BRANCH: ${{ steps.versions.outputs.branch }}
        run: git -C target checkout -B "$BRANCH"

      # No up-to-date shortcut: modules, private, and description
      # are live inputs that must re-render even at an unchanged template
      # ref, and a no-op render is cheap. The no-changes case exits with a
      # notice after diffing. MODULES and DESCRIPTION come from files via
      # the shell, not step env, so the env-group print never carries
      # them; run_hidden.ts captures copier's own output for a hidden
      # target (it prints target paths and merge detail).
      - name: Apply copier update
        env:
          TARGET_REF: ${{ steps.versions.outputs.target_ref }}
          PRIVATE: ${{ steps.target.outputs.private }}
          RECOVER: ${{ inputs.recover }}
        run: |
          MODULES="$(cat "$RUNNER_TEMP/modules.json")" \
          DESCRIPTION="$(cat "$RUNNER_TEMP/description.txt")" \
            bun .github/scripts/sync/run_hidden.ts "copier update" -- \
            bun .github/scripts/sync/apply_update.ts

      # Clean template renders at the old and new refs, materialized once
      # in RUNNER_TEMP by clean_renders.ts: the split-file rebuild below
      # consumes render-new (and render-old for edit detection), and the
      # retired-file cleanup diffs the pair - one materialization, so every
      # consumer sees the same bytes the update rendered. Recovery mode
      # skips it: the recorded base is unusable, so there is no old ref to
      # render. copier's output names target paths, so a hidden target's
      # run is captured.
      - name: Materialize clean renders
        if: inputs.recover != 'recopy'
        env:
          OLD_SHA: ${{ steps.versions.outputs.old_sha }}
          TARGET_REF: ${{ steps.versions.outputs.target_ref }}
          PRIVATE: ${{ steps.target.outputs.private }}
          SRC_PATH: ${{ steps.src.outputs.src_path }}
        run: |
          MODULES="$(cat "$RUNNER_TEMP/modules.json")" \
          DESCRIPTION="$(cat "$RUNNER_TEMP/description.txt")" \
            bun .github/scripts/sync/run_hidden.ts "clean renders" -- \
            bun .github/scripts/sync/clean_renders.ts

      # Split-class files are REBUILT structurally after every update:
      # copier's merged result for them is discarded, the managed half
      # comes from the clean render at the new ref, and the repo-local
      # half comes byte-for-byte from the pre-update HEAD. Which files are
      # split, and where each marker sits, comes from the new render's
      # ownership manifest. Local edits INSIDE a managed half are reset by
      # this rebuild (detected against the old render, so a template
      # change never reads as a local edit) - the reset is flagged in the
      # PR body and via the carry-review file, which forces the PR onto
      # the manual-review path (open_pr.ts). A recovery re-render has no
      # renders to consume, so it keeps the sentinel-scan carry over the
      # recopy result (the working tree IS the fresh render there). The
      # carried files are listed in the PR body - and, for a hidden
      # target, ONLY there (paths and dispositions are target data). The
      # script prints hide-details-aware counts itself, but its FAILURE
      # paths (a damaged manifest naming split paths, a refused write)
      # quote target data, so a hidden target's run is captured like every
      # other step that reads the target tree.
      - name: Rebuild split files structurally
        env:
          RECOVER: ${{ inputs.recover }}
        run: |
          flags=(--summary "$RUNNER_TEMP/local-carryover.md" --root target
                 --hide-details "$HIDE_DETAILS"
                 --needs-review "$RUNNER_TEMP/carry-review.txt"
                 --rebuilt-paths "$RUNNER_TEMP/split-rebuilt-paths.txt")
          if [ "$RECOVER" != "recopy" ]; then
            flags+=(--render-dir "$RUNNER_TEMP/render-new"
                    --old-render-dir "$RUNNER_TEMP/render-old")
          fi
          bun .github/scripts/sync/run_hidden.ts "split-file rebuild" -- \
            bun .github/scripts/sync/preserve_local_content.ts "${flags[@]}"

      # Conflicts (local edits overlapping template changes) resolve in the
      # template's favor so the tree stays valid. The files the rebuild
      # above wrote are excluded via --skip - their conflict blocks are
      # gone with the merged result, and a carried repository half may
      # legitimately contain conflict-marker-shaped text this pass must not
      # rewrite - so the conflicts resolved here live in non-split files.
      # Either way the dropped local lines go into the PR body for review -
      # and, for a hidden target, ONLY there (the step-log dump is target
      # file content).
      - name: Resolve copier conflicts toward the template
        id: conflicts
        run: |
          bun .github/scripts/sync/resolve_copier_conflicts.ts \
            --summary "$RUNNER_TEMP/dropped-local-hunks.md" --root target \
            --skip "$RUNNER_TEMP/split-rebuilt-paths.txt" \
            --hide-details "$HIDE_DETAILS"
          if [ -s "$RUNNER_TEMP/dropped-local-hunks.md" ]; then
            echo "resolved=true" >> "$GITHUB_OUTPUT"
          else
            echo "resolved=false" >> "$GITHUB_OUTPUT"
          fi

      # A locally modified file that leaves the render survives copier
      # update as a conflict leftover. Deletion candidates come only from
      # the difference of the two clean renders materialized above minus
      # both versions' _skip_if_exists lists (see retired_paths.ts): paths
      # never rendered by either version cannot appear. A formerly
      # rendered path the repo repurposed after the template retired it IS
      # deleted - the PR body lists every removal for review. Recovery
      # mode has no trustworthy old render to diff against, so cleanup is
      # skipped there.
      - name: Remove files the template retired
        if: inputs.recover != 'recopy'
        id: cleanup
        run: |
          MODULES="$(cat "$RUNNER_TEMP/modules.json")" \
            bun .github/scripts/sync/run_hidden.ts "retired-file cleanup" -- \
            bun .github/scripts/sync/retired_cleanup.ts
          if [ "$HIDE_DETAILS" = "true" ] && [ -s "$RUNNER_TEMP/removed-paths.txt" ]; then
            echo "removed $(wc -l <"$RUNNER_TEMP/removed-paths.txt" | tr -d ' ') retired file(s) (paths hidden: private repository; listed in the PR body)"
          fi

      # settings.yml and (for repos on the custom-license module) the
      # repo's own license file are repo-owned wherever they exist: a
      # module change de-renders them, but the sync must never delete them
      # (see the script's header for the full rules and the recovery-mode
      # behavior). Wrapped in run_hidden: the removed-splits hold names
      # deleted repo-owned paths, so a hidden target captures the step's
      # output instead of logging it.
      - name: Preserve repo-owned files
        env:
          RECOVER: ${{ inputs.recover }}
          TARGET_REF: ${{ steps.versions.outputs.target_ref }}
        run: |
          MODULES="$(cat "$RUNNER_TEMP/modules.json")" \
            bun .github/scripts/sync/run_hidden.ts "preserve repo-owned files" -- \
            bun .github/scripts/sync/preserve_repo_owned.ts

      # One-run rollout of the fuzz-issue action pin inside STARTER-class
      # workflows: starters are rendered once and repo-owned
      # (_skip_if_exists), so the template's own move of the pin from the
      # retired @main and @actions refs to the green-gated @build delivery
      # branch never reaches a repo that already rendered them. The script
      # rewrites EXACTLY the retired pin strings (paths from the render's
      # ownership manifest, the working tree's own in recopy mode), leaves
      # hand-set pins alone, and writes the PR-body transition note
      # open_pr.ts appends. Delete this step once the fleet carries no
      # retired fuzz-issue pins (see the script header).
      - name: Roll out starter action pins
        env:
          RECOVER: ${{ inputs.recover }}
        run: |
          flags=(--root target --hide-details "$HIDE_DETAILS")
          if [ "$RECOVER" != "recopy" ]; then
            flags+=(--render-dir "$RUNNER_TEMP/render-new")
          fi
          bun .github/scripts/sync/run_hidden.ts "starter pin rollout" -- \
            bun .github/scripts/sync/starter_pin_rollout.ts "${flags[@]}"

      # Conflict resolution and the preserve steps can rewrite files after
      # copier's own post-render stamp hook ran, so the ownership
      # manifest's hashes are stamped once more when the tree is final
      # (idempotent; see stamp_manifest.ts). Deliberately: the hashes
      # record the tree THIS SYNC delivers - non-conflicting local edits
      # copier's three-way merge preserves are part of that baseline, so
      # parity measures drift since the last sync, never re-litigates the
      # merge.
      - name: Stamp the ownership manifest
        env:
          TARGET_DIR: target
        run: bun .github/scripts/sync/stamp_manifest.ts

      # Defense-in-depth, now that the tree is final: every split entry's
      # repository-owned half must still hold each non-blank line it held
      # at the target's HEAD (split rules in the script header). A trip is
      # a sync bug: it lands in the PR body via the script's RUNNER_TEMP
      # report (a filename constant it shares with open_pr.ts, which
      # forces the manual-review path). Warn, not red - a blocked delivery
      # would hide the diff the reviewer needs.
      - name: Tripwire on repository-owned content loss
        run: |
          bun .github/scripts/sync/run_hidden.ts "tail tripwire" -- \
            bun .github/scripts/sync/tail_tripwire.ts \
            --root target \
            --hide-details "$HIDE_DETAILS"

      # Registries publish the manifest's license claim, not the LICENSE
      # file: a repo adopting the fleet license with package.json still
      # saying "MIT" publishes a false grant. Flags conflicting claims in
      # the PR body (status-only in this log; values are target-derived).
      - name: Check manifest license metadata
        run: |
          MODULES="$(cat "$RUNNER_TEMP/modules.json")" \
            bun .github/scripts/sync/manifest_license_check.ts

      # Version-aligned validation: the tree is judged by the validator at
      # the source commit its build was assembled from, never by main's
      # newer rules when main moved since.
      - name: Check out the version-aligned validator
        uses: actions/checkout@v7
        with:
          ref: ${{ steps.versions.outputs.validate_ref }}
          path: validator

      # A failed validation still opens the PR (that is where a human fixes
      # the tree); the job fails at the end. The validator's diagnostics
      # name target paths and values, so a hidden target's run is captured
      # by run_hidden.ts.
      - name: Validate the updated tree
        id: validate
        run: |
          (cd validator/actions/validate-template && bun install --frozen-lockfile --silent)
          if bun .github/scripts/sync/run_hidden.ts "template validation" -- \
            bun validator/actions/validate-template/validate_generated_files.ts target; then
            echo "result=ok" >> "$GITHUB_OUTPUT"
          else
            echo "result=failed" >> "$GITHUB_OUTPUT"
          fi

      - name: Detect changes
        id: changes
        env:
          DISPLAY: ${{ steps.versions.outputs.display }}
          BASE_BRANCH: ${{ steps.target.outputs.default_branch }}
        run: |
          # Uncommitted copier output OR commits already on the branch (the
          # _src_path normalization commits itself) both count as changes.
          ahead="$(git -C target rev-list --count "origin/${BASE_BRANCH}..HEAD")"
          if [ -z "$(git -C target status --porcelain)" ] && [ "$ahead" -eq 0 ]; then
            echo "::notice::${TARGET_DISPLAY}: already matches ${DISPLAY}; no sync PR needed."
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      # The push authenticates with the PAT at push time (the checkout kept
      # no credentials) and withholds workflow files when the token lacks
      # the Workflows scope - see the script for the fallback rules.
      # Unconditional and BEFORE the push: whatever this run delivers
      # (needs-review, nothing at all, or a failed push), an auto-merge
      # armed by an earlier clean run must never fire on it. open_pr.ts
      # re-arms clean revisions.
      - name: Disarm auto-merge before the branch changes
        env:
          GH_TOKEN: ${{ secrets.REPO_PLATFORM_TOKEN }}
          BRANCH: ${{ steps.versions.outputs.branch }}
        run: bun .github/scripts/sync/disarm_pr.ts

      - name: Commit and push
        if: steps.changes.outputs.changed == 'true'
        id: push
        env:
          BRANCH: ${{ steps.versions.outputs.branch }}
          DISPLAY: ${{ steps.versions.outputs.display }}
          BASE_BRANCH: ${{ steps.target.outputs.default_branch }}
          PAT: ${{ secrets.REPO_PLATFORM_TOKEN }}
        run: bun .github/scripts/sync/commit_push.ts

      # The push step re-validates when it rewrites the tree (withheld
      # workflow files); its verdict supersedes the full-tree one. Derived
      # once so the PR body and the fail gate below can never disagree.
      - name: Resolve the effective validation verdict
        id: verdict
        env:
          PUSH_VALIDATION: ${{ steps.push.outputs.validation }}
          TREE_VALIDATION: ${{ steps.validate.outputs.result }}
        run: echo "verdict=${PUSH_VALIDATION:-$TREE_VALIDATION}" >> "$GITHUB_OUTPUT"

      - name: Create or refresh pull request
        if: steps.push.outputs.pushed == 'true'
        id: pr
        env:
          GH_TOKEN: ${{ secrets.REPO_PLATFORM_TOKEN }}
          DISPLAY: ${{ steps.versions.outputs.display }}
          BRANCH: ${{ steps.versions.outputs.branch }}
          BASE_BRANCH: ${{ steps.target.outputs.default_branch }}
          VALIDATION: ${{ steps.verdict.outputs.verdict }}
          RESOLVED: ${{ steps.conflicts.outputs.resolved }}
          DRIFT_FILE: ${{ runner.temp }}/settings-drift.md
          SUMMARY_FILE: ${{ runner.temp }}/dropped-local-hunks.md
          CARRIED_FILE: ${{ runner.temp }}/local-carryover.md
          CARRY_REVIEW_FILE: ${{ runner.temp }}/carry-review.txt
          RETIRED_MODULES_FILE: ${{ runner.temp }}/retired-modules.txt
          REMOVED_PATHS_FILE: ${{ runner.temp }}/removed-paths.txt
          WITHHELD_FILE: ${{ runner.temp }}/withheld-workflows.txt
          MANIFEST_LICENSE_FILE: ${{ runner.temp }}/manifest-license-warnings.md
          RECOVER: ${{ inputs.recover }}
          FORCE_MANUAL: ${{ inputs.force_manual }}
        run: bun .github/scripts/sync/open_pr.ts

      - name: Fail on validation errors
        if: steps.verdict.outputs.verdict == 'failed'
        env:
          PR_URL: ${{ steps.pr.outputs.url }}
          PUSH_VALIDATION: ${{ steps.push.outputs.validation }}
        run: |
          if [ "$HIDE_DETAILS" = "true" ] && [ -n "$PR_URL" ]; then
            # run_hidden.ts withheld the diagnostics from this log;
            # open_pr.ts appended them to the PR body instead.
            where="the PR body - this public log hides them (private repository)"
          elif [ "$HIDE_DETAILS" = "true" ]; then
            # No PR exists to carry them (the update delivered nothing);
            # the deliver step below routes the capture to the target's
            # failure-report issue instead.
            where="hidden from this public log (private repository); delivered to the target's failure-report issue, or reproduce validation locally per docs/private-repos.md"
          elif [ -n "$PUSH_VALIDATION" ]; then
            where="the 'Commit and push' step log - the tree was re-validated after workflow files were withheld"
          else
            where="the 'Validate the updated tree' step log"
          fi
          if [ -n "$PR_URL" ]; then
            echo "::error::the update was pushed but validation of the resulting tree failed (details in ${where}). Fix the tree in ${PR_URL} before merging."
          else
            echo "::error::the update produced no changes to deliver, yet validation failed, so ${TARGET_DISPLAY}'s default branch itself does not validate (details in ${where}). Fix the tree on its default branch, then re-run the sync."
          fi
          exit 1

      - name: Flag auto-resolved conflicts for review
        if: steps.conflicts.outputs.resolved == 'true'
        env:
          PR_URL: ${{ steps.pr.outputs.url }}
        run: |
          if [ "$HIDE_DETAILS" = "true" ]; then
            echo "::warning::copier hit merge conflicts in ${TARGET_DISPLAY}; where possible they were resolved in favor of the template. The dropped local lines are listed in the PR body ONLY (this log hides them: private repository). Review the PR, restore anything that should stay local, then merge."
          else
            echo "::warning::copier hit merge conflicts in ${TARGET_DISPLAY}; where possible they were resolved in favor of the template. The dropped local lines are listed in the PR body and in the 'Resolve copier conflicts' step log. Review ${PR_URL}, restore anything that should stay local, then merge."
          fi

      # A hidden step failure with no PR to carry its captured diagnostics
      # (copier or cleanup crash, validation failure with nothing
      # delivered) would otherwise die with the runner. Deliver the
      # capture to a reused issue on the target repo - its issues are as
      # private as the repo. When a PR exists, open_pr.ts already routed
      # the detail into its body and the script skips itself. Best-effort:
      # the script warns generically and exits 0 on delivery problems.
      # env.TARGET != '' keeps both tail steps off runs that died before
      # the checkout and target resolution. Both gates read env
      # (strings): the boolean input itself never == 'true' in an
      # expression (mismatched types coerce to number, true -> 1,
      # 'true' -> NaN).
      - name: Deliver hidden failure diagnostics
        if: failure() && env.HIDE_DETAILS == 'true' && env.TARGET != ''
        env:
          GH_TOKEN: ${{ secrets.REPO_PLATFORM_TOKEN }}
          PR_URL: ${{ steps.pr.outputs.url }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: bun .github/scripts/sync/failure_issue.ts deliver

      - name: Resolve the failure-report issue
        if: success() && env.HIDE_DETAILS == 'true' && env.TARGET != ''
        env:
          GH_TOKEN: ${{ secrets.REPO_PLATFORM_TOKEN }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: bun .github/scripts/sync/failure_issue.ts resolve
