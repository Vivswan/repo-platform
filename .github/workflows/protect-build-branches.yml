# Auto-close pull requests targeting the generated build branch. `template`
# is an append-only output of build-branches.yml; nothing merges into it -
# changes go to templates/ on main. pull_request_target (not pull_request)
# so fork PRs are handled too; safe because the PR's code is never checked
# out or executed here.

name: Protect Build Branches

on:
  pull_request_target:
    # edited fires when a PR is RETARGETED onto the build branch after opening.
    types: [opened, reopened, edited]

permissions:
  pull-requests: write

jobs:
  close:
    if: github.event.pull_request.base.ref == 'template'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Comment and close
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
          BASE: ${{ github.event.pull_request.base.ref }}
        run: |
          gh pr comment "$PR" -R "$GITHUB_REPOSITORY" --body \
            "\`$BASE\` is the generated build branch (append-only output of the build-branches workflow); nothing merges into it. Template changes go to \`templates/\` on \`main\`. Closing."
          gh pr close "$PR" -R "$GITHUB_REPOSITORY"
