# Auto-close pull requests targeting the generated build branch. `build`
# is published by post-green.yml's publish-build job; nothing merges into it via PRs -
# changes go to templates/ (and actions/) on main. (The retired `template`
# and `actions` refs were deleted 2026-08-29 and are no longer matched.)
# pull_request_target (not pull_request) so fork PRs are handled too; safe
# because the PR's code is never checked out or executed here.

name: Protect Build Branches

on: # zizmor: ignore[dangerous-triggers] (the PR code is never checked out or run here)
  pull_request_target:
    # edited fires when a PR is RETARGETED onto a build branch after opening.
    types: [opened, reopened, edited]

permissions:
  pull-requests: write

jobs:
  close:
    if: github.event.pull_request.base.ref == 'build'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      # One comment per PR, edited in place when the PR is reopened or
      # retargeted again; a failed post fails the step, so the PR is not
      # closed without its explanation.
      - name: Explain why the PR is closed
        uses: marocchino/sticky-pull-request-comment@5770ad5eb8f42dd2c4f34da00c94c5381e49af88 # v3.0.5
        with:
          header: repo-platform/protect-build-branches
          message: >-
            `build` is a generated build branch (append-only output of the post-green publish);
            nothing merges into it. Template changes go to `templates/` on `main`, action changes
            to `actions/` on `main`. Closing.

      - name: Close the PR
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
        run: gh pr close "$PR" -R "$GITHUB_REPOSITORY"
