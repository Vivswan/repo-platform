# This repository's own docs site: the docs-site module dogfooded by hand,
# since repo-platform carries no registration for the fleet pipeline to
# read its mounts from (the rendered twin passes custom_domain alone). The
# check job builds docs/ strictly on every PR touching it (dead internal
# links fail there instead of at deploy time); paths-filtered by design,
# so it is never in the all-green roster and never a required check. The
# push deploy is ci.yml's docs-site job, downstream of the all-green gate
# with the judged commit; this workflow is the nightly rebuild and the
# manual dispatch, both building the default branch head. Layout,
# versioning, locales, and conventions: docs/docs-site.md.
name: Docs Site

on:
  pull_request:
    paths:
      - docs/**
  schedule:
    # Nightly rebuild: central theme updates and version tags created
    # without a push propagate, and the external-link check runs
    # (docs/docs-site.md).
    - cron: "41 4 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: Vivswan/repo-platform/actions/pages-site@build
        with:
          check: "true"

  deploy:
    if: github.event_name != 'pull_request'
    concurrency:
      group: pages
      cancel-in-progress: false
    uses: ./.github/workflows/reusable-pages.yml
    with:
      mounts: '[{"path": "/", "source": "vitepress", "versioned": true}]'
      site_title: repo-platform
      link_rot_label: docs-link-rot
      custom_domain: ${{ vars.CUSTOM_DOMAIN }}
    permissions:
      contents: read
      pages: write
      id-token: write
      issues: write
