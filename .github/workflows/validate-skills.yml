# This file is managed by Vivswan/repo-platform.
# Local edits may be replaced during template updates.
#
# Advisory discovery check for this repository's hosted agent skills: runs
# the real `npx skills` CLI against the checkout and asserts every skill
# published in the plugin manifest appears in its listing. It lives outside
# the managed ci.yml's all-green gate on purpose - npx downloads the CLI
# from the npm registry, so the check needs network and can flake on
# registry hiccups, and an advisory red must never block merges. The
# offline structural validation runs inside the gate (the validate-skills
# job in ci.yml). Repo-specific assertions (docs coverage, extra per-skill
# files) belong in the repo-owned checks.yml, not here.

name: Validate Skills

on:
  pull_request:
    # The workflow's own path too, so a pin bump to this file runs it.
    paths: ["skills/**", ".claude-plugin/**", ".github/workflows/validate-skills.yml"]

permissions:
  contents: read

jobs:
  discovery:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: Vivswan/repo-platform/actions/validate-skills@build
        with:
          skills-dir: "skills"
          mode: discovery
