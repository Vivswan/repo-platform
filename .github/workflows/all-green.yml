# workflow_run executes the DEFAULT branch's copy of this file (and the
# local reusable at that ref) - changes land only after they merge.

name: All Green

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
  # Copilot's review submission is the wake that re-judges a verdict left
  # pending on the owed review (a check run's completion fires no event).
  pull_request_review:
    types: [submitted]
  workflow_dispatch:
    inputs:
      sha:
        description: Commit whose newest completed CI run should be re-judged (the unwedge path for a lost workflow_run event).
        required: true
        type: string

permissions: {}

# Serialize judgments per sha so their check-run POSTs stay ordered. Never
# cancel: a verdict cancelled between judging and posting is a lost check.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.workflow_run.head_sha || github.event.pull_request.head.sha || inputs.sha }}
  cancel-in-progress: false

jobs:
  verdict:
    permissions:
      checks: write
      actions: read
    uses: ./.github/workflows/reusable-all-green.yml
    with:
      sha: ${{ github.event_name == 'workflow_dispatch' && inputs.sha || '' }}
      # The ruleset requires only all-green, so this input is the review
      # gate's only home. Residuals (docs/all-green.md): a bot-authored PR
      # pends until a review lands after CI; the weekly schedule run's
      # verdict goes red without posting.
      require-copilot-review: true

  # Gated on the verdict's own posted conclusion, never the triggering
  # run's, which can be green while the verdict fails.
  post-green:
    needs: [verdict]
    # result is spelled out so the release never depends on GitHub's
    # implied-success() rule; conclusion is empty on a pending verdict and
    # unset on a refused one, so neither can release.
    if: >-
      needs.verdict.result == 'success' &&
      needs.verdict.outputs.conclusion == 'success' &&
      github.event_name == 'workflow_run' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_branch == 'main'
    # Deliberately a DIFFERENT resource from the publisher lane the called
    # job takes (build-branches-publish): this job HOLDS post-green-<ref>
    # while its called job WAITS for the lane, so one name would deadlock.
    concurrency:
      group: post-green-${{ github.event.workflow_run.head_branch }}
      cancel-in-progress: false
    permissions:
      contents: read
      checks: read
    uses: ./.github/workflows/post-green.yml
    with:
      # Never github.sha: on workflow_run events that is main's CURRENT
      # tip, which can already be a newer - even red - commit.
      sha: ${{ github.event.workflow_run.head_sha }}
    secrets:
      REPO_PLATFORM_TOKEN: ${{ secrets.REPO_PLATFORM_TOKEN }}
