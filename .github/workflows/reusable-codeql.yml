# Reusable CodeQL analysis, parameterized by language.

name: Reusable CodeQL

on:
  workflow_call:
    inputs:
      language:
        description: CodeQL language (javascript-typescript or python)
        required: true
        type: string
      config:
        description: Optional inline CodeQL config (e.g. paths-ignore)
        required: false
        type: string
        default: ""

permissions:
  contents: read

jobs:
  analyze:
    name: analyze (${{ inputs.language }})
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
      actions: read
    steps:
      # Code scanning needs a public repo (or GitHub Code Security), and
      # these jobs only exist because the repo was public at generation
      # time. A silent skip here would report success with zero scanning,
      # so a private repo fails loudly instead.
      - name: Fail if the repository is private
        if: github.event.repository.private
        run: |
          echo "::error::CodeQL cannot run: this repository is private, but its CI still carries CodeQL jobs from when it was public (private repositories get no CodeQL without GitHub Code Security). Either restore public visibility (if the repo carries .github/settings.yml declaring 'private: false', the settings heal does this on its next run), or merge the template-sync visibility-drift PR so the CodeQL jobs are removed. CI stays red until one of those lands."
          exit 1

      - uses: actions/checkout@v7

      # Repo-owned CodeQL tuning: a .github/codeql/codeql-config.yml in
      # the calling repository - the standard CodeQL config file
      # (paths-ignore, queries, packs, query-filters) - is picked up
      # automatically. The managed ci.yml cannot carry per-repo scan
      # parameters, so the file is how a repository customizes its scan;
      # the inline config input wins when a caller passes both.
      - name: Detect the repository's CodeQL config
        id: config
        env:
          INLINE: ${{ inputs.config }}
        run: |
          file=""
          if [ -z "$INLINE" ]; then
            for candidate in .github/codeql/codeql-config.yml .github/codeql/codeql-config.yaml; do
              if [ -f "$candidate" ]; then file="./$candidate"; break; fi
            done
          fi
          echo "file=$file" >> "$GITHUB_OUTPUT"

      - uses: github/codeql-action/init@v4.37.4
        with:
          languages: ${{ inputs.language }}
          config: ${{ inputs.config }}
          config-file: ${{ steps.config.outputs.file }}
          # Advanced setup does not run the alert-suppression queries by
          # default, so inline `codeql[query-id]` comments are inert without
          # this: append the language's suppression query to the default
          # suite (the pack prefix is the language part of the input). The
          # `packs` input only works in single-language analyses - callers
          # must keep fanning out one call per language.
          packs: "+codeql/${{ inputs.language == 'javascript-typescript' && 'javascript' || inputs.language }}-queries:AlertSuppression.ql"

      - uses: github/codeql-action/analyze@v4.37.4
        with:
          category: "/language:${{ inputs.language }}"
