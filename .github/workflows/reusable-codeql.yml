name: Reusable CodeQL

on:
  workflow_call:
    inputs:
      language:
        description: CodeQL language (javascript-typescript or python)
        required: true
        type: string

permissions:
  contents: read

jobs:
  analyze:
    name: analyze (${{ inputs.language }})
    runs-on: ubuntu-latest
    timeout-minutes: 120
    permissions:
      contents: read
      security-events: write
      actions: read
    steps:
      # Visibility is the caller's to gate: fleet.yml's plan empties a private repository's CodeQL languages, and this
      # repository's own ci.yml calls it as a public repository.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: github/codeql-action/init@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4.38.2
        with:
          languages: ${{ inputs.language }}
          # Advanced setup skips the alert-suppression queries by default,
          # so inline `codeql[query-id]` comments are inert without this.
          # `packs` only works single-language - keep fanning out one call
          # per language.
          packs: "+codeql/${{ inputs.language == 'javascript-typescript' && 'javascript' || inputs.language }}-queries:AlertSuppression.ql"

      - uses: github/codeql-action/analyze@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4.38.2
        with:
          category: "/language:${{ inputs.language }}"
