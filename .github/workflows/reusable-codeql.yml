name: Reusable CodeQL

on:
  workflow_call:
    inputs:
      language:
        description: CodeQL language (javascript-typescript or python)
        required: true
        type: string

permissions:
  contents: read

jobs:
  analyze:
    name: analyze (${{ inputs.language }})
    runs-on: ubuntu-latest
    timeout-minutes: 120
    permissions:
      contents: read
      security-events: write
      actions: read
    steps:
      # CodeQL needs a public repo; these jobs exist because the repo was
      # public at generation time. A silent skip would report success with
      # zero scanning, so a private repo fails loudly instead.
      - name: Fail if the repository is private
        if: github.event.repository.private
        run: |
          echo "::error::CodeQL cannot run: this repository is private, but its CI still carries CodeQL jobs from when it was public (private"\
            "repositories get no CodeQL without GitHub Code Security). Either restore public visibility (if the repo carries .github/settings.yml"\
            "declaring 'private: false', the settings heal does this on its next run), or merge the template-sync visibility-drift PR so the CodeQL"\
            "jobs are removed. CI stays red until one of those lands."
          exit 1

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: github/codeql-action/init@b96794f015dfd88f77b49b1c93e0fa7110f94c63 # v4.38.0
        with:
          languages: ${{ inputs.language }}
          # Advanced setup skips the alert-suppression queries by default,
          # so inline `codeql[query-id]` comments are inert without this.
          # `packs` only works single-language - keep fanning out one call
          # per language.
          packs: "+codeql/${{ inputs.language == 'javascript-typescript' && 'javascript' || inputs.language }}-queries:AlertSuppression.ql"

      - uses: github/codeql-action/analyze@b96794f015dfd88f77b49b1c93e0fa7110f94c63 # v4.38.0
        with:
          category: "/language:${{ inputs.language }}"
