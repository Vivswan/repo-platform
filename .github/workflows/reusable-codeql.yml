name: Reusable CodeQL

on:
  workflow_call:
    inputs:
      language:
        description: CodeQL language (javascript-typescript or python)
        required: true
        type: string
      config:
        description: Optional inline CodeQL config (e.g. paths-ignore)
        required: false
        type: string
        default: ""

permissions:
  contents: read

jobs:
  analyze:
    name: analyze (${{ inputs.language }})
    runs-on: ubuntu-latest
    timeout-minutes: 120
    permissions:
      contents: read
      security-events: write
      actions: read
    steps:
      # CodeQL needs a public repo; these jobs exist because the repo was
      # public at generation time. A silent skip would report success with
      # zero scanning, so a private repo fails loudly instead.
      - name: Fail if the repository is private
        if: github.event.repository.private
        run: |
          echo "::error::CodeQL cannot run: this repository is private, but its CI still carries CodeQL jobs from when it was public (private repositories get no CodeQL without GitHub Code Security). Either restore public visibility (if the repo carries .github/settings.yml declaring 'private: false', the settings heal does this on its next run), or merge the template-sync visibility-drift PR so the CodeQL jobs are removed. CI stays red until one of those lands."
          exit 1

      - uses: actions/checkout@v7

      # Repo-owned tuning: a .github/codeql/codeql-config.yml in the
      # calling repository is picked up automatically (the managed ci.yml
      # cannot carry per-repo scan parameters). The inline config input
      # wins when a caller passes one.
      - name: Detect the repository's CodeQL config
        id: config
        if: inputs.config == ''
        run: |
          file=""
          for candidate in .github/codeql/codeql-config.yml .github/codeql/codeql-config.yaml; do
            if [ -f "$candidate" ]; then file="./$candidate"; break; fi
          done
          echo "file=$file" >> "$GITHUB_OUTPUT"

      - uses: github/codeql-action/init@v4
        with:
          languages: ${{ inputs.language }}
          config: ${{ inputs.config }}
          config-file: ${{ steps.config.outputs.file }}
          # Advanced setup skips the alert-suppression queries by default,
          # so inline `codeql[query-id]` comments are inert without this.
          # `packs` only works single-language - keep fanning out one call
          # per language.
          packs: "+codeql/${{ inputs.language == 'javascript-typescript' && 'javascript' || inputs.language }}-queries:AlertSuppression.ql"

      - uses: github/codeql-action/analyze@v4
        with:
          category: "/language:${{ inputs.language }}"
