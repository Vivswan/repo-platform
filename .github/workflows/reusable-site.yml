# The fleet's one GitHub Pages deploy, called by the managed ci.yml's `site` leg (docs/site.md).
# ONE job on purpose: the repo-owned site-build hook (.github/actions/site-build in the caller's checkout) hands its output directory to the fleet's assembly in the same workspace, so the Pages artifact is the only artifact.
# Callers own `concurrency: pages`; this workflow declares none.

name: Reusable Site

on:
  workflow_call:
    inputs:
      sha:
        description: The commit to build
        required: true
        type: string

permissions:
  contents: read

jobs:
  site:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    # The hook step runs under this token too: a composite action declares
    # no permissions of its own. issues: write is the link-rot issue's.
    permissions:
      contents: read
      pages: write
      id-token: write
      issues: write
    steps:
      # One full checkout serves the hook and every docs tier: version tags
      # and per-ref trees come from history, which needs fetch-depth 0.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          ref: ${{ inputs.sha }}

      # The owner is lowercased: Pages serves <owner>.github.io in lowercase and lychee reports hosts
      # that way, so the own-site exclude matches. The two excludes are regexes, hence the escaped
      # dots (the assembly's ownSitePattern escapes the same way).
      - name: Resolve the site URLs
        id: urls
        run: |
          base_path="/${GITHUB_REPOSITORY#*/}/"
          origin="https://$(echo "${GITHUB_REPOSITORY%%/*}" | tr '[:upper:]' '[:lower:]').github.io"
          site_url="$origin${base_path%/}"
          edit_url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/edit/"
          {
            echo "base_path=$base_path"
            echo "origin=$origin"
            echo "own_links=^${site_url//./\\.}([/?#]|$)"
            echo "edit_links=^${edit_url//./\\.}"
          } >> "$GITHUB_OUTPUT"

      # A repository without the hook publishes docs/ alone, when it has one.
      - name: Build the repository's website
        id: hook
        if: hashFiles('.github/actions/site-build/action.yml') != ''
        uses: ./.github/actions/site-build
        with:
          base-path: ${{ steps.urls.outputs.base_path }}
          origin: ${{ steps.urls.outputs.origin }}

      - name: Note a hook that named no directory
        if: steps.hook.outcome == 'success'
        env:
          DIST: ${{ steps.hook.outputs.dist }}
        run: '[ -n "$DIST" ] || echo "::notice::the site-build hook ran and named no dist directory; only the docs directory publishes, when there is one"'

      - name: Assemble the site
        id: site
        uses: Vivswan/repo-platform/actions/pages-site@stable
        with:
          site-dir: ${{ steps.hook.outputs.dist }}

      # A repository's first deploy after selecting the module can run before the settings apply that creates its
      # Pages site (files/site/settings.yml), and the job token cannot create one: GitHub reserves that to another
      # token whatever `pages: write` grants. So the deploy asks, and waits for the apply on the one known answer.
      #   200 -> exists=true    404 -> exists=false and a warning    anything else -> the step fails
      - name: Ask whether the Pages site exists
        id: pages
        if: steps.site.outputs.publish == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          response=$(gh api --include "repos/$GITHUB_REPOSITORY/pages") || true
          status=$(sed -n '1s#^HTTP/[0-9.]* \([0-9]\{3\}\) .*#\1#p' <<<"$response")
          case "$status" in
            200) echo "exists=true" >>"$GITHUB_OUTPUT" ;;
            404)
              echo "exists=false" >>"$GITHUB_OUTPUT"
              echo "::warning::no Pages site yet: repo-platform's settings apply creates it on its next run (daily), and the nightly rebuild deploys; nothing to do here."
              ;;
            *)
              body=$(sed '1,/^\r\{0,1\}$/d' <<<"$response" | tr -d '\r' | tr -s '\n ' ' ')
              body=${body% }
              echo "::error::reading the Pages site answered HTTP ${status:-nothing}${body:+: $body}"
              exit 1
              ;;
          esac

      - if: steps.pages.outputs.exists == 'true'
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0

      - if: steps.pages.outputs.exists == 'true'
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: ${{ steps.site.outputs.site-dir }}

      - id: deployment
        if: steps.pages.outputs.exists == 'true'
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1

      # lychee reads .lycheeignore from its working directory alone (no flag
      # names another path), and it runs in the site directory: a repository
      # that keeps one at its root, listing the URL patterns an anonymous
      # crawl cannot judge (bot walls, login redirects), has it copied there
      # AFTER the upload, so the served site never carries the file.
      - name: Stage the repository's .lycheeignore
        if: github.event_name == 'schedule' && steps.pages.outputs.exists == 'true' && steps.site.outputs.link-rot-label != '' && hashFiles('.lycheeignore') != ''
        env:
          SITE_DIR: ${{ steps.site.outputs.site-dir }}
        run: cp .lycheeignore "$SITE_DIR/"

      # Nightly link rot over what shipped: external links only (internal
      # ones were fatal at assembly), on the schedule alone so a fixed link
      # closes the issue on the next clean night, never on a push. Green
      # whatever lychee finds (fail: false): the deploy has shipped, so
      # findings become the tracking issue below. lychee-action still fails
      # the step when lychee extracted no link at all (excluded ones count).
      - name: Check external links
        id: links
        if: github.event_name == 'schedule' && steps.pages.outputs.exists == 'true' && steps.site.outputs.link-rot-label != ''
        uses: lycheeverse/lychee-action@e7477775783ea5526144ba13e8db5eec57747ce8 # v2.9.0
        with:
          workingDirectory: ${{ steps.site.outputs.site-dir }}
          # Anonymous on purpose: given a token, lychee answers a 404 on a
          # github.com URL by asking the API, which calls a private repository
          # alive whatever the path. A deleted deep link into this repository
          # would then read as fixed and close the link-rot issue.
          token: ""
          # http(s) links alone and none of the site's own: relative links
          # resolve to files under --root-dir, absolute ones match own_links,
          # and the assembly judged both against the artifact. The theme's
          # "Edit this page" links are theme output an anonymous crawl cannot
          # judge (auth redirect, 404 on a private repository).
          args: >-
            --no-progress
            --root-dir ${{ steps.site.outputs.site-dir }}
            --scheme https --scheme http
            --exclude-all-private
            --exclude '${{ steps.urls.outputs.own_links }}'
            --exclude '${{ steps.urls.outputs.edit_links }}'
            --timeout 30 --max-retries 3 --retry-wait-time 5
            --glob-ignore-case '**/*.html' '**/*.htm'
          fail: false
          format: markdown
          # One failure directory of the fuzz-issue action's report contract
          # (docs/fuzzer.md): <artifacts-dir>/<failure>/report.md, its first
          # line lychee's `# Summary` heading.
          output: ${{ runner.temp }}/link-rot/external-links/report.md

      # A verdict the gates below can test positively (an absent step output
      # reads as 0, tests/workflows/step_output_gates.test.ts): anything but
      # lychee's two verdicts fails here rather than reading as a clean
      # night, and neither the report nor the close runs.
      - name: Read the link-rot verdict
        id: rot
        if: steps.links.outcome == 'success'
        env:
          EXIT_CODE: ${{ steps.links.outputs.exit_code }}
        run: |
          case "$EXIT_CODE" in
            0) echo "found=false" >> "$GITHUB_OUTPUT" ;;
            2) echo "found=true" >> "$GITHUB_OUTPUT" ;;
            *) echo "::error::lychee published no verdict: exit code '$EXIT_CODE' (0 = clean, 2 = broken links)"; exit 1 ;;
          esac

      - name: File or update the link-rot issue
        if: steps.rot.outputs.found == 'true'
        uses: Vivswan/repo-platform/actions/fuzz-issue@stable
        with:
          mode: report
          label: ${{ steps.site.outputs.link-rot-label }}
          title: Docs site link rot
          artifacts-dir: ${{ runner.temp }}/link-rot
          label-color: ${{ steps.site.outputs.link-rot-color }}
          label-description: ${{ steps.site.outputs.link-rot-description }}
          stream: generic

      - name: Close the link-rot issue on a clean night
        if: steps.rot.outputs.found == 'false'
        uses: Vivswan/repo-platform/actions/fuzz-issue@stable
        with:
          mode: resolve
          label: ${{ steps.site.outputs.link-rot-label }}
          stream: generic
