# Deploys the calling repository's GitHub Pages site, as the fleet's one Pages deploy, called by the managed ci.yml's
# `site` leg (docs/modules/site.md).
#
# One job on purpose: the repo-owned site-build hook hands its output directory to the fleet's assembly in the same
# workspace, so the Pages artifact is the only artifact.
#
# Callers own `concurrency: pages`. This workflow declares none.

name: Reusable Site

on:
  workflow_call:
    inputs:
      sha:
        description: The commit to build
        required: true
        type: string

permissions:
  contents: read

jobs:
  site:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    # The hook step runs under this token too: a composite action declares
    # no permissions of its own. issues: write is the link-rot issue's.
    permissions:
      contents: read
      pages: write
      id-token: write
      issues: write
    steps:
      # One full checkout serves the hook and every docs tier: version tags
      # and per-ref trees come from history, which needs fetch-depth 0.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          ref: ${{ inputs.sha }}

      # The base path the hook builds for, from the one rule in actions/shared/pages_site.ts (the assembly lays the
      # artifact out at the same base path), and the edit and tree patterns the link-rot step reads.
      - name: Resolve the site URLs
        id: urls
        uses: $/actions/site-urls

      # A repository without the hook publishes docs/ alone, when it has one; the assembly says so with a notice.
      - name: Build the repository's website
        id: hook
        if: hashFiles('.github/actions/site-build/action.yml') != ''
        uses: ./.github/actions/site-build
        with:
          base-path: ${{ steps.urls.outputs.base-path }}
          origin: ${{ steps.urls.outputs.origin }}

      # The Pages steps run whenever the assembly has something to publish. No pre-check of the Pages site: GitHub
      # reserves its creation to a token this job lacks, the module's settings layer creates it on the next daily
      # apply, and a deploy before that fails on configure-pages's own error (docs/modules/site.md, "Pages enablement").
      - name: Assemble the site
        id: site
        uses: $/actions/pages-site
        with:
          site-dir: ${{ steps.hook.outputs.dist }}

      - if: steps.site.outputs.publish == 'true'
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0

      # Artifacts belong to the RUN, not the attempt: a re-run after a failed prerequisite (post-green) re-runs this leg, and a second
      # github-pages artifact in the run makes deploy-pages refuse ("Multiple artifacts named github-pages").
      # The attempt number in the name keeps each attempt's upload and deploy a pair of their own.
      - if: steps.site.outputs.publish == 'true'
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: ${{ steps.site.outputs.site-dir }}
          name: github-pages-${{ github.run_attempt }}

      - id: deployment
        if: steps.site.outputs.publish == 'true'
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
        with:
          artifact_name: github-pages-${{ github.run_attempt }}

      # lychee reads .lycheeignore from its working directory alone, so the crawl's list (the own links the assembly
      # judged, then the repository's own list, docs/modules/site.md) lands in the site directory after the upload and
      # the served site never carries it.
      - name: Stage the crawl's .lycheeignore
        if: github.event_name == 'schedule' && steps.site.outputs.publish == 'true' && steps.site.outputs.link-rot-label != ''
        env:
          SITE_DIR: ${{ steps.site.outputs.site-dir }}
          IGNORE: ${{ steps.site.outputs.link-rot-ignore }}
        run: cp "$IGNORE" "$SITE_DIR/.lycheeignore"

      # Nightly link rot over what shipped: external links only (internal
      # ones were fatal at assembly), on the schedule alone so a fixed link
      # closes the issue on the next clean night, never on a push. Green
      # whatever lychee finds (fail: false): the deploy has shipped, so
      # findings become the tracking issue below. lychee-action still fails
      # the step when lychee extracted no link at all (excluded ones count).
      - name: Check external links
        id: links
        if: github.event_name == 'schedule' && steps.site.outputs.publish == 'true' && steps.site.outputs.link-rot-label != ''
        uses: lycheeverse/lychee-action@e7477775783ea5526144ba13e8db5eec57747ce8 # v2.9.0
        with:
          workingDirectory: ${{ steps.site.outputs.site-dir }}
          # The lychee the assembly's internal check ran (actions/pages-site/action.yml): one version judges a site.
          lycheeVersion: v0.24.2
          # Anonymous on purpose: given a token, lychee answers a 404 on a
          # github.com URL by asking the API, which calls a private repository
          # alive whatever the path. A deleted deep link into this repository
          # would then read as fixed and close the link-rot issue.
          token: ""
          # The site's own links were judged against the artifact at assembly (the staged .lycheeignore's first
          # line), and the theme's "Edit this page" links are output an anonymous crawl cannot judge (auth
          # redirect, 404 on a private repository). github.com answers an anonymous crawl of blob pages with 503,
          # so links into this repository's own tree are judged by the checkout instead; the file scheme is for
          # those alone.
          args: >-
            --no-progress
            --root-dir ${{ steps.site.outputs.site-dir }}
            --scheme https --scheme http --scheme file
            --exclude-all-private
            --exclude '${{ steps.urls.outputs.edit-links }}'
            --exclude '^file://${{ steps.site.outputs.site-dir }}/'
            --remap '${{ steps.urls.outputs.tree-links }}'
            --timeout 30 --max-retries 3 --retry-wait-time 5
            --glob-ignore-case '**/*.html' '**/*.htm'
          fail: false
          format: markdown
          # One failure directory of the fuzz-issue action's report contract
          # (docs/modules/fuzzer.md): <artifacts-dir>/<failure>/report.md, its first
          # line lychee's `# Summary` heading.
          output: ${{ runner.temp }}/link-rot/external-links/report.md

      # A verdict the gates below can test positively (an absent step output
      # reads as 0, tests/workflows/step_output_gates.test.ts): anything but
      # lychee's two verdicts fails there rather than reading as a clean
      # night, and neither the report nor the close runs.
      - name: Read the link-rot verdict
        id: rot
        if: steps.links.outcome == 'success'
        uses: $/actions/lychee-verdict
        with:
          exit-code: ${{ steps.links.outputs.exit_code }}

      - name: File or update the link-rot issue
        if: steps.rot.outputs.found == 'true'
        uses: $/actions/fuzz-issue
        with:
          mode: report
          label: ${{ steps.site.outputs.link-rot-label }}
          title: Docs site link rot
          artifacts-dir: ${{ runner.temp }}/link-rot
          label-color: ${{ steps.site.outputs.link-rot-color }}
          label-description: ${{ steps.site.outputs.link-rot-description }}
          stream: generic

      - name: Close the link-rot issue on a clean night
        if: steps.rot.outputs.found == 'false'
        uses: $/actions/fuzz-issue
        with:
          mode: resolve
          label: ${{ steps.site.outputs.link-rot-label }}
          stream: generic
