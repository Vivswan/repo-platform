# Every managed repository's ci.yml calls this reusable, so an edit here
# changes fleet CI with no per-repo diff trail; repo-platform's own CI
# gating every edit is the counterweight. The `plan` job runs first and
# resolves the repository's configuration from its registration
# (actions/plan@build); every other job needs it and keys on its outputs,
# so a call carries no per-repository inputs. The caller job's RESULT is
# what the all-green gate judges: a job that fails here fails the whole
# call, and a SKIPPED job leaves it green (module/visibility conditions are
# the design). Job names are non-gating and nothing here may be
# name-addressed. Action refs must stay fully qualified @build: a `./`
# ACTION path resolves against the CALLER's checkout (a `./` WORKFLOW ref
# resolves against this repository).

name: Fleet CI

on:
  workflow_call:
    # The inputs are IGNORED: the plan job resolves every value from the
    # caller's registration. They stay declared so callers rendered before
    # the plan job existed keep calling; the next release removes them.
    inputs:
      modules:
        description: Ignored; the plan job resolves the module selection.
        required: false
        type: string
        default: "[]"
      private:
        description: Ignored; the plan job resolves the visibility.
        required: false
        type: boolean
        default: false
      skills-dir:
        description: Ignored; the plan job resolves the skills directory.
        required: false
        type: string
        default: skills
      codeql-languages:
        description: Ignored; the plan job resolves the CodeQL languages.
        required: false
        type: string
        default: "[]"
      tracking-labels:
        description: Ignored; the plan job resolves the tracking labels.
        required: false
        type: string
        default: ""
    outputs:
      modules:
        description: The repository's module selection in canonical order, a compact JSON array.
        value: ${{ jobs.plan.outputs.modules }}
      tracking-labels:
        description: Comma-separated nightly tracking-issue labels of the selected stream modules.
        value: ${{ jobs.plan.outputs.tracking-labels }}

permissions:
  contents: read

jobs:
  # The one read of the registration: a sparse checkout of the two files
  # the plan resolves from, and the outputs every later job keys on. The
  # visibility rides the event's repository object; the action asks the API
  # when an event carries none.
  plan:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      modules: ${{ steps.plan.outputs.modules }}
      private: ${{ steps.plan.outputs.private }}
      skills-dir: ${{ steps.plan.outputs.skills-dir }}
      codeql-languages: ${{ steps.plan.outputs.codeql-languages }}
      tracking-labels: ${{ steps.plan.outputs.tracking-labels }}
    steps:
      - uses: actions/checkout@v7
        with:
          sparse-checkout: |
            .repo-platform.yml
            .github/.copier-answers.yml
          sparse-checkout-cone-mode: false
      - uses: Vivswan/repo-platform/actions/plan@build
        id: plan
        with:
          private: ${{ github.event.repository.private }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # INTEGRITY (the tree matches its stamp) BLOCKS; FRESHNESS (distance
  # behind the build branch) only informs. The action DEFERS the integrity
  # step so the findings comment is posted before the gate goes red.
  validate-template:
    needs: [plan]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      # Only for the sticky comment, and only on this job.
      pull-requests: write
    steps:
      - uses: actions/checkout@v7
      - uses: Vivswan/repo-platform/actions/validate-template-report@build
        id: template
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
      # Fail-closed: != 'success' re-raises on 'failure' AND on an output
      # that resolved empty (a broken mapping must never read as green).
      - name: Fail on an integrity finding
        if: steps.template.outputs.integrity != 'success'
        run: |
          echo "::error::validate-template's integrity check failed; see the findings on this PR (or the job summary) and the step log above."
          exit 1

  # A pull request that changes the module selection (or a recorded
  # answer) must carry that selection's render: the action renders the
  # template at the repository's recorded build commit and compares every
  # managed file against the tree. Stale fails naming the files and the
  # sync dispatch that pushes the render onto the PR branch (sync-repos.yml's
  # branch input); a PR leaving both files alone is a fast no-op. PR events
  # only: nothing else has a selection diff to judge.
  module-render:
    needs: [plan]
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      # The PR's file listing (a private repository answers 403 without it).
      pull-requests: read
    steps:
      - uses: actions/checkout@v7
      - uses: Vivswan/repo-platform/actions/module-render@build
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}

  # The six base checks in one job for every visibility (a standalone job
  # bills a rounded-up minute per push); !cancelled() keeps later checks
  # running past a failure, and the judge last names every failed check.
  base-checks:
    needs: [plan]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      # Write only for check-file-size's sticky comment.
      pull-requests: write
    steps:
      # One checkout serves every check: fetch-depth 0 because
      # commit-names walks history and gitleaks scans the event's range.
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      # Step ids are the check names the judge reports.
      - id: typography
        if: ${{ !cancelled() }}
        uses: Vivswan/repo-platform/actions/check-typography@build
      # Advisory: continue-on-error keeps a finding from turning the PR
      # red; the sticky comment and step summary still land.
      - id: file-size
        if: ${{ !cancelled() }}
        continue-on-error: true
        uses: Vivswan/repo-platform/actions/check-file-size@build
      - id: commit-names
        if: ${{ !cancelled() }}
        uses: Vivswan/repo-platform/actions/validate-commit-names@build
      - id: actionlint
        if: ${{ !cancelled() }}
        uses: raven-actions/actionlint@v2
      - id: yamllint
        if: ${{ !cancelled() }}
        uses: Vivswan/repo-platform/actions/yamllint@build
      # Allowlist false positives in the repo-owned .gitleaks.toml;
      # comments off: findings land in the log and summary, not PR comments.
      - id: gitleaks
        if: ${{ !cancelled() }}
        uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_ENABLE_COMMENTS: "false"
          # The action's default binary predates .gitleaks.toml's
          # minVersion floor and skips that check silently; pin past it.
          GITLEAKS_VERSION: "8.30.1"
      # A step's conclusion is failure only when it gates (continue-on-error
      # turns a failed outcome into an advisory success).
      - name: Judge the base checks
        if: always()
        env:
          STEPS: ${{ toJSON(steps) }}
        run: |
          {
            printf '## Base checks\n\n| check | outcome | verdict |\n| --- | --- | --- |\n'
            jq -r 'to_entries[] | "| \(.key) | \(.value.outcome) | \(
              if .value.conclusion != "success" then "FAILED"
              elif .value.outcome != "success" then "advisory" else "ok" end) |"' <<<"$STEPS"
          } >>"$GITHUB_STEP_SUMMARY"
          failed="$(jq -r 'to_entries[] | select(.value.conclusion != "success") | "::error::base check failed: \(.key)"' <<<"$STEPS")"
          if [ -z "$failed" ]; then
            echo "all base checks passed"
            exit 0
          fi
          echo "$failed"
          exit 1

  # Fails a PR introducing dependencies with known vulnerabilities. Public
  # only (the dependency-graph API is free just there); PR events only:
  # nothing else has a diff. != 'true' so an empty visibility output runs
  # the check and fails loudly rather than standing the gate down.
  dependency-review:
    needs: [plan]
    if: ${{ needs.plan.outputs.private != 'true' && github.event_name == 'pull_request' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      # The severity threshold and the upstream pin live in the wrapper.
      - uses: Vivswan/repo-platform/actions/dependency-review@build

  # CodeQL, one call per language.
  codeql:
    needs: [plan]
    if: needs.plan.outputs.codeql-languages != '[]' && needs.plan.outputs.codeql-languages != ''
    strategy:
      fail-fast: false
      matrix:
        language: ${{ fromJSON(needs.plan.outputs.codeql-languages) }}
    permissions:
      contents: read
      security-events: write
      actions: read
    uses: ./.github/workflows/reusable-codeql.yml
    with:
      language: ${{ matrix.language }}

  # Offline and inside the gate; the network-dependent discovery check
  # stays advisory in the standalone validate-skills.yml.
  validate-skills:
    needs: [plan]
    if: contains(fromJSON(needs.plan.outputs.modules), 'skills')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: Vivswan/repo-platform/actions/validate-skills@build
        with:
          skills-dir: ${{ needs.plan.outputs.skills-dir }}

  # Fails when the release-please PR head lacks main's tip at CHECK time:
  # a stale release PR cuts a release missing commits already on main.
  # Other PRs stay mergeable while behind.
  release-freshness:
    needs: [plan]
    if: contains(fromJSON(needs.plan.outputs.modules), 'release-please') && github.event_name == 'pull_request' && startsWith(github.head_ref, 'release-please--')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          # Full history: the ancestor check needs origin/main.
          fetch-depth: 0
          # PR head, not the default merge ref - the merge ref already
          # contains main's tip, so it would always pass.
          ref: ${{ github.event.pull_request.head.sha }}
      - name: Require the release PR to contain the tip of main
        run: |
          tip="$(git rev-parse "origin/${GITHUB_BASE_REF}")"
          if git merge-base --is-ancestor "$tip" HEAD; then
            echo "release PR contains the ${GITHUB_BASE_REF} tip (${tip})"
          else
            echo "::error::Release PR is behind ${GITHUB_BASE_REF} (tip ${tip});"\
              "its version and changelog would miss commits already on ${GITHUB_BASE_REF}."\
              "Do not merge; release-please refreshes the PR after the next green run on ${GITHUB_BASE_REF}."
            exit 1
          fi

  # Early release gating: fails the release PR on open tracking/blocker
  # issues or Dependabot alerts at the severity threshold. Can go stale,
  # so the release path re-runs the same action as the pre-flight.
  release-health:
    needs: [plan]
    if: contains(fromJSON(needs.plan.outputs.modules), 'release-please') && github.event_name == 'pull_request' && startsWith(github.head_ref, 'release-please--')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    # vulnerability-alerts read is the Dependabot alerts API key; where
    # the token cannot see alerts the action degrades to a skipped check.
    permissions:
      contents: read
      issues: read
      pull-requests: read
      vulnerability-alerts: read
    steps:
      - uses: Vivswan/repo-platform/actions/release-health@build
        with:
          mode: pull-request
          # Empty disables the tracking gates (no stream module selected).
          tracking-labels: ${{ needs.plan.outputs.tracking-labels }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
