# Every managed repository's ci.yml calls this reusable, so an edit here
# changes fleet CI with no per-repo diff trail; repo-platform's own CI
# gating every edit is the counterweight. The caller job's RESULT is what
# the all-green gate judges: a job that fails here fails the whole call,
# and a SKIPPED job leaves it green (module/visibility conditions are the
# design). Job names are non-gating and nothing here may be
# name-addressed. Action refs must stay fully qualified @build: a `./`
# ACTION path resolves against the CALLER's checkout (a `./` WORKFLOW ref
# resolves against this repository).

name: Fleet CI

on:
  workflow_call:
    inputs:
      modules:
        description: The repository's module selection, a JSON array (the rendered .repo-platform.yml answer).
        required: true
        type: string
      private:
        description: The repository's recorded visibility.
        required: true
        type: boolean
      skills-dir:
        description: The skills module's catalog directory (its copier answer).
        required: false
        type: string
        default: skills
      codeql-languages:
        description: CodeQL languages to analyze, a JSON array; empty when CodeQL is off (private, or no analyzable toolchain).
        required: false
        type: string
        default: "[]"
      tracking-labels:
        description: Comma-separated nightly tracking-issue labels (the fuzzer/nightly answers); release-health blocks on open issues carrying them.
        required: false
        type: string
        default: ""

permissions:
  contents: read

jobs:
  # INTEGRITY (the tree matches its stamp) BLOCKS; FRESHNESS (distance
  # behind the build branch) only informs. The action DEFERS the integrity
  # step so the findings comment is posted before the gate goes red.
  validate-template:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      # Only for the sticky comment, and only on this job.
      pull-requests: write
    steps:
      - uses: actions/checkout@v7
      - uses: Vivswan/repo-platform/actions/validate-template-report@build
        id: template
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
      # Fail-closed: != 'success' re-raises on 'failure' AND on an output
      # that resolved empty (a broken mapping must never read as green).
      - name: Fail on an integrity finding
        if: steps.template.outputs.integrity != 'success'
        run: |
          echo "::error::validate-template's integrity check failed; see the findings on this PR (or the job summary) and the step log above."
          exit 1

  # The five base checks, merged into one job on private repositories (a
  # standalone job bills a rounded-up minute per push there); !cancelled()
  # keeps later checks running when an earlier one fails. Public repos
  # keep the per-check fan-out below.
  base-checks:
    if: inputs.private
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      pull-requests: read
    steps:
      # One checkout serves every check: fetch-depth 0 because
      # commit-names walks history and gitleaks scans the event's range.
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: Vivswan/repo-platform/actions/check-typography@build
        if: '!cancelled()'
      - uses: Vivswan/repo-platform/actions/validate-commit-names@build
        if: '!cancelled()'
      - uses: raven-actions/actionlint@v2
        if: '!cancelled()'
      - uses: Vivswan/repo-platform/actions/yamllint@build
        if: '!cancelled()'
      # Allowlist false positives in the repo-owned .gitleaks.toml;
      # comments off keeps the pull-requests scope at read.
      - uses: gitleaks/gitleaks-action@v3
        if: '!cancelled()'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_ENABLE_COMMENTS: "false"
          # The action's default binary predates .gitleaks.toml's
          # minVersion floor and skips that check silently; pin past it.
          GITLEAKS_VERSION: "8.30.1"

  typography:
    if: ${{ !inputs.private }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: Vivswan/repo-platform/actions/check-typography@build

  commit-names:
    if: ${{ !inputs.private }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: Vivswan/repo-platform/actions/validate-commit-names@build

  actionlint:
    if: ${{ !inputs.private }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: raven-actions/actionlint@v2

  yamllint:
    if: ${{ !inputs.private }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: Vivswan/repo-platform/actions/yamllint@build

  gitleaks:
    if: ${{ !inputs.private }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      # The action lists the PR's commits to build the scan range.
      pull-requests: read
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_ENABLE_COMMENTS: "false"
          GITLEAKS_VERSION: "8.30.1"

  # Fails a PR introducing dependencies with known vulnerabilities. Public
  # only (the dependency-graph API is free just there); PR events only:
  # nothing else has a diff.
  dependency-review:
    if: ${{ !inputs.private && github.event_name == 'pull_request' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      # The severity threshold and the upstream pin live in the wrapper.
      - uses: Vivswan/repo-platform/actions/dependency-review@build

  # CodeQL, one call per language.
  codeql:
    if: inputs.codeql-languages != '[]' && inputs.codeql-languages != ''
    strategy:
      fail-fast: false
      matrix:
        language: ${{ fromJSON(inputs.codeql-languages) }}
    permissions:
      contents: read
      security-events: write
      actions: read
    uses: ./.github/workflows/reusable-codeql.yml
    with:
      language: ${{ matrix.language }}

  # Offline and inside the gate; the network-dependent discovery check
  # stays advisory in the standalone validate-skills.yml.
  validate-skills:
    if: contains(fromJSON(inputs.modules), 'skills')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: Vivswan/repo-platform/actions/validate-skills@build
        with:
          skills-dir: ${{ inputs.skills-dir }}

  # Fails when the release-please PR head lacks main's tip at CHECK time:
  # a stale release PR cuts a release missing commits already on main.
  # Other PRs stay mergeable while behind.
  release-freshness:
    if: contains(fromJSON(inputs.modules), 'release-please') && github.event_name == 'pull_request' && startsWith(github.head_ref, 'release-please--')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          # Full history: the ancestor check needs origin/main.
          fetch-depth: 0
          # PR head, not the default merge ref - the merge ref already
          # contains main's tip, so it would always pass.
          ref: ${{ github.event.pull_request.head.sha }}
      - name: Require the release PR to contain the tip of main
        run: |
          tip="$(git rev-parse "origin/${GITHUB_BASE_REF}")"
          if git merge-base --is-ancestor "$tip" HEAD; then
            echo "release PR contains the ${GITHUB_BASE_REF} tip (${tip})"
          else
            echo "::error::Release PR is behind ${GITHUB_BASE_REF} (tip ${tip}); its version and changelog would miss commits already on ${GITHUB_BASE_REF}. Do not merge; release-please refreshes the PR after the next green run on ${GITHUB_BASE_REF}."
            exit 1
          fi

  # Early release gating: fails the release PR on open tracking/blocker
  # issues or Dependabot alerts at the severity threshold. Can go stale,
  # so the release path re-runs the same action as the pre-flight.
  release-health:
    if: contains(fromJSON(inputs.modules), 'release-please') && github.event_name == 'pull_request' && startsWith(github.head_ref, 'release-please--')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    # vulnerability-alerts read is the Dependabot alerts API key; where
    # the token cannot see alerts the action degrades to a skipped check.
    permissions:
      contents: read
      issues: read
      pull-requests: read
      vulnerability-alerts: read
    steps:
      - uses: Vivswan/repo-platform/actions/release-health@build
        with:
          mode: pull-request
          # Empty disables the tracking gates (no stream module selected).
          tracking-labels: ${{ inputs.tracking-labels }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
