# Every managed ci.yml calls this workflow, so an edit here changes fleet CI with no per-repo diff
# trail; this repository's own gate is the counterweight. The caller judges the call's one RESULT:
# a job that fails here fails the call, a SKIPPED job leaves it green, and no job is name-addressed.
#
#   `./` ACTION path   -> the CALLER's checkout, so action refs stay Vivswan/repo-platform/actions/<name>@stable
#   `./` WORKFLOW ref  -> this repository (reusable-codeql.yml)
#   job permissions    -> checked against the skeleton ci.yml's caller grant BEFORE the job's `if` runs (the fleet-caller-ceilings rule)
# A job needing more than that grant lives in fleet-nightly.yml behind its own caller.

name: Fleet CI

on:
  workflow_call:
    outputs:
      modules:
        description: The repository's module selection in canonical order, a compact JSON array.
        value: ${{ jobs.plan.outputs.modules }}
      tracking-labels:
        description: Comma-separated nightly tracking-issue labels of the selected stream modules.
        value: ${{ jobs.plan.outputs.tracking-labels }}

permissions:
  contents: read

jobs:
  # The visibility input is empty on events without a repository object; the action asks the API then.
  plan:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      modules: ${{ steps.plan.outputs.modules }}
      private: ${{ steps.plan.outputs.private }}
      codeql-languages: ${{ steps.plan.outputs.codeql-languages }}
      tracking-labels: ${{ steps.plan.outputs.tracking-labels }}
      weekly: ${{ steps.plan.outputs.weekly }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          sparse-checkout: .repo-platform.yml
          sparse-checkout-cone-mode: false
      - uses: Vivswan/repo-platform/actions/plan@stable
        id: plan
        with:
          private: ${{ github.event.repository.private }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # The action DEFERS its failure so the findings comment posts first; the step below re-raises it.
  # != 'schedule': the nightly cron carries only the jobs that ask for it (codeql); the nightly scan
  # itself rides fleet-nightly.yml.
  validate-managed-files:
    needs: [plan]
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      # Only for the sticky comment, and only on this job.
      pull-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: Vivswan/repo-platform/actions/validate-managed-files@stable
        id: validate
        with:
          private: ${{ needs.plan.outputs.private }}
      # Fail-closed: != 'success' re-raises on 'failure' AND on an output
      # that resolved empty (a broken mapping must never read as green).
      - name: Fail on a finding
        if: steps.validate.outputs.integrity != 'success'
        run: |
          echo "::error::validate-managed-files failed; see the findings on this PR (or the job summary) and the step log above."
          exit 1

  # One job, not seven: a standalone job bills a rounded-up minute per push. !cancelled() on each
  # step keeps later checks running past a failure, and the judge names every failed one.
  base-checks:
    needs: [plan]
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      # Write only for check-file-size's sticky comment.
      pull-requests: write
    steps:
      # fetch-depth 0: commit-names walks history and gitleaks scans the event's range.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      # Step ids are the check names the judge reports.
      - id: typography
        if: ${{ !cancelled() }}
        uses: Vivswan/repo-platform/actions/check-typography@stable
      - id: file-size
        if: ${{ !cancelled() }}
        continue-on-error: true
        uses: Vivswan/repo-platform/actions/check-file-size@stable
      - id: commit-names
        if: ${{ !cancelled() }}
        uses: Vivswan/repo-platform/actions/validate-commit-names@stable
      - id: actionlint
        if: ${{ !cancelled() }}
        uses: raven-actions/actionlint@3d39aea434753780c3b3d4a1a31c854b4dbf49d7 # v2.2.0
      - id: yamllint
        if: ${{ !cancelled() }}
        uses: Vivswan/repo-platform/actions/yamllint@stable
      # Allowlist in the repo-owned _typos.toml, layered under the fleet's.
      - id: typos
        if: ${{ !cancelled() }}
        uses: Vivswan/repo-platform/actions/typos@stable
      # Allowlist false positives in the repo-owned .gitleaks.toml;
      # comments off: findings land in the log and summary, not PR comments.
      - id: gitleaks
        if: ${{ !cancelled() }}
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_ENABLE_COMMENTS: "false"
          # The action's default binary predates .gitleaks.toml's
          # minVersion floor and skips that check silently; pin past it.
          GITLEAKS_VERSION: "8.30.1"
      # A step's conclusion is failure only when it gates (continue-on-error
      # turns a failed outcome into an advisory success).
      - name: Judge the base checks
        if: always()
        env:
          STEPS: ${{ toJSON(steps) }}
        run: |
          {
            printf '## Base checks\n\n| check | outcome | verdict |\n| --- | --- | --- |\n'
            jq -r 'to_entries[] | "| \(.key) | \(.value.outcome) | \(
              if .value.conclusion != "success" then "FAILED"
              elif .value.outcome != "success" then "advisory" else "ok" end) |"' <<<"$STEPS"
          } >>"$GITHUB_STEP_SUMMARY"
          failed="$(jq -r 'to_entries[] | select(.value.conclusion != "success") | "::error::base check failed: \(.key)"' <<<"$STEPS")"
          if [ -z "$failed" ]; then
            echo "all base checks passed"
            exit 0
          fi
          echo "$failed"
          exit 1

  # Public only: the dependency-graph API is free just there. != 'true' so an empty visibility
  # output runs the check, where a private repository fails loudly instead of skipping silently.
  dependency-review:
    needs: [plan]
    if: ${{ needs.plan.outputs.private != 'true' && github.event_name == 'pull_request' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # The severity threshold and the upstream pin live in the wrapper.
      - uses: Vivswan/repo-platform/actions/dependency-review@stable

  # The fleet policy applies unless the repository carries .github/zizmor.yml. SARIF uploads on
  # public repositories only (a private personal repository has no code scanning); != 'true' so an
  # empty visibility output uploads, where a private repository fails loudly instead of skipping silently.
  zizmor:
    needs: [plan]
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      # The SARIF upload only.
      security-events: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: Vivswan/repo-platform/actions/zizmor@stable
        with:
          upload-sarif: ${{ needs.plan.outputs.private != 'true' }}

  # knip resolves imports through node_modules, so the repository's own bun installs first; the fleet
  # configuration applies unless the repository carries its own knip configuration. A repository
  # committed right after selecting the module has no package.json yet, so the job stands down then.
  knip:
    needs: [plan]
    if: contains(fromJSON(needs.plan.outputs.modules), 'bun') && github.event_name != 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: .bun-version
      - id: bun-install
        if: hashFiles('package.json') != ''
        run: bun install --frozen-lockfile
      - uses: Vivswan/repo-platform/actions/knip@stable
        if: steps.bun-install.outcome == 'success'
      - if: steps.bun-install.outcome == 'skipped'
        run: echo "::notice::knip stood down, this repository has no package.json to install from"

  # Public only: code scanning is where the findings go (!= 'true' as above).
  semgrep:
    needs: [plan]
    if: needs.plan.outputs.private != 'true' && github.event_name != 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      # The SARIF upload only.
      security-events: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: Vivswan/repo-platform/actions/semgrep@stable

  # On the nightly schedule it runs on the week's Monday alone (the plan's weekly output).
  codeql:
    needs: [plan]
    if: needs.plan.outputs.codeql-languages != '[]' && needs.plan.outputs.codeql-languages != '' && (github.event_name != 'schedule' || needs.plan.outputs.weekly == 'true')
    strategy:
      fail-fast: false
      matrix:
        language: ${{ fromJSON(needs.plan.outputs.codeql-languages) }}
    permissions:
      contents: read
      security-events: write
      actions: read
    uses: ./.github/workflows/reusable-codeql.yml
    with:
      language: ${{ matrix.language }}

  # A dead internal link fails the PR here instead of the site leg after the merge. The hashFiles
  # guard sits on the step: GitHub does not allow hashFiles in a job-level if.
  docs-check:
    needs: [plan]
    if: contains(fromJSON(needs.plan.outputs.modules), 'site') && github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - if: hashFiles('docs/**') != ''
        uses: Vivswan/repo-platform/actions/pages-site@stable
        with:
          check: "true"
      - if: hashFiles('docs/**') == ''
        run: echo "::notice::docs-check stood down, this repository has no docs/ directory"

  # Fails when the release-please PR head lacks main's tip at CHECK time:
  # a stale release PR cuts a release missing commits already on main.
  # Other PRs stay mergeable while behind.
  release-freshness:
    needs: [plan]
    if: contains(fromJSON(needs.plan.outputs.modules), 'release-please') && github.event_name == 'pull_request' && startsWith(github.head_ref, 'release-please--')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Full history: the ancestor check needs origin/main.
          fetch-depth: 0
          # PR head, not the default merge ref - the merge ref already
          # contains main's tip, so it would always pass.
          ref: ${{ github.event.pull_request.head.sha }}
      - name: Require the release PR to contain the tip of main
        run: |
          tip="$(git rev-parse "origin/${GITHUB_BASE_REF}")"
          if git merge-base --is-ancestor "$tip" HEAD; then
            echo "release PR contains the ${GITHUB_BASE_REF} tip (${tip})"
          else
            echo "::error::Release PR is behind ${GITHUB_BASE_REF} (tip ${tip});"\
              "its version and changelog would miss commits already on ${GITHUB_BASE_REF}."\
              "Do not merge; release-please refreshes the PR after the next green run on ${GITHUB_BASE_REF}."
            exit 1
          fi

  # Can go stale between check and release, so the release path re-runs the same action as its
  # pre-flight.
  release-health:
    needs: [plan]
    if: contains(fromJSON(needs.plan.outputs.modules), 'release-please') && github.event_name == 'pull_request' && startsWith(github.head_ref, 'release-please--')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    # vulnerability-alerts read is the Dependabot alerts API key; without it the security gate fails.
    permissions:
      contents: read
      issues: read
      pull-requests: read
      vulnerability-alerts: read
    steps:
      - uses: Vivswan/repo-platform/actions/release-health@stable
        with:
          mode: pull-request
          # Empty disables the tracking gates (no stream module selected).
          tracking-labels: ${{ needs.plan.outputs.tracking-labels }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # Blocks for every visibility (docs/security-scans.md); the only bypass is the repository's
  # .trivyignore.yaml, statement and expiry per entry.
  trivy:
    needs: [plan]
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: Vivswan/repo-platform/actions/trivy@stable
