# Weekly: bump the toolchain version pins (files.yml modules.<module>.pin)
# to the latest upstream releases, regenerate the pinned dotfiles, and
# open a PR when anything moved.
# Merging the PR reaches the build branch automatically via the post-green publish.

name: Refresh toolchains

on:
  schedule:
    - cron: "58 9 * * 1"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

# Schedule and dispatch both force-push the same PR branch; queue runs,
# never cancel one mid-push.
concurrency:
  group: refresh-toolchains
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Base the refresh on the default branch regardless of trigger ref.
          ref: ${{ github.event.repository.default_branch }}
          token: ${{ secrets.REPO_PLATFORM_TOKEN || github.token }}

      - name: Set up bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: .bun-version

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Bump pins to the latest upstream versions
        id: refresh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: bun .github/scripts/refresh-toolchains/refresh_toolchains.ts

      # open_refresh_pr.ts composes the body (its optional MAJOR banner is
      # a multiline string, which expressions cannot build) and hands it
      # to open_automation_pr.ts. REFRESH_TITLE: a later run can bump
      # different versions onto the same branch, so an existing PR's title
      # is refreshed too.
      - name: Commit, push, and open PR
        if: steps.refresh.outputs.bumps != ''
        env:
          GH_TOKEN: ${{ secrets.REPO_PLATFORM_TOKEN || github.token }}
          BASE_BRANCH: ${{ github.event.repository.default_branch }}
          BUMPS: ${{ steps.refresh.outputs.bumps }}
          MAJOR: ${{ steps.refresh.outputs.major }}
          BRANCH: automation/toolchain-refresh
          PR_TITLE: "fix(files): bump ${{ steps.refresh.outputs.bumps }}"
          REFRESH_TITLE: "true"
        run: bun .github/scripts/refresh-toolchains/open_refresh_pr.ts
