# Weekly: bump the toolchain version pins (templates/<module>/module.yml
# toolchain.pin) to the latest upstream releases, regenerate the pinned
# dotfiles and dogfood copies, and open a PR when anything moved.
# Merging the PR reaches the staging branch automatically via build-branches.

name: Refresh toolchains

on:
  schedule:
    - cron: "58 9 * * 1"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

# Schedule and dispatch both force-push the same PR branch; queue runs,
# never cancel one mid-push.
concurrency:
  group: refresh-toolchains
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          # Base the refresh on the default branch regardless of trigger ref.
          ref: ${{ github.event.repository.default_branch }}
          token: ${{ secrets.REPO_PLATFORM_TOKEN || github.token }}

      - name: Set up bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: .bun-version

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Bump pins to the latest upstream versions
        id: refresh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: bun .github/scripts/refresh-toolchains/refresh_toolchains.ts

      - name: Commit, push, and open PR
        if: steps.refresh.outputs.bumps != ''
        env:
          GH_TOKEN: ${{ secrets.REPO_PLATFORM_TOKEN || github.token }}
          BASE_BRANCH: ${{ github.event.repository.default_branch }}
          BUMPS: ${{ steps.refresh.outputs.bumps }}
          MAJOR: ${{ steps.refresh.outputs.major }}
        run: |
          branch="automation/toolchain-refresh"
          title="fix(templates): bump $BUMPS"
          body="Automated toolchain pin refresh: bump $BUMPS (fleet-wide via the managed version dotfiles - see docs/toolchains.md). Merging this rebuilds the staging branch; cutting a release makes sync-repos push it to latest-channel repos."
          if [ -n "$MAJOR" ]; then
            body="**MAJOR VERSION JUMP: $MAJOR - review before merging.**

          $body"
          fi
          git config user.name "repo-platform-sync"
          git config user.email "repo-platform-sync@users.noreply.github.com"
          git checkout -B "$branch"
          # The checkout was clean before the bump, so the dirty set is
          # exactly the manifests plus the regenerated outputs.
          git add -A
          git commit -m "$title"
          git push --force origin "$branch"

          existing="$(gh pr list --head "$branch" --json number --jq '.[0].number // empty')"
          if [ -z "$existing" ]; then
            gh pr create \
              --base "$BASE_BRANCH" \
              --head "$branch" \
              --title "$title" \
              --body "$body"
          else
            # A later run can bump different versions onto the same branch;
            # keep the PR naming what it now ships.
            gh pr edit "$existing" --title "$title" --body "$body"
          fi
