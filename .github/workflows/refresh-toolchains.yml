name: Refresh toolchains

on:
  schedule:
    - cron: "58 9 * * 1"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

# Schedule and dispatch both push the same PR branch; queue runs,
# never cancel one mid-push.
concurrency:
  group: refresh-toolchains
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.repository.default_branch }}
          token: ${{ secrets.REPO_PLATFORM_TOKEN || github.token }}

      - name: Set up bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: .bun-version

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Bump pins to the latest upstream versions
        id: refresh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: bun .github/scripts/refresh-toolchains/refresh_toolchains.ts

      # A later run can bump different versions onto the same branch, so the open PR's title and body are refreshed with it.
      # A run that bumped nothing with a refresh PR still open means main already carries those pins (the script aborts on
      # any view that cannot see upstream's newest: an unreachable source, a backport surfacing as latest): the action closes
      # that PR and deletes its branch, so it runs unconditionally. An empty bumps output never reaches a PR: there is no diff.
      - name: Commit, push, and open PR
        uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1 # v8.1.1
        with:
          token: ${{ secrets.REPO_PLATFORM_TOKEN || github.token }}
          branch: automation/toolchain-refresh
          delete-branch: true
          committer: repo-platform-sync <repo-platform-sync@users.noreply.github.com>
          author: repo-platform-sync <repo-platform-sync@users.noreply.github.com>
          commit-message: "fix(files): bump ${{ steps.refresh.outputs.bumps }}"
          title: "fix(files): bump ${{ steps.refresh.outputs.bumps }}"
          body: ${{ steps.refresh.outputs.body }}
