# Split from fleet-ci.yml: GitHub validates a called job's permissions against the CALLER job's grant before any `if` runs,
# and trivy-nightly needs `issues: write`, which the skeleton's `ci` caller never grants, so it rides its own `nightly` caller.
#
#   not in the all-green needs list   -> nothing here gates; the scan stays green whatever it finds
#   a `./` action path                -> resolves against the CALLER's checkout, so repo-platform's action refs stay `@build`

name: Fleet nightly

on:
  workflow_call:

permissions:
  contents: read

jobs:
  plan:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      private: ${{ steps.plan.outputs.private }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          sparse-checkout: |
            .repo-platform.yml
          sparse-checkout-cone-mode: false
      - uses: Vivswan/repo-platform/actions/plan@build
        id: plan
        with:
          private: ${{ github.event.repository.private }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # The nightly half of the security scan (docs/security-scans.md): never red; its findings become the
  # security-nightly issue that release-health blocks on, and a clean night closes it.
  trivy-nightly:
    needs: [plan]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      issues: write
      security-events: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: Vivswan/repo-platform/actions/trivy@build
        id: scan
        with:
          mode: nightly
      - name: Upload the findings report
        if: steps.scan.outputs.found == 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: trivy-findings-${{ github.run_attempt }}
          path: ${{ steps.scan.outputs.report-dir }}
          if-no-files-found: ignore
      - name: File or update the security issue
        if: steps.scan.outputs.found == 'true'
        uses: Vivswan/repo-platform/actions/fuzz-issue@build
        with:
          mode: report
          label: security-nightly
          title: Nightly security scan findings
          artifacts-dir: ${{ steps.scan.outputs.report-dir }}
          artifact-name: trivy-findings-${{ github.run_attempt }}
          # The stream's create tuple, anchored to the settings baseline's
          # label by check_ssot's labels rule.
          label-color: "1d76db"
          label-description: Automated nightly security scan findings
          stream: generic
      - name: Close the security issue on a clean night
        if: steps.scan.outputs.found == 'false'
        uses: Vivswan/repo-platform/actions/fuzz-issue@build
        with:
          mode: resolve
          label: security-nightly
          stream: generic
      # Personal-account code scanning is public-only.
      - name: Upload the SARIF to code scanning
        if: needs.plan.outputs.private == 'false'
        uses: github/codeql-action/upload-sarif@b96794f015dfd88f77b49b1c93e0fa7110f94c63 # v4.38.0
        with:
          sarif_file: ${{ steps.scan.outputs.sarif }}
          category: trivy
