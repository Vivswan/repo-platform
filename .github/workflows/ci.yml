name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  # Weekly CodeQL re-scan with refreshed query packs; every other gate job
  # is event-agnostic or skips its work cleanly on non-PR events.
  schedule:
    - cron: "3 8 * * 1"

permissions:
  contents: read

# Keyed by the commit on a push: a ref-keyed group holds one pending run, so in a burst of merges the displaced commit never gets a verdict.
# Pull-request runs stay keyed by the ref so a newer push cancels the stale run.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # The sources under files/ carry placeholders actionlint cannot read, so the writer lands them in
  # two scratch repositories (every module, none). Each is linted from its own root, where the
  # starter actionlint.yaml's path-scoped ignores apply; pinact judges the same roots and this checkout.
  actionlint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: raven-actions/actionlint@3d39aea434753780c3b3d4a1a31c854b4dbf49d7 # v2.2.0
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: files/bun/.bun-version
      - name: Install dependencies
        run: bun install --frozen-lockfile --silent
      - name: Write the fleet's workflows
        run: bun .github/scripts/ci/write_fleet_lint_tree.ts "$RUNNER_TEMP/fleet-lint"
      - name: actionlint the written workflows
        run: |
          for target in all none; do
            (cd "$RUNNER_TEMP/fleet-lint/$target" && actionlint -color)
          done
      # The archive's sha256 is the pin: the release's checksums file comes from the same place as the archive.
      - name: Install the pinned pinact release
        env:
          PINACT_VERSION: 4.1.1
          PINACT_SHA256: d1cffebe5704b74e2e5f8a864efb9f7e54768972dc686188c008033fb1797841
        run: |
          curl -fsSL --retry 3 --retry-all-errors -o "$RUNNER_TEMP/pinact.tar.gz" \
            "https://github.com/suzuki-shunsuke/pinact/releases/download/v${PINACT_VERSION}/pinact_linux_amd64.tar.gz"
          echo "${PINACT_SHA256}  $RUNNER_TEMP/pinact.tar.gz" | sha256sum --check --strict
          mkdir -p "$RUNNER_TEMP/pinact-bin"
          tar -xzf "$RUNNER_TEMP/pinact.tar.gz" -C "$RUNNER_TEMP/pinact-bin" pinact
          echo "$RUNNER_TEMP/pinact-bin" >>"$GITHUB_PATH"
      # Networked, so outside `bun run check`: a dangling pin passes every offline gate and fails at job start, fleet-wide
      # once synced. Every third-party pin is a full sha whose comment names the tag GitHub resolves to that sha (pinact
      # codes 001 and 005; tests/workflows/delivery_pins.test.ts refuses the `# v7` comment shapes pinact would pass
      # unverified); the config names the two refs that are not release pins by design, and reaches the written trees
      # only through the variable (pinact discovers a config relative to its working directory).
      - name: Verify every pin in the checkout and the written workflows
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PINACT_CONFIG: ${{ github.workspace }}/.github/pinact.yaml
        run: |
          for root in . "$RUNNER_TEMP"/fleet-lint/*/; do
            (cd "$root" && pinact run -check -verify-comment)
          done

  # fetch-depth 0 so the event's commit range resolves; pull-requests read because the action lists
  # the PR's commits to build that range. Comments off keeps that scope at read; findings still land
  # in the job summary and SARIF artifact.
  gitleaks:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_ENABLE_COMMENTS: "false"
          # The action's default binary (8.24.3) predates .gitleaks.toml's
          # minVersion floor AND skips that check silently; pin one meeting
          # the floor so CI honors the same config local runs do.
          GITLEAKS_VERSION: "8.30.1"

  # Only a pull request has a dependency diff to review; the gate's allowed-skips names this job.
  dependency-review:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # The severity threshold and the upstream pin live in the wrapper.
      - uses: ./actions/dependency-review

  yamllint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./actions/yamllint

  biome:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: files/bun/.bun-version
      - name: Install tooling
        run: bun install --frozen-lockfile --silent
      - name: Biome (lint + format check)
        run: bun x biome ci .

  typography:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./actions/check-typography

  file-size:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      # Only for the sticky comment.
      pull-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./actions/check-file-size

  commit-names:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: ./actions/validate-commit-names

  typecheck:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: files/bun/.bun-version
      - name: Typecheck repo and action scripts
        run: |
          bun scripts/bootstrap.ts
          bun run typecheck

  # The invariants are package.json's `invariants` script, so CI and `bun run check` run one list.
  invariants:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: files/bun/.bun-version
      - name: Install dependencies
        run: bun install --frozen-lockfile --silent
      - name: Check the invariants
        run: bun run invariants

  # This repository judged as fleet CI judges every repository (fleet-ci.yml's plan and validate steps): the plan over
  # the registration, then the action from this checkout, which reads the manifest's recorded commit and runs that
  # commit's check.ts over the tree. A PR that changes files/ stays green until this repository syncs itself.
  managed-files:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      # Only for the sticky comment.
      pull-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./actions/plan
        id: plan
        with:
          private: ${{ github.event.repository.private }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      # The action DEFERS its failure so the findings comment posts first; the next step re-raises it, fail-closed:
      # != 'success' re-raises on 'failure' AND on an output that resolved empty.
      - uses: ./actions/validate-managed-files
        id: validate
        with:
          private: ${{ steps.plan.outputs.private }}
      - if: ${{ steps.validate.outputs.integrity != 'success' }}
        run: |
          echo "::error::validate-managed-files failed; see the findings on this PR (or the job summary) and the step log above."
          exit 1

  script-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: files/bun/.bun-version
      # The root install's postinstall installs every action's pinned dependencies, the site action's among them.
      - name: Install dependencies
        run: bun install --frozen-lockfile --silent
      # Running the typos action installs its pinned release into $RUNNER_TEMP, which the end-to-end cases need on PATH.
      - name: Install typos by running the action
        uses: ./actions/typos
      - name: Put the installed typos on PATH
        run: echo "$RUNNER_TEMP" >>"$GITHUB_PATH"
      # The link-check step installs the pinned lychee on PATH, which the site tests' live link check then runs.
      - name: Install the site action's lychee
        uses: lycheeverse/lychee-action@e7477775783ea5526144ba13e8db5eec57747ce8 # v2.9.0
        with:
          lycheeVersion: v0.24.2
          args: --offline --no-progress --version
      - name: Run .github/scripts and action tests
        env:
          TYPOS_REQUIRED: "1"
        run: bun run test

  # This repository's own skills catalog, judged by the action Vivswan/skills carries (it pins its
  # own bun). Skills publishes no release tags, so the pin's comment names its branch.
  validate-skills:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: Vivswan/skills/.github/actions/validate-skills@cff7bdd1435143ad62567862cf89e9f1af308b26 # main

  # Discovery runs the real `npx skills add --list` against the checkout, so it reaches the npm
  # registry: its own job, so a registry hiccup names itself instead of the structure check.
  skills-discovery:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: Vivswan/skills/.github/actions/validate-skills@cff7bdd1435143ad62567862cf89e9f1af308b26 # main
        with:
          mode: discovery

  # The configuration is the plan's reading of this repository's registration, as in the deploy; this checkout's plan, not
  # @stable's, so a PR changing files.yml judges its own docs. A dead internal link fails here instead of the deploy.
  docs-check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # The skills repository at the sha the validate-skills pins name: Vale's styles and the docs probe live there (.vale.ini).
      # Dependabot bumps the `uses:` lines and never a `ref:`, so tests/workflows/ci_shape.test.ts holds this ref to them.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: Vivswan/skills
          ref: cff7bdd1435143ad62567862cf89e9f1af308b26
          path: .skills
      - uses: ./actions/plan
        id: plan
        with:
          mode: site
      - uses: ./actions/pages-site
        with:
          check: "true"
          config: ${{ steps.plan.outputs.config }}
      # The skills' Vale styles over this repository's pages (.vale.ini); the release by sha256, as pinact above.
      - name: Install the pinned Vale release
        env:
          VALE_VERSION: 3.24.0
          VALE_SHA256: 867534ddb678abca7f214bc4706ead0922bd5252ffe8035fc227013f66c8b214
        run: |
          curl -fsSL --retry 3 --retry-all-errors -o "$RUNNER_TEMP/vale.tar.gz" \
            "https://github.com/vale-cli/vale/releases/download/v${VALE_VERSION}/vale_${VALE_VERSION}_Linux_64-bit.tar.gz"
          echo "${VALE_SHA256}  $RUNNER_TEMP/vale.tar.gz" | sha256sum --check --strict
          mkdir -p "$RUNNER_TEMP/vale-bin"
          tar -xzf "$RUNNER_TEMP/vale.tar.gz" -C "$RUNNER_TEMP/vale-bin" vale
          echo "$RUNNER_TEMP/vale-bin" >>"$GITHUB_PATH"
      - name: Vale over the pages (shape and wording, the skills' rules)
        run: vale README.md docs
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: files/bun/.bun-version
      # The docs-discipline probe's path check: a page naming a path a managed repository holds resolves through the shipped base tree.
      - name: Probe every path the pages name
        run: >-
          git ls-files 'README.md' 'docs/*.md'
          | xargs bun .skills/skills/docs-discipline/scripts/docs-probe.mts --base files/base

  # A caller job's permissions are the ceiling for the called workflow, so the scan grants sit here.
  codeql-javascript:
    permissions:
      contents: read
      security-events: write
      actions: read
    uses: ./.github/workflows/reusable-codeql.yml
    with:
      language: javascript-typescript

  # This repository is public, so the SARIF uploads (zizmor, semgrep) run unconditionally.
  zizmor:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./actions/zizmor

  typos:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./actions/typos

  # knip.jsonc at the root is this repository's own configuration.
  knip:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: files/bun/.bun-version
      - name: Install dependencies
        run: bun install --frozen-lockfile --silent
      - uses: ./actions/knip

  semgrep:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./actions/semgrep

  bun-setup-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: files/bun/.bun-version
      - name: Plant the two pins
        id: pins
        run: bun .github/scripts/ci/bun_setup_smoke.ts plant
      - name: Set up the current bun (already on PATH)
        id: first
        uses: ./actions/bun-setup
        with:
          from: ${{ runner.temp }}/bun-setup-smoke/current
      - name: Set up an earlier release (not the bun on PATH)
        id: second
        uses: ./actions/bun-setup
        with:
          from: ${{ runner.temp }}/bun-setup-smoke/previous
      - name: Judge both calls
        shell: bash
        env:
          CURRENT: ${{ steps.pins.outputs.current }}
          PREVIOUS: ${{ steps.pins.outputs.previous }}
          FIRST_PATH: ${{ steps.first.outputs.path }}
          FIRST_READY: ${{ steps.first.outputs.ready }}
          FIRST_INSTALLED: ${{ steps.first.outputs.installed }}
          FIRST_VERSION: ${{ steps.first.outputs.version }}
          SECOND_PATH: ${{ steps.second.outputs.path }}
          SECOND_READY: ${{ steps.second.outputs.ready }}
          SECOND_INSTALLED: ${{ steps.second.outputs.installed }}
          SECOND_VERSION: ${{ steps.second.outputs.version }}
        # Whichever bun is current by now (the second call overwrote the
        # shared install path); the judge reads recorded outputs only.
        run: bun .github/scripts/ci/bun_setup_smoke.ts judge

  trivy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./actions/trivy

  # THE gate: this job's own check run is the ruleset's required check (files/settings/override.yml),
  # and alls-green passes only when every needed result is success, or skipped for a job named in allowed-skips.
  #   needs          -> every gating job (tests/workflows/all_green_gate.test.ts compares the list with the job set)
  #   if: always()   -> the judgment must run over failures
  #   allowed-skips  -> every needed job with a condition (the same test compares the two)
  all-green:
    needs:
      - actionlint
      - gitleaks
      - dependency-review
      - yamllint
      - biome
      - typography
      - file-size
      - commit-names
      - typecheck
      - invariants
      - managed-files
      - script-tests
      - validate-skills
      - skills-discovery
      - docs-check
      - codeql-javascript
      - zizmor
      - typos
      - knip
      - semgrep
      - bun-setup-smoke
      - trivy
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: re-actors/alls-green@b5b5b37504aa4183270bd3d855c52a67f212be35 # v1.3.0
        with:
          jobs: ${{ toJSON(needs) }}
          allowed-skips: dependency-review

  # Needs-ordered behind the gate in the same run, so github.sha IS the judged commit.
  # No concurrency group: the called mover holds stable-tag-move, and a caller holding a lane its called job takes deadlocks the call.
  post-green:
    needs: [all-green]
    if: >-
      needs.all-green.result == 'success' &&
      github.event_name == 'push' &&
      github.ref == 'refs/heads/main'
    # The ceiling for every post-green.yml job (tests/workflows/caller_ceilings.test.ts):
    # pull-requests read is read-directives' merged-PR lookup.
    permissions:
      contents: write
      checks: read
      pull-requests: read
    uses: ./.github/workflows/post-green.yml
    # A called workflow inherits down only what it received: the fleet legs' environment secret needs the whole
    # chain to inherit (post-green.yml's callers, actions/runner#4453).
    # nosemgrep: yaml.github-actions.security.secrets-inherit.secrets-inherit
    secrets: inherit # zizmor: ignore[secrets-inherit]
    with:
      sha: ${{ github.sha }}
      before: ${{ github.event.before }}

  # Ordered behind post-green so the deploy runs after this run's mover, and a green move's theme
  # is what @stable serves it; !cancelled() keeps a red or skipped post-green from holding the site back. No push clause in
  # the if: the weekly schedule is the rebuild and link-rot check, a dispatch the manual deploy.
  site:
    needs: [all-green, post-green]
    if: >-
      !cancelled() &&
      needs.all-green.result == 'success' &&
      github.ref == 'refs/heads/main'
    concurrency:
      group: pages
    permissions:
      contents: read
      pages: write
      id-token: write
      issues: write
    uses: ./.github/workflows/reusable-site.yml
    with:
      sha: ${{ github.sha }}
