name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  # Weekly CodeQL re-scan with refreshed query packs; every other gate job
  # is event-agnostic or skips its work cleanly on non-PR events.
  schedule:
    - cron: "3 8 * * 1"

permissions:
  contents: read

# Keyed by the commit on a push: every merge to main gets its own complete run and verdict.
# A ref-keyed group keeps one pending run and cancels the older one, so a burst of merges leaves the tip unjudged.
# Pull-request runs stay keyed by the ref: a newer push cancels the stale run.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # This repository's own workflows, then the workflows the fleet receives:
  # the sources under files/ carry placeholders actionlint cannot read, so
  # the writer lands them in two scratch repositories (every module, none)
  # and the binary the first step put on PATH lints each from its own root,
  # where the starter actionlint.yaml's path-scoped ignores apply.
  actionlint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: raven-actions/actionlint@3d39aea434753780c3b3d4a1a31c854b4dbf49d7 # v2.2.0
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: .bun-version
      - name: Install dependencies
        run: bun install --frozen-lockfile --silent
      - name: Write the fleet's workflows
        run: bun .github/scripts/ci/write_fleet_lint_tree.ts "$RUNNER_TEMP/fleet-lint"
      - name: actionlint the written workflows
        run: |
          for target in all none; do
            (cd "$RUNNER_TEMP/fleet-lint/$target" && actionlint -color)
          done

  # The action scans the event's commit range (fetch-depth: 0 so any
  # range resolves). Same job the base template ships to every managed
  # repo; `bun run lint:secrets` covers history and staged changes
  # locally. pull-requests read: the action lists the PR's commits to
  # build the scan range. Comments off keeps that scope at read; leaks
  # still land in the job summary and SARIF artifact.
  gitleaks:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_ENABLE_COMMENTS: "false"
          # The action's default binary (8.24.3) predates .gitleaks.toml's
          # minVersion floor AND skips that check silently; pin one meeting
          # the floor so CI honors the same config local runs do.
          GITLEAKS_VERSION: "8.30.1"

  # Fails when a PR introduces dependencies with known vulnerabilities, by
  # diffing the dependency graph between base and head. Only PR events have
  # a diff to review, so the skip lives on the steps: the all-green verdict
  # treats a skipped job as standing down, so a job-level skip would fail
  # open - gating jobs stay unconditional (the all-green-roster ssot rule
  # pins this) and event conditions go on their steps.
  dependency-review:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: github.event_name == 'pull_request'
      # The severity threshold and the upstream pin live in the wrapper.
      - uses: ./actions/dependency-review
        if: github.event_name == 'pull_request'

  # The all-green gate's judging logic, exercised as the REAL run block
  # extracted from actions/all-green/action.yml against scenario needs
  # payloads: the fail-closed shapes (a failure, all skipped, an empty
  # needs list, malformed input) must exit red, the healthy shapes green.
  allgreen-judgment:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: .bun-version
      - name: Install dependencies
        run: bun install --frozen-lockfile --silent
      - name: Judge the gate scenarios through the real run block
        run: bun run test tests/actions/all_green_judgment.test.ts

  yamllint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # The same action the fleet runs; local path, so this repository
      # always lints with the tree under review rather than what is
      # published. `bun run lint:yaml` is the local twin.
      - uses: ./actions/yamllint

  biome:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: .bun-version
      - name: Install tooling
        run: bun install --frozen-lockfile --silent
      - name: Biome (lint + format check)
        run: bun x biome ci .

  typography:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./actions/check-typography

  file-size:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      # Only for the sticky comment.
      pull-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./actions/check-file-size

  commit-names:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: ./actions/validate-commit-names

  typecheck:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: .bun-version
      # Keyed on each action's tsconfig.json: dirs without one (no TS to
      # check) skip naturally, and a new action joins without editing this
      # list. The bun-dirs ssot rule pins the glob and requires every dir
      # committing a bun.lock to carry a tsconfig.json.
      - name: Typecheck repo and action scripts
        run: |
          for tsconfig in tsconfig.json actions/*/tsconfig.json; do
            dir="$(dirname "$tsconfig")"
            echo "::group::$dir"
            (cd "$dir" && bun install --frozen-lockfile --silent && bun x tsc -p .)
            echo "::endgroup::"
          done

  # Network gate, deliberately outside `bun run check`: proves every
  # third-party action pin resolves to a real upstream ref (a dangling
  # pin like a retired moving-major tag passes every offline gate and
  # then fails at job start, fleet-wide once synced).
  action-refs:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: .bun-version
      - name: Resolve every pinned action ref
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: bun .github/scripts/ci/resolve_action_refs.ts

  # The offline invariants, each the twin of a `bun run check` gate (the
  # local-gates rule pins the pairing both ways).
  invariants:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: .bun-version
      - name: Install dependencies
        run: |
          bun install --frozen-lockfile --silent
          bun install --frozen-lockfile --silent --cwd actions/validate-managed-files
      - name: Validate this repository's own managed files
        run: bun run validate
      - name: Check single-source-of-truth invariants
        run: bun run ssot:check
      - name: Check the files table in docs/new-repo.md against files.yml
        run: bun run files:check
      # Offline and sub-second: the block files must match files.yml's
      # gitignore_sources on the PR that edits them, not a week later.
      - name: Check the gitignore copies against files.yml
        run: bun run gitignore:topology
      - name: Check the toolchain pin dotfiles against files.yml
        run: bun run pins:check
      - name: Check the theme CSS against its token data
        run: bun run theme:check
      - name: Check this repository's rendered settings against its layers and overlay
        run: bun run settings:check
      - name: Check markdown is not hard-wrapped
        run: bun run wrap:check

  # The build tree the fleet consumes, assembled twice and compared: the
  # post-green publish ships exactly this, so a failing or
  # non-deterministic assembly fails here first.
  build-tree:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: .bun-version
      - name: Install dependencies
        run: bun install --frozen-lockfile --silent
      - name: Assemble twice and compare
        run: |
          bun .github/scripts/build-branches/branch_tree.ts --dest /tmp/tree-a
          bun .github/scripts/build-branches/branch_tree.ts --dest /tmp/tree-b
          diff -r --no-dereference /tmp/tree-a /tmp/tree-b
          echo "build tree is deterministic"

  script-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: .bun-version
      - name: Install dependencies
        run: bun install --frozen-lockfile --silent
      # The typos action's end-to-end cases run the binary the action pins
      # (its release publishes no checksum file, so the archive's sha256 is
      # recorded here); TYPOS_REQUIRED makes them fail instead of skip.
      - name: Install the pinned typos release
        env:
          TYPOS_VERSION: 1.50.1
          TYPOS_SHA256: edf0545109aee6a22751d04ddecb97c45be47d3aa0409564fb895eeeace91b1e
        run: |
          curl -fsSL --retry 3 --retry-all-errors -o "$RUNNER_TEMP/typos.tar.gz" \
            "https://github.com/crate-ci/typos/releases/download/v${TYPOS_VERSION}/typos-v${TYPOS_VERSION}-x86_64-unknown-linux-musl.tar.gz"
          echo "${TYPOS_SHA256}  $RUNNER_TEMP/typos.tar.gz" | sha256sum --check --strict
          mkdir -p "$RUNNER_TEMP/typos-bin"
          tar -xzf "$RUNNER_TEMP/typos.tar.gz" -C "$RUNNER_TEMP/typos-bin" ./typos
          echo "$RUNNER_TEMP/typos-bin" >>"$GITHUB_PATH"
      - name: Run .github/scripts and action tests
        env:
          TYPOS_REQUIRED: "1"
        run: bun run test

  # Structural validation of this repository's own hosted agent skills
  # (skills/ plus the repo-owned .claude-plugin manifests), dogfooding the
  # composite action the skills module pins fleet-wide. Offline and cheap;
  # `bun run validate:skills` is the local twin.
  validate-skills:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./actions/validate-skills
        with:
          skills-dir: skills

  # CLI discovery for the same catalog. Fleet repos get this as the
  # advisory validate-skills.yml (npx needs the npm registry, and managed
  # repos must not block on a registry hiccup); here it GATES, per this
  # repo's all-jobs-gate convention - CI is not network-shy (action-refs
  # already resolves upstream refs) and a listing regression in the action
  # this repo ships should block its own merges.
  skills-discovery:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./actions/validate-skills
        with:
          skills-dir: skills
          mode: discovery

  # The pages-site action's vitepress build, end to end in the runner's
  # own directory topology (workspace, action tree, and RUNNER_TEMP apart):
  # nothing else in the gate ever RUNS vitepress, and the build's module
  # resolution only breaks under that separation - the class a laptop
  # layout cannot reproduce (tests/ci/pages_site_build/).
  pages-site-build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: .bun-version
      - name: Install the action's pinned dependencies
        run: bun install --frozen-lockfile --cwd actions/pages-site
      - name: Build the fixture site and assert the artifact
        run: bun run test tests/ci/pages_site_build

  # CodeQL runs inside the gate: this thin job calls the analysis workflow,
  # and a caller job's permissions are the ceiling for every job in the
  # called workflow, so the scan permissions are granted here. This repo is
  # TypeScript-only (the actions, scripts, and writer tooling), so one
  # language leg suffices; the name matches fleet-ci's per-language jobs.
  codeql-javascript:
    permissions:
      contents: read
      security-events: write
      actions: read
    uses: ./.github/workflows/reusable-codeql.yml
    with:
      language: javascript-typescript

  # The four fleet lint actions dogfooded from the working tree, each the
  # same call fleet-ci.yml makes at @build. This repository is public, so
  # the SARIF uploads (zizmor, semgrep) run unconditionally.
  zizmor:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./actions/zizmor

  typos:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./actions/typos

  # knip.jsonc at the root is this repository's own configuration.
  knip:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: .bun-version
      - name: Install dependencies
        run: bun install --frozen-lockfile --silent
      - uses: ./actions/knip

  semgrep:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./actions/semgrep

  # The shared bun-setup action dogfooded from the working tree: the runner
  # gets the pinned bun, then one call per planted pin (that version:
  # reused, not installed; an earlier release: installed), judged by ci/.
  bun-setup-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: .bun-version
      - name: Plant the two pins
        id: pins
        run: bun .github/scripts/ci/bun_setup_smoke.ts plant
      - name: Set up the current bun (already on PATH)
        id: first
        uses: ./actions/bun-setup
        with:
          pin: ${{ runner.temp }}/bun-setup-smoke/current/.bun-version
      - name: Set up an earlier release (not the bun on PATH)
        id: second
        uses: ./actions/bun-setup
        with:
          pin: ${{ runner.temp }}/bun-setup-smoke/previous/.bun-version
      - name: Judge both calls
        shell: bash
        env:
          CURRENT: ${{ steps.pins.outputs.current }}
          PREVIOUS: ${{ steps.pins.outputs.previous }}
          FIRST_PATH: ${{ steps.first.outputs.path }}
          FIRST_READY: ${{ steps.first.outputs.ready }}
          FIRST_INSTALLED: ${{ steps.first.outputs.installed }}
          FIRST_VERSION: ${{ steps.first.outputs.version }}
          SECOND_PATH: ${{ steps.second.outputs.path }}
          SECOND_READY: ${{ steps.second.outputs.ready }}
          SECOND_INSTALLED: ${{ steps.second.outputs.installed }}
          SECOND_VERSION: ${{ steps.second.outputs.version }}
        # Whichever bun is current by now (the second call overwrote the
        # shared install path); the judge reads recorded outputs only.
        run: bun .github/scripts/ci/bun_setup_smoke.ts judge

  # The same blocking scan the fleet runs, by local path: a fixable
  # CRITICAL finding in any committed lockfile fails here first.
  trivy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./actions/trivy

  # THE gate: this job's own check run (named all-green, created by the
  # GitHub Actions app) is the ruleset's required check. `needs` must list
  # every gating job above - ALL_GREEN_ROSTER (scripts/check/ssot/all_green.ts) is that list's
  # authored twin, compared both ways, so adding or retiring a gate is loud.
  # `if: always()` because the judgment must run over failures; the shared
  # action fails unless every result is success or skipped with at least
  # one success (a skipped gate stands down; an all-skipped run vouches
  # for nothing).
  all-green:
    needs:
      - actionlint
      - gitleaks
      - dependency-review
      - allgreen-judgment
      - yamllint
      - biome
      - typography
      - file-size
      - commit-names
      - typecheck
      - action-refs
      - invariants
      - build-tree
      - script-tests
      - validate-skills
      - skills-discovery
      - pages-site-build
      - codeql-javascript
      - zizmor
      - typos
      - knip
      - semgrep
      - bun-setup-smoke
      - trivy
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./actions/all-green
        with:
          needs: ${{ toJSON(needs) }}

  # Everything that runs after green on a main push.
  # Same-run and needs-ordered behind the gate, so github.sha IS the judged commit.
  # No lane here: a caller holding a lane its called job takes deadlocks the call, and the called publish job holds build-branches-publish.
  # contents: write is the ceiling the called move-stable job needs for its tag push; every other called job declares read.
  post-green:
    needs: [all-green]
    if: >-
      needs.all-green.result == 'success' &&
      github.event_name == 'push' &&
      github.ref == 'refs/heads/main'
    # The ceiling for every post-green.yml job (the caller-ceilings ssot
    # rule): pull-requests read is read-directives' merged-PR lookup.
    permissions:
      contents: write
      checks: read
      pull-requests: read
    uses: ./.github/workflows/post-green.yml
    with:
      sha: ${{ github.sha }}
      before: ${{ github.event.before }}
    secrets:
      REPO_PLATFORM_TOKEN: ${{ secrets.REPO_PLATFORM_TOKEN }}

  # This repository's own site: the skeleton's `site` leg carried by hand,
  # calling the pipeline by local path so this tree's workflow is the one
  # under test. Ordered behind post-green so the deploy runs after this run
  # republished the build branch its actions ride (@build); !cancelled()
  # keeps a red fleet leg from holding the site back. No push clause: the
  # weekly schedule is the rebuild and the link-rot check, a dispatch the
  # manual deploy. The configuration is spelled out: this caller reads no
  # registration through the plan.
  site:
    needs: [all-green, post-green]
    if: >-
      !cancelled() &&
      needs.all-green.result == 'success' &&
      github.ref == 'refs/heads/main'
    concurrency:
      group: pages
      cancel-in-progress: false
    permissions:
      contents: read
      pages: write
      id-token: write
      issues: write
    uses: ./.github/workflows/reusable-site.yml
    with:
      sha: ${{ github.sha }}
      config: '{"site_title": "repo-platform", "docs_path": "docs", "include": [], "link_rot_label": "docs-link-rot"}'
      custom_domain: ${{ vars.CUSTOM_DOMAIN }}
