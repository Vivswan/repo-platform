name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  # Weekly CodeQL re-scan with refreshed query packs; every other gate job
  # is event-agnostic or skips its work cleanly on non-PR events.
  schedule:
    - cron: "3 8 * * 1"

permissions:
  contents: read

# Keyed by the commit on a push: a ref-keyed group holds one pending run, so in a burst of merges the displaced commit never gets a verdict.
# Pull-request runs stay keyed by the ref so a newer push cancels the stale run.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # The sources under files/ carry placeholders actionlint cannot read, so the writer lands them in
  # two scratch repositories (every module, none). Each is linted from its own root, where the
  # starter actionlint.yaml's path-scoped ignores apply; pinact judges the same roots and this checkout.
  actionlint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: raven-actions/actionlint@3d39aea434753780c3b3d4a1a31c854b4dbf49d7 # v2.2.0
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: .bun-version
      - name: Install dependencies
        run: bun install --frozen-lockfile --silent
      - name: Write the fleet's workflows
        run: bun .github/scripts/ci/write_fleet_lint_tree.ts "$RUNNER_TEMP/fleet-lint"
      - name: actionlint the written workflows
        run: |
          for target in all none; do
            (cd "$RUNNER_TEMP/fleet-lint/$target" && actionlint -color)
          done
      # The archive's sha256 is the pin: the release's checksums file comes from the same place as the archive.
      - name: Install the pinned pinact release
        env:
          PINACT_VERSION: 4.1.1
          PINACT_SHA256: d1cffebe5704b74e2e5f8a864efb9f7e54768972dc686188c008033fb1797841
        run: |
          curl -fsSL --retry 3 --retry-all-errors -o "$RUNNER_TEMP/pinact.tar.gz" \
            "https://github.com/suzuki-shunsuke/pinact/releases/download/v${PINACT_VERSION}/pinact_linux_amd64.tar.gz"
          echo "${PINACT_SHA256}  $RUNNER_TEMP/pinact.tar.gz" | sha256sum --check --strict
          mkdir -p "$RUNNER_TEMP/pinact-bin"
          tar -xzf "$RUNNER_TEMP/pinact.tar.gz" -C "$RUNNER_TEMP/pinact-bin" pinact
          echo "$RUNNER_TEMP/pinact-bin" >>"$GITHUB_PATH"
      # Networked, so outside `bun run check`: a dangling pin passes every offline gate and fails at job start, fleet-wide
      # once synced. Every third-party pin is a full sha whose comment names the tag GitHub resolves to that sha (pinact
      # codes 001 and 005; the version-comments-verifiable ssot rule refuses the `# v7` comment shapes pinact would pass
      # unverified); the config names the two refs that are not release pins by design, and reaches the written trees
      # only through the variable (pinact discovers a config relative to its working directory).
      - name: Verify every pin in the checkout and the written workflows
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PINACT_CONFIG: ${{ github.workspace }}/.github/pinact.yaml
        run: |
          for root in . "$RUNNER_TEMP"/fleet-lint/*/; do
            (cd "$root" && pinact run -check -verify-comment)
          done

  # fetch-depth 0 so the event's commit range resolves; pull-requests read because the action lists
  # the PR's commits to build that range. Comments off keeps that scope at read; findings still land
  # in the job summary and SARIF artifact.
  gitleaks:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_ENABLE_COMMENTS: "false"
          # The action's default binary (8.24.3) predates .gitleaks.toml's
          # minVersion floor AND skips that check silently; pin one meeting
          # the floor so CI honors the same config local runs do.
          GITLEAKS_VERSION: "8.30.1"

  # The PR-only condition sits on the steps, not the job: the gate requires success from every needed
  # job, so a job-level skip would fail every push and schedule run (the all-green-roster ssot rule pins this).
  dependency-review:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: github.event_name == 'pull_request'
      # The severity threshold and the upstream pin live in the wrapper.
      - uses: ./actions/dependency-review
        if: github.event_name == 'pull_request'

  yamllint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./actions/yamllint

  biome:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: .bun-version
      - name: Install tooling
        run: bun install --frozen-lockfile --silent
      - name: Biome (lint + format check)
        run: bun x biome ci .

  typography:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./actions/check-typography

  file-size:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      # Only for the sticky comment.
      pull-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./actions/check-file-size

  commit-names:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: ./actions/validate-commit-names

  typecheck:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: .bun-version
      # The glob is the roster: the bun-dirs ssot rule pins it and requires every dir committing a
      # bun.lock to carry a tsconfig.json.
      - name: Typecheck repo and action scripts
        run: |
          for tsconfig in tsconfig.json actions/*/tsconfig.json; do
            dir="$(dirname "$tsconfig")"
            echo "::group::$dir"
            (cd "$dir" && bun install --frozen-lockfile --silent && bun x tsc -p .)
            echo "::endgroup::"
          done

  # The offline invariants, each the twin of a `bun run check` gate (the
  # local-gates rule pins the pairing both ways).
  invariants:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: .bun-version
      - name: Install dependencies
        run: |
          bun install --frozen-lockfile --silent
          bun install --frozen-lockfile --silent --cwd actions/validate-managed-files
      - name: Validate this repository's own managed files
        run: bun run validate
      - name: Check single-source-of-truth invariants
        run: bun run ssot:check
      - name: Check the files table in docs/new-repo.md against files.yml
        run: bun run files:check
      # Offline and sub-second: the block files must match files.yml's
      # gitignore_sources on the PR that edits them, not a week later.
      - name: Check the gitignore copies against files.yml
        run: bun run gitignore:topology
      - name: Check the toolchain pin dotfiles against files.yml
        run: bun run pins:check
      - name: Check the theme CSS against its token data
        run: bun run theme:check
      - name: Check this repository's rendered settings against its layers and overlay
        run: bun run settings:check
      - name: Check markdown is not hard-wrapped
        run: bun run wrap:check

  script-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: .bun-version
      - name: Install dependencies
        run: bun install --frozen-lockfile --silent
      # The typos action's end-to-end cases run the binary the action pins
      # (its release publishes no checksum file, so the archive's sha256 is
      # recorded here); TYPOS_REQUIRED makes them fail instead of skip.
      - name: Install the pinned typos release
        env:
          TYPOS_VERSION: 1.50.1
          TYPOS_SHA256: edf0545109aee6a22751d04ddecb97c45be47d3aa0409564fb895eeeace91b1e
        run: |
          curl -fsSL --retry 3 --retry-all-errors -o "$RUNNER_TEMP/typos.tar.gz" \
            "https://github.com/crate-ci/typos/releases/download/v${TYPOS_VERSION}/typos-v${TYPOS_VERSION}-x86_64-unknown-linux-musl.tar.gz"
          echo "${TYPOS_SHA256}  $RUNNER_TEMP/typos.tar.gz" | sha256sum --check --strict
          mkdir -p "$RUNNER_TEMP/typos-bin"
          tar -xzf "$RUNNER_TEMP/typos.tar.gz" -C "$RUNNER_TEMP/typos-bin" ./typos
          echo "$RUNNER_TEMP/typos-bin" >>"$GITHUB_PATH"
      - name: Run .github/scripts and action tests
        env:
          TYPOS_REQUIRED: "1"
        run: bun run test

  # This repository's own skills catalog, judged by the action Vivswan/skills carries (it pins its
  # own bun). Skills publishes no release tags, so the pin's comment names its branch.
  validate-skills:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: Vivswan/skills/.github/actions/validate-skills@33556be3f64d91a1ae2aba1c39f7378ba238ac5f # main

  # Discovery runs the real `npx skills add --list` against the checkout, so it reaches the npm
  # registry: its own job, so a registry hiccup names itself instead of the structure check.
  skills-discovery:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: Vivswan/skills/.github/actions/validate-skills@33556be3f64d91a1ae2aba1c39f7378ba238ac5f # main
        with:
          mode: discovery

  # The config is the site job's, byte for byte: a dead internal link fails here instead of the deploy.
  docs-check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./actions/pages-site
        with:
          check: "true"
          config: '{"site_title": "repo-platform", "docs_path": "docs", "include": [], "link_rot_label": "docs-link-rot"}'

  # vitepress in the runner's directory topology (workspace, action tree, and RUNNER_TEMP apart): the
  # build's module resolution breaks only under that separation, which a laptop layout cannot
  # reproduce (tests/ci/pages_site_build/).
  pages-site-build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: .bun-version
      - name: Install the action's pinned dependencies
        run: bun install --frozen-lockfile --cwd actions/pages-site
      - name: Build the fixture site and assert the artifact
        run: bun run test tests/ci/pages_site_build

  # A caller job's permissions are the ceiling for the called workflow, so the scan grants sit here.
  codeql-javascript:
    permissions:
      contents: read
      security-events: write
      actions: read
    uses: ./.github/workflows/reusable-codeql.yml
    with:
      language: javascript-typescript

  # This repository is public, so the SARIF uploads (zizmor, semgrep) run unconditionally.
  zizmor:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./actions/zizmor

  typos:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./actions/typos

  # knip.jsonc at the root is this repository's own configuration.
  knip:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: .bun-version
      - name: Install dependencies
        run: bun install --frozen-lockfile --silent
      - uses: ./actions/knip

  semgrep:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./actions/semgrep

  bun-setup-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: .bun-version
      - name: Plant the two pins
        id: pins
        run: bun .github/scripts/ci/bun_setup_smoke.ts plant
      - name: Set up the current bun (already on PATH)
        id: first
        uses: ./actions/bun-setup
        with:
          pin: ${{ runner.temp }}/bun-setup-smoke/current/.bun-version
      - name: Set up an earlier release (not the bun on PATH)
        id: second
        uses: ./actions/bun-setup
        with:
          pin: ${{ runner.temp }}/bun-setup-smoke/previous/.bun-version
      - name: Judge both calls
        shell: bash
        env:
          CURRENT: ${{ steps.pins.outputs.current }}
          PREVIOUS: ${{ steps.pins.outputs.previous }}
          FIRST_PATH: ${{ steps.first.outputs.path }}
          FIRST_READY: ${{ steps.first.outputs.ready }}
          FIRST_INSTALLED: ${{ steps.first.outputs.installed }}
          FIRST_VERSION: ${{ steps.first.outputs.version }}
          SECOND_PATH: ${{ steps.second.outputs.path }}
          SECOND_READY: ${{ steps.second.outputs.ready }}
          SECOND_INSTALLED: ${{ steps.second.outputs.installed }}
          SECOND_VERSION: ${{ steps.second.outputs.version }}
        # Whichever bun is current by now (the second call overwrote the
        # shared install path); the judge reads recorded outputs only.
        run: bun .github/scripts/ci/bun_setup_smoke.ts judge

  trivy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./actions/trivy

  # THE gate: this job's own check run is the ruleset's required check (files/settings/override.yml),
  # and alls-green passes only when every needed result is success: a skipped or cancelled gating job fails it.
  #   needs        -> every gating job; ALL_GREEN_ROSTER (scripts/check/ssot/all_green.ts) is its authored twin, compared both ways
  #   if: always() -> the judgment must run over failures
  all-green:
    needs:
      - actionlint
      - gitleaks
      - dependency-review
      - yamllint
      - biome
      - typography
      - file-size
      - commit-names
      - typecheck
      - invariants
      - script-tests
      - validate-skills
      - skills-discovery
      - docs-check
      - pages-site-build
      - codeql-javascript
      - zizmor
      - typos
      - knip
      - semgrep
      - bun-setup-smoke
      - trivy
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: re-actors/alls-green@b5b5b37504aa4183270bd3d855c52a67f212be35 # v1.3.0
        with:
          jobs: ${{ toJSON(needs) }}

  # Needs-ordered behind the gate in the same run, so github.sha IS the judged commit.
  # No concurrency group: the called mover holds stable-tag-move, and a caller holding a lane its called job takes deadlocks the call.
  post-green:
    needs: [all-green]
    if: >-
      needs.all-green.result == 'success' &&
      github.event_name == 'push' &&
      github.ref == 'refs/heads/main'
    # The ceiling for every post-green.yml job (the caller-ceilings ssot
    # rule): pull-requests read is read-directives' merged-PR lookup.
    permissions:
      contents: write
      checks: read
      pull-requests: read
    uses: ./.github/workflows/post-green.yml
    with:
      sha: ${{ github.sha }}
      before: ${{ github.event.before }}
    secrets:
      REPO_PLATFORM_TOKEN: ${{ secrets.REPO_PLATFORM_TOKEN }}

  # Ordered behind post-green so the deploy runs after this run's mover, and a green move's theme
  # is what @stable serves it; !cancelled() keeps a red or skipped post-green from holding the site back. No push clause in
  # the if: the weekly schedule is the rebuild and link-rot check, a dispatch the manual deploy.
  site:
    needs: [all-green, post-green]
    if: >-
      !cancelled() &&
      needs.all-green.result == 'success' &&
      github.ref == 'refs/heads/main'
    concurrency:
      group: pages
      cancel-in-progress: false
    permissions:
      contents: read
      pages: write
      id-token: write
      issues: write
    uses: ./.github/workflows/reusable-site.yml
    with:
      sha: ${{ github.sha }}
      config: '{"site_title": "repo-platform", "docs_path": "docs", "include": [], "link_rot_label": "docs-link-rot"}'
      custom_domain: ${{ vars.CUSTOM_DOMAIN }}
