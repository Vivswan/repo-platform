name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  # Weekly CodeQL re-scan with refreshed query packs; every other gate job
  # is event-agnostic or skips its work cleanly on non-PR events.
  schedule:
    - cron: "3 8 * * 1"

permissions:
  contents: read

# Keyed by the commit on a push: a ref-keyed group holds one pending run, so in a burst of merges the displaced commit never gets a verdict.
# Pull-request runs stay keyed by the ref so a newer push cancels the stale run.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # The sources under files/ carry placeholders actionlint cannot read, so the writer lands them in
  # two scratch repositories (every module, none). Each is linted from its own root, as a repository
  # is, with the action's ignores; pinact judges the same roots and this checkout.
  actionlint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # Lints this checkout, and leaves actionlint, shellcheck, uv, and the problem matcher set up for the written trees below.
      - uses: $/actions/actionlint
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: files/bun/.bun-version
      - name: Install dependencies
        run: bun install --frozen-lockfile --silent
      - name: Write the fleet's workflows
        run: bun .github/scripts/ci/write_fleet_lint_tree.ts "$RUNNER_TEMP/fleet-lint"
      # Under the action's uv project, whose pyflakes actionlint then finds on PATH as it does shellcheck.
      - name: actionlint the written workflows
        run: >-
          uv run --isolated --project actions/actionlint --locked
          bun .github/scripts/ci/run_in_fleet_lint_trees.ts "$RUNNER_TEMP/fleet-lint" --
          bun "$GITHUB_WORKSPACE/.github/scripts/ci/actionlint_written_tree.ts"
      # The archive's sha256 is the pin: the release's checksums file comes from the same place as the archive.
      # refresh-upstream.yml's tool leg moves the two values together (docs/toolchains.md).
      - name: Install the pinned pinact release
        env:
          PINACT_VERSION: 5.0.2
          PINACT_SHA256: 7f003d8f51e984c2264d2009d430e3e0e87ae404a0e2dc2a9a277b0f731bf5b7
        run: |
          curl -fsSL --retry 3 --retry-all-errors -o "$RUNNER_TEMP/pinact.tar.gz" \
            "https://github.com/suzuki-shunsuke/pinact/releases/download/v${PINACT_VERSION}/pinact_linux_amd64.tar.gz"
          echo "${PINACT_SHA256}  $RUNNER_TEMP/pinact.tar.gz" | sha256sum --check --strict
          mkdir -p "$RUNNER_TEMP/pinact-bin"
          tar -xzf "$RUNNER_TEMP/pinact.tar.gz" -C "$RUNNER_TEMP/pinact-bin" pinact
          echo "$RUNNER_TEMP/pinact-bin" >>"$GITHUB_PATH"
      # Networked, so outside `bun run check`: a dangling pin passes every offline gate and fails at job start, fleet-wide
      # once synced. Every third-party pin is a full sha whose comment names the tag GitHub resolves to that sha (pinact
      # codes 001 and 005; tests/workflows/delivery_pins.test.ts refuses the `# v7` comment shapes pinact would pass
      # unverified); the config names the two refs that are not release pins by design, and reaches the written trees
      # only through the variable (pinact discovers a config relative to its working directory).
      - name: Verify every pin in the checkout and the written workflows
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PINACT_CONFIG: ${{ github.workspace }}/.github/pinact.yaml
        run: bun .github/scripts/ci/run_in_fleet_lint_trees.ts --with-checkout "$RUNNER_TEMP/fleet-lint" -- pinact run --check --verify-comment

  # fetch-depth 0 so the event's commit range resolves; pull-requests read because the action lists
  # the PR's commits to build that range. Comments off keeps that scope at read; findings still land
  # in the log and the job summary. The artifact is off as in fleet.yml.
  gitleaks:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_ENABLE_COMMENTS: "false"
          GITLEAKS_ENABLE_UPLOAD_ARTIFACT: "false"
          # The action's default binary (8.24.3) predates .gitleaks.toml's
          # minVersion floor AND skips that check silently; pin one meeting
          # the floor so CI honors the same config local runs do.
          GITLEAKS_VERSION: "8.30.1"

  # Only a pull request has a dependency diff to review; the gate's allowed-skips names this job.
  dependency-review:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # The upstream pin and the warn-only verdict live in the wrapper.
      - uses: $/actions/dependency-review

  yamllint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: $/actions/yamllint

  biome:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: files/bun/.bun-version
      - name: Install tooling
        run: bun install --frozen-lockfile --silent
      - name: Biome (lint + format check)
        run: bun run lint
      # The fleet's lint floor, as every repository receives it: the pinned biome of the action under this checkout's biome.json.
      - uses: $/actions/biome

  typography:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: $/actions/check-typography

  # This checkout first, then the fleet trees the writer lands (the templates under files/ are not yaml until written),
  # where the managed files are this repository's own to fix, so they are judged rather than skipped.
  shell-complexity:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      # Only for the sticky comment.
      pull-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: $/actions/check-shell-complexity
        with:
          # The sync templates: judged through the written trees below, not raw.
          skip: files
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: files/bun/.bun-version
      - name: Install dependencies
        run: bun install --frozen-lockfile --silent
      - name: Write the fleet's workflows
        run: bun .github/scripts/ci/write_fleet_lint_tree.ts "$RUNNER_TEMP/fleet-lint"
      - name: Judge the written trees, managed files included, each finding against its template
        run: >-
          bun .github/scripts/ci/run_in_fleet_lint_trees.ts "$RUNNER_TEMP/fleet-lint" --
          bun "$GITHUB_WORKSPACE/actions/check-shell-complexity/check-shell-complexity.ts"
          --judge-managed --sources .shell-complexity-sources.json

  file-size:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      # Only for the sticky comment.
      pull-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: $/actions/check-file-size

  member-shape:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      # Only for the sticky comment.
      pull-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: $/actions/check-member-shape

  commit-names:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: $/actions/validate-commit-names

  typecheck:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: files/bun/.bun-version
      - name: Typecheck repo and action scripts
        run: |
          bun scripts/bootstrap.ts
          bun run typecheck

  # The invariants are package.json's `invariants` script, so CI and `bun run check` run one list.
  invariants:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: files/bun/.bun-version
      - name: Install dependencies
        run: bun install --frozen-lockfile --silent
      - name: Check the invariants
        run: bun run invariants

  # This repository judged as fleet CI judges every repository (fleet.yml's plan and validate steps): the plan over
  # the registration, then the action from this checkout, which reads the manifest's recorded commit and runs that
  # commit's check.ts over the tree. A PR that changes files/ stays green until this repository syncs itself.
  managed-files:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      # Only for the sticky comment.
      pull-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: $/actions/plan
        id: plan
        with:
          private: ${{ github.event.repository.private }}
      - uses: $/actions/validate-managed-files
        with:
          private: ${{ steps.plan.outputs.private }}

  # This repository's own tests: edit checks.yml, as in every managed repository. They need no secret and write nothing, so
  # the call inherits none and its ceiling is a read; they run on the schedule too, so the gate grants the job no skip.
  checks:
    permissions:
      contents: read
    uses: $/.github/workflows/checks.yml

  # This repository's own skills catalog, judged by the action Vivswan/skills carries (it pins its
  # own bun). Skills publishes no release tags, so the pin's comment names its branch.
  validate-skills:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: Vivswan/skills/.github/actions/validate-skills@d2d8205778dc643c45162730d51ea24adf618722 # main

  # Discovery runs the real `npx skills add --list` against the checkout, so it reaches the npm
  # registry: its own job, so a registry hiccup names itself instead of the structure check.
  skills-discovery:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: Vivswan/skills/.github/actions/validate-skills@d2d8205778dc643c45162730d51ea24adf618722 # main
        with:
          mode: discovery

  # The configuration is the plan's reading of this repository's registration, as in the deploy; this checkout's plan, not
  # @stable's, so a PR changing files.yml judges its own docs. A dead internal link fails here instead of the deploy.
  docs-check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # The skills repository at the sha the validate-skills pins name: Vale's styles and the docs probe live there (.vale.ini).
      # Dependabot bumps the `uses:` lines and never a `ref:`, so tests/workflows/ci_shape.test.ts holds this ref to them.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: Vivswan/skills
          ref: d2d8205778dc643c45162730d51ea24adf618722
          path: .skills
      - uses: $/actions/plan
        id: plan
        with:
          mode: site
      - uses: $/actions/pages-site
        with:
          check: "true"
          config: ${{ steps.plan.outputs.config }}
      # The skills' Vale styles over this repository's pages (.vale.ini); the release by sha256, as pinact above.
      - name: Install the pinned Vale release
        env:
          VALE_VERSION: 3.28.1
          VALE_SHA256: 068954ad869ebec24b8dec6ebcd1cbb1fd5f5a83e966a35baedfae8b2cdc093a
        run: |
          curl -fsSL --retry 3 --retry-all-errors -o "$RUNNER_TEMP/vale.tar.gz" \
            "https://github.com/vale-cli/vale/releases/download/v${VALE_VERSION}/vale_${VALE_VERSION}_Linux_64-bit.tar.gz"
          echo "${VALE_SHA256}  $RUNNER_TEMP/vale.tar.gz" | sha256sum --check --strict
          mkdir -p "$RUNNER_TEMP/vale-bin"
          tar -xzf "$RUNNER_TEMP/vale.tar.gz" -C "$RUNNER_TEMP/vale-bin" vale
          echo "$RUNNER_TEMP/vale-bin" >>"$GITHUB_PATH"
      - name: Vale over the pages (shape and wording, the skills' rules)
        run: vale README.md docs
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: files/bun/.bun-version
      # The working-text probe's path check: a page naming a path a managed repository holds resolves through the shipped
      # trees, the base and the modules that ship a hook of their own.
      - name: Probe every path the pages name
        run: >-
          git ls-files 'README.md' 'docs/*.md'
          | xargs bun .skills/skills/working-text/scripts/docs-probe.mts --base files/base --base files/npm --base files/autofix

  # A caller job's permissions are the ceiling for the called workflow, so the scan grants sit here.
  codeql-javascript:
    permissions:
      contents: read
      security-events: write
      actions: read
    uses: $/.github/workflows/reusable-codeql.yml
    with:
      language: javascript-typescript

  # This repository is public, so the SARIF uploads (zizmor, semgrep) run unconditionally.
  zizmor:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: $/actions/zizmor

  typos:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: $/actions/typos

  # knip.jsonc at the root is this repository's own configuration.
  knip:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: files/bun/.bun-version
      - name: Install dependencies
        run: bun install --frozen-lockfile --silent
      - uses: $/actions/knip

  semgrep:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: $/actions/semgrep

  bun-setup-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: files/bun/.bun-version
      - name: Install dependencies
        run: bun install --frozen-lockfile --silent
      - name: Plant the two pins
        id: pins
        env:
          GH_TOKEN: ${{ github.token }}
        run: bun .github/scripts/ci/bun_setup_smoke.ts plant
      - name: Set up the current bun (already on PATH)
        id: first
        uses: $/actions/bun-setup
        with:
          from: ${{ runner.temp }}/bun-setup-smoke/current
      - name: Set up an earlier release (not the bun on PATH)
        id: second
        uses: $/actions/bun-setup
        with:
          from: ${{ runner.temp }}/bun-setup-smoke/previous
      - name: Judge both calls
        shell: bash
        env:
          CURRENT: ${{ steps.pins.outputs.current }}
          PREVIOUS: ${{ steps.pins.outputs.previous }}
          FIRST_PATH: ${{ steps.first.outputs.path }}
          FIRST_INSTALLED: ${{ steps.first.outputs.installed }}
          FIRST_VERSION: ${{ steps.first.outputs.version }}
          SECOND_PATH: ${{ steps.second.outputs.path }}
          SECOND_INSTALLED: ${{ steps.second.outputs.installed }}
          SECOND_VERSION: ${{ steps.second.outputs.version }}
        # Whichever bun is current by now (the second call overwrote the
        # shared install path); the judge reads recorded outputs only.
        run: bun .github/scripts/ci/bun_setup_smoke.ts judge

  # Advisory (docs/modules/security-scans.md): green on a finding, red on a scan error.
  trivy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: $/actions/trivy

  # GitHub loads an action's manifest when the job starts, so a manifest error fails every caller before its first step,
  # and only a job naming the action loads it. So the actions no other gating job names run here, with inputs that
  # change nothing;
  # tests/workflows/action_load.test.ts holds the job to the actions directory.
  action-load:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      issues: read
      pull-requests: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # The image's gh is rarely the pinned release, so this call fetches the archive; the actions below reuse it.
      - id: gh-setup
        uses: $/actions/gh-setup
      # No inputs: it reads this repository's own coordinates from the runner's environment.
      - id: site-urls
        uses: $/actions/site-urls
      # Resolve mode over a stream no issue carries closes nothing, and the token could not.
      - id: fuzz-issue
        uses: $/actions/fuzz-issue
        with:
          mode: resolve
          label: action-load
          stream: generic
      # after-propose fails only on a merged release PR left pending, and this repository cuts no releases.
      - id: release-health
        uses: $/actions/release-health
        with:
          mode: after-propose
        env:
          GH_TOKEN: ${{ github.token }}
      # Only a pull request carries the event it reads; a push with no autofix.push block starts no fix and calls nothing.
      - id: autofix
        if: github.event_name == 'pull_request'
        uses: $/actions/autofix
        with:
          phase: plan
          config: '{"label":{"paths":["**"],"delete":[]},"push":null}'
      # Offline over the README: its links into this checkout are judged, and the network is never asked.
      - id: lychee
        uses: $/actions/lychee
        with:
          working-directory: ${{ github.workspace }}
          args: |
            --offline
            --no-progress
            README.md
          report: ${{ runner.temp }}/action-load/links.md

  # GitHub's image carries python, node, jq, gh, and shellcheck, so a shipped step that leans on one stays green there.
  # Here the shipped actions and the gate's steps run in a container holding the baseline alone (docs/fleet-guidelines.md,
  # "Runner"), so the missing tool is a red step; tests/workflows/bare_runner.test.ts holds the job to the actions directory.
  bare-runner:
    runs-on: ubuntu-latest
    container:
      image: debian:bookworm-slim@sha256:734a72b3d6142a71993b4bc580ca01d8ca687f77a2c422d96a961d3376b179bc
    timeout-minutes: 30
    permissions:
      contents: read
      issues: read
      # Read: the findings comments belong to the jobs that keep them, and each action tolerates a comment it cannot post.
      pull-requests: read
      # The semgrep action's SARIF upload.
      security-events: write
    steps:
      # The image's build, not a shipped step: what the baseline names and the slim image lacks, after which apt leaves
      # PATH so no later step installs more. Two container artifacts: the runner fills some expressions with its own path
      # for the work folder, mounted here at /__w (actions/runner#2185), and its user owns the checkout these steps read as root.
      - name: Build the baseline
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          apt-get update
          apt-get install --yes --no-install-recommends ca-certificates curl git unzip wget xz-utils
          rm /usr/bin/apt /usr/bin/apt-get
          mkdir -p /home/runner
          ln -s /__w /home/runner/work
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      # Every step below runs whatever failed before it, so one run names every gap.
      # fleet.yml's standard-checks job.
      - if: ${{ !cancelled() }}
        id: plan
        uses: $/actions/plan
        with:
          private: ${{ github.event.repository.private }}
      - if: ${{ !cancelled() }}
        uses: $/actions/validate-managed-files
        with:
          private: ${{ steps.plan.outputs.private }}
      - if: ${{ !cancelled() }}
        uses: $/actions/check-typography
      - if: ${{ !cancelled() }}
        uses: $/actions/check-file-size
      # `files` as in the shell-complexity job. The action's own .ps1 is this checkout's one PowerShell body, and judging
      # one takes the runner's pwsh, by the action's description.
      - if: ${{ !cancelled() }}
        uses: $/actions/check-shell-complexity
        with:
          skip: files, check-shell-complexity
      - if: ${{ !cancelled() }}
        uses: $/actions/validate-commit-names
      - if: ${{ !cancelled() }}
        uses: $/actions/actionlint
      - if: ${{ !cancelled() }}
        uses: $/actions/yamllint
      - if: ${{ !cancelled() }}
        uses: $/actions/typos
      - if: ${{ !cancelled() }}
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_ENABLE_COMMENTS: "false"
          GITLEAKS_ENABLE_UPLOAD_ARTIFACT: "false"
          GITLEAKS_VERSION: "8.30.1"
      # The zizmor job uploads this commit's SARIF; the verdict pass alone runs the same zizmor.
      - if: ${{ !cancelled() }}
        uses: $/actions/zizmor
        with:
          upload-sarif: "false"
      - if: ${{ !cancelled() }}
        uses: $/actions/trivy
      - if: ${{ !cancelled() }}
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: files/bun/.bun-version
      - if: ${{ !cancelled() }}
        name: Install dependencies
        run: bun install --frozen-lockfile --silent
      - if: ${{ !cancelled() }}
        uses: $/actions/biome
      - if: ${{ !cancelled() }}
        uses: $/actions/check-member-shape
      - if: ${{ !cancelled() }}
        uses: $/actions/knip

      # fleet.yml's semgrep, dependency-review, and docs-check jobs.
      - if: ${{ !cancelled() }}
        uses: $/actions/semgrep
      - if: ${{ !cancelled() && github.event_name == 'pull_request' }}
        uses: $/actions/dependency-review
      - if: ${{ !cancelled() }}
        id: site
        uses: $/actions/plan
        with:
          mode: site
      - if: ${{ !cancelled() }}
        uses: $/actions/pages-site
        with:
          check: "true"
          config: ${{ steps.site.outputs.config }}

      # The actions of the release, nightly, site, and autofix workflows, with the action-load job's inputs.
      - if: ${{ !cancelled() }}
        uses: $/actions/release-health
        with:
          mode: after-propose
        env:
          GH_TOKEN: ${{ github.token }}
      - if: ${{ !cancelled() }}
        uses: $/actions/fuzz-issue
        with:
          mode: resolve
          label: bare-runner
          stream: generic
      - if: ${{ !cancelled() }}
        uses: $/actions/site-urls
      - if: ${{ !cancelled() && github.event_name == 'pull_request' }}
        uses: $/actions/autofix
        with:
          phase: plan
          config: '{"label":{"paths":["**"],"delete":[]},"push":null}'
      - if: ${{ !cancelled() }}
        uses: $/actions/gh-setup

      # The skeleton's all-green job, over a needs context of one green job. Last: it puts a python on PATH.
      - if: ${{ !cancelled() }}
        uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
        with:
          python-version: "3.13"
          activate-environment: true
          venv-path: ${{ runner.temp }}/gate-python
          enable-cache: false
          ignore-empty-workdir: true
        env:
          UV_PYTHON_PREFERENCE: only-managed
      - if: ${{ !cancelled() }}
        uses: re-actors/alls-green@b5b5b37504aa4183270bd3d855c52a67f212be35 # v1.3.0
        with:
          jobs: '{"baseline": {"result": "success", "outputs": {}}}'

  # THE gate: this job's own check run is the ruleset's required check (files/settings/override.yml),
  # and alls-green passes only when every needed result is success, or skipped for a job named in allowed-skips.
  #   needs          -> every gating job (tests/workflows/all_green_gate.test.ts compares the list with the job set)
  #   if: always()   -> the judgment must run over failures
  #   allowed-skips  -> every needed job with a condition (the same test compares the two)
  all-green:
    needs:
      - actionlint
      - gitleaks
      - dependency-review
      - yamllint
      - biome
      - typography
      - shell-complexity
      - file-size
      - member-shape
      - commit-names
      - typecheck
      - invariants
      - managed-files
      - checks
      - validate-skills
      - skills-discovery
      - docs-check
      - codeql-javascript
      - zizmor
      - typos
      - knip
      - semgrep
      - bun-setup-smoke
      - trivy
      - action-load
      - bare-runner
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      # alls-green runs `python -m`, on the standard library alone. uv fetches a python of its own (never the runner's)
      # into a venv under the job's temp directory and puts it first on PATH.
      - uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
        with:
          python-version: "3.13"
          activate-environment: true
          venv-path: ${{ runner.temp }}/gate-python
          enable-cache: false
          ignore-empty-workdir: true
        env:
          UV_PYTHON_PREFERENCE: only-managed
      - uses: re-actors/alls-green@b5b5b37504aa4183270bd3d855c52a67f212be35 # v1.3.0
        with:
          jobs: ${{ toJSON(needs) }}
          allowed-skips: dependency-review

  # Needs-ordered behind the gate in the same run, so github.sha IS the judged commit.
  # !cancelled(): the implicit success() reads the whole needs chain, so dependency-review's skip on a push skipped this job past a green gate.
  # No concurrency group: the called mover holds stable-tag-move, and a caller holding a lane its called job takes deadlocks the call.
  post-green:
    needs: [all-green]
    if: >-
      !cancelled() &&
      needs.all-green.result == 'success' &&
      github.event_name == 'push' &&
      github.ref == 'refs/heads/main'
    # The ceiling for every post-green.yml job (tests/workflows/caller_ceilings.test.ts):
    # pull-requests read is read-directives' merged-PR lookup.
    permissions:
      contents: write
      checks: read
      pull-requests: read
    uses: $/.github/workflows/post-green.yml
    # A called workflow inherits down only what it received: the fleet legs' environment secret needs the whole
    # chain to inherit (post-green.yml's callers, actions/runner#4453).
    # nosemgrep: yaml.github-actions.security.secrets-inherit.secrets-inherit
    secrets: inherit # zizmor: ignore[secrets-inherit]
    with:
      sha: ${{ github.sha }}
      before: ${{ github.event.before }}

  # Ordered behind post-green so the deploy runs after this run's mover, and a green move's theme
  # is what @stable serves it; !cancelled() keeps a red or skipped post-green from holding the site back. No push clause in
  # the if: the weekly schedule is the rebuild and link-rot check, a dispatch the manual deploy.
  site:
    needs: [all-green, post-green]
    if: >-
      !cancelled() &&
      needs.all-green.result == 'success' &&
      github.ref == 'refs/heads/main'
    concurrency:
      group: pages
      cancel-in-progress: true
    permissions:
      contents: write
      pages: write
      id-token: write
      issues: write
    uses: $/.github/workflows/reusable-site.yml
    with:
      sha: ${{ github.sha }}
