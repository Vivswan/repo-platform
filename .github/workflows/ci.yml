name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  # Weekly CodeQL re-scan with refreshed query packs; every other gate job
  # is event-agnostic or skips its work cleanly on non-PR events.
  schedule:
    - cron: "3 8 * * 1"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  actionlint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: raven-actions/actionlint@3d39aea434753780c3b3d4a1a31c854b4dbf49d7 # v2.2.0

  # The action scans the event's commit range (fetch-depth: 0 so any
  # range resolves). Same job the base template ships to every managed
  # repo; `bun run lint:secrets` covers history and staged changes
  # locally. pull-requests read: the action lists the PR's commits to
  # build the scan range. Comments off keeps that scope at read; leaks
  # still land in the job summary and SARIF artifact.
  gitleaks:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_ENABLE_COMMENTS: "false"
          # The action's default binary (8.24.3) predates .gitleaks.toml's
          # minVersion floor AND skips that check silently; pin one meeting
          # the floor so CI honors the same config local runs do.
          GITLEAKS_VERSION: "8.30.1"

  # Fails when a PR introduces dependencies with known vulnerabilities, by
  # diffing the dependency graph between base and head. Only PR events have
  # a diff to review, so the skip lives on the steps: the all-green verdict
  # treats a skipped job as standing down, so a job-level skip would fail
  # open - gating jobs stay unconditional (the all-green-roster ssot rule
  # pins this) and event conditions go on their steps.
  dependency-review:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: github.event_name == 'pull_request'
      # The severity threshold and the upstream pin live in the wrapper.
      - uses: ./actions/dependency-review
        if: github.event_name == 'pull_request'

  # The all-green gate's judging logic, exercised as the REAL run block
  # extracted from actions/all-green/action.yml against scenario needs
  # payloads: the fail-closed shapes (a failure, all skipped, an empty
  # needs list, malformed input) must exit red, the healthy shapes green.
  allgreen-judgment:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: .bun-version
      - name: Install dependencies
        run: bun install --frozen-lockfile --silent
      - name: Judge the gate scenarios through the real run block
        run: bun run test tests/actions/all_green_judgment.test.ts

  yamllint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # The same action the fleet runs; local path, so this repository
      # always lints with the tree under review rather than what is
      # published. `bun run lint:yaml` is the local twin.
      - uses: ./actions/yamllint

  biome:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: .bun-version
      - name: Install tooling
        run: bun install --frozen-lockfile --silent
      - name: Biome (lint + format check)
        run: bun x biome ci .

  typography:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./actions/check-typography

  file-size:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      # Only for the sticky comment.
      pull-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # The rendered goldens are judged too, managed-file skip off: an
      # oversize render fails here, at its source.
      - uses: ./actions/check-file-size
        with:
          rendered-dir: tests/golden-renders/all-modules

  commit-names:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: ./actions/validate-commit-names

  typecheck:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: .bun-version
      # Keyed on each action's tsconfig.json: dirs without one (no TS to
      # check) skip naturally, and a new action joins without editing this
      # list. The bun-dirs ssot rule pins the glob and requires every dir
      # committing a bun.lock to carry a tsconfig.json.
      - name: Typecheck repo and action scripts
        run: |
          for tsconfig in tsconfig.json actions/*/tsconfig.json; do
            dir="$(dirname "$tsconfig")"
            echo "::group::$dir"
            (cd "$dir" && bun install --frozen-lockfile --silent && bun x tsc -p .)
            echo "::endgroup::"
          done

  # Network gate, deliberately outside `bun run check`: proves every
  # third-party action pin resolves to a real upstream ref (a dangling
  # pin like a retired moving-major tag passes every offline gate and
  # then fails at job start, fleet-wide once synced).
  action-refs:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: .bun-version
      - name: Resolve every pinned action ref
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: bun .github/scripts/ci/resolve_action_refs.ts

  # template/ is no longer committed; prove composition succeeds (collisions,
  # orphan anchors, manifest errors all hard-fail) and is deterministic.
  compose:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: .bun-version
      - name: Install dependencies
        run: bun install --frozen-lockfile --silent
      - name: Build twice and compare
        run: |
          bun .github/scripts/build-branches/branch_tree.ts --dest /tmp/tree-a
          bun .github/scripts/build-branches/branch_tree.ts --dest /tmp/tree-b
          diff -r --no-dereference /tmp/tree-a /tmp/tree-b
          echo "build tree is deterministic"

  validate-template:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: .bun-version
      - name: Install dependencies
        run: |
          bun install --frozen-lockfile --silent
          bun install --frozen-lockfile --silent --cwd actions/validate-template-report
      - name: Validate repo-platform against its own conventions
        run: bun actions/validate-template-report/validator/validate_generated_files.ts --self .
      - name: Check single-source-of-truth invariants
        run: bun run ssot:check
      - name: Check generated regions against the module manifests
        run: bun run generate:check
      - name: Check the files table in docs/new-repo.md against files.yml
        run: bun run files:check
      - name: Check generated dogfood copies against their template twins
        run: bun run dogfood:check
      # Offline and sub-second: fragments must match the manifests'
      # gitignore_sources on the PR that edits them, not a week later.
      - name: Check gitignore topology against the module manifests
        run: bun run gitignore:topology
      - name: Check markdown is not hard-wrapped
        run: bun run wrap:check

  # Committed golden renders (tests/golden-renders/) must match a fresh
  # copier render of the canonical selection matrix, so every template or
  # composer change shows its fleet-facing rendered diff in the PR
  # (scripts/generate/render_goldens.ts has the matrix and determinism contract).
  golden-renders:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: .bun-version
      - name: Install dependencies
        run: bun install --frozen-lockfile --silent
      - name: Install copier
        run: pipx install copier
      - name: Check the golden renders against a fresh render
        run: bun run renders:check

  script-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: .bun-version
      - name: Install dependencies
        run: bun install --frozen-lockfile --silent
      # The typos action's end-to-end cases run the binary the action pins
      # (its release publishes no checksum file, so the archive's sha256 is
      # recorded here); TYPOS_REQUIRED makes them fail instead of skip.
      - name: Install the pinned typos release
        env:
          TYPOS_VERSION: 1.50.1
          TYPOS_SHA256: edf0545109aee6a22751d04ddecb97c45be47d3aa0409564fb895eeeace91b1e
        run: |
          curl -fsSL --retry 3 --retry-all-errors -o "$RUNNER_TEMP/typos.tar.gz" \
            "https://github.com/crate-ci/typos/releases/download/v${TYPOS_VERSION}/typos-v${TYPOS_VERSION}-x86_64-unknown-linux-musl.tar.gz"
          echo "${TYPOS_SHA256}  $RUNNER_TEMP/typos.tar.gz" | sha256sum --check --strict
          mkdir -p "$RUNNER_TEMP/typos-bin"
          tar -xzf "$RUNNER_TEMP/typos.tar.gz" -C "$RUNNER_TEMP/typos-bin" ./typos
          echo "$RUNNER_TEMP/typos-bin" >>"$GITHUB_PATH"
      - name: Run .github/scripts and action tests
        env:
          TYPOS_REQUIRED: "1"
        run: bun run test

  # Structural validation of this repository's own hosted agent skills
  # (skills/ plus the repo-owned .claude-plugin manifests), dogfooding the
  # composite action the skills module pins fleet-wide. Offline and cheap;
  # `bun run validate:skills` is the local twin.
  validate-skills:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./actions/validate-skills
        with:
          skills-dir: skills

  # CLI discovery for the same catalog. Fleet repos get this as the
  # advisory validate-skills.yml (npx needs the npm registry, and managed
  # repos must not block on a registry hiccup); here it GATES, per this
  # repo's all-jobs-gate convention - CI is not network-shy (smoke-generate
  # already downloads copier) and a listing regression in
  # the action this repo ships should block its own merges.
  skills-discovery:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./actions/validate-skills
        with:
          skills-dir: skills
          mode: discovery

  # The smoke legs lint their rendered workflows with the actionlint
  # binary. Fetched here ONCE per run and handed to the legs as an
  # artifact: each leg fetching it itself meant one unpinned download of
  # rhysd/actionlint@main's install script per matrix row per push
  # (observed connection-reset flake, and unpinned third-party code). The
  # install script rides the same pinned release tag as the binary it
  # installs; curl retries transient resets as belt-and-braces.
  actionlint-binary:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Download actionlint
        env:
          ACTIONLINT_VERSION: 1.7.12
        run: |
          # --retry-all-errors: plain --retry skips connection resets (the
          # observed failure) - it only retries timeouts and a few HTTP
          # codes. -f turns HTTP errors into curl failures so they retry
          # too and still fail the step; -S keeps errors visible under -s.
          curl -fsSL --retry 3 --retry-all-errors -o /tmp/download-actionlint.bash \
            "https://raw.githubusercontent.com/rhysd/actionlint/v${ACTIONLINT_VERSION}/scripts/download-actionlint.bash"
          bash /tmp/download-actionlint.bash "$ACTIONLINT_VERSION"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: actionlint-binary
          path: actionlint
          if-no-files-found: error

  smoke-generate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # For the actionlint-binary artifact the lint step downloads.
    needs: [actionlint-binary]
    strategy:
      fail-fast: false
      matrix:
        include:
          # Module combos covering the risky branches. `modules` is a YAML
          # STRING here (quoted) and parsed by copier as a YAML list.
          # custom-license rides on the everything row so the LICENSE
          # opt-out (no fleet license rendered) is exercised; every other
          # row covers the default fleet-license render.
          - name: everything
            modules: "[bun, node, deno, uv, rust, pages, docs-site, release-please, issue-templates, skills, pr-title, fuzzer, nightly, custom-license]"
            private: "false"
          - name: bun-typical
            modules: "[bun, release-please, issue-templates, pr-title]"
            private: "false"
          # node and deno each as the sole toolchain: codeql-javascript and
          # the javascript/deno labels must render from the module alone,
          # without bun in the selection. skills rides on this thin row
          # with a non-default skills_dir, so the module's dir answer is
          # exercised end-to-end (the everything row covers the default).
          - name: node-typical
            modules: "[node, skills]"
            private: "false"
            extra_data: "-d skills_dir=lib/skills"
          # pages rides along on a non-bun toolchain (the everything row's
          # selection heads with bun).
          - name: deno-typical
            modules: "[deno, pages]"
            private: "false"
          # bun + node co-selected: the only render exercising the shared
          # javascript label or-gate and the shared javascript-typescript
          # CodeQL group (the exact-count check must see one job), plus the
          # Node.gitignore guard's bun+node leg (one section, the node copy
          # suppressed).
          - name: bun-node
            modules: "[bun, node]"
            private: "false"
          # deno co-selected with each earlier Node.gitignore declarer:
          # deno's two-operand suppression guard must render the shared
          # section exactly once when exactly ONE of bun/node is also
          # selected. An and->or slip in the guard passes bun-node and the
          # everything row but duplicates the section on these rows.
          - name: bun-deno
            modules: "[bun, deno]"
            private: "false"
          - name: node-deno
            modules: "[node, deno]"
            private: "false"
          # The only public row where uv is the sole toolchain: AGENTS.md's
          # Toolchain section must render the uv bullet alone. nightly rides
          # along as the only fuzzer-free nightly render (stream
          # independence: the fuzz starter must not render here).
          - name: uv-typical
            modules: "[uv, nightly, release-please]"
            private: "false"
          # rust + fuzzer must render cargo dependabot + the Rust gitignore
          # and nothing toolchain-gated (no auto-format starter): rust is
          # deliberately outside has_toolchain, so the AGENTS.md Toolchain
          # section is exercised with rust as the only toolchain module.
          # Deliberately nightly-free (the fuzzer-present, nightly-absent
          # leg; uv-typical covers the mirror).
          - name: rust-fuzzer
            modules: "[rust, fuzzer, release-please]"
            private: "false"
          - name: uv-pages-private
            # The private: true render of the settings.yml starter is
            # exercised for uv (bun-private covers bun).
            modules: "[uv, pages]"
            private: "true"
          # The only row where bun renders private: settings.yml must
          # declare `private: true` (uv-pages-private covers the uv side),
          # and pr-title proves the module's own required workflow renders
          # on a private row too.
          - name: bun-private
            modules: "[bun, pr-title]"
            private: "true"
          # pages as the whole selection, with the pages answers overridden:
          # the questions' validators must accept a toolchain-free build.
          - name: pages-bare
            modules: "[pages]"
            private: "false"
            extra_data: "-d pages_setup=none -d pages_build_command=./build.sh"
          # docs-site alone: the module's OWN Pages-enablement layer is
          # asserted without the pages module's identical layer masking it.
          - name: docs-only
            modules: "[docs-site]"
            private: "false"
          # Proves the declared _min_copier_version still supports the
          # multiselect + when features the template uses (serialized
          # multiselect answers landed in copier 9.8.0).
          - name: none
            modules: "[]"
            private: "false"
            copier_spec: "copier==9.8.0"
          # Renders with this repository's own answers
          # (.repo-platform-answers.yml - the ssot dogfood-oracle-row rule
          # and the oracle step both fail if this row drifts from that
          # file) so the committed dogfood copies can be byte-compared
          # against real copier output. The trailing project_name overrides
          # the harness default (copier keeps the last -d occurrence);
          # description stays the harness default - EXTRA_DATA cannot carry
          # whitespace and no generated pair renders it.
          - name: dogfood-oracle
            modules: "[bun, skills, pr-title, docs-site]"
            private: "false"
            extra_data: "-d project_name=repo-platform"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      # copier invokes the stamp hook with bun during copy/update.
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: .bun-version
      - name: Install copier
        env:
          COPIER_SPEC: ${{ matrix.copier_spec || 'copier' }}
        run: pipx install "$COPIER_SPEC"
      - name: Generate ${{ matrix.name }}
        env:
          MODULES: ${{ matrix.modules }}
          PRIVATE: ${{ matrix.private }}
          EXTRA_DATA: ${{ matrix.extra_data }}
        run: bun .github/scripts/ci/smoke_generate.ts
      - name: Validate generated output
        run: |
          bun install --frozen-lockfile --silent --cwd actions/validate-template-report
          bun actions/validate-template-report/validator/validate_generated_files.ts /tmp/smoke
      - name: Verify module/visibility gating
        env:
          SMOKE_DIR: /tmp/smoke
          MODULES: ${{ matrix.modules }}
          PRIVATE: ${{ matrix.private }}
          EXTRA_DATA: ${{ matrix.extra_data }}
        run: bun run test tests/ci/smoke_gating/smoke_gating.test.ts
      # The dogfood-oracle row rendered with this repo's own answers, so
      # real copier output must byte-match the committed generated copies
      # (closing the TS-renderer-vs-copier gap render_dogfood leaves open).
      - name: Compare dogfood copies against the copier render
        if: matrix.name == 'dogfood-oracle'
        run: bun .github/scripts/ci/verify_dogfood_oracle.ts
      # Rendered workflows are invisible to the repo-level actionlint job
      # (.jinja files are not YAML pre-render), so lint the smoke output
      # with the binary the actionlint-binary job fetched once for the run.
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: actionlint-binary
      - name: actionlint rendered workflows
        run: |
          # The artifact zip drops the executable bit.
          chmod +x "$GITHUB_WORKSPACE/actionlint"
          # git init + render-root cwd, or the render's actionlint.yaml
          # ignores never apply: project discovery needs the .git dir, and
          # the config's path globs match cwd-relative paths.
          git -C /tmp/smoke init -q
          (cd /tmp/smoke && "$GITHUB_WORKSPACE/actionlint" -color .github/workflows/*.yml)

  # Generate from a previous build tree, then `copier update` to a fresh
  # build - the path every managed repo takes (tests/ci/upgrade_path/).
  upgrade-path:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      # copier invokes the stamp hook with bun during copy/update.
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: .bun-version
      - name: Install dependencies
        run: bun install --frozen-lockfile --silent
      - name: Install copier
        run: pipx install copier
      - name: Update from a previous build tree to a fresh build
        # The legs skip without copier; here a missing copier must fail.
        env:
          REQUIRE_COPIER: "1"
        run: bun run test tests/ci/upgrade_path
      # The one bun test that needs real copier: the stamp hook runs on the
      # destination exactly once per copy, update, and recopy (the
      # script-tests job has no copier and skips it).
      - name: Count stamp hook invocations per render
        run: bun run test tests/actions/stamp_hook_invocations.test.ts

  # The pages-site action's vitepress build, end to end in the runner's
  # own directory topology (workspace, action tree, and RUNNER_TEMP apart):
  # nothing else in the gate ever RUNS vitepress, and the build's module
  # resolution only breaks under that separation - the class a laptop
  # layout cannot reproduce (tests/ci/pages_site_build/).
  pages-site-build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: .bun-version
      - name: Install the action's pinned dependencies
        run: bun install --frozen-lockfile --cwd actions/pages-site
      - name: Build the fixture site and assert the artifact
        run: bun run test tests/ci/pages_site_build

  # Dry-run sync against every fleet repo's REAL current state (no push, no
  # PR, private repos hard-skipped by rehearse_fleet.ts's fail-closed
  # visibility rule): the class of bug the synthetic rows above cannot see
  # (a real repo's local edits, stale markers, recorded answers) goes red
  # here instead of during a live sync. The job stays unconditional (a
  # job-level skip would stand this gate down in the all-green verdict); the
  # steps skip when the fleet PAT is absent from the event's secrets
  # (Dependabot-triggered runs) - the push run after merge still rehearses.
  rehearse-fleet:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      HAS_FLEET_PAT: ${{ secrets.REPO_PLATFORM_TOKEN != '' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: env.HAS_FLEET_PAT == 'true'
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        if: env.HAS_FLEET_PAT == 'true'
        with:
          bun-version-file: .bun-version
      - name: Install dependencies
        if: env.HAS_FLEET_PAT == 'true'
        run: bun install --frozen-lockfile --silent
      # copier invokes the stamp hook with bun during the rehearsal update.
      - name: Install copier
        if: env.HAS_FLEET_PAT == 'true'
        run: pipx install copier
      - name: Rehearse the fleet sync
        if: env.HAS_FLEET_PAT == 'true'
        env:
          # The PAT, not github.token: fleet discovery and the enrollment
          # probe answer for the fleet token, exactly as production's
          # plan job does.
          GH_TOKEN: ${{ secrets.REPO_PLATFORM_TOKEN }}
        run: bun .github/scripts/ci/rehearse_fleet_gate.ts
      - name: Note the tokenless skip
        if: env.HAS_FLEET_PAT != 'true'
        run: |
          echo "::notice::rehearse-fleet skipped - this event's secrets carry no REPO_PLATFORM_TOKEN (a Dependabot-triggered run);"\
            "the post-merge push run rehearses the same tree."

  # CodeQL runs inside the gate: this thin job calls the analysis workflow,
  # and a caller job's permissions are the ceiling for every job in the
  # called workflow, so the scan permissions are granted here. This repo is
  # TypeScript-only (the actions, scripts, and template tooling), so one
  # language leg suffices; the name matches the template's per-language jobs.
  codeql-javascript:
    permissions:
      contents: read
      security-events: write
      actions: read
    uses: ./.github/workflows/reusable-codeql.yml
    with:
      language: javascript-typescript

  # The four fleet lint actions dogfooded from the working tree, each the
  # same call fleet-ci.yml makes at @build. This repository is public, so
  # the SARIF uploads (zizmor, semgrep) run unconditionally.
  zizmor:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./actions/zizmor

  typos:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./actions/typos

  # knip.jsonc at the root is this repository's own configuration.
  knip:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: .bun-version
      - name: Install dependencies
        run: bun install --frozen-lockfile --silent
      - uses: ./actions/knip

  semgrep:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./actions/semgrep

  # The shared bun-setup action dogfooded from the working tree: the runner
  # gets the manifests' bun, then one call per planted pin (that version:
  # reused, not installed; an earlier release: installed), judged by ci/.
  bun-setup-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: .bun-version
      - name: Plant the two pins
        id: pins
        run: bun .github/scripts/ci/bun_setup_smoke.ts plant
      - name: Set up the current bun (already on PATH)
        id: first
        uses: ./actions/bun-setup
        with:
          pin: ${{ runner.temp }}/bun-setup-smoke/current/.bun-version
      - name: Set up an earlier release (not the bun on PATH)
        id: second
        uses: ./actions/bun-setup
        with:
          pin: ${{ runner.temp }}/bun-setup-smoke/previous/.bun-version
      - name: Judge both calls
        shell: bash
        env:
          CURRENT: ${{ steps.pins.outputs.current }}
          PREVIOUS: ${{ steps.pins.outputs.previous }}
          FIRST_PATH: ${{ steps.first.outputs.path }}
          FIRST_READY: ${{ steps.first.outputs.ready }}
          FIRST_INSTALLED: ${{ steps.first.outputs.installed }}
          FIRST_VERSION: ${{ steps.first.outputs.version }}
          SECOND_PATH: ${{ steps.second.outputs.path }}
          SECOND_READY: ${{ steps.second.outputs.ready }}
          SECOND_INSTALLED: ${{ steps.second.outputs.installed }}
          SECOND_VERSION: ${{ steps.second.outputs.version }}
        # Whichever bun is current by now (the second call overwrote the
        # shared install path); the judge reads recorded outputs only.
        run: bun .github/scripts/ci/bun_setup_smoke.ts judge

  # The same blocking scan the fleet runs, by local path: a fixable
  # CRITICAL finding in any committed lockfile fails here first.
  trivy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./actions/trivy

  # THE gate: this job's own check run (named all-green, created by the
  # GitHub Actions app) is the ruleset's required check. `needs` must list
  # every gating job above - ALL_GREEN_ROSTER (scripts/check/ssot/all_green.ts) is that list's
  # authored twin, compared both ways, so adding or retiring a gate is loud.
  # `if: always()` because the judgment must run over failures; the shared
  # action fails unless every result is success or skipped with at least
  # one success (a skipped gate stands down; an all-skipped run vouches
  # for nothing).
  all-green:
    needs:
      - actionlint
      - actionlint-binary
      - gitleaks
      - dependency-review
      - allgreen-judgment
      - yamllint
      - biome
      - typography
      - file-size
      - commit-names
      - typecheck
      - action-refs
      - compose
      - validate-template
      - golden-renders
      - script-tests
      - validate-skills
      - skills-discovery
      - smoke-generate
      - upgrade-path
      - pages-site-build
      - rehearse-fleet
      - codeql-javascript
      - zizmor
      - typos
      - knip
      - semgrep
      - bun-setup-smoke
      - trivy
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./actions/all-green
        with:
          needs: ${{ toJSON(needs) }}

  # Everything that runs after green on a main push. Same-run and
  # needs-ordered behind the gate, so github.sha IS the judged commit; the
  # called workflow's publish job holds the build-branches-publish lane (a
  # lane this caller must never hold, or the call deadlocks against
  # itself), and ci.yml's run-level concurrency already serializes main
  # runs, so no caller lane is needed.
  post-green:
    needs: [all-green]
    if: >-
      needs.all-green.result == 'success' &&
      github.event_name == 'push' &&
      github.ref == 'refs/heads/main'
    permissions:
      contents: read
      checks: read
    uses: ./.github/workflows/post-green.yml
    with:
      sha: ${{ github.sha }}
      before: ${{ github.event.before }}
    secrets:
      REPO_PLATFORM_TOKEN: ${{ secrets.REPO_PLATFORM_TOKEN }}

  # This repository's own docs site (the docs-site module, dogfooded): the
  # skeleton's docs-site leg calling the pipeline by local path. Ordered
  # behind post-green so the deploy runs after this run republished the
  # build branch its pipeline consumes (@build), gated on the all-green
  # result alone: !cancelled() keeps a red fleet leg from holding the site
  # back. The mount is spelled out: this repository carries no
  # registration for the called workflow to read.
  docs-site:
    needs: [all-green, post-green]
    if: >-
      !cancelled() &&
      needs.all-green.result == 'success' &&
      github.event_name == 'push' &&
      github.ref == 'refs/heads/main'
    concurrency:
      group: pages
      cancel-in-progress: false
    permissions:
      contents: read
      pages: write
      id-token: write
      issues: write
    uses: ./.github/workflows/reusable-pages.yml
    with:
      sha: ${{ github.sha }}
      mounts: '[{"path": "/", "source": "vitepress", "versioned": true}]'
      site_title: repo-platform
      link_rot_label: docs-link-rot
      custom_domain: ${{ vars.CUSTOM_DOMAIN }}
