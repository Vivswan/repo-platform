name: CI

on:
  push:
    branches: [main]
  # `edited` on top of the default three: a PR title edit must re-run the
  # gate so the pr-title check stays honest. The cancel-in-progress
  # concurrency below bounds the extra runs.
  pull_request:
    types: [opened, edited, reopened, synchronize]
  workflow_dispatch:
  # Weekly CodeQL re-scan with refreshed query packs; every other gate job
  # is event-agnostic or skips its work cleanly on non-PR events.
  schedule:
    - cron: "3 8 * * 1"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  actionlint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: raven-actions/actionlint@v2

  # The action scans the event's commit range (fetch-depth: 0 so any
  # range resolves). Same job the base template ships to every managed
  # repo; `bun run lint:secrets` covers history and staged changes
  # locally. pull-requests read: the action lists the PR's commits to
  # build the scan range. Comments off keeps that scope at read; leaks
  # still land in the job summary and SARIF artifact.
  gitleaks:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_ENABLE_COMMENTS: "false"
          # The action's default binary (8.24.3) predates .gitleaks.toml's
          # minVersion floor AND skips that check silently; pin one meeting
          # the floor so CI honors the same config local runs do.
          GITLEAKS_VERSION: "8.30.1"

  # Fails when a PR introduces dependencies with known vulnerabilities, by
  # diffing the dependency graph between base and head. Only PR events have
  # a diff to review, so the skip lives on the steps: all-green treats a
  # skipped needed job as failure, so the job itself stays unconditional.
  dependency-review:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        if: github.event_name == 'pull_request'
      # The severity threshold and the upstream pin live in the wrapper.
      - uses: ./actions/dependency-review
        if: github.event_name == 'pull_request'

  # The workflows' large steps live as scripts in .github/scripts/ exactly
  # so they can be linted; actionlint only sees inline run blocks.
  shellcheck:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - name: Shellcheck the workflow step scripts
        # -x follows the `# shellcheck source=` directives into the
        # sourced shared helpers (paths resolve from the checkout root).
        run: find .github/scripts -name '*.sh' -print0 | xargs -0 shellcheck -x

  yamllint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      # The same action the fleet runs; local path, so this repository
      # always lints with the tree under review rather than what is
      # published. `bun run lint:yaml` is the local twin.
      - uses: ./actions/yamllint

  biome:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: .bun-version
      - name: Install tooling
        run: bun install --frozen-lockfile --silent
      - name: Biome (lint + format check)
        run: bun x biome ci .

  typography:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: ./actions/check-typography

  commit-names:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: ./actions/validate-commit-names

  typecheck:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: .bun-version
      # Keyed on each action's tsconfig.json: dirs without one (no TS to
      # check) skip naturally, and a new action joins without editing this
      # list. The bun-dirs ssot rule pins the glob and requires every dir
      # committing a bun.lock to carry a tsconfig.json.
      - name: Typecheck repo and action scripts
        run: |
          for tsconfig in tsconfig.json actions/*/tsconfig.json; do
            dir="$(dirname "$tsconfig")"
            echo "::group::$dir"
            (cd "$dir" && bun install --frozen-lockfile --silent && bun x tsc -p .)
            echo "::endgroup::"
          done

  # Network gate, deliberately outside `bun run check`: proves every
  # third-party action pin resolves to a real upstream ref (a dangling
  # pin like a retired moving-major tag passes every offline gate and
  # then fails at job start, fleet-wide once synced).
  action-refs:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: .bun-version
      - name: Resolve every pinned action ref
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: bun .github/scripts/ci/resolve_action_refs.ts

  # template/ is no longer committed; prove composition succeeds (collisions,
  # orphan anchors, manifest errors all hard-fail) and is deterministic.
  compose:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: .bun-version
      - name: Install dependencies
        run: bun install --frozen-lockfile --silent
      - name: Build twice and compare
        run: |
          bun .github/scripts/build-branches/branch_tree.ts --dest /tmp/tree-a
          bun .github/scripts/build-branches/branch_tree.ts --dest /tmp/tree-b
          diff -r --no-dereference /tmp/tree-a /tmp/tree-b
          echo "build tree is deterministic"

  validate-template:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: .bun-version
      - name: Install dependencies
        run: |
          bun install --frozen-lockfile --silent
          bun install --frozen-lockfile --silent --cwd actions/validate-template
      - name: Validate repo-platform against its own conventions
        run: bun actions/validate-template/validate_generated_files.ts --self .
      - name: Validate managed-repos registry
        run: bun .github/scripts/fleet/repos_registry.ts validate
      - name: Check single-source-of-truth invariants
        run: bun run ssot:check
      - name: Check generated regions against the module manifests
        run: bun run generate:check
      - name: Check generated dogfood copies against their template twins
        run: bun run dogfood:check
      # Offline and sub-second: fragments must match the manifests'
      # gitignore_sources on the PR that edits them, not a week later.
      - name: Check gitignore topology against the module manifests
        run: bun run gitignore:topology
      - name: Check markdown is not hard-wrapped
        run: bun run wrap:check

  # Committed golden renders (tests/golden-renders/) must match a fresh
  # copier render of the canonical selection matrix, so every template or
  # composer change shows its fleet-facing rendered diff in the PR
  # (scripts/render_goldens.ts has the matrix and determinism contract).
  golden-renders:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: .bun-version
      - name: Install dependencies
        run: bun install --frozen-lockfile --silent
      - name: Install copier
        run: pipx install copier
      - name: Check the golden renders against a fresh render
        run: bun run renders:check

  script-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: .bun-version
      - name: Install dependencies
        run: bun install --frozen-lockfile --silent
      - name: Run .github/scripts and action tests
        run: bun test ./tests ./actions

  # Structural validation of this repository's own hosted agent skills
  # (skills/ plus the repo-owned .claude-plugin manifests), dogfooding the
  # composite action the skills module pins fleet-wide. Offline and cheap;
  # `bun run validate:skills` is the local twin.
  validate-skills:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: ./actions/validate-skills
        with:
          skills-dir: skills

  # CLI discovery for the same catalog. Fleet repos get this as the
  # advisory validate-skills.yml (npx needs the npm registry, and managed
  # repos must not block on a registry hiccup); here it GATES, per this
  # repo's all-jobs-gate convention - CI is not network-shy (smoke-generate
  # already downloads copier) and a listing regression in
  # the action this repo ships should block its own merges.
  skills-discovery:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: ./actions/validate-skills
        with:
          skills-dir: skills
          mode: discovery

  # The smoke legs lint their rendered workflows with the actionlint
  # binary. Fetched here ONCE per run and handed to the legs as an
  # artifact: each leg fetching it itself meant one unpinned download of
  # rhysd/actionlint@main's install script per matrix row per push
  # (observed connection-reset flake, and unpinned third-party code). The
  # install script rides the same pinned release tag as the binary it
  # installs; curl retries transient resets as belt-and-braces.
  actionlint-binary:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Download actionlint
        env:
          ACTIONLINT_VERSION: 1.7.12
        run: |
          # --retry-all-errors: plain --retry skips connection resets (the
          # observed failure) - it only retries timeouts and a few HTTP
          # codes. -f turns HTTP errors into curl failures so they retry
          # too and still fail the step; -S keeps errors visible under -s.
          curl -fsSL --retry 3 --retry-all-errors -o /tmp/download-actionlint.bash \
            "https://raw.githubusercontent.com/rhysd/actionlint/v${ACTIONLINT_VERSION}/scripts/download-actionlint.bash"
          bash /tmp/download-actionlint.bash "$ACTIONLINT_VERSION"
      - uses: actions/upload-artifact@v7
        with:
          name: actionlint-binary
          path: actionlint
          if-no-files-found: error

  smoke-generate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # For the actionlint-binary artifact the lint step downloads.
    needs: [actionlint-binary]
    strategy:
      fail-fast: false
      matrix:
        include:
          # Module combos covering the risky branches. `modules` is a YAML
          # STRING here (quoted) and parsed by copier as a YAML list.
          # custom-license rides on the everything row so the LICENSE
          # opt-out (no fleet license rendered) is exercised; every other
          # row covers the default fleet-license render.
          - name: everything
            modules: "[agents, bun, node, deno, uv, rust, pages, release-please, issue-templates, skills, pr-title, auto-assign, fuzzer, nightly, settings-sync, custom-license]"
            private: "false"
            expect_in_pages: |
              setup: bun,node,deno,uv
              bun install --frozen-lockfile
              bun run build
          - name: bun-typical
            modules: "[agents, bun, release-please, issue-templates, pr-title, auto-assign, settings-sync]"
            private: "false"
          # node and deno each as the sole toolchain: codeql-javascript and
          # the javascript/deno labels must render from the module alone,
          # without bun in the selection. skills rides on this thin row
          # with a non-default skills_dir, so the module's dir answer is
          # exercised end-to-end (the everything row covers the default).
          - name: node-typical
            modules: "[agents, node, skills, settings-sync]"
            private: "false"
            extra_data: "-d skills_dir=lib/skills"
          # pages rides along as the only real render of a non-bun pages
          # chain end-to-end (the everything row's chain heads with bun).
          - name: deno-typical
            modules: "[agents, deno, pages, settings-sync]"
            private: "false"
            expect_in_pages: |
              setup: deno
              deno ci
              deno task build
          # bun + node co-selected: the only render exercising the shared
          # javascript label or-gate and the shared javascript-typescript
          # CodeQL group (the exact-count check must see one job), plus the
          # Node.gitignore guard's bun+node leg (one section, the node copy
          # suppressed).
          - name: bun-node
            modules: "[agents, bun, node, settings-sync]"
            private: "false"
          # deno co-selected with each earlier Node.gitignore declarer:
          # deno's two-operand suppression guard must render the shared
          # section exactly once when exactly ONE of bun/node is also
          # selected. An and->or slip in the guard passes bun-node and the
          # everything row but duplicates the section on these rows.
          - name: bun-deno
            modules: "[bun, deno]"
            private: "false"
          - name: node-deno
            modules: "[node, deno]"
            private: "false"
          # The only public row where uv is the sole toolchain: CodeQL must
          # gate ci.yml with the python leg and WITHOUT the javascript leg,
          # and AGENTS.md's Toolchain section must render the uv bullet
          # alone (every other agents+uv row pairs uv with bun). nightly
          # rides along as the only fuzzer-free nightly render: stream
          # independence means the fuzz starter must not render here, and
          # with release-please the release-health call sites must pass
          # exactly the nightly label (the single-stream nightly-only leg;
          # rust-fuzzer covers the fuzzer-only mirror).
          - name: uv-typical
            modules: "[agents, uv, nightly, release-please]"
            private: "false"
          # rust + fuzzer must render cargo dependabot + the Rust gitignore and
          # nothing toolchain-gated (no CodeQL block, no auto-format starter):
          # rust is deliberately outside has_toolchain, and the fuzzer module
          # adds nothing toolchain-gated. agents rides along so the AGENTS.md
          # Toolchain section is exercised with rust as the only toolchain
          # module; without auto-assign, the fuzzer starter must render no
          # auto-assign dispatch (the everything row covers the with branch).
          # Deliberately nightly-free: the fuzzer-present/nightly-absent leg
          # (no nightly.yml renders) - uv-typical covers the mirror leg and
          # the everything row the co-selection. release-please rides along
          # so the release-health call sites pass exactly the fuzz label
          # (the single-stream fuzzer-only leg).
          - name: rust-fuzzer
            modules: "[agents, rust, fuzzer, release-please]"
            private: "false"
          - name: uv-pages-private
            # settings-sync rides along so the private: true render of
            # settings.yml is exercised for uv (bun-private covers bun).
            modules: "[uv, pages, auto-assign, settings-sync]"
            private: "true"
            expect_in_pages: |
              uv sync
              uv run mkdocs build --site-dir dist
              production: release
              staging: true
          # The only row where bun renders private: the bun fragments'
          # enable_codeql=false branches must emit no CodeQL wiring in
          # ci.yml, settings.yml must still declare `private: true`
          # (uv-pages-private covers the uv side), and pr-title proves a
          # fragment gate job renders beside the merged base-checks job.
          - name: bun-private
            modules: "[bun, settings-sync, pr-title]"
            private: "true"
          - name: pages-bare
            modules: "[pages, auto-assign]"
            private: "false"
            extra_data: "-d pages_setup=none -d pages_build_command=./build.sh -d pages_production=main"
            expect_in_pages: |
              ./build.sh
              production: main
              staging: false
          # Proves the declared _min_copier_version still supports the
          # multiselect + when features the template uses (serialized
          # multiselect answers landed in copier 9.8.0).
          - name: none
            modules: "[]"
            private: "false"
            copier_spec: "copier==9.8.0"
          # Renders with this repository's own answers
          # (.repo-platform-answers.yml - the ssot dogfood-oracle-row rule
          # and the oracle step both fail if this row drifts from that
          # file) so the committed dogfood copies can be byte-compared
          # against real copier output. The trailing project_name overrides
          # the harness default (copier keeps the last -d occurrence);
          # description stays the harness default - EXTRA_DATA cannot carry
          # whitespace and no generated pair renders it.
          - name: dogfood-oracle
            modules: "[agents, bun, skills, pr-title, auto-assign]"
            private: "false"
            extra_data: "-d project_name=repo-platform"
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      # copier invokes the stamp hook with bun during copy/update.
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: .bun-version
      - name: Install copier
        env:
          COPIER_SPEC: ${{ matrix.copier_spec || 'copier' }}
        run: pipx install "$COPIER_SPEC"
      - name: Generate ${{ matrix.name }}
        env:
          MODULES: ${{ matrix.modules }}
          PRIVATE: ${{ matrix.private }}
          EXTRA_DATA: ${{ matrix.extra_data }}
        run: bun .github/scripts/ci/smoke_generate.ts
      - name: Validate generated output
        run: |
          bun install --frozen-lockfile --silent --cwd actions/validate-template
          bun actions/validate-template/validate_generated_files.ts /tmp/smoke
      - name: Verify module/visibility gating
        env:
          MODULES: ${{ matrix.modules }}
          PRIVATE: ${{ matrix.private }}
          EXPECT_IN_PAGES: ${{ matrix.expect_in_pages }}
          EXTRA_DATA: ${{ matrix.extra_data }}
        run: .github/scripts/ci/verify_smoke_gating.sh
      # The dogfood-oracle row rendered with this repo's own answers, so
      # real copier output must byte-match the committed generated copies
      # (closing the TS-renderer-vs-copier gap render_dogfood leaves open).
      - name: Compare dogfood copies against the copier render
        if: matrix.name == 'dogfood-oracle'
        run: bun .github/scripts/ci/verify_dogfood_oracle.ts
      # Rendered workflows are invisible to the repo-level actionlint job
      # (.jinja files are not YAML pre-render), so lint the smoke output
      # with the binary the actionlint-binary job fetched once for the run.
      - uses: actions/download-artifact@v8
        with:
          name: actionlint-binary
      - name: actionlint rendered workflows
        run: |
          # The artifact zip drops the executable bit.
          chmod +x "$GITHUB_WORKSPACE/actionlint"
          # git init + render-root cwd, or the render's actionlint.yaml
          # ignores never apply: project discovery needs the .git dir, and
          # the config's path globs match cwd-relative paths.
          git -C /tmp/smoke init -q
          (cd /tmp/smoke && "$GITHUB_WORKSPACE/actionlint" -color .github/workflows/*.yml)

  # Generate from a previous build tree, then `copier update` to a fresh
  # build - the path every managed repo takes (details in the script).
  upgrade-path:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      # copier invokes the stamp hook with bun during copy/update.
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: .bun-version
      - name: Install copier
        run: pipx install copier
      - name: Update from a previous build tree to a fresh build
        run: .github/scripts/ci/upgrade_path_test.sh

  # Dry-run sync against every fleet repo's REAL current state (render,
  # splice, resolve, validate - no push, no PR, private repos hard-skipped
  # by rehearse_fleet.ts's fail-closed visibility rule): the class of bug
  # the synthetic rows above cannot see - a real repo's local edits, stale
  # markers, recorded answers - goes red here instead of during a live
  # sync run. Gate mode turns failed rehearsals and failed validations
  # into ::error:: annotations naming repo, phase, and files, and fails
  # the job (bun run rehearse:fleet is the local, report-only twin). The
  # job stays unconditional for the strict gate; the steps skip when the
  # fleet PAT is absent from the event's secrets (Dependabot-triggered
  # runs get Dependabot secrets, not this repo's) - the push run after
  # merge and the weekly schedule still rehearse every change. No fork
  # exposure: solo repo.
  rehearse-fleet:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      HAS_FLEET_PAT: ${{ secrets.REPO_PLATFORM_TOKEN != '' }}
    steps:
      - uses: actions/checkout@v7
        if: env.HAS_FLEET_PAT == 'true'
      - uses: oven-sh/setup-bun@v2
        if: env.HAS_FLEET_PAT == 'true'
        with:
          bun-version-file: .bun-version
      - name: Install dependencies
        if: env.HAS_FLEET_PAT == 'true'
        run: bun install --frozen-lockfile --silent
      # copier invokes the stamp hook with bun during the rehearsal update.
      - name: Install copier
        if: env.HAS_FLEET_PAT == 'true'
        run: pipx install copier
      - name: Rehearse the fleet sync
        if: env.HAS_FLEET_PAT == 'true'
        env:
          # The PAT, not github.token: fleet discovery and the enrollment
          # probe answer for the fleet token, exactly as production's
          # plan job does.
          GH_TOKEN: ${{ secrets.REPO_PLATFORM_TOKEN }}
        run: bun .github/scripts/ci/rehearse_fleet_gate.ts
      - name: Note the tokenless skip
        if: env.HAS_FLEET_PAT != 'true'
        run: echo "::notice::rehearse-fleet skipped - this event's secrets carry no REPO_PLATFORM_TOKEN (a Dependabot-triggered run); the post-merge push run rehearses the same tree."

  # Conventional Commit PR title, checked inside the gate so branch
  # protection blocks on it. The skip lives on the STEP, not the job:
  # all-green treats a skipped needed job as failure, and CI also runs on
  # push/dispatch/schedule events.
  pr-title:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      pull-requests: read
    steps:
      - name: Validate PR title is a Conventional Commit
        if: github.event_name == 'pull_request'
        uses: amannn/action-semantic-pull-request@v6
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # CodeQL runs inside the gate: this thin job calls the analysis workflow,
  # and a caller job's permissions are the ceiling for every job in the
  # called workflow, so the scan permissions are granted here. This repo is
  # TypeScript-only (the actions, scripts, and template tooling), so one
  # language leg suffices; the name matches the template's per-language jobs.
  codeql-javascript:
    permissions:
      contents: read
      security-events: write
      actions: read
    uses: ./.github/workflows/reusable-codeql.yml
    with:
      language: javascript-typescript

  all-green:
    name: all-green
    if: always()
    needs:
      - actionlint
      - actionlint-binary
      - gitleaks
      - dependency-review
      - shellcheck
      - yamllint
      - biome
      - typography
      - commit-names
      - typecheck
      - action-refs
      - compose
      - validate-template
      - golden-renders
      - script-tests
      - validate-skills
      - skills-discovery
      - smoke-generate
      - upgrade-path
      - rehearse-fleet
      - pr-title
      - codeql-javascript
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: All jobs green
        env:
          NEEDS: ${{ toJson(needs) }}
        run: |
          set -o pipefail
          jq -r 'to_entries[] | "\(.value.result)\t\(.key)"' <<< "$NEEDS"
          failed="$(jq -r 'to_entries[] | select(.value.result != "success") | .key' <<< "$NEEDS" | tr '\n' ' ')"
          if [ -n "$failed" ]; then
            echo "::error::all-green failed: ${failed% } did not succeed. Open the failing job's log in this run, fix the failure, and push again."
            exit 1
          fi
