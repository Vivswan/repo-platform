# Reusable settings apply for settings-sync module repos: a thin caller
# runs this on pushes touching its .github/settings.yml. The apply is the
# SAME two-layer merge the central settings-repos run computes - a partial
# repo document alone would delete every baseline label (the action's
# label sync removes undeclared ones), so this workflow checks out
# repo-platform (pinned to the calling ref's commit), computes the managed
# baseline from the caller's module selection, merges the caller's
# settings.yml over it, and applies the merged document in single-repo
# mode. The central home for the same merge is settings-repos.yml.
#
# Token model: settings mutation needs Administration (and Issues) write,
# which GITHUB_TOKEN can never hold - the caller passes its own
# REPO_PLATFORM_TOKEN (fine-grained PAT). Without it the run SKIPS with a
# warning; repo-platform's central settings-repos run heals it either way.
# Pinned to an immutable commit sha; switch to @v1 once
# github-settings-as-code cuts its first release.

name: Reusable Apply Settings

on:
  workflow_call:
    inputs:
      check_only:
        description: Report drift without writing (exit 1 on drift)
        required: false
        type: boolean
        default: false
      on_missing_permission:
        description: fail (default) or warn - partial success on missing permissions
        required: false
        type: string
        default: fail
      required_sections:
        description: Sections that must apply even under warn
        required: false
        type: string
        default: ""
      sections:
        description: Optional allowlist of sections to process
        required: false
        type: string
        default: ""
      api_version:
        description: X-GitHub-Api-Version override
        required: false
        type: string
        default: "2022-11-28"
    secrets:
      REPO_PLATFORM_TOKEN:
        required: false

permissions:
  contents: read

concurrency:
  group: apply-settings-${{ github.repository }}
  cancel-in-progress: false

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Resolve token
        id: token
        env:
          PAT: ${{ secrets.REPO_PLATFORM_TOKEN }}
        run: |
          if [ -n "$PAT" ]; then
            echo "proceed=true" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::settings apply skipped: the REPO_PLATFORM_TOKEN secret is not set, and GITHUB_TOKEN cannot mutate repo settings. To opt in to self-apply on push, add a fine-grained PAT with Administration (read and write) and Issues (read and write) on this repo as an Actions secret named REPO_PLATFORM_TOKEN. The central settings-repos run in repo-platform applies this repository's settings either way."
            echo "proceed=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Check out repository
        if: steps.token.outputs.proceed == 'true'
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.repository.default_branch }}

      # The baseline generator and merge dialect live in repo-platform;
      # job_workflow_sha pins the checkout to the exact commit the
      # caller's `uses:` ref resolved to, so the scripts and this workflow
      # can never version-skew (fallback for contexts that omit it: main,
      # what staging-channel callers pin anyway).
      - name: Check out repo-platform
        if: steps.token.outputs.proceed == 'true'
        uses: actions/checkout@v7
        with:
          repository: Vivswan/repo-platform
          ref: ${{ github.job_workflow_sha || 'main' }}
          path: platform

      - if: steps.token.outputs.proceed == 'true'
        uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: platform/.bun-version

      - name: Install repo-platform script dependencies
        if: steps.token.outputs.proceed == 'true'
        working-directory: platform
        run: bun install --frozen-lockfile --silent

      # The managed baseline from this repository's own facts (module
      # selection and tracking answers fetched from the default branch,
      # live visibility probed), then the checked-out settings.yml merged
      # over it - the document the apply step below reads.
      - name: Compute the merged settings document
        if: steps.token.outputs.proceed == 'true'
        env:
          GH_TOKEN: ${{ secrets.REPO_PLATFORM_TOKEN }}
        run: |
          bun platform/.github/scripts/fleet/render_managed_settings.ts \
            --repo "$GITHUB_REPOSITORY" --out "$RUNNER_TEMP/managed-settings.yml"
          bun platform/.github/scripts/fleet/merge_settings_layers.ts \
            --managed "$RUNNER_TEMP/managed-settings.yml" \
            --repo-file .github/settings.yml \
            --out "$RUNNER_TEMP/merged-settings.yml"

      - name: Apply repository settings
        if: steps.token.outputs.proceed == 'true'
        # Pinned to an immutable commit; bump to @v1 once the action cuts
        # its first release. Bump together with settings-repos.yml.
        uses: Vivswan/github-settings-as-code@ac83fb48219309e2249294ef37fb55310bd45fb3
        with:
          token: ${{ secrets.REPO_PLATFORM_TOKEN }}
          mode: ${{ inputs.check_only && 'check' || 'apply' }}
          settings-file: ${{ runner.temp }}/merged-settings.yml
          on-missing-permission: ${{ inputs.on_missing_permission }}
          required-sections: ${{ inputs.required_sections }}
          sections: ${{ inputs.sections }}
          api-version: ${{ inputs.api_version }}
