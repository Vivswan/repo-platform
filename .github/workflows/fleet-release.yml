# The fleet's release cut, called by every managed ci.yml downstream of
# the all-green gate: release-please runs on the judged commit, draft-first
# because published releases freeze (a late upload gets 422). The caller
# then runs its own update-release hook and fleet-release-publish.yml.
# Without REPO_PLATFORM_TOKEN the release PR is created by GITHUB_TOKEN
# and needs a close/reopen to run its checks. If the pipeline dies after
# the draft exists, a rerun cannot recreate it (the tag is forced):
# re-run the failed jobs, or finish by hand with
# `gh release upload <tag> <assets> --clobber` and
# `gh release edit <tag> --draft=false`.

name: Fleet Release

on:
  workflow_call:
    inputs:
      sha:
        description: The judged commit this release run vouches for; empty falls back to github.sha.
        required: false
        type: string
        default: ""
      tracking-labels:
        description: Comma-separated nightly tracking-issue labels; release-health blocks on open issues carrying them. Empty disables the tracking gates.
        required: false
        type: string
        default: ""
    secrets:
      REPO_PLATFORM_TOKEN:
        description: The fleet PAT; release-please falls back to github.token without it.
        required: false
    outputs:
      release_created:
        description: Whether release-please cut a draft release ("true" or empty).
        value: ${{ jobs.release-please.outputs.release_created }}
      tag_name:
        description: The cut release's tag.
        value: ${{ jobs.release-please.outputs.tag_name }}
      prs_created:
        description: Whether release-please created or refreshed a release PR ("true" or empty).
        value: ${{ jobs.release-please.outputs.prs_created }}
      pr_number:
        description: The release PR's number, when one was proposed.
        value: ${{ jobs.release-please.outputs.pr_number }}
      pr_head_branch:
        description: The release PR's head branch, when one was proposed.
        value: ${{ jobs.release-please.outputs.pr_head_branch }}

jobs:
  release-please:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Caps a caller that grants more; the read keys feed release-health.
    permissions:
      contents: write
      pull-requests: write
      issues: read
      vulnerability-alerts: read
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
      # pr is unset when no PR was proposed; the && short-circuit keeps
      # fromJSON off the empty string.
      prs_created: ${{ steps.release.outputs.prs_created }}
      pr_number: ${{ steps.release.outputs.pr && fromJSON(steps.release.outputs.pr).number }}
      pr_head_branch: ${{ steps.release.outputs.pr && fromJSON(steps.release.outputs.pr).headBranchName }}
    steps:
      # A green verdict releases only the commit it judged; gh api (not
      # anonymous ls-remote) so private repositories work.
      - name: Check this run judged the current head
        id: head
        env:
          GH_TOKEN: ${{ github.token }}
          JUDGED: ${{ inputs.sha || github.sha }}
        run: |
          head="$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq .object.sha)"
          if [ "$head" = "$JUDGED" ]; then
            echo "current=true" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::main moved to ${head:0:7} since ${JUDGED:0:7} was judged; the newer run releases"
            echo "current=false" >> "$GITHUB_OUTPUT"
          fi
      # The release PR's CI health check can be stale by merge time, so
      # the same gate re-runs here; release mode self-scopes to
      # release-cut pushes.
      - uses: Vivswan/repo-platform/actions/release-health@build
        if: steps.head.outputs.current == 'true'
        with:
          mode: release
          tracking-labels: ${{ inputs.tracking-labels }}
        env:
          GH_TOKEN: ${{ github.token }}
      - uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        id: release
        if: steps.head.outputs.current == 'true'
        with:
          token: ${{ secrets.REPO_PLATFORM_TOKEN || github.token }}
      # release-please's propose phase silently ABORTS - green - while a
      # merged PR still wears "autorelease: pending". Checked AFTER the
      # action so its recovery phase runs first; 30 minutes covers labels
      # legitimately pending right after a merge.
      - name: Fail when a stale pending release PR parks release-please
        if: steps.head.outputs.current == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          cutoff="$(date -u -d '30 minutes ago' +%Y-%m-%dT%H:%M:%SZ)"
          stale="$(gh pr list --state merged --label 'autorelease: pending' \
            --limit 100 --json number,mergedAt \
            --jq "[.[] | select(.mergedAt < \"$cutoff\") | \"#\\(.number)\"] | join(\", \")")"
          if [ -n "$stale" ]; then
            echo "::error::merged release PR(s) $stale have worn 'autorelease: pending' for over 30 minutes,"\
              "so release-please refuses to propose any new release ('untagged, merged release PRs outstanding')."\
              "Finish or abandon that release, then move the label to 'autorelease: tagged'."
            exit 1
          fi
