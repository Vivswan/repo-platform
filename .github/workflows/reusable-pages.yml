# Reusable GitHub Pages deploy: ONE versioned Pages site assembled by the
# pages-site action (actions/pages-site@build) from a mount list (the
# contract: docs/pages.md). Two configurations. Registration-configured: a
# caller passing no `mounts` has the config job run the plan action
# (actions/plan@build, mode pages) over its registration, which yields the
# mounts, setup, commands, output directory, site title, and link-rot label.
# Caller-configured: a caller passing `mounts` sets the rest through the other
# inputs, published unchanged after the setup grammar check (this repository's
# own docs-site.yml: it has no registration). The config job stands alone so
# the action's bun never reaches the PATH the caller's build commands run on.
# Per versioned mount: <mount>latest/ builds from the default branch head,
# <mount><tag>/ from each served version tag (newest vars.PAGES_MAX_VERSIONS
# or 5; a tag that structurally cannot build is skipped with a notice), and
# the mount root serves the newest served version, or the default branch head
# while none serve. An unversioned mount is one build of the default branch
# head. Command mounts run the caller's build under the PAGES_* contract;
# vitepress mounts render the caller's docs tree under the central fleet theme
# (docs/docs-site.md). A custom domain needs DNS + Pages settings + the
# CUSTOM_DOMAIN variable together; when set, the root moves from /<repo>/ to /
# and the artifact carries CNAME. On scheduled runs with a link-rot label, the
# site's external links are checked after the deploy and findings ride the
# fleet's tracking-issue stream (fuzz-issue@build) under that label. Callers
# own `concurrency: pages`; this workflow declares none. The commit built: the
# caller's sha input when passed (the judged commit), else a push's own
# commit, else the default branch head.

name: Reusable Pages

on:
  workflow_call:
    inputs:
      sha:
        description: The commit to build ("" = a push builds github.sha, any other event the default branch head)
        required: false
        type: string
        default: ""
      mounts:
        description: 'Caller-configured deploys only: the JSON mount list [{"path", "source": command|vitepress, "versioned"}]; empty resolves the whole configuration from the registration'
        required: false
        type: string
        default: ""
      setup:
        description: Caller-configured deploys only; toolchain(s) installed on the build runner (comma-separated bun/node/deno/uv/rust, or none)
        required: false
        type: string
        default: none
      install_command:
        description: Caller-configured deploys only; dependency install command run before each command-mount build ("" skips)
        required: false
        type: string
        default: ""
      build_command:
        description: Caller-configured deploys only; build command for command mounts (PAGES_BASE_PATH/PAGES_ORIGIN/PAGES_VERSION/PAGES_TIER are exported, docs/pages.md)
        required: false
        type: string
        default: ""
      dist_dir:
        description: Caller-configured deploys only; command-mount build output directory, relative to the repo root
        required: false
        type: string
        default: dist
      site_title:
        description: Caller-configured deploys only; site title for vitepress mounts (empty = the repository name)
        required: false
        type: string
        default: ""
      docs_dir:
        description: Caller-configured deploys only; the docs tree a vitepress mount renders
        required: false
        type: string
        default: docs
      custom_domain:
        description: Custom domain ("" = <owner>.github.io/<repo>); pass vars.CUSTOM_DOMAIN
        required: false
        type: string
        default: ""
      link_rot_label:
        description: Caller-configured deploys only; tracking label for the nightly external-link check ("" disables it)
        required: false
        type: string
        default: ""

permissions:
  contents: read

jobs:
  # The one owner of the deploy configuration: the plan resolves it from
  # the registration, or publishes the caller's inputs when mounts is set.
  # The commit it read is an output too: the deploy builds THAT commit, so
  # a default branch moving between the two jobs cannot split them.
  config:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      sha: ${{ steps.checkout.outputs.commit }}
      mounts: ${{ steps.plan.outputs.mounts }}
      setup: ${{ steps.plan.outputs.setup }}
      install_command: ${{ steps.plan.outputs.install_command }}
      build_command: ${{ steps.plan.outputs.build_command }}
      dist_dir: ${{ steps.plan.outputs.dist_dir }}
      site_title: ${{ steps.plan.outputs.site_title }}
      docs_dir: ${{ steps.plan.outputs.docs_dir }}
      link_rot_label: ${{ steps.plan.outputs.link_rot_label }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        id: checkout
        with:
          ref: ${{ inputs.sha || (github.event_name == 'push' && github.sha || github.event.repository.default_branch) }}
          sparse-checkout: |
            .repo-platform.yml
          sparse-checkout-cone-mode: false
      - uses: Vivswan/repo-platform/actions/plan@build
        id: plan
        with:
          mode: pages
          mounts: ${{ inputs.mounts }}
          setup: ${{ inputs.setup }}
          install_command: ${{ inputs.install_command }}
          build_command: ${{ inputs.build_command }}
          dist_dir: ${{ inputs.dist_dir }}
          site_title: ${{ inputs.site_title }}
          docs_dir: ${{ inputs.docs_dir }}
          link_rot_label: ${{ inputs.link_rot_label }}

  deploy:
    needs: config
    runs-on: ubuntu-latest
    timeout-minutes: 60
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    permissions:
      contents: read
      pages: write
      id-token: write
    steps:
      # One full checkout serves every tier: the action reads version tags
      # and per-ref trees from history (git archive), which needs
      # fetch-depth 0. The commit is the one the config job planned from.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          ref: ${{ needs.config.outputs.sha }}

      # One output per toolchain token, so each setup step below gates on a
      # positive `== 'true'` (an absent output never passes as a match).
      - name: Resolve the toolchain setup
        id: tools
        env:
          SETUP: ${{ needs.config.outputs.setup }}
        run: |
          IFS=,
          for tool in $SETUP; do
            case "$tool" in
              bun|node|deno|uv|rust|none) ;;
              *) echo "::error::invalid setup token '$tool': each token must be bun, node, deno, uv, rust, or none"; exit 1 ;;
            esac
            echo "$tool=true" >> "$GITHUB_OUTPUT"
          done

      # Every tier builds with the toolchain the checkout's version dotfile
      # pins (historical tags build with today's pin, deliberately - one
      # toolchain per run); without the dotfile the setup action's default
      # floats.
      - name: Setup bun
        if: steps.tools.outputs.bun == 'true'
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: ${{ hashFiles('.bun-version') != '' && '.bun-version' || '' }}

      - name: Cache bun dependencies
        if: steps.tools.outputs.bun == 'true'
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('**/bun.lock') }}
          restore-keys: bun-${{ runner.os }}-

      # node and uv have no cache step, and setup-deno's built-in DENO_DIR
      # cache (used by the template's own deno steps) is not enabled here.
      # setup-node's own package-manager-cache is switched off: it defaults
      # on, and when package.json declares a package manager it hard-fails
      # unless the lockfile sits at the workspace root.
      - name: Setup node
        if: steps.tools.outputs.node == 'true'
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: ${{ hashFiles('.node-version') != '' && '.node-version' || '' }}
          package-manager-cache: false

      - name: Setup deno
        if: steps.tools.outputs.deno == 'true'
        uses: denoland/setup-deno@22d081ff2d3a40755e97629de92e3bcbfa7cf2ed # v2.0.5
        with:
          deno-version-file: ${{ hashFiles('.dvmrc') != '' && '.dvmrc' || '' }}

      - name: Setup uv
        if: steps.tools.outputs.uv == 'true'
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1

      # Stable as the rustup default only: the action sets no override, so
      # a rust-toolchain.toml in the build tree still wins (rust pins stay
      # repository-owned - docs/toolchains.md). The action publishes no
      # version tags (its branches name toolchains), so the pin is a master
      # commit and the toolchain is the explicit input. The cache carries
      # cargo's registry and installed binaries (the mdbook default) across
      # runs, with the .crates metadata that lets cargo install recognise a
      # restored binary as its own instead of refusing to overwrite it.
      - name: Setup rust
        if: steps.tools.outputs.rust == 'true'
        uses: dtolnay/rust-toolchain@d1031067263f94b142dd6c0ce24c5eb9d02d52a0 # master
        with:
          toolchain: stable

      - name: Cache cargo
        if: steps.tools.outputs.rust == 'true'
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/bin
            ~/.cargo/.crates.toml
            ~/.cargo/.crates2.json
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
          key: cargo-${{ runner.os }}-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: cargo-${{ runner.os }}-

      - name: Build and assemble the site
        id: site
        uses: Vivswan/repo-platform/actions/pages-site@build
        with:
          mounts: ${{ needs.config.outputs.mounts }}
          docs-dir: ${{ needs.config.outputs.docs_dir }}
          site-title: ${{ needs.config.outputs.site_title }}
          install-command: ${{ needs.config.outputs.install_command }}
          build-command: ${{ needs.config.outputs.build_command }}
          dist-dir: ${{ needs.config.outputs.dist_dir }}
          max-versions: ${{ vars.PAGES_MAX_VERSIONS || '5' }}
          custom-domain: ${{ inputs.custom_domain }}

      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0

      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: ${{ steps.site.outputs.site-dir }}

      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1

  # Nightly link rot, as its OWN job: the deploy job above executes
  # caller-authored build commands, so its token never carries issues
  # write - this job crawls the artifact that actually shipped (the
  # github-pages artifact the deploy published) and files findings on the
  # tracking-issue stream: open issue on rot, closed on a clean night.
  link-rot:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: [config, deploy]
    if: github.event_name == 'schedule' && needs.config.outputs.link_rot_label != ''
    permissions:
      contents: read
      issues: write
    steps:
      - name: Download the deployed artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: github-pages

      - name: Extract the deployed artifact
        run: mkdir -p _site && tar -xf artifact.tar -C _site

      - name: Check external links
        id: links
        uses: Vivswan/repo-platform/actions/pages-site/check-links@build
        with:
          site-dir: _site

      # A count the gates below can test positively (check_ssot's
      # step-output-gates rule): an absent count fails here rather than
      # reading as a clean night, and neither the report nor the close runs.
      - name: Read the link-rot count
        id: rot
        env:
          BROKEN: ${{ steps.links.outputs.broken }}
        run: |
          [[ "$BROKEN" =~ ^[0-9]+$ ]] || { echo "::error::check-links published no broken count: '$BROKEN'"; exit 1; }
          echo "found=$([ "$BROKEN" -gt 0 ] && echo true || echo false)" >> "$GITHUB_OUTPUT"

      - name: Upload the link-rot report
        if: steps.rot.outputs.found == 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: link-rot-${{ github.run_attempt }}
          path: ${{ steps.links.outputs.report-dir }}
          if-no-files-found: ignore

      - name: File or update the link-rot issue
        if: steps.rot.outputs.found == 'true'
        uses: Vivswan/repo-platform/actions/fuzz-issue@build
        with:
          mode: report
          label: ${{ needs.config.outputs.link_rot_label }}
          title: Docs site link rot
          artifacts-dir: ${{ steps.links.outputs.report-dir }}
          artifact-name: link-rot-${{ github.run_attempt }}
          # The stream's create tuple, anchored to files.yml's docs-site
          # tracking_label by check_ssot's labels rule.
          label-color: "D4A72C"
          label-description: Automated docs-site link-rot report
          stream: generic

      - name: Close the link-rot issue on a clean night
        if: steps.rot.outputs.found == 'false'
        uses: Vivswan/repo-platform/actions/fuzz-issue@build
        with:
          mode: resolve
          label: ${{ needs.config.outputs.link_rot_label }}
          stream: generic
