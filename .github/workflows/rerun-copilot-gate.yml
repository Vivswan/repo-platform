# Re-arms ci.yml's fail-fast copilot-review gate: that job fails
# immediately when Copilot's review is expected but not yet posted (zero
# runner time instead of a billed polling wait), and this workflow
# re-runs JUST that job once the review is in. Two triggers cover both
# orderings: the review posting after CI finished (pull_request_review),
# and CI finishing red after the review posted mid-run (workflow_run -
# jobs of a live run cannot be re-run, so the review trigger defers to
# this one). The script guards every no-op case and caps re-run attempts;
# see its header.

name: Rerun Copilot Gate

on:
  pull_request_review:
    types: [submitted]
  workflow_run:
    workflows: [CI]
    types: [completed]

# Actions write re-runs the failed gate job; checks and pull-requests
# read answer "did the review arrive" on the CI-completed path; contents
# read is for the checkout the script rides in.
permissions:
  actions: write
  checks: read
  pull-requests: read
  contents: read

jobs:
  rerun:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      # Only two event shapes matter: a Copilot-authored review, or a
      # failed pull_request CI run (a push run's gate passes trivially,
      # and a green run needs no re-arm). Everything else skips the
      # steps; the event condition lives here, not on the job.
      RELEVANT: >-
        ${{
          (github.event_name == 'pull_request_review' &&
           contains(fromJSON('["copilot-pull-request-reviewer[bot]", "Copilot"]'), github.event.review.user.login)) ||
          (github.event_name == 'workflow_run' &&
           github.event.workflow_run.event == 'pull_request' &&
           github.event.workflow_run.conclusion == 'failure')
        }}
    steps:
      # Pinned to the default branch: this job's token can re-run gate
      # jobs, so only the trusted copy of the script may run under it,
      # never a PR ref's.
      - uses: actions/checkout@v7
        if: env.RELEVANT == 'true'
        with:
          ref: ${{ github.event.repository.default_branch }}
      - uses: oven-sh/setup-bun@v2
        if: env.RELEVANT == 'true'
        with:
          bun-version-file: .bun-version
      - name: Install script dependencies
        if: env.RELEVANT == 'true'
        run: bun install --frozen-lockfile --silent
      - name: Re-run the copilot-review job if the review arrived
        if: env.RELEVANT == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          HEAD_SHA: >-
            ${{ github.event_name == 'workflow_run' &&
                github.event.workflow_run.head_sha ||
                github.event.pull_request.head.sha }}
          RUN_ID: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.id || '' }}
        run: bun .github/scripts/ci/rerun_copilot_gate.ts
