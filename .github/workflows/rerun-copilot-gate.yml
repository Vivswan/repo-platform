# Re-arms ci.yml's fail-fast copilot-review gate: that job fails
# immediately when Copilot's review is expected but not yet posted (zero
# runner time instead of a billed polling wait), and this workflow
# re-runs JUST that job once the review is in. Two triggers cover both
# orderings: the review posting after CI finished (pull_request_review),
# and CI finishing red after the review posted mid-run (workflow_run -
# jobs of a live run cannot be re-run, so the review trigger defers to
# this one). The action guards every no-op case and caps re-run attempts;
# see its rerun.ts header.
#
# EXPECT action_required: GitHub holds a run for manual approval when the
# triggering actor is the Copilot bot, so this workflow can land with
# that conclusion and no jobs run at all - the re-arm is best effort,
# never a guarantee (GitHub actor policy; no REST API exposes a toggle,
# and run 33023093065 proved it on this repository's own PR #12). When it
# happens, open the failed CI run and pick Re-run jobs, then Re-run
# failed jobs - that re-runs copilot-review together with the all-green
# job that needs it, and both go green once the review has arrived.
#
# workflow_run triggers execute the DEFAULT branch's copy of this file,
# so changes here are observable only after they merge to main.

name: Rerun Copilot Gate

on:
  pull_request_review:
    types: [submitted]
  workflow_run:
    workflows: [CI]
    types: [completed]

# Actions write re-runs the failed gate job; checks and pull-requests
# read answer "did the review arrive" on the CI-completed path; contents
# read is for the checkout the action rides in.
permissions:
  actions: write
  checks: read
  pull-requests: read
  contents: read

jobs:
  rerun:
    # Only two event shapes matter: a Copilot-authored review, or a failed
    # pull_request CI run (a push run's gate passes trivially, and a green
    # run needs no re-arm). A JOB-level if, same as the fleet twin
    # (templates/base/.github/workflows/rerun-copilot-gate.yml.jinja): an
    # irrelevant event starts no job at all, instead of starting a runner
    # whose every step skips.
    if: >-
      ${{
        (github.event_name == 'pull_request_review' &&
         contains(fromJSON('["copilot-pull-request-reviewer[bot]", "Copilot"]'), github.event.review.user.login)) ||
        (github.event_name == 'workflow_run' &&
         github.event.workflow_run.event == 'pull_request' &&
         github.event.workflow_run.conclusion == 'failure')
      }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      # DELIBERATE divergence from the fleet twin, which calls the action
      # @actions with no checkout: the operator runs the SAME action by
      # local path off a default-branch checkout, exercising its own tip
      # rather than the last published ref. Pinned to the default branch:
      # this job's token can re-run gate jobs, so only the trusted copy of
      # the action may run under it, never a PR ref's.
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.repository.default_branch }}
      - uses: ./actions/copilot-rearm
        with:
          head-sha: >-
            ${{ github.event_name == 'workflow_run' &&
                github.event.workflow_run.head_sha ||
                github.event.pull_request.head.sha }}
          run-id: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.id || '' }}
          # The commit the triggering review actually covered (review
          # trigger only): a review of an OLDER head must not re-arm the
          # new head - the re-review of the new head fires its own event.
          review-commit: >-
            ${{ github.event_name == 'pull_request_review' &&
                github.event.review.commit_id || '' }}
          # The review's own PR (review trigger only): stacked PRs share
          # head shas, so the run to re-arm is selected by ITS
          # pull_requests association, never by the sha alone.
          review-pr: >-
            ${{ github.event_name == 'pull_request_review' &&
                github.event.pull_request.number || '' }}
          github-token: ${{ github.token }}
