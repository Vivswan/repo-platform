# Publishes the generated `template` build branch copier consumes: a minimal
# build tree from the LATEST main commit, rebuilt on every push. It is an
# ORPHAN, APPEND-ONLY branch: each build commit parents the previous build
# commit, never a main commit, so a main history rewrite can never
# invalidate it and old build commits (downstream repos' recorded _commit,
# needed by copier update's three-way merge) stay reachable forever.
# The weekly schedule is a self-heal net. GITHUB_TOKEN pushes trigger no
# workflows - intended; nothing may run on the build branch (its tree
# carries no .github/).

name: Build Branches

on:
  push:
    branches: [main]
  schedule:
    - cron: "12 6 * * 1"
  workflow_dispatch:

# Contents write publishes the build branch; actions read lets publish.ts's
# re-stamp check read the run stamped on the current tip.
permissions:
  contents: write
  actions: read

concurrency:
  group: build-branches
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: .bun-version

      - name: Build and publish
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: bun .github/scripts/build-branches/publish.ts
