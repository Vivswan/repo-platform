# Central settings apply: merges each target's settings LAYERS
# (docs/settings.md). render_managed_settings.ts selects and merges layers
# 1 to 4 - the fleet baseline, the fleet visibility overlay, and each
# selected module's own layer and visibility overlay - driven by the
# target's .repo-platform.yml module selection and its effective
# visibility. merge_settings_layers.ts then adds the repo's own
# .github/settings.yml and the fleet override on top, and runs
# Vivswan/github-settings-as-code in
# single-repo mode once per repository in a fail-fast-free matrix. Targets
# are enrolled, adopted repos whose .repo-platform.yml selects the
# settings-sync module - the module selection is the opt-in - plus this
# repository itself (its baseline facts come from
# .repo-platform-answers.yml). Repos heal independently: one target's
# failure is its own red "apply (<repo>)" job and never blocks the others.
# The settings-sync module also adds push-time self-apply via
# reusable-apply-settings.yml, which computes the same merge.

name: Settings Repos

on:
  push:
    branches: [main]
    # Every input the merged documents are built from: this repo's own
    # settings layer, the fleet layers (baseline, visibility overlays, and
    # the override that outranks every repo file), the per-module settings
    # layers, the merge scripts, and the module manifests. A push that
    # changes any single layer must reach the fleet.
    paths:
      - .github/settings.yml
      - .github/settings-baseline.yml
      - .github/settings-public.yml
      - .github/settings-private.yml
      - .github/settings-override.yml
      - .github/scripts/fleet/render_managed_settings.ts
      - .github/scripts/fleet/merge_settings_layers.ts
      - .repo-platform-answers.yml
      - templates/*/module.yml
      - templates/*/settings.yml
      - templates/*/settings-public.yml
      - templates/*/settings-private.yml
  schedule:
    # Nightly heal at an offbeat minute.
    - cron: "2 8 * * *"
  workflow_dispatch:
    inputs:
      repo:
        description: Single owner/name to heal (defaults to every settings target)
        required: false
        type: string
      check_only:
        description: >-
          Report drift without settings writes (a private target's
          report issue is still delivered)
        required: false
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: settings-repos
  cancel-in-progress: false

jobs:
  select:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      targets: ${{ steps.targets.outputs.targets }}
    steps:
      # A missing token is a misconfiguration of this repo: fail loudly.
      # So is a narrowed one here: settings need Administration + Issues
      # write, and unreachable sections fail the run (see
      # on-missing-permission below).
      - name: Require the fleet token
        env:
          PAT: ${{ secrets.REPO_PLATFORM_TOKEN }}
        run: |
          if [ -z "$PAT" ]; then
            echo "::error::settings apply cannot run: the REPO_PLATFORM_TOKEN secret is not set - GITHUB_TOKEN can never hold the Administration write that settings mutation needs. Create a fine-grained PAT for the fleet via https://github.com/settings/personal-access-tokens/new?name=REPO_PLATFORM_TOKEN&description=repo-platform+fleet%3A+push+sync+and+central+settings&contents=write&pull_requests=write&workflows=write&administration=write&issues=write and add it as an Actions secret named REPO_PLATFORM_TOKEN in this repository."
            exit 1
          fi

      - name: Check out repository
        uses: actions/checkout@v7

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: .bun-version

      - name: Install dependencies
        run: bun install --frozen-lockfile

      # One matrix entry per target repo. Probes retry and then
      # warn-and-skip a repo they cannot answer for; only
      # selection-infrastructure failures (unreadable registry, failed
      # discovery) fail this job.
      # No ONLY_REPO env on purpose: the typed dispatch input may be a
      # private slug, and the runner prints step env values into this
      # public log - the script reads it from the event payload instead.
      - name: Select settings targets
        id: targets
        env:
          GH_TOKEN: ${{ secrets.REPO_PLATFORM_TOKEN }}
          PAT: ${{ secrets.REPO_PLATFORM_TOKEN }}
          OWNER: ${{ github.repository_owner }}
        run: bun .github/scripts/fleet/select_settings_repos.ts

  apply:
    needs: select
    # fromJSON on an empty list would create a matrix with no jobs, which
    # GitHub rejects; an empty fleet is a no-op, not a failure.
    if: needs.select.outputs.targets != '[]'
    strategy:
      # Independence between repos lives HERE: one repo's failed apply
      # stays a red job but never cancels or blocks its siblings. Within
      # a job everything stays strict - no continue-on-error, no
      # softened exit codes. (GitHub caps a matrix at 256 jobs; the
      # fleet is far smaller.)
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.select.outputs.targets) }}
    # matrix.repo is the redaction hint for a private target - the real
    # slug never enters the matrix or this job name; the resolve step
    # recovers it.
    name: apply (${{ matrix.repo }})
    # Job level so the deliver step's `if:` can read it - a step-level env
    # is invisible to another step's condition. Rendered as the string
    # "true"/"false", which is what the comparison below expects.
    env:
      HIDE_DETAILS: ${{ matrix.hide_details }}
      # Distinct from the template sync's report: failure_issue.ts matches
      # by exact title, so a shared one would let either workflow's green
      # run close the other's open report.
      SETTINGS_REPORT_TITLE: "[automated] repo-platform settings: private failure report"
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: .bun-version

      # Before the resolve step: the resolver is a bun script and imports
      # the registry/redaction modules, which need the yaml dependency.
      - name: Install dependencies
        run: bun install --frozen-lockfile

      # Recovers the real slug for a redacted target and registers it with
      # the runner's masker before anything else prints; public rows pass
      # straight through.
      - name: Resolve the target repository
        id: resolve
        env:
          TARGET_INPUT: ${{ matrix.repo }}
          REDACT_NAME: ${{ matrix.redact_name }}
          VERIFY: ${{ matrix.verify }}
          GH_TOKEN: ${{ secrets.REPO_PLATFORM_TOKEN }}
          PAT: ${{ secrets.REPO_PLATFORM_TOKEN }}
        run: bun .github/scripts/fleet/resolve_private_repo.ts

      # The managed baseline for THIS repository's facts (module
      # selection, declared-or-live visibility, tracking-label answers),
      # then the repo's own settings.yml merged over it. Scratch filenames
      # are fixed and neutral - a redacted slug reaches the scripts only
      # through env (already masked). The operator repo itself has no
      # .repo-platform.yml to fetch; its facts come from its recorded
      # answers file in this checkout.
      # Both of these run BEFORE the settings action, so the action's own
      # private-repos redaction cannot cover what they print, and both
      # quote repo-owned content on their diagnostic paths. run_hidden.ts
      # is the boundary: it passes output through untouched for a public
      # target and captures it for a hide-details one, publishing only a
      # generic outcome. HIDE_DETAILS is independent of redact_name - a
      # private repo can disclose its NAME and still need its content
      # hidden.
      - name: Render the managed settings baseline
        id: render
        env:
          GH_TOKEN: ${{ secrets.REPO_PLATFORM_TOKEN }}
          TARGET: ${{ steps.resolve.outputs.repo }}
        run: |
          if [ "$TARGET" = "$GITHUB_REPOSITORY" ]; then
            bun .github/scripts/sync/run_hidden.ts "settings render" -- \
              bun .github/scripts/fleet/render_managed_settings.ts \
              --repo "$TARGET" --operator-answers .repo-platform-answers.yml \
              --out "$RUNNER_TEMP/managed-settings.yml"
          else
            bun .github/scripts/sync/run_hidden.ts "settings render" -- \
              bun .github/scripts/fleet/render_managed_settings.ts \
              --repo "$TARGET" --out "$RUNNER_TEMP/managed-settings.yml"
          fi

      - name: Merge the repository's settings.yml over the baseline
        id: merge
        env:
          GH_TOKEN: ${{ secrets.REPO_PLATFORM_TOKEN }}
          TARGET: ${{ steps.resolve.outputs.repo }}
        run: >-
          bun .github/scripts/sync/run_hidden.ts "settings merge" --
          bun .github/scripts/fleet/merge_settings_layers.ts
          --managed "$RUNNER_TEMP/managed-settings.yml"
          --repo-fetch "$TARGET" --repo-ref "${{ steps.render.outputs.ref }}"
          --out "$RUNNER_TEMP/merged-settings.yml"

      # Outside the hidden capture on purpose: for a hide-details target
      # run_hidden swallows the merge step's SUCCESS output, including its
      # not-onboarded warning, so the skip would otherwise be a green job
      # with no signal at all. matrix.repo is the masked hint for a
      # redacted row, so this says WHICH target without saying anything
      # about its contents.
      - name: Report a skipped target
        if: steps.merge.outputs.skipped == 'true'
        run: |
          echo "::notice::settings apply skipped for ${{ matrix.repo }}: it selects settings-sync but has no .github/settings.yml yet, so there is nothing to layer over the fleet defaults. The settings-sync starter seeds the file on its next template sync."

      - name: Apply repository settings
        # Skipped for a target that selected settings-sync but has no
        # settings.yml yet: the merge step writes no document, because
        # applying the baseline alone would delete the repo's own labels.
        if: steps.merge.outputs.skipped != 'true'
        # Pinned to an immutable commit; bump to @v1 once the action cuts
        # its first release. Bump together with reusable-apply-settings.yml.
        uses: Vivswan/github-settings-as-code@ac83fb48219309e2249294ef37fb55310bd45fb3
        with:
          token: ${{ secrets.REPO_PLATFORM_TOKEN }}
          mode: ${{ inputs.check_only && 'check' || 'apply' }}
          # Single-repo mode, scoped by the resolved slug (already masked
          # when the row is redacted, so this with: line renders *** in
          # the log); the merged scratch document is the settings source.
          repository: ${{ steps.resolve.outputs.repo }}
          settings-file: ${{ runner.temp }}/merged-settings.yml
          private-repos: redact
          # A redacted target's failure/drift details cannot appear in
          # this public log; they land as a reused issue on the target
          # repo instead. Needs the PAT's Issues write.
          private-report: issue
          # Strict: a token that cannot reach a declared section fails
          # this repo's job (the action's default) - settings drift must
          # not hide behind a green run.
          on-missing-permission: fail

      # run_hidden.ts keeps a hide-details target's render/merge output out
      # of this public log, which means the detail only exists in
      # RUNNER_TEMP. Without this step it would die with the runner and
      # the operator would see an exit code and nothing else, breaking the
      # private-detail contract in docs/private-repos.md. TARGET comes
      # from the resolve step via GITHUB_ENV.
      - name: Deliver hidden failure diagnostics
        if: failure() && env.HIDE_DETAILS == 'true' && env.TARGET != ''
        env:
          GH_TOKEN: ${{ secrets.REPO_PLATFORM_TOKEN }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          REPORT_TITLE: ${{ env.SETTINGS_REPORT_TITLE }}
          REPORT_KIND: settings apply
        run: bun .github/scripts/sync/failure_issue.ts deliver

      # Without this the issue stays open after a recovered run, and the
      # template sync's own green run could close a report the settings
      # apply is still failing on - which is why the two carry different
      # titles.
      - name: Resolve the settings failure report
        if: success() && env.HIDE_DETAILS == 'true' && env.TARGET != ''
        env:
          GH_TOKEN: ${{ secrets.REPO_PLATFORM_TOKEN }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          REPORT_TITLE: ${{ env.SETTINGS_REPORT_TITLE }}
          REPORT_KIND: settings apply
        run: bun .github/scripts/sync/failure_issue.ts resolve
