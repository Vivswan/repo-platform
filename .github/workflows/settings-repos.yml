# A plan job selects the targets into a keyed matrix; one apply job per row resolves its target
# and runs github-settings-as-code on it, from its own rendered .github/settings.yml
# (docs/settings.md). No push trigger: a merge reaches the fleet only through post-green.yml's
# call, behind the all-green gate.

name: Settings Repos

on:
  schedule:
    # Nightly heal at an offbeat minute.
    - cron: "2 8 * * *"
  workflow_dispatch:
    inputs:
      repo:
        description: >-
          owner/name to heal (or a bare name, same owner), a
          comma-separated list of them, public, private, modules:<a>+<b> (every
          target whose .repo-platform.yml selects ALL the listed modules; a
          visibility token intersects with it), or the literal "all" - same as
          leaving it empty, every settings target
        required: false
        type: string
      check_only:
        description: >-
          Report drift without settings writes (a private target's
          report issue is still delivered)
        required: false
        type: boolean
        default: false
  # Named `repos`, not `repo`: the dispatch input may be a private slug and never rides in step env,
  # while this value is public text and is passed as ONLY_REPO below. check_only is dispatch-only,
  # so a called run always applies.
  workflow_call:
    inputs:
      repos:
        description: >-
          "all", or a comma-separated list of owner/name slugs and the
          visibility tokens public and private (fleet/sync_scope.ts); a
          private repo may appear only under its token here, and the
          dispatch-only modules: filter never does
        required: true
        type: string
      sha:
        description: >-
          The judged main commit - the caller's own github.sha, which
          the gate step requires and verifies green
        required: true
        type: string
    secrets:
      REPO_PLATFORM_TOKEN:
        required: true

permissions:
  contents: read

# A CALLED run takes a per-run group: its caller (post-green.yml's settings-fleet job) already holds
# settings-repos, and a called workflow waiting on its caller's lane deadlocks.
# cancel-in-progress stays false on both: the lane orders by arrival, so cancelling would let an older
# commit's late run cancel the newer apply in flight. The selector stands that run down instead
# (fleet/newest_main.ts; the settings-lane-newest-wins ssot rule pins the pair).
concurrency:
  group: ${{ inputs.sha != '' && format('settings-repos-called-{0}', github.run_id) || 'settings-repos' }}
  cancel-in-progress: false

jobs:
  plan:
    runs-on: ubuntu-latest
    # The green gate's bounded wait (require_green_commit.ts) plus the selection: three short
    # reads per target, run one after another, so a far larger fleet shows up here first.
    timeout-minutes: 60
    # Checks read: the green gate reads this repository's own all-green
    # check runs with GITHUB_TOKEN; the fleet PAT's grant carries no Checks read.
    permissions:
      contents: read
      checks: read
    outputs:
      count: ${{ steps.select.outputs.count }}
      matrix: ${{ steps.select.outputs.matrix }}
    steps:
      # A narrowed token fails too: settings need Administration and Issues write, and
      # on-missing-permission below fails an unreachable section.
      - name: Require the fleet token
        env:
          PAT: ${{ secrets.REPO_PLATFORM_TOKEN }}
        run: |
          if [ -z "$PAT" ]; then
            echo "::error::settings apply cannot run: the REPO_PLATFORM_TOKEN secret is not set - GITHUB_TOKEN can never hold the Administration"\
              "write that settings mutation needs. Create a fine-grained PAT for the fleet via"\
              "https://github.com/settings/personal-access-tokens/new?name=REPO_PLATFORM_TOKEN&description=repo-platform+fleet%3A+push+sync+and+central+settings&contents=write&pull_requests=write&workflows=write&administration=write&issues=write"\
              "and add it as an Actions secret named REPO_PLATFORM_TOKEN in this repository."
            exit 1
          fi

      # Exactly one, without a ref: it lands on the trigger commit the gate
      # judges (the settings-green-gate ssot rule pins that).
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: .bun-version

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Require a green commit
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_SHA: ${{ inputs.sha }}
        run: bun .github/scripts/fleet/require_green_commit.ts

      # The typed dispatch input is not passed as env: it may be a private slug, and the runner prints
      # step env into this public log; the script reads the event payload instead. The matrix output
      # carries each row's index and the plan's opaque key (sync/resolve_row.ts), never a slug.
      - name: Select settings targets
        id: select
        env:
          GH_TOKEN: ${{ secrets.REPO_PLATFORM_TOKEN }}
          PAT: ${{ secrets.REPO_PLATFORM_TOKEN }}
          OWNER: ${{ github.repository_owner }}
          ONLY_REPO: ${{ inputs.repos }}
          # The judged commit a refused called scope names; empty
          # on cron and dispatch runs like ONLY_REPO.
          SOURCE_SHA: ${{ inputs.sha }}
        run: bun .github/scripts/fleet/select_settings_repos.ts

  # One job per matrix row: an index for the job name, which never carries a repository name, and
  # the plan's opaque key for the resolver. The `include` word lives here, not in the plan's output:
  # the runner drops a job output that spells a masked name (sync/resolve_row.ts). An empty
  # selection is a no-op, not a failure.
  apply:
    needs: plan
    if: needs.plan.outputs.count != '0'
    permissions:
      contents: read
    strategy:
      # One broken target is that row's red, never another's.
      fail-fast: false
      # Every row writes with the same PAT (labels, rulesets, report
      # issues are content-creating, so secondary rate limits apply):
      # bound the fleet's burst.
      max-parallel: 5
      matrix:
        include: ${{ fromJSON(needs.plan.outputs.matrix) }}
    name: apply (row ${{ matrix.row }})
    runs-on: ubuntu-latest
    # One target's work: the install, one listing of the owner's repositories,
    # then about five minutes of apply. The fleet's size is the matrix's width,
    # never this bound.
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: .bun-version

      - name: Install dependencies
        run: bun install --frozen-lockfile

      # The only step that sees the name in the clear: resolve_settings_target.ts masks the target
      # before anything else prints and hands it on as TARGET through GITHUB_ENV. It also asks newest
      # wins again at the write: a re-run of failed rows reuses the plan's answer.
      - name: Resolve the row's target
        env:
          ROW_KEY: ${{ matrix.key }}
          PAT: ${{ secrets.REPO_PLATFORM_TOKEN }}
          GH_TOKEN: ${{ secrets.REPO_PLATFORM_TOKEN }}
          OWNER: ${{ github.repository_owner }}
        run: bun .github/scripts/fleet/resolve_settings_target.ts

      # Gated on the resolved name: an empty repos input is the action's single-repo mode over
      # this checkout's own document.
      - name: Apply repository settings
        if: env.TARGET != ''
        uses: Vivswan/github-settings-as-code@046adf3b24454f26f569850630809bcf481f8b84 # v2.0.0
        with:
          token: ${{ secrets.REPO_PLATFORM_TOKEN }}
          mode: ${{ inputs.check_only && 'check' || 'apply' }}
          repos: ${{ env.TARGET }}
          # A private target appears in this public log as "private
          # repository #1"; its failure or drift details land as a reused
          # issue on the target repository instead (needs the PAT's Issues
          # write).
          private-repos: redact
          private-report: issue
          # Strict: a token that cannot reach a declared section fails that
          # target (the action's default) - drift must not hide behind a
          # green run.
          on-missing-permission: fail
