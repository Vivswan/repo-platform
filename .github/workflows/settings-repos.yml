# Central settings apply: one Vivswan/github-settings-as-code step in repos
# mode over the selected targets, each applied from its own rendered
# .github/settings.yml (docs/settings.md). Targets are enrolled, adopted
# repositories whose settings the sync has rendered, this repository
# included; the action applies them one at a time and reports per target,
# so one failure never blocks the others.
#
# Three ways in, one apply: post-green.yml's settings-fleet leg CALLS this
# workflow from a green main push's own CI run, the nightly cron heals
# out-of-band drift, and a dispatch applies or checks by hand. No push
# trigger: the apply reaches the fleet only behind the all-green gate, and
# the post-green call is that gate's one exit.

name: Settings Repos

on:
  schedule:
    # Nightly heal at an offbeat minute.
    - cron: "2 8 * * *"
  workflow_dispatch:
    inputs:
      repo:
        description: >-
          owner/name to heal (or a bare name, same owner), a
          comma-separated list of them, public, private, modules:<a>+<b> (every
          target whose .repo-platform.yml selects ALL the listed modules; a
          visibility token intersects with it), or the literal "all" - same as
          leaving it empty, every settings target
        required: false
        type: string
      check_only:
        description: >-
          Report drift without settings writes (a private target's
          report issue is still delivered)
        required: false
        type: boolean
        default: false
  # The post-green path: post-green.yml's settings-fleet leg calls this
  # workflow from the merge's CI run, needs-ordered behind the all-green
  # job. Named `repos`, not `repo`, on purpose - the dispatch input may
  # be a private slug and never rides in step env, while this value is
  # "all" or public text off the merged PRs of a main range and is passed
  # as ONLY_REPO below. check_only is dispatch-only, so a called run always applies.
  workflow_call:
    inputs:
      repos:
        description: >-
          "all", or a comma-separated list of owner/name slugs and the
          visibility tokens public and private (fleet/sync_scope.ts); a
          private repo may appear only under its token here, and the
          dispatch-only modules: filter never does
        required: true
        type: string
      sha:
        description: >-
          The judged main commit - the caller's own github.sha, which
          the gate step requires and verifies green
        required: true
        type: string
    secrets:
      REPO_PLATFORM_TOKEN:
        required: true

permissions:
  contents: read
  # For the green gate's verdict lookup (require_green_commit.ts):
  # GITHUB_TOKEN reads this repository's own all-green check runs; the
  # fleet PAT's grant carries no Checks read.
  checks: read

# Cron and dispatch runs hold the settings-repos lane. A CALLED run takes
# a per-run group instead: its caller (post-green.yml's settings-fleet
# job) already holds settings-repos, and a called workflow must never
# wait on the lane its caller holds (the deadlock law in post-green.yml's
# header).
concurrency:
  group: ${{ inputs.sha != '' && format('settings-repos-called-{0}', github.run_id) || 'settings-repos' }}
  cancel-in-progress: false

jobs:
  apply:
    runs-on: ubuntu-latest
    # 30 for the green gate's bounded wait, plus about 5 per target run
    # sequentially by the action; sized at the fleet's count (11 today).
    timeout-minutes: 90
    steps:
      # A missing token is a misconfiguration of this repo: fail loudly.
      # So is a narrowed one here: settings need Administration + Issues
      # write, and unreachable sections fail the run (see
      # on-missing-permission below).
      - name: Require the fleet token
        env:
          PAT: ${{ secrets.REPO_PLATFORM_TOKEN }}
        run: |
          if [ -z "$PAT" ]; then
            echo "::error::settings apply cannot run: the REPO_PLATFORM_TOKEN secret is not set - GITHUB_TOKEN can never hold the Administration"\
              "write that settings mutation needs. Create a fine-grained PAT for the fleet via"\
              "https://github.com/settings/personal-access-tokens/new?name=REPO_PLATFORM_TOKEN&description=repo-platform+fleet%3A+push+sync+and+central+settings&contents=write&pull_requests=write&workflows=write&administration=write&issues=write"\
              "and add it as an Actions secret named REPO_PLATFORM_TOKEN in this repository."
            exit 1
          fi

      # Exactly one, without a ref: it lands on the trigger commit the gate
      # judges (the settings-green-gate ssot rule pins that).
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: .bun-version

      - name: Install dependencies
        run: bun install --frozen-lockfile

      # THE FLEET-WIDE WRITER'S GREEN GATE (docs/settings.md): a red tip
      # fails this step, so no target is selected and no apply runs.
      - name: Require a green commit
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_SHA: ${{ inputs.sha }}
        run: bun .github/scripts/fleet/require_green_commit.ts

      # Probes retry and then warn-and-skip a repo they cannot answer for;
      # only a failed discovery fails this job. ONLY_REPO carries only the
      # workflow_call scope ("all", or public text off the merged PRs of a
      # main range; empty on cron and dispatch runs). The typed dispatch input never rides
      # here: it may be a private slug, and the runner prints step env into
      # this public log, so the script reads it from the event payload.
      # The repos output is a STEP output on purpose: a job output holding a
      # masked private slug is dropped by the runner.
      - name: Select settings targets
        id: select
        env:
          GH_TOKEN: ${{ secrets.REPO_PLATFORM_TOKEN }}
          PAT: ${{ secrets.REPO_PLATFORM_TOKEN }}
          OWNER: ${{ github.repository_owner }}
          ONLY_REPO: ${{ inputs.repos }}
          # The judged commit a refused called scope names; empty
          # on cron and dispatch runs like ONLY_REPO.
          SOURCE_SHA: ${{ inputs.sha }}
        run: bun .github/scripts/fleet/select_settings_repos.ts

      # An empty selection is a no-op, not a failure - and never an empty
      # repos input, which the action would read as single-repo mode.
      - name: Apply repository settings
        if: steps.select.outputs.repos != ''
        uses: Vivswan/github-settings-as-code@046adf3b24454f26f569850630809bcf481f8b84 # v2.0.0
        with:
          token: ${{ secrets.REPO_PLATFORM_TOKEN }}
          mode: ${{ inputs.check_only && 'check' || 'apply' }}
          # The selector's newline-joined slugs: each target is applied from
          # its own default-branch .github/settings.yml.
          repos: ${{ steps.select.outputs.repos }}
          # A private target appears in this public log as "private
          # repository #N"; its failure or drift details land as a reused
          # issue on the target repository instead (needs the PAT's Issues
          # write).
          private-repos: redact
          private-report: issue
          # Strict: a token that cannot reach a declared section fails that
          # target (the action's default) - drift must not hide behind a
          # green run.
          on-missing-permission: fail
