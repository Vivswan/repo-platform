# Central settings apply: resolves every managed settings target -
# central settings/repos/<name>.yml files (settings/defaults.yml
# deep-merged under each) plus in-repo targets (enrolled, adopted repos
# carrying their own .github/settings.yml - the file is the opt-in, no
# module needed; a central file for the same repository wins) - and runs
# Vivswan/repo-settings-as-code once per repository in a fail-fast-free
# matrix. Repos heal independently: one target's failure is its own red
# "apply (<repo>)" job and never blocks the others. The optional
# settings-sync module adds push-time self-apply via
# reusable-apply-settings.yml.

name: Settings Repos

on:
  push:
    branches: [main]
    paths: [settings/**]
  schedule:
    # Nightly heal at an offbeat minute.
    - cron: "47 3 * * *"
  workflow_dispatch:
    inputs:
      repo:
        description: Single owner/name to heal (defaults to every settings target)
        required: false
        type: string
      check_only:
        description: >-
          Report drift without settings writes (a private target's
          report issue is still delivered)
        required: false
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: settings-repos
  cancel-in-progress: false

jobs:
  select:
    runs-on: ubuntu-latest
    outputs:
      targets: ${{ steps.targets.outputs.targets }}
    steps:
      # A missing token is a misconfiguration of this repo: fail loudly.
      # So is a narrowed one here: settings need Administration + Issues
      # write, and unreachable sections fail the run (see
      # on-missing-permission below).
      - name: Require the fleet token
        env:
          PAT: ${{ secrets.REPO_PLATFORM_TOKEN }}
        run: |
          if [ -z "$PAT" ]; then
            echo "::error::settings apply cannot run: the REPO_PLATFORM_TOKEN secret is not set - GITHUB_TOKEN can never hold the Administration write that settings mutation needs. Create a fine-grained PAT for the fleet via https://github.com/settings/personal-access-tokens/new?name=REPO_PLATFORM_TOKEN&description=repo-platform+fleet%3A+push+sync+and+central+settings&contents=write&pull_requests=write&workflows=write&administration=write&issues=write and add it as an Actions secret named REPO_PLATFORM_TOKEN in this repository."
            exit 1
          fi

      - name: Check out repository
        uses: actions/checkout@v7

      - uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: bun install --frozen-lockfile

      # One matrix entry per target repo, each carrying its settings
      # home. Probes retry and then warn-and-skip a repo they cannot
      # answer for; only selection-infrastructure failures (unreadable
      # registry, failed discovery, a central file the per-repo scoping
      # cannot represent) fail this job.
      # No ONLY_REPO env on purpose: the typed dispatch input may be a
      # private slug, and the runner prints step env values into this
      # public log - the script reads it from the event payload instead.
      - name: Select settings targets
        id: targets
        env:
          GH_TOKEN: ${{ secrets.REPO_PLATFORM_TOKEN }}
          PAT: ${{ secrets.REPO_PLATFORM_TOKEN }}
          OWNER: ${{ github.repository_owner }}
        run: bun .github/scripts/fleet/select_settings_repos.ts

  apply:
    needs: select
    # fromJSON on an empty list would create a matrix with no jobs, which
    # GitHub rejects; an empty fleet is a no-op, not a failure.
    if: needs.select.outputs.targets != '[]'
    strategy:
      # Independence between repos lives HERE: one repo's failed apply
      # stays a red job but never cancels or blocks its siblings. Within
      # a job everything stays strict - no continue-on-error, no
      # softened exit codes. (GitHub caps a matrix at 256 jobs; the
      # fleet is far smaller.)
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.select.outputs.targets) }}
    # matrix.repo is the redaction hint for a private in-repo target - the
    # real slug never enters the matrix or this job name; the resolve step
    # recovers it. Central names are committed filenames, self-disclosed.
    name: apply (${{ matrix.repo }})
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - uses: oven-sh/setup-bun@v2

      # Before the resolve step: the resolver is a bun script and imports
      # the registry/redaction modules, which need the yaml dependency.
      - name: Install dependencies
        run: bun install --frozen-lockfile

      # Recovers the real slug for a redacted target and registers it with
      # the runner's masker before anything else prints; public and
      # central rows pass straight through.
      - name: Resolve the target repository
        id: resolve
        env:
          TARGET_INPUT: ${{ matrix.repo }}
          REDACT_NAME: ${{ matrix.redact_name }}
          VERIFY: ${{ matrix.verify }}
          GH_TOKEN: ${{ secrets.REPO_PLATFORM_TOKEN }}
          PAT: ${{ secrets.REPO_PLATFORM_TOKEN }}
        run: bun .github/scripts/fleet/resolve_private_repo.ts

      # The action's central mode reads a whole directory and has no
      # per-target filter, so scoping this job to one repository means a
      # scratch dir holding just its file. (Single-repo `repository:`
      # mode is no alternative: it rejects defaults-file.)
      - name: Scope the central file to this repository
        if: matrix.home == 'central'
        env:
          NAME: ${{ matrix.name }}
        run: |
          mkdir -p "$RUNNER_TEMP/central-scope"
          cp "settings/repos/${NAME}.yml" "$RUNNER_TEMP/central-scope/"

      # Central files are hand-maintained, but the labels they must declare
      # follow the target repo's module selection (its .repo-platform.yml)
      # and fuzzer label (its .copier-answers.yml). A stale roster fails
      # this repo's apply, loudly, instead of starting the nightly
      # delete/recreate loop; a failed fetch only warns, so this step
      # never blocks the apply over a file it could not read. It runs
      # here, scoped to this job's file, rather than in select: one bad
      # central file must fail one apply job, never the whole heal.
      - name: Validate the central file against target modules
        if: matrix.home == 'central'
        env:
          GH_TOKEN: ${{ secrets.REPO_PLATFORM_TOKEN }}
          OWNER: ${{ github.repository_owner }}
        run: >-
          bun .github/scripts/fleet/validate_central_settings.ts
          --owner "$OWNER" --dir "$RUNNER_TEMP/central-scope"

      - name: Apply repository settings
        # Pinned to an immutable commit; bump to @v1 once the action cuts
        # its first release. Bump together with reusable-apply-settings.yml.
        uses: Vivswan/repo-settings-as-code@ac83fb48219309e2249294ef37fb55310bd45fb3
        with:
          token: ${{ secrets.REPO_PLATFORM_TOKEN }}
          mode: ${{ inputs.check_only && 'check' || 'apply' }}
          # Exactly one of the two multi-repo modes carries this job's
          # single repository: the scoped scratch dir for a central
          # home, the action's remote mode for an in-repo home (the
          # resolved slug - already masked when the row is redacted, so
          # this with: line renders *** in the log).
          repos-dir: ${{ matrix.home == 'central' && format('{0}/central-scope', runner.temp) || '' }}
          repos: ${{ matrix.home == 'in-repo' && steps.resolve.outputs.repo || '' }}
          defaults-file: settings/defaults.yml
          private-repos: redact
          # A redacted target's failure/drift details cannot appear in
          # this public log; they land as a reused issue on the target
          # repo instead. Needs the PAT's Issues write.
          private-report: issue
          # Strict: a token that cannot reach a declared section fails
          # this repo's job (the action's default) - settings drift must
          # not hide behind a green run.
          on-missing-permission: fail
