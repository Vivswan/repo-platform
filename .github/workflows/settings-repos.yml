# Central settings apply: merges each target's settings LAYERS
# (docs/settings.md). render_managed_settings.ts selects and merges layers
# 1 to 4 - the fleet baseline, the fleet visibility overlay, and each
# selected module's own layer and visibility overlay - driven by the
# target's .repo-platform.yml module selection and its effective
# visibility. merge_settings_layers.ts then adds the repo's own
# .github/settings.yml and the fleet override on top, and runs
# Vivswan/github-settings-as-code in
# single-repo mode once per repository in a fail-fast-free matrix. Targets
# are enrolled, adopted repos (a readable .repo-platform.yml is the
# opt-in) plus this repository itself (its baseline facts come from
# .repo-platform-answers.yml). Repos heal independently: one target's
# failure is its own red "apply (<repo>)" job and never blocks the others.
#
# Three ways in, one apply: post-green.yml's settings-fleet leg CALLS
# this workflow in a green main push's own CI run (when the merge touched
# a settings input - fleet/settings_inputs_changed.ts owns that path
# list - or after its fleet sync, for the synced repos), the nightly cron
# heals out-of-band drift, and a dispatch applies or checks by hand. No
# push trigger: the apply reaches the fleet only behind the all-green
# gate, and the post-green call is that gate's one exit.

name: Settings Repos

on:
  schedule:
    # Nightly heal at an offbeat minute.
    - cron: "2 8 * * *"
  workflow_dispatch:
    inputs:
      repo:
        description: >-
          owner/name to heal (or a bare name, same owner), a
          comma-separated list of them, public, private, or the literal "all" - same as
          leaving it empty, every settings target
        required: false
        type: string
      check_only:
        description: >-
          Report drift without settings writes (a private target's
          report issue is still delivered)
        required: false
        type: boolean
        default: false
  # The post-green path: post-green.yml's settings-fleet leg calls this
  # workflow from the merge's CI run, needs-ordered behind the all-green
  # job. Named `repos`, not `repo`, on purpose - the dispatch input may
  # be a private slug and never rides in step env, while this value is
  # "all" or text off a public main commit and is passed as ONLY_REPO
  # below. check_only is dispatch-only, so a called run always applies.
  workflow_call:
    inputs:
      repos:
        description: >-
          "all", or a comma-separated list of owner/name slugs and the
          visibility tokens public and private (fleet/sync_scope.ts); a
          private repo may appear only under its token here
        required: true
        type: string
      sha:
        description: >-
          The judged main commit - the caller's own github.sha, which
          the gate step requires (its checkouts read that commit) and
          verifies green
        required: true
        type: string
    secrets:
      REPO_PLATFORM_TOKEN:
        required: true

permissions:
  contents: read
  # For the green gate's verdict lookup (require_green_commit.ts):
  # GITHUB_TOKEN reads this repository's own all-green check runs; the
  # fleet PAT's grant carries no Checks read.
  checks: read

# Cron and dispatch runs hold the settings-repos lane. A CALLED run takes
# a per-run group instead: its caller (post-green.yml's settings-fleet
# job) already holds settings-repos, and a called workflow must never
# wait on the lane its caller holds (the deadlock law in post-green.yml's
# header).
concurrency:
  group: ${{ inputs.sha != '' && format('settings-repos-called-{0}', github.run_id) || 'settings-repos' }}
  cancel-in-progress: false

jobs:
  select:
    runs-on: ubuntu-latest
    # Room for the green gate's bounded wait (up to 20 minutes on a
    # dispatch) plus, on the scheduled fallback path, the bounded
    # green-commit walk (up to 50 verdict probes) on top of selection
    # itself.
    timeout-minutes: 45
    outputs:
      targets: ${{ steps.targets.outputs.targets }}
      # The commit the gate vouched for: the tip (the judged commit on a
      # called run), or on the scheduled heal's fallback path the newest
      # green commit behind a red tip. Every later checkout pins to it.
      sha: ${{ steps.gate.outputs.sha }}
    steps:
      # A missing token is a misconfiguration of this repo: fail loudly.
      # So is a narrowed one here: settings need Administration + Issues
      # write, and unreachable sections fail the run (see
      # on-missing-permission below).
      - name: Require the fleet token
        env:
          PAT: ${{ secrets.REPO_PLATFORM_TOKEN }}
        run: |
          if [ -z "$PAT" ]; then
            echo "::error::settings apply cannot run: the REPO_PLATFORM_TOKEN secret is not set - GITHUB_TOKEN can never hold the Administration"\
              "write that settings mutation needs. Create a fine-grained PAT for the fleet via"\
              "https://github.com/settings/personal-access-tokens/new?name=REPO_PLATFORM_TOKEN&description=repo-platform+fleet%3A+push+sync+and+central+settings&contents=write&pull_requests=write&workflows=write&administration=write&issues=write"\
              "and add it as an Actions secret named REPO_PLATFORM_TOKEN in this repository."
            exit 1
          fi

      - name: Check out repository
        uses: actions/checkout@v7

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: .bun-version

      - name: Install dependencies
        run: bun install --frozen-lockfile

      # THE FLEET-WIDE WRITER'S GREEN GATE. This workflow mutates every
      # managed repository's settings from a checkout's layer files,
      # and the apply's label reconciliation deletes undeclared labels -
      # so it must never run from a commit CI has not vouched for, or a
      # broken layer change reaches the fleet concurrently with the CI
      # run that would have caught it. Same predicate the template
      # publisher and the sync enforce (shared/all_green.ts), and the
      # same ref guard as the publisher: a dispatch aimed at a branch is
      # refused outright, since a branch CI run vouches only for that
      # branch. A CALLED run (SOURCE_SHA set) rides the judged commit's
      # own CI run behind the all-green job: the gate requires the input
      # to be this run's commit and reads the verdict through the
      # publisher's bounded poll (the Checks API can trail the gate job
      # by a moment). A
      # dispatch waits out the race with the tip's CI run, then gates
      # hard - except on the SCHEDULED heal, where a red tip falls back
      # to the newest green commit behind it (itself vouched by the same
      # predicate; the bounded walk's exhaustion still halts). The
      # resolved sha is this step's output, and every later checkout
      # pins to it.
      - name: Require a green commit
        id: gate
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_SHA: ${{ inputs.sha }}
        run: bun .github/scripts/fleet/require_green_commit.ts

      # The scheduled fallback path re-checks THIS job out at the
      # resolved green commit before anything reads the tree: the
      # selection scripts, the registry, and later the apply job's layer
      # files must all come from the one revision CI vouched for - tip
      # scripts reading green-commit data would be an unvouched hybrid
      # no CI run ever saw. Toolchain and dependencies are re-pinned
      # from that commit for the same reason. The residual this cannot
      # reach: the workflow FILE itself (this orchestration, its step
      # conditions, the settings action's pin) always executes from the
      # tip - a scheduled run loads the default branch's workflow - so a
      # broken-but-parseable workflow edit still steers a fallback run.
      # CI gating every workflow change is the counterweight, the same
      # trade the build channel documents.
      - name: Check out the resolved green commit
        if: steps.gate.outputs.fallback == 'true'
        uses: actions/checkout@v7
        with:
          ref: ${{ steps.gate.outputs.sha }}

      - uses: oven-sh/setup-bun@v2
        if: steps.gate.outputs.fallback == 'true'
        with:
          bun-version-file: .bun-version

      - name: Reinstall dependencies at the resolved commit
        if: steps.gate.outputs.fallback == 'true'
        run: bun install --frozen-lockfile

      # One matrix entry per target repo. Probes retry and then
      # warn-and-skip a repo they cannot answer for; only
      # selection-infrastructure failures (unreadable registry, failed
      # discovery) fail this job.
      # ONLY_REPO carries only the workflow_call scope ("all", or public
      # text off a main commit; empty on cron and dispatch runs). The
      # typed dispatch input never rides here: it may be a private slug,
      # and the runner prints step env values into this public log - the
      # script reads it from the event payload instead.
      - name: Select settings targets
        id: targets
        env:
          GH_TOKEN: ${{ secrets.REPO_PLATFORM_TOKEN }}
          PAT: ${{ secrets.REPO_PLATFORM_TOKEN }}
          OWNER: ${{ github.repository_owner }}
          ONLY_REPO: ${{ inputs.repos }}
          # The judged commit a refused called scope names; empty
          # on cron and dispatch runs like ONLY_REPO.
          SOURCE_SHA: ${{ inputs.sha }}
        run: bun .github/scripts/fleet/select_settings_repos.ts

  apply:
    needs: select
    # fromJSON on an empty list would create a matrix with no jobs, which
    # GitHub rejects; an empty fleet is a no-op, not a failure.
    if: needs.select.outputs.targets != '[]'
    strategy:
      # Independence between repos lives HERE: one repo's failed apply
      # stays a red job but never cancels or blocks its siblings. Within
      # a job everything stays strict - no continue-on-error, no
      # softened exit codes. (GitHub caps a matrix at 256 jobs; the
      # fleet is far smaller.)
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.select.outputs.targets) }}
    # matrix.repo is the redaction hint for a private target - the real
    # slug never enters the matrix or this job name; the resolve step
    # recovers it.
    name: apply (${{ matrix.repo }})
    # Job level so the deliver step's `if:` can read it - a step-level env
    # is invisible to another step's condition. Rendered as the string
    # "true"/"false", which is what the comparison below expects.
    env:
      HIDE_DETAILS: ${{ matrix.hide_details }}
      # Distinct from the template sync's report: failure_issue.ts matches
      # by exact title, so a shared one would let either workflow's green
      # run close the other's open report.
      SETTINGS_REPORT_TITLE: "[automated] repo-platform settings: private failure report"
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      # Pinned to the commit the select job's green gate vouched for: the
      # tip on called and dispatch runs (where it equals the trigger sha),
      # the newest green commit behind a red tip on the scheduled heal's
      # fallback path - scripts and layer files from one vouched revision.
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          ref: ${{ needs.select.outputs.sha }}

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: .bun-version

      # Before the resolve step: the resolver is a bun script and imports
      # the registry/redaction modules, which need the yaml dependency.
      - name: Install dependencies
        run: bun install --frozen-lockfile

      # Recovers the real slug for a redacted target and registers it with
      # the runner's masker before anything else prints; public rows pass
      # straight through.
      - name: Resolve the target repository
        id: resolve
        env:
          TARGET_INPUT: ${{ matrix.repo }}
          REDACT_NAME: ${{ matrix.redact_name }}
          VERIFY: ${{ matrix.verify }}
          GH_TOKEN: ${{ secrets.REPO_PLATFORM_TOKEN }}
          PAT: ${{ secrets.REPO_PLATFORM_TOKEN }}
        run: bun .github/scripts/fleet/resolve_private_repo.ts

      # The managed baseline for THIS repository's facts (module
      # selection, declared-or-live visibility, tracking-label answers),
      # then the repo's own settings.yml merged over it. Scratch filenames
      # are fixed and neutral - a redacted slug reaches the scripts only
      # through env (already masked). The operator repo itself has no
      # .repo-platform.yml to fetch; its facts come from its recorded
      # answers file in this checkout.
      # Both of these run BEFORE the settings action, so the action's own
      # private-repos redaction cannot cover what they print, and both
      # quote repo-owned content on their diagnostic paths. run_hidden.ts
      # is the boundary: it passes output through untouched for a public
      # target and captures it for a hide-details one, publishing only a
      # generic outcome. HIDE_DETAILS is independent of redact_name - a
      # private repo can disclose its NAME and still need its content
      # hidden.
      - name: Render the managed settings baseline
        id: render
        env:
          GH_TOKEN: ${{ secrets.REPO_PLATFORM_TOKEN }}
          TARGET: ${{ steps.resolve.outputs.repo }}
        run: |
          if [ "$TARGET" = "$GITHUB_REPOSITORY" ]; then
            bun .github/scripts/sync/run_hidden.ts "settings render" -- \
              bun .github/scripts/fleet/render_managed_settings.ts \
              --repo "$TARGET" --operator-answers .repo-platform-answers.yml \
              --out "$RUNNER_TEMP/managed-settings.yml"
          else
            bun .github/scripts/sync/run_hidden.ts "settings render" -- \
              bun .github/scripts/fleet/render_managed_settings.ts \
              --repo "$TARGET" --out "$RUNNER_TEMP/managed-settings.yml"
          fi

      - name: Merge the repository's settings.yml over the baseline
        id: merge
        # No baseline was written when the target turned settings off at
        # the pinned revision, so there is nothing to merge.
        if: steps.render.outputs.skipped == 'false'
        env:
          GH_TOKEN: ${{ secrets.REPO_PLATFORM_TOKEN }}
          TARGET: ${{ steps.resolve.outputs.repo }}
        run: |
          # The operator repository IS this checkout, so its layer is read
          # from disk - the render took its facts from the same working
          # tree, and fetching would reintroduce the race the pin removes.
          # Every other target is fetched, pinned to the commit the render
          # published.
          if [ "$TARGET" = "$GITHUB_REPOSITORY" ]; then
            bun .github/scripts/sync/run_hidden.ts "settings merge" -- \
              bun .github/scripts/fleet/merge_settings_layers.ts \
              --managed "$RUNNER_TEMP/managed-settings.yml" \
              --repo-file .github/settings.yml \
              --out "$RUNNER_TEMP/merged-settings.yml"
          else
            bun .github/scripts/sync/run_hidden.ts "settings merge" -- \
              bun .github/scripts/fleet/merge_settings_layers.ts \
              --managed "$RUNNER_TEMP/managed-settings.yml" \
              --repo-fetch "$TARGET" --repo-ref "${{ steps.render.outputs.ref }}" \
              --out "$RUNNER_TEMP/merged-settings.yml"
          fi

      # The opt-in was rechecked at the pinned commit, but the apply runs
      # later and the branch keeps moving. Re-resolving the head here
      # narrows that window to this step: if the target moved, the run
      # skips and the next one reads the new revision. It cannot CLOSE the
      # window - there is no compare-and-swap on "still opted in" - so
      # this is damage limitation, not a guarantee.
      # Behind the same hidden-capture boundary as the render and merge:
      # the moved warning quotes the current head sha and resolveTargetRef's
      # failure strings name the target's default BRANCH, none of which a
      # hide-details target's public log may carry. The pinned sha in this
      # step's env still echoes into the log header - an accepted, opaque
      # identifier (docs/private-repos.md), already printed by the merge
      # step's rendered command above.
      - name: Check the target has not moved
        id: freshness
        if: steps.render.outputs.skipped == 'false' && steps.merge.outputs.skipped == 'false'
        env:
          GH_TOKEN: ${{ secrets.REPO_PLATFORM_TOKEN }}
          TARGET: ${{ steps.resolve.outputs.repo }}
          PINNED: ${{ steps.render.outputs.ref }}
        run: |
          bun .github/scripts/sync/run_hidden.ts "settings freshness" -- \
            bun .github/scripts/fleet/check_target_fresh.ts

      # Outside the hidden capture on purpose: for a hide-details target
      # the capture swallows the merge step's SUCCESS output (its
      # not-onboarded warning) and the freshness step's moved warning
      # alike, so each of these skips would otherwise be a green job with
      # no signal at all. matrix.repo is the masked hint for a redacted
      # row, so this says WHICH target without saying anything about its
      # contents.
      - name: Report a skipped target
        if: >-
          steps.render.outputs.skipped == 'true' || steps.merge.outputs.skipped == 'true' ||
          steps.freshness.outputs.moved == 'true'
        run: |
          if [ "${{ steps.render.outputs.skipped }}" = "true" ]; then
            echo "::notice::settings apply skipped for ${{ matrix.repo }}: it carries no .repo-platform.yml at the revision this run read (it left management), so its settings are not managed here any more."
          elif [ "${{ steps.merge.outputs.skipped }}" = "true" ]; then
            echo "::notice::settings apply skipped for ${{ matrix.repo }}: it has no .github/settings.yml yet, so there is nothing to layer"\
              "over the fleet defaults. The settings starter seeds the file on its next template sync."
          else
            echo "::notice::settings apply skipped for ${{ matrix.repo }}: its default branch moved while this run was computing its settings, so the apply was skipped rather than applied from a stale snapshot. The next run reads the new revision."
          fi

      # Referenced-label invariant, FAIL-CLOSED side: the apply's
      # reconciliation DELETES every live label the merged document does
      # not declare (and renames away `new_name` sources), and removing
      # one the target's issue forms or workflows still reference breaks
      # them silently. Before the action runs, the preflight lists the
      # live labels, extracts the referenced ones (from this checkout for
      # the operator, from the target at the pinned ref otherwise - the
      # same fact-source split as the render), and fails THIS repo's apply
      # naming the label and its referencing file. The action's mode is
      # mirrored so a check_only run warns instead of failing (a check
      # deletes nothing, and a hard fail would cost the drift report).
      # Same gate as the apply itself: a moved target was never checked.
      # Behind the same hidden-capture boundary as the render and merge -
      # label names and file paths are target content.
      - name: Preflight labels the target still references
        id: labels
        if: steps.freshness.outputs.moved == 'false'
        env:
          GH_TOKEN: ${{ secrets.REPO_PLATFORM_TOKEN }}
          TARGET: ${{ steps.resolve.outputs.repo }}
          MODE: ${{ inputs.check_only && 'check' || 'apply' }}
        run: |
          if [ "$TARGET" = "$GITHUB_REPOSITORY" ]; then
            bun .github/scripts/sync/run_hidden.ts "settings labels" -- \
              bun .github/scripts/fleet/label_preflight.ts \
              --merged "$RUNNER_TEMP/merged-settings.yml" \
              --repo "$TARGET" --target-dir . --mode "$MODE"
          else
            bun .github/scripts/sync/run_hidden.ts "settings labels" -- \
              bun .github/scripts/fleet/label_preflight.ts \
              --merged "$RUNNER_TEMP/merged-settings.yml" \
              --repo "$TARGET" --ref "${{ steps.render.outputs.ref }}" --mode "$MODE"
          fi

      # Outside the hidden capture, like the skip notices above: for a
      # hide-details target the capture swallows the preflight's own
      # stood-down line, and a guard that silently stood down looks
      # exactly like one that checked and passed. The reason is one of the
      # script's fixed categories - value-free by construction.
      - name: Report a stood-down label preflight
        if: steps.labels.outputs.not_applicable == 'true'
        run: |
          echo "::notice::label preflight stood down for ${{ matrix.repo }}: ${{ steps.labels.outputs.reason }}"

      - name: Apply repository settings
        id: apply
        # Skipped for a target that has no settings.yml yet: the merge
        # step writes no document, because
        # applying the baseline alone would delete the repo's own labels.
        if: steps.freshness.outputs.moved == 'false'
        # Pinned to an immutable commit; bump to @v1 once the action cuts
        # its first release.
        uses: Vivswan/github-settings-as-code@ac83fb48219309e2249294ef37fb55310bd45fb3
        with:
          token: ${{ secrets.REPO_PLATFORM_TOKEN }}
          mode: ${{ inputs.check_only && 'check' || 'apply' }}
          # Single-repo mode, scoped by the resolved slug (already masked
          # when the row is redacted, so this with: line renders *** in
          # the log); the merged scratch document is the settings source.
          repository: ${{ steps.resolve.outputs.repo }}
          settings-file: ${{ runner.temp }}/merged-settings.yml
          private-repos: redact
          # A redacted target's failure/drift details cannot appear in
          # this public log; they land as a reused issue on the target
          # repo instead. Needs the PAT's Issues write.
          private-report: issue
          # Strict: a token that cannot reach a declared section fails
          # this repo's job (the action's default) - settings drift must
          # not hide behind a green run.
          on-missing-permission: fail

      # run_hidden.ts keeps a hide-details target's render/merge output out
      # of this public log, which means the detail only exists in
      # RUNNER_TEMP. Without this step it would die with the runner and
      # the operator would see an exit code and nothing else, breaking the
      # private-detail contract in docs/private-repos.md. TARGET comes
      # from the resolve step via GITHUB_ENV.
      - name: Deliver hidden failure diagnostics
        if: failure() && env.HIDE_DETAILS == 'true' && env.TARGET != ''
        env:
          GH_TOKEN: ${{ secrets.REPO_PLATFORM_TOKEN }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          REPORT_TITLE: ${{ env.SETTINGS_REPORT_TITLE }}
          REPORT_KIND: settings apply
        run: bun .github/scripts/sync/failure_issue.ts deliver

      # Without this the issue stays open after a recovered run, and the
      # template sync's own green run could close a report the settings
      # apply is still failing on - which is why the two carry different
      # titles. A green job is not enough on its own: a MOVED target means
      # this run never checked the settings, so an open report stays open
      # until a run actually applies. The two skips are terminal - the repo
      # opted out, or has no settings.yml to layer yet - so they resolve.
      - name: Resolve the settings failure report
        if: >-
          success() && env.HIDE_DETAILS == 'true' && env.TARGET != '' &&
          (steps.apply.outcome == 'success' || steps.render.outputs.skipped == 'true' ||
          steps.merge.outputs.skipped == 'true')
        env:
          GH_TOKEN: ${{ secrets.REPO_PLATFORM_TOKEN }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          REPORT_TITLE: ${{ env.SETTINGS_REPORT_TITLE }}
          REPORT_KIND: settings apply
        run: bun .github/scripts/sync/failure_issue.ts resolve
