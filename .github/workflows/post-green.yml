# The legs after the all-green gate (docs/all-green.md, "After the gate"; the trust model: docs/build-provenance.md).
# Inside a called run github.event_name is the CALLER's event, so `!= 'workflow_dispatch'` is what gates the call-only legs.
#
# Every leg holds three invariants:
#   state-shaped        -> a leg evicted while pending at its lane is covered by its evictor or healed by the next trigger
#   sha from the input  -> every leg reads the judged commit from `inputs.sha`, never from github.sha or a read of main
#   own green check     -> a leg that mutates shared state re-verifies the all-green check itself

name: Post Green

on:
  workflow_call:
    inputs:
      sha:
        description: >-
          The green main commit the calling run judged (github.sha there
          - same run, so it IS the judged commit) - the commit every leg
          here acts on.
        required: true
        type: string
      before:
        description: >-
          The push payload's `before` (all zeros for a branch-creating
          push): the read-directives leg's base when the mover reports
          none (the tag did not move, or did not exist before this run).
          Explicit like sha, and verified an ancestor of it.
        required: true
        type: string
    secrets:
      REPO_PLATFORM_TOKEN:
        description: The fleet PAT, passed through to the two writers this workflow calls.
        required: true
  # The self-heal: the scripts refuse any sha that is not green main history, so re-run that commit's CI first
  # when its all-green check is missing.
  workflow_dispatch:
    inputs:
      sha:
        description: >-
          The full 40-hex main commit to move the stable tag to; must carry
          a green all-green check.
        required: true
        type: string

permissions: {}

jobs:
  # move_stable.ts owns the tag's invariants and re-verifies the all-green check at the sha before the push:
  # defense in depth on the call, the sole gate on a dispatch.
  move-stable:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    # One mover lane, LITERAL on purpose: github.workflow inside a called workflow is the CALLER's name, which would
    # split the lane between called and dispatched runs. ci.yml's calling job holds no lane: a caller never holds what
    # its callee waits on.
    concurrency:
      group: stable-tag-move
      cancel-in-progress: false
    # contents: write is the token's tag push (the caller job in ci.yml
    # grants the same, a called job's ceiling).
    permissions:
      contents: write
      checks: read
    outputs:
      previous: ${{ steps.move.outputs.previous }}
    steps:
      # The default token stays persisted: it is the push credential.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Set up bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: .bun-version

      - name: Move the stable tag
        id: move
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_SHA: ${{ inputs.sha }}
        run: bun .github/scripts/post-green/move_stable.ts

  # Ordered behind the mover for its base, and run on every mover result: only this run is sure to read
  # this commit's fleet-sync label (fleet_sync_marker.ts; docs/all-green.md, "Opting a PR into an immediate fleet sync").
  read-directives:
    needs: [move-stable]
    if: github.event_name != 'workflow_dispatch' && !cancelled()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    outputs:
      armed: ${{ steps.directives.outputs.armed }}
      repos: ${{ steps.directives.outputs.repos }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.sha }}
          fetch-depth: 0

      - name: Set up bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: .bun-version

      - name: Install script dependencies
        run: bun install --frozen-lockfile --silent

      - name: Read the fleet-sync labels of the merges since the commit the tag named
        id: directives
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_SHA: ${{ inputs.sha }}
          BEFORE_SHA: ${{ needs.move-stable.outputs.previous || inputs.before }}
        run: bun .github/scripts/fleet/fleet_sync_marker.ts

  # Ordered behind the mover so the sync renders from the tag as this run's mover or a newer one left it (a red
  # mover skips the sync rather than ship the previous commit); judged by name, since the directives read runs on
  # every mover result.
  # This job holds the sync-repos lane the weekly cron also holds; the called run keys a per-run group instead.
  sync-fleet:
    needs: [move-stable, read-directives]
    if: >-
      !cancelled() &&
      needs.move-stable.result == 'success' &&
      needs.read-directives.outputs.armed == 'true'
    concurrency:
      group: sync-repos
      cancel-in-progress: false
    permissions:
      contents: read
      checks: read
    uses: ./.github/workflows/sync-repos.yml
    with:
      repos: ${{ needs.read-directives.outputs.repos }}
      sha: ${{ inputs.sha }}
    secrets:
      REPO_PLATFORM_TOKEN: ${{ secrets.REPO_PLATFORM_TOKEN }}

  # Every target on every called run: the apply is idempotent and reads each target's own state, so no diff decides it.
  # Ordered behind sync-fleet whatever its result, so a synced repo is applied after its sync; holds the lane the called run keys around.
  # Never cancelling: the lane orders by arrival, and an older commit's late run must wait and stand down in the selector
  # (fleet/newest_main.ts), not cancel the newer apply in flight.
  settings-fleet:
    needs: [sync-fleet]
    if: github.event_name != 'workflow_dispatch' && !cancelled()
    concurrency:
      group: settings-repos
      cancel-in-progress: false
    permissions:
      contents: read
      checks: read
    uses: ./.github/workflows/settings-repos.yml
    with:
      repos: all
      sha: ${{ inputs.sha }}
    secrets:
      REPO_PLATFORM_TOKEN: ${{ secrets.REPO_PLATFORM_TOKEN }}
