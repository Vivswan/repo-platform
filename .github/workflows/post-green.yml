# The post-green home (docs/build-provenance.md, docs/all-green.md). Two ways in:
# the workflow_call from ci.yml's post-green job runs every leg on the judged
# sha, and a workflow_dispatch runs the two delivery legs alone (publish-build
# and move-stable) on a green main sha.
#
# Invariants every leg must hold: STATE-shaped (a coalesced pending run is
# covered by its evictor or healed by the next trigger); the commit comes from
# the sha input, never re-derived from context; a leg that mutates shared state
# keeps its own green verification. Inside a called run github.event_name is
# the caller's event, so `!= 'workflow_dispatch'` gates the call-only legs.

name: Post Green

on:
  workflow_call:
    inputs:
      sha:
        description: >-
          The green main commit the calling run judged (github.sha there
          - same run, so it IS the judged commit) - the commit every leg
          here acts on.
        required: true
        type: string
      before:
        description: >-
          The push payload's `before` (all zeros for a branch-creating
          push): the read-directives leg's FALLBACK base, used only when
          the mover reports no base (the tag did not move, or did not exist
          before this run) and no build branch exists yet or its every stamp
          is sha itself (the first publish, landed by this run).
          Explicit like sha, and verified an ancestor of it.
        required: true
        type: string
    secrets:
      REPO_PLATFORM_TOKEN:
        description: >-
          PAT with workflow scope: the build branch carries
          .github/workflows/ files GITHUB_TOKEN may not push (the
          publish-build job's checkout).
        required: true
  # The self-heal: publish one green main commit by hand. publish.ts and
  # move_stable.ts each refuse anything that is not main history with a
  # completed successful all-green check at that exact sha (re-run that
  # commit's CI first when the check is missing - the all-green job posts it).
  workflow_dispatch:
    inputs:
      sha:
        description: >-
          The full 40-hex main commit to publish the build branch from and
          move the stable tag to; must carry a green all-green check.
        required: true
        type: string

permissions: {}

jobs:
  # The build-branch publisher, on both ways in (docs/build-provenance.md):
  # composes the tree from the sha's own script in this run and advances
  # refs/heads/build. On the call the caller releases this job needs-ordered
  # behind the all-green gate, and publish.ts still hard-verifies the check
  # at the source before any mutation (defense in depth there, the sole gate
  # on a dispatch). State-shaped: newest-green wins behind a staleness
  # preflight, the plain push is the compare-and-swap, and the residual is an
  # out-of-order eviction leaving the branch one push stale, never rolled back.
  publish-build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # THE single publisher lane: one repo-scoped group serializes every
    # writer of refs/heads/build, the called runs and the dispatched ones,
    # which are runs of DIFFERENT workflows. LITERAL on purpose: derived from
    # github.workflow, which inside a workflow_call'd workflow resolves to
    # the CALLER's name, it would silently split the lane. The calling job
    # in ci.yml holds NO lane, the deadlock law's other half: a caller must
    # never hold the resource its called workflow requires.
    concurrency:
      group: build-branches-publish
      cancel-in-progress: false
    permissions:
      contents: read
      checks: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          # The persisted push credential for publish.ts: a PAT with
          # workflow scope (see the secret's description; the branch
          # stays inert by construction - branch_tree.ts refuses shipped
          # workflows with any trigger beyond workflow_call).
          token: ${{ secrets.REPO_PLATFORM_TOKEN }}

      - name: Set up bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: .bun-version

      # SOURCE_SHA is the sha input on both ways in - the judged commit
      # on the call, the operator's commit on a dispatch - never a read of
      # origin/main: main can already have advanced to a newer, even red,
      # commit this run must not touch (that commit's own run publishes
      # it).
      - name: Publish the build branch
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          SOURCE_SHA: ${{ inputs.sha }}
        run: bun .github/scripts/build-branches/publish.ts

  # The stable tag mover, on both ways in (docs/build-provenance.md): moves
  # refs/tags/stable to the sha, beside the build branch until the fleet's
  # pins follow it. State-shaped like the publisher: newest-green wins behind
  # a staleness read of the tag, and the lease push is the compare-and-swap,
  # so a racing mover loses loudly with the tag untouched. move_stable.ts
  # re-verifies main history and the all-green check at the sha before the
  # push (defense in depth on the call, the sole gate on a dispatch). Its
  # previous output is the directives leg's base after a move.
  move-stable:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    # One mover lane, LITERAL for the reason the publisher lane states.
    concurrency:
      group: stable-tag-move
      cancel-in-progress: false
    # contents: write is the token's tag push (the caller job in ci.yml
    # grants the same, a called job's ceiling).
    permissions:
      contents: write
      checks: read
    outputs:
      previous: ${{ steps.move.outputs.previous }}
    steps:
      # The default token stays persisted: it is the push credential.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Set up bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: .bun-version

      - name: Move the stable tag
        id: move
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_SHA: ${{ inputs.sha }}
        run: bun .github/scripts/post-green/move_stable.ts

  # The merged PRs' opt-in to an immediate fleet sync, read off the merged
  # pull request of every commit since the last published build (the squash
  # commit carries the title alone; a direct push is read from its message:
  # fleet_sync_marker.ts) and handed to sync-fleet. State-shaped: mutates
  # nothing; the range covers the merges whose runs this run evicted. A bad directive fails the leg on the judged
  # commit only; an older one already failed its own run and warns here.
  # Ordered behind the mover for its base: the commit the tag named before
  # this run moved it, else the push's `before`. No mover result stands it
  # down: a newer run's range starts after ITS base, which can be this very
  # commit, so only this run is sure to read it; a mover that moved nothing
  # or went red leaves the read on the fallback base (a failed sync recovers).
  read-directives:
    needs: [move-stable]
    if: github.event_name != 'workflow_dispatch' && !cancelled()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    outputs:
      armed: ${{ steps.directives.outputs.armed }}
      repos: ${{ steps.directives.outputs.repos }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.sha }}
          fetch-depth: 0

      - name: Set up bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: .bun-version

      - name: Install script dependencies
        run: bun install --frozen-lockfile --silent

      - name: Read the directives blocks since the last published green main
        id: directives
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_SHA: ${{ inputs.sha }}
          BEFORE_SHA: ${{ needs.move-stable.outputs.previous || inputs.before }}
        run: bun .github/scripts/fleet/fleet_sync_marker.ts

  # The opted-in sync: sync-repos.yml called in this run, needs-ordered
  # behind the publish so the sync renders from the tip as the publish left
  # it (a red publish skips it rather than sync the previous build); the
  # publish and the opt-in are judged by name, so a red mover upstream of
  # the directives read does not swallow the sync. State-shaped: the called sync re-verifies the build's green source and
  # provenance itself, and a swallowed run leaves a repo one sync behind,
  # healed by the weekly cron. THIS job holds the fleet's single-writer lane
  # (the literal sync-repos.yml's cron and dispatch runs hold at workflow
  # level) while the called run takes a per-run group: the deadlock law above.
  sync-fleet:
    needs: [publish-build, read-directives]
    if: >-
      !cancelled() &&
      needs.publish-build.result == 'success' &&
      needs.read-directives.outputs.armed == 'true'
    concurrency:
      group: sync-repos
      cancel-in-progress: false
    permissions:
      contents: read
      checks: read
    uses: ./.github/workflows/sync-repos.yml
    with:
      repos: ${{ needs.read-directives.outputs.repos }}
      sha: ${{ inputs.sha }}
    secrets:
      REPO_PLATFORM_TOKEN: ${{ secrets.REPO_PLATFORM_TOKEN }}

  # Every target on EVERY called run: the apply is idempotent and reads each target's own state,
  # so no diff decides it. Ordered behind sync-fleet whatever its result, so a synced repo is
  # applied after its sync. Holds the settings-repos lane the called run keys around (deadlock law).
  settings-fleet:
    needs: [sync-fleet]
    if: github.event_name != 'workflow_dispatch' && !cancelled()
    concurrency:
      group: settings-repos
      cancel-in-progress: false
    permissions:
      contents: read
      checks: read
    uses: ./.github/workflows/settings-repos.yml
    with:
      repos: all
      sha: ${{ inputs.sha }}
    secrets:
      REPO_PLATFORM_TOKEN: ${{ secrets.REPO_PLATFORM_TOKEN }}
