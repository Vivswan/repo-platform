# Everything that runs AFTER the all-green gate passed on a push to main
# - the post-green home. Two ways in, both explicit about the commit they
# act on: workflow_call from ci.yml's post-green job (the sole caller;
# the sha input is the judged commit) runs every leg, and a
# workflow_dispatch naming a green main commit by hand runs the
# publish-build leg alone - the self-heal for a publish that went
# missing after its gate passed (a failed or evicted post-green run) or
# a stamp that needs recovery. Nothing here carries a trigger of its own
# beyond those two: the gate is the one green authority on the call, and
# publish.ts's own hard-verify (main history, completed successful
# all-green at the sha) is the whole gate on a dispatch.
#
# EVERY leg added here must be STATE-shaped: idempotent, and able to
# leave the world no worse than one trigger behind. GitHub keeps at most
# one running plus one pending run per concurrency group and replaces the
# pending one (latest wins, independent of cancel-in-progress), so a
# superseded pending leg never executes - its work must either be covered
# by the run that evicted it, or be a staleness the leg's next trigger
# (or a manual dispatch) repairs. Each job below states why it
# qualifies; a leg that CANNOT tolerate a swallowed pending run does not
# belong in a coalescing lane.
#
# A workflow_call'd workflow executes at the caller's ref with the
# caller's event context; the sha input keeps the judged commit explicit
# instead of re-deriving it from that context, so a future caller cannot
# silently hand a leg the wrong commit. The same context rule gates the
# call-only legs: inside a called run github.event_name is the CALLER's
# event (push, per ci.yml's post-green condition), so
# `github.event_name != 'workflow_dispatch'` is exactly "not the
# dispatch", and a dispatch runs publish-build alone.
#
# The caller is needs-ordered behind the all-green job in the SAME run,
# so a leg's own green verification is defense in depth rather than the
# sole authority - but a leg that MUTATES shared state keeps one anyway
# (publish.ts hard-verifies the all-green check run via
# shared/all_green.ts): the caller's gate guards entry, not the world the
# leg reads at run time.

name: Post Green

on:
  workflow_call:
    inputs:
      sha:
        description: >-
          The green main commit the calling run judged (github.sha there
          - same run, so it IS the judged commit) - the commit every leg
          here acts on.
        required: true
        type: string
      before:
        description: >-
          The push payload's `before` (all zeros for a branch-creating
          push): the settings-inputs leg's FALLBACK base, used only when
          no build branch exists yet or its every stamp is sha itself
          (the first publish, landed by this run). Explicit like sha, and
          verified an ancestor of it.
        required: true
        type: string
    secrets:
      REPO_PLATFORM_TOKEN:
        description: >-
          PAT with workflow scope: the build branch carries
          .github/workflows/ files GITHUB_TOKEN may not push (the
          publish-build job's checkout).
        required: true
  # The self-heal: publish one green main commit by hand. publish.ts
  # refuses anything that is not main history with a completed
  # successful all-green check at that exact sha (re-run that commit's
  # CI first when the check is missing - the all-green job posts it).
  workflow_dispatch:
    inputs:
      sha:
        description: >-
          The full 40-hex main commit to publish the build branch from;
          must carry a green all-green check.
        required: true
        type: string

permissions: {}

jobs:
  # The build-branch publisher, on both ways in: composes the tree from
  # the sha's own script and sources in this run and advances
  # refs/heads/build. On the call the caller releases this job
  # needs-ordered behind the all-green gate, and publish.ts still
  # hard-verifies the all-green check run at the source commit before
  # any mutation (defense in depth there, the sole gate on a dispatch).
  #
  # State-shaped: publish.ts publishes SOURCE_SHA behind a
  # newest-green-wins staleness preflight against the branch tip's stamp,
  # onto an append-only branch whose plain push doubles as the
  # compare-and-swap - a rerun of an already-published source is a no-op
  # (unchanged tree, no commit), and a superseded pending publish is
  # covered by the evicting run whenever its source is newer (the common
  # case: same-run gating means publishes arrive in push order). The
  # residual is an OUT-OF-ORDER eviction - a re-run of an older commit's
  # CI replacing a pending newer publish - which leaves the branch stale
  # by one push, never rolled back; the next push heals it, or a dispatch
  # with the newer commit's sha, and the sync's freshness check
  # (sync/wait_for_build.ts) is what notices a stale build meanwhile.
  publish-build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # THE single publisher lane: one repo-scoped group serializes every
    # writer of refs/heads/build - the called runs and the dispatched
    # ones, which are runs of DIFFERENT workflows (the caller's and this
    # one). LITERAL on purpose: never derive this group from
    # github.workflow, which inside a workflow_call'd workflow resolves to
    # the CALLER's workflow name and would silently split the lane. The
    # calling job in ci.yml holds NO lane at all, for the deadlock law's
    # other half: a caller must never hold the resource its called
    # workflow requires, or the call deadlocks against itself.
    concurrency:
      group: build-branches-publish
      cancel-in-progress: false
    permissions:
      contents: read
      checks: read
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          # The persisted push credential for publish.ts: a PAT with
          # workflow scope (see the secret's description; the branch
          # stays inert by construction - branch_tree.ts refuses shipped
          # workflows with any trigger beyond workflow_call).
          token: ${{ secrets.REPO_PLATFORM_TOKEN }}

      - name: Set up bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: .bun-version

      # SOURCE_SHA is the sha input on both ways in - the judged commit
      # on the call, the operator's commit on a dispatch - never a read of
      # origin/main: main can already have advanced to a newer, even red,
      # commit this run must not touch (that commit's own run publishes
      # it).
      - name: Publish the build branch
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          SOURCE_SHA: ${{ inputs.sha }}
        run: bun .github/scripts/build-branches/publish.ts

  # The merged PR's opt-in to an immediate fleet sync: reads the judged
  # commit's directives block (fleet_sync_marker.ts's header has the
  # grammar) and hands the scope to sync-fleet. State-shaped trivially -
  # it mutates nothing. A malformed or misplaced directive fails this
  # leg: loud, so a mistyped opt-in never degrades silently into "wait
  # for Tuesday".
  read-directives:
    if: github.event_name != 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      armed: ${{ steps.directives.outputs.armed }}
      repos: ${{ steps.directives.outputs.repos }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.sha }}

      - name: Set up bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: .bun-version

      - name: Install script dependencies
        run: bun install --frozen-lockfile --silent

      - name: Read the directives block
        id: directives
        env:
          SOURCE_SHA: ${{ inputs.sha }}
        run: bun .github/scripts/fleet/fleet_sync_marker.ts

  # The opted-in sync: sync-repos.yml called in this run, needs-ordered
  # behind the publish so wait_for_build's fast path finds the fresh tip
  # (a red publish skips it - a sync then would wait out the freshness
  # budget and ship the previous build). State-shaped: each target's
  # automation branch is regenerated under a lease, and the called sync
  # re-verifies the build's green source and provenance itself; a
  # swallowed run leaves a repo one sync behind, which the weekly cron
  # heals. THIS job holds the fleet's single-writer lane: the same
  # literal sync-repos.yml's cron and dispatch runs hold at workflow
  # level, while a called run takes a per-run group there, so the called
  # workflow never waits on the lane its caller holds (the deadlock law
  # above).
  sync-fleet:
    needs: [publish-build, read-directives]
    if: needs.read-directives.outputs.armed == 'true'
    concurrency:
      group: sync-repos
      cancel-in-progress: false
    permissions:
      contents: read
      checks: read
    uses: ./.github/workflows/sync-repos.yml
    with:
      repos: ${{ needs.read-directives.outputs.repos }}
      sha: ${{ inputs.sha }}
    secrets:
      REPO_PLATFORM_TOKEN: ${{ secrets.REPO_PLATFORM_TOKEN }}

  # Did a settings input change? The diff base is the newest earlier build stamp; `before` is
  # only the first-publish fallback (fleet/settings_inputs_changed.ts; docs/all-green.md).
  settings-inputs:
    if: github.event_name != 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      changed: ${{ steps.inputs.outputs.changed }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.sha }}
          fetch-depth: 0

      - name: Set up bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: .bun-version

      - name: Install script dependencies
        run: bun install --frozen-lockfile --silent

      - name: Diff for settings inputs since the last published green main
        id: inputs
        env:
          SOURCE_SHA: ${{ inputs.sha }}
          BEFORE_SHA: ${{ inputs.before }}
        run: bun .github/scripts/fleet/settings_inputs_changed.ts

  # The fleet-wide settings apply, called once per run when an input changed OR the sync ran: a red
  # diff never blocks or widens a completed sync's apply. Holds the settings-repos lane while the
  # called run keys a per-run group (the deadlock law above). Model: docs/all-green.md.
  settings-fleet:
    needs: [settings-inputs, read-directives, sync-fleet]
    if: >-
      !cancelled() &&
      ((needs.settings-inputs.result == 'success' && needs.settings-inputs.outputs.changed == 'true') ||
      needs.sync-fleet.result == 'success' || needs.sync-fleet.result == 'failure')
    concurrency:
      group: settings-repos
      cancel-in-progress: false
    permissions:
      contents: read
      checks: read
    uses: ./.github/workflows/settings-repos.yml
    with:
      repos: ${{ needs.settings-inputs.result == 'success' && needs.settings-inputs.outputs.changed == 'true' && 'all' || needs.read-directives.outputs.repos }}
      sha: ${{ inputs.sha }}
    secrets:
      REPO_PLATFORM_TOKEN: ${{ secrets.REPO_PLATFORM_TOKEN }}
