# Cuts releases via release-please: merging to main accumulates conventional
# commits into a release PR. GitHub releases are immutable once published
# (the tag and assets freeze), so release-please-config.json carries
# `draft` + `force-tag-creation`: merging the release PR creates a DRAFT
# release with its vX.Y.Z tag already forced at the merge SHA, and ci.yml's
# publish-release job flips it live. Publishing fires build-branches, which
# tags templates/vX.Y.Z and rebuilds the latest channel sync-repos pushes to
# managed repos.
#
# Called by ci.yml's release-please job, downstream of the all-green gate, so
# releases and release-PR refreshes only happen on a green main.
#
# With REPO_PLATFORM_TOKEN (the fleet PAT stored here) the release PR
# triggers CI normally; with the default GITHUB_TOKEN it needs a
# close/reopen to run checks.

name: Release Please

on:
  workflow_call:
    outputs:
      release_created:
        description: "'true' when this run just cut a release"
        value: ${{ jobs.release-please.outputs.release_created }}
      tag_name:
        description: The tag of the release that was just cut (a draft-flow config forces the tag at creation, so it is checkout-able before publication)
        value: ${{ jobs.release-please.outputs.tag_name }}

# The effective token comes from the calling job; declaring the needs here
# documents them and caps a caller that grants more. The read keys feed the
# release-health pre-flight (open issues, Dependabot alerts).
permissions:
  contents: write
  pull-requests: write
  issues: read
  vulnerability-alerts: read

jobs:
  release-please:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
    steps:
      # A green run releases only the head it tested: if main moved on, skip
      # and let the newer push's own run release (after its CI passes).
      # gh api (not anonymous ls-remote) so private repositories work too.
      - name: Check this run tested the current head
        id: head
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          head="$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq .object.sha)"
          if [ "$head" = "$GITHUB_SHA" ]; then
            echo "current=true" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::main moved to ${head:0:7} since this run started; the newer run releases"
            echo "current=false" >> "$GITHUB_OUTPUT"
          fi
      # Authoritative release gating: the release PR's release-health CI job
      # gives early visible feedback, but it can be stale by merge time, so
      # the same action runs again here before release-please acts. In
      # release mode the gate self-scopes to release-cut pushes (a push
      # merging a release-please-- PR, whose release-override label it
      # reads) and passes trivially on every other run. Checkout because
      # this repository dogfoods the action from its own tree; downstream
      # repos use the remote pin and need none (a recorded divergence in
      # scripts/check_ssot.ts).
      - uses: actions/checkout@v7
      - uses: ./actions/release-health
        if: steps.head.outputs.current == 'true'
        with:
          mode: release
        env:
          GH_TOKEN: ${{ github.token }}
      # release-please silently ABORTS - green - when any merged release PR
      # still wears "autorelease: pending" ("untagged, merged release PRs
      # outstanding"): release PRs stop being proposed with no red anywhere.
      # Gate the action on that state being clean. A fresh merge is exempt
      # (its label is legitimately pending until the pipeline tags or
      # publishes it, which can happen in a parallel job), so only a
      # pending label older than 30 minutes fails.
      - name: Fail when a stale pending release PR parks release-please
        if: steps.head.outputs.current == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          cutoff="$(date -u -d '30 minutes ago' +%Y-%m-%dT%H:%M:%SZ)"
          stale="$(gh pr list --state merged --label 'autorelease: pending' \
            --json number,mergedAt \
            --jq "[.[] | select(.mergedAt < \"$cutoff\") | .number] | join(\", \")")"
          if [ -n "$stale" ]; then
            echo "::error::merged release PR(s) #$stale have worn 'autorelease: pending' for over 30 minutes, so release-please refuses to propose any new release ('untagged, merged release PRs outstanding'). Finish or abandon that release, then move the label to 'autorelease: tagged'."
            exit 1
          fi
      - uses: googleapis/release-please-action@v5
        id: release
        if: steps.head.outputs.current == 'true'
        with:
          token: ${{ secrets.REPO_PLATFORM_TOKEN || github.token }}
