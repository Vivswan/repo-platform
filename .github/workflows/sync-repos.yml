# Push sync fan-out: resolves which managed repos to sync (repos.yml
# registry x live discovery) and runs reusable-template-sync.yml against
# each one, in parallel. Managed repos carry no sync workflow and no
# sync secret; their update PRs are pushed from here with the
# REPO_PLATFORM_TOKEN PAT.
#
# The `sync-repos` concurrency group makes this the single automated
# writer of every target's automation branch: legs fan out in parallel,
# but each writes to a different repo, so the per-branch single-writer
# guarantee holds; the sync's lease-guarded force-push regenerates that
# branch each run. GitHub keeps only ONE pending run per group and
# cancels the rest ("a higher priority waiting request exists"), so
# multi-repo work belongs in a single run - repo=all covers a
# fleet-wide recover=recopy, and repo takes a comma list. The weekly cron
# is the catch-all: repos pick up main merges through it, and it heals
# any sync run that was missed. A merged PR opts into an immediate sync
# with a [fleet-sync] directive (fleet_sync_marker.ts): post-green.yml's
# sync-fleet leg then CALLS this workflow in the merge's own CI run.

name: Sync Repos

on:
  schedule:
    - cron: "50 8 * * 2"
  workflow_dispatch:
    inputs:
      repo:
        description: >-
          owner/name to sync, a comma-separated list of them, or the
          literal "all" - same as leaving it empty, every managed repo
          (recovery requires an explicit value)
        required: false
        type: string
      recover:
        description: >-
          Recovery mode - "recopy" regenerates the repo with a full
          re-render (no three-way merge) when its recorded _commit base
          is unusable. Requires an explicit repo scope (owner/name, or
          "all" to recover the whole fleet); the PRs stay manual-review.
        required: false
        type: choice
        options: [none, recopy]
        default: none
      manual:
        description: >-
          Never arm auto-merge - every PR this run delivers waits for
          human review, clean updates included
        required: false
        type: boolean
        default: false
  # The opt-in path: post-green.yml's sync-fleet leg calls this workflow
  # from the merge's CI run. Named `repos`, not `repo`, on purpose - the
  # dispatch input may be a private slug and never rides in step env,
  # while this value is text off a public main commit and is passed as
  # ONLY_REPO below. The dispatch-only inputs are unset here, so recover
  # and manual keep their defaults.
  workflow_call:
    inputs:
      repos:
        description: >-
          "all", or a comma-separated list of owner/name slugs
        required: true
        type: string
      sha:
        description: >-
          The judged main commit whose build the sync waits for (its
          publish precedes this call in the same run) - never main's
          live HEAD, which a later merge queued behind this run may
          already have moved
        required: true
        type: string
    secrets:
      REPO_PLATFORM_TOKEN:
        required: true

permissions:
  contents: read

# Cron and dispatch runs hold the sync-repos lane. A CALLED run takes a
# per-run group instead: its caller (post-green.yml's sync-fleet job)
# already holds sync-repos, and a called workflow must never wait on the
# lane its caller holds (the deadlock law in post-green.yml's header).
concurrency:
  group: ${{ inputs.repos != '' && format('sync-repos-called-{0}', github.run_id) || 'sync-repos' }}
  cancel-in-progress: false

jobs:
  plan:
    runs-on: ubuntu-latest
    # Must outlive wait_for_build.ts's own 40-minute warn-and-continue
    # budget (a full main CI run - the tree is pre-built DURING it - plus
    # the post-CI promotion) with slack for the other steps - a job-level
    # kill would turn the script's designed graceful degradation into a
    # red sync.
    timeout-minutes: 55
    permissions:
      contents: read
    outputs:
      repos: ${{ steps.select.outputs.repos }}
    steps:
      # A missing token is a misconfiguration of this repo: fail loudly. A
      # deliberately NARROWED token still works - see the reusable sync's
      # adaptive handling of missing scopes.
      - name: Require the fleet token
        env:
          PAT: ${{ secrets.REPO_PLATFORM_TOKEN }}
        run: |
          if [ -z "$PAT" ]; then
            echo "::error::push sync cannot run: the REPO_PLATFORM_TOKEN secret is not set, and the default GITHUB_TOKEN cannot write to other repos. Create a fine-grained PAT with the permissions pre-selected at https://github.com/settings/personal-access-tokens/new?name=REPO_PLATFORM_TOKEN&description=repo-platform+fleet%3A+push+sync+and+central+settings&contents=write&pull_requests=write&workflows=write&administration=write&issues=write scoped to the managed repos, then store it with 'gh secret set REPO_PLATFORM_TOKEN' in this repo."
            exit 1
          fi

      # Fast-fail twin of select_sync_repos.ts's recovery scope guard
      # (that script's header states the full contract; its copy is the
      # tested backstop). Presence-only on purpose: the repo value may be
      # a private slug, and step env values print into this public log.
      - name: Require an explicit repo scope for recovery
        if: inputs.recover == 'recopy'
        env:
          REPO_SET: ${{ inputs.repo != '' }}
        run: |
          if [ "$REPO_SET" != "true" ]; then
            echo "::error::recover=recopy needs an explicit scope: dispatch it with repo=<owner/name> to recover one repository, or repo=all to fan the recovery out across every managed repo."
            exit 1
          fi

      - uses: actions/checkout@v7

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: .bun-version

      - name: Install script dependencies
        run: bun install --frozen-lockfile --silent

      # The wait logic lives in a script (its header states the contract):
      # the bounded wait warns-and-continues on timeout because the sync's
      # own guards fail loudly and the cron heals. The build branch is
      # published asynchronously (each main push parks a pending tree;
      # ci.yml's post-green job promotes it - composing as the
      # fallback - once the verdict lands green, and in normal operation
      # commits only on a content change); a sync dispatched right after
      # a merge could consume the previous build tree. Wait (bounded)
      # for freshness, two-path: the build tip's SOURCE STAMP names the
      # target (main's live HEAD, or the judged commit on a called run),
      # or the tree composed from the target right here (once, before
      # the poll) matches the tip byte-for-byte - publish.ts commits only
      # on content change, so an unchanged tree is proven fresh by
      # computation, not trusted. Git plus a local compose; no token.
      - name: Wait for a fresh build
        env:
          # Empty on cron and dispatch runs (live main HEAD); the judged
          # commit on a called run.
          TARGET_SHA: ${{ inputs.sha }}
        run: bun .github/scripts/sync/wait_for_build.ts

      # Snapshots the owner's writable fleet to $RUNNER_TEMP/discovered.json
      # for the select step; the script's header states the contract
      # (pre-filter vs probe, fail-closed visibility for redaction).
      - name: Discover repos
        env:
          GH_TOKEN: ${{ secrets.REPO_PLATFORM_TOKEN }}
        run: bun .github/scripts/fleet/discover_repos.ts

      # ONLY_REPO carries only the workflow_call scope (public text off a
      # main commit; empty on cron and dispatch runs). The typed dispatch
      # input never rides here: it may be a private slug, and the runner
      # prints step env values into this public log - the script reads it
      # from the event payload instead. The script also re-runs the
      # recovery scope guard fast-failed above.
      - name: Select repos and check adoption
        id: select
        env:
          GH_TOKEN: ${{ secrets.REPO_PLATFORM_TOKEN }}
          PAT: ${{ secrets.REPO_PLATFORM_TOKEN }}
          ONLY_REPO: ${{ inputs.repos }}
          # Scheduled runs have no inputs context: empty is
          # fine, only the literal "recopy" means recovery.
          RECOVER: ${{ inputs.recover }}
        run: bun .github/scripts/fleet/select_sync_repos.ts

  sync:
    needs: plan
    if: needs.plan.outputs.repos != '[]'
    # Checks read flows to the called workflow's token: its green-source
    # gate reads the all-green verdict check runs at the build tip's
    # stamped source (shared/all_green.ts). Provenance itself is
    # API-free: verify_build_provenance.ts is git plus a local rebuild.
    permissions:
      contents: read
      checks: read
    strategy:
      fail-fast: false
      # Every leg writes with the same PAT, and PR creation is
      # content-creating (secondary rate limits): bound the wildcard-grown
      # fleet's burst. Costs a single-repo dispatch nothing.
      max-parallel: 5
      matrix:
        include: ${{ fromJSON(needs.plan.outputs.repos) }}
    # matrix.repo is the redaction hint for a private repo - the real slug
    # must never reach this job name or the called workflow's auto-printed
    # inputs; the leg resolves it from matrix.verify.
    name: sync (${{ matrix.repo }})
    uses: ./.github/workflows/reusable-template-sync.yml
    with:
      target_repo: ${{ matrix.repo }}
      target_redact_name: ${{ matrix.redact_name }}
      target_hide_details: ${{ matrix.hide_details }}
      target_verify: ${{ matrix.verify }}
      # The dispatch default is the literal "none"; only "recopy" means
      # recovery downstream.
      recover: ${{ inputs.recover == 'recopy' && 'recopy' || '' }}
      # Scheduled runs have no inputs context: default false.
      force_manual: ${{ inputs.manual || false }}
    secrets:
      REPO_PLATFORM_TOKEN: ${{ secrets.REPO_PLATFORM_TOKEN }}
