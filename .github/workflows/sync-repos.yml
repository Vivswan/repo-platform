# The push-only sync operator (docs/sync.md, "The operator"): the public log carries the operator's vocabulary and
# nothing else, so a row's steps write their detail to $RUNNER_TEMP files or to the target repository itself.
# GitHub keeps ONE pending run per concurrency group, so multi-repo work belongs in a single run (repo=all, or a comma list).

name: Sync Repos

on:
  schedule:
    - cron: "50 8 * * 2"
  workflow_dispatch:
    inputs:
      repo:
        description: >-
          owner/name to sync, a comma-separated list of them, the visibility tokens public and private,
          modules:<a>+<b> (every managed repo whose .repo-platform.yml selects ALL the listed modules;
          a visibility token intersects with it, a slug adds as typed), or the
          literal "all" - same as leaving it empty, every managed repo
        required: false
        type: string
      manual:
        description: >-
          Never arm auto-merge - every PR this run delivers waits for
          human review, clean updates included
        required: false
        type: boolean
        default: false
  # Named `repos`, not `repo`, on purpose: the dispatch input may be a private slug and never rides in step env,
  # while this value is public text off merged PRs and is passed as ONLY_REPO below.
  workflow_call:
    inputs:
      repos:
        description: >-
          "all", or a comma-separated list of owner/name slugs and the
          visibility tokens public and private (fleet/sync_scope.ts); a
          private repo may appear only under its token here, and the
          dispatch-only modules: filter never does
        required: true
        type: string
      sha:
        description: >-
          The judged main commit (its publish precedes this call in the
          same run) - never main's live HEAD, which a later merge queued
          behind this run may already have moved; a private-slug
          refusal of the called scope names it (fleet/sync_scope.ts)
        required: true
        type: string
    secrets:
      REPO_PLATFORM_TOKEN:
        required: true

permissions:
  contents: read

# A CALLED run takes a per-run group: its caller (post-green.yml's sync-fleet job) already holds sync-repos,
# and a called workflow must never wait on the lane its caller holds.
concurrency:
  group: ${{ inputs.repos != '' && format('sync-repos-called-{0}', github.run_id) || 'sync-repos' }}
  cancel-in-progress: false

jobs:
  plan:
    runs-on: ubuntu-latest
    # The provenance rebuild plus the probe bounds at ten adopted repos:
    # discovery 2 x 120 s, selection's two 300 s stages, 10 x 2 x 120 s.
    timeout-minutes: 60
    # Checks read: the green gate reads the all-green verdict at the build
    # tip's stamped source (shared/all_green.ts).
    permissions:
      contents: read
      checks: read
    outputs:
      build: ${{ steps.build.outputs.build }}
      count: ${{ steps.plan.outputs.count }}
      indexes: ${{ steps.plan.outputs.indexes }}
    steps:
      - name: Require the fleet token
        env:
          PAT: ${{ secrets.REPO_PLATFORM_TOKEN }}
        run: |
          if [ -z "$PAT" ]; then
            echo "::error::push sync cannot run: the REPO_PLATFORM_TOKEN secret is not set, and the default GITHUB_TOKEN cannot write to other"\
              "repos. Create a fine-grained PAT with the permissions pre-selected at"\
              "https://github.com/settings/personal-access-tokens/new?name=REPO_PLATFORM_TOKEN&description=repo-platform+fleet%3A+push+sync+and+central+settings&contents=write&pull_requests=write&workflows=write&administration=write&issues=write"\
              "scoped to the managed repos, then store it with 'gh secret set REPO_PLATFORM_TOKEN' in this repo."
            exit 1
          fi

      # Full history: the provenance check walks main for the build's
      # stamped source and rebuilds the tree from that commit.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: .bun-version

      - name: Install script dependencies
        run: bun install --frozen-lockfile --silent

      # Once for the whole run: every row checks out exactly this commit.
      - name: Resolve the build
        id: build
        env:
          GH_TOKEN: ${{ github.token }}
        run: bun .github/scripts/sync/resolve_build.ts

      - name: Discover repos
        env:
          GH_TOKEN: ${{ secrets.REPO_PLATFORM_TOKEN }}
        run: bun .github/scripts/fleet/discover_repos.ts

      # The dispatch input never rides in step env (the runner prints env values into this public log);
      # the script reads it from the event payload instead.
      - name: Select repos and check adoption
        id: select
        env:
          GH_TOKEN: ${{ secrets.REPO_PLATFORM_TOKEN }}
          PAT: ${{ secrets.REPO_PLATFORM_TOKEN }}
          OWNER: ${{ github.repository_owner }}
          ONLY_REPO: ${{ inputs.repos }}
          TARGET_SHA: ${{ inputs.sha }}
        run: bun .github/scripts/fleet/select_sync_repos.ts

      - name: Print the plan
        id: plan
        run: bun .github/scripts/sync/verdict.ts plan

  # One job per row index; the job name never carries a repository name.
  # The target checkout and the writer continue on error so deliver.ts can
  # file the failure in the target; the job is red only before that point.
  sync:
    needs: plan
    if: needs.plan.outputs.count != '0'
    permissions:
      contents: read
    strategy:
      fail-fast: false
      # Every row writes with the same PAT, and PR creation is
      # content-creating (secondary rate limits): bound the fleet's burst.
      max-parallel: 5
      matrix:
        row: ${{ fromJSON(needs.plan.outputs.indexes) }}
    name: sync (row ${{ matrix.row }})
    runs-on: ubuntu-latest
    # At least the budget row_budget.ts sums from the steps' bounds (the
    # operator-verdict-only rule judges it): every bound a step can hit
    # before deliver.ts files a failure counts, since a row the runner kills
    # at its timeout files nothing.
    timeout-minutes: 105
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: .bun-version

      - name: Install script dependencies
        run: bun install --frozen-lockfile --silent > "$RUNNER_TEMP/install.log" 2>&1

      - name: Check out the build
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.plan.outputs.build }}
          path: build

      # The plan, recomputed: the same discovery and selection the plan job
      # ran, so row indexes mean the same repositories.
      - name: Discover repos
        env:
          GH_TOKEN: ${{ secrets.REPO_PLATFORM_TOKEN }}
        run: bun .github/scripts/fleet/discover_repos.ts > "$RUNNER_TEMP/discover.log" 2>&1

      - name: Select repos and check adoption
        id: select
        env:
          GH_TOKEN: ${{ secrets.REPO_PLATFORM_TOKEN }}
          PAT: ${{ secrets.REPO_PLATFORM_TOKEN }}
          OWNER: ${{ github.repository_owner }}
          ONLY_REPO: ${{ inputs.repos }}
          TARGET_SHA: ${{ inputs.sha }}
        run: bun .github/scripts/fleet/select_sync_repos.ts > "$RUNNER_TEMP/select.log" 2>&1

      # The only step that sees the name in the clear: resolve_row.ts masks the target before anything else prints.
      - name: Resolve the row's target
        id: target
        env:
          ROW: ${{ matrix.row }}
          PLANNED: ${{ needs.plan.outputs.count }}
        run: bun .github/scripts/sync/resolve_row.ts

      # A captured clone, not actions/checkout: git quotes target file text
      # in some diagnostics, and the checkout action echoes them.
      - name: Check out the target
        id: checkout
        continue-on-error: true
        env:
          PAT: ${{ secrets.REPO_PLATFORM_TOKEN }}
        run: bun .github/scripts/sync/checkout_target.ts > "$RUNNER_TEMP/checkout-stdio.log" 2>&1

      # The one writer step (docs/sync.md): its report is the PR body, its
      # summary the hold decision; a failure is delivered as an issue.
      - name: Write the build into the target
        id: write
        continue-on-error: true
        # The writer's bound: its git calls are local to the clone, so the
        # row budget counts this step by its timeout.
        timeout-minutes: 10
        env:
          BUILD: ${{ needs.plan.outputs.build }}
        run: >-
          bun .github/scripts/sync/writer/sync.ts --files build/files.yml --tree build/files --target target
          --build "$BUILD" --repository "$TARGET" --private "$TARGET_PRIVATE"
          --summary "$RUNNER_TEMP/summary.json" > "$RUNNER_TEMP/sync.log" 2>&1

      - name: Deliver to the target
        if: always() && env.TARGET != ''
        env:
          GH_TOKEN: ${{ secrets.REPO_PLATFORM_TOKEN }}
          PAT: ${{ secrets.REPO_PLATFORM_TOKEN }}
          BUILD: ${{ needs.plan.outputs.build }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          MANUAL: ${{ inputs.manual || false }}
          CHECKOUT_OUTCOME: ${{ steps.checkout.outcome }}
          WRITER_OUTCOME: ${{ steps.write.outcome }}
        run: bun .github/scripts/sync/deliver.ts > "$RUNNER_TEMP/deliver-stdio.log" 2>&1

      - name: Print the verdict
        if: always()
        env:
          ROW: ${{ matrix.row }}
        run: bun .github/scripts/sync/verdict.ts row
