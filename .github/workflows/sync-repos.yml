# Push sync fan-out: resolves which managed repos to sync (repos.yml
# registry x live discovery) and runs reusable-template-sync.yml against
# each one, in parallel. Managed repos carry no sync workflow and no
# sync secret; their update PRs are pushed from here with the
# REPO_PLATFORM_TOKEN PAT.
#
# The `sync-repos` concurrency group makes this the single automated
# writer of every target's automation branch: legs fan out in parallel,
# but each writes to a different repo, so the per-branch single-writer
# guarantee holds; the sync's lease-guarded force-push regenerates that
# branch each run. GitHub keeps only ONE pending run per group and
# cancels the rest ("a higher priority waiting request exists"), so
# multi-repo work belongs in a single run - repo=all covers a
# fleet-wide recover=recopy; a batch of distinct per-repo dispatches
# must still run serially, waiting for each run to finish before the
# next. The weekly cron is the catch-all: staging-channel
# repos pick up main merges through it, and it heals any release whose
# sync run was missed.

name: Sync Repos

on:
  release:
    types: [published]
  schedule:
    - cron: "50 8 * * 2"
  workflow_dispatch:
    inputs:
      version:
        description: Release tag to sync latest-channel repos to (defaults to newest release)
        required: false
        type: string
      repo:
        description: >-
          Single owner/name to sync, or the literal "all" - same as
          leaving it empty, every managed repo (recovery requires one of
          the two)
        required: false
        type: string
      recover:
        description: >-
          Recovery mode - "recopy" regenerates the repo with a full
          re-render (no three-way merge) when its recorded _commit base
          is unusable. Requires an explicit repo scope (owner/name, or
          "all" to recover the whole fleet); the PRs stay manual-review.
        required: false
        type: choice
        options: [none, recopy]
        default: none
      manual:
        description: >-
          Never arm auto-merge - every PR this run delivers waits for
          human review, clean updates included
        required: false
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: sync-repos
  cancel-in-progress: false

jobs:
  plan:
    # A prerelease must not roll the latest channel (and staging repos are
    # covered by the weekly cron); skipping here skips the dependent sync
    # fan-out too. A stable release published on an older tag still runs -
    # the version resolve below pins it to the newest stable release.
    if: github.event_name != 'release' || !github.event.release.prerelease
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      actions: read
    outputs:
      repos: ${{ steps.select.outputs.repos }}
      version: ${{ steps.version.outputs.version }}
    steps:
      # A missing token is a misconfiguration of this repo: fail loudly. A
      # deliberately NARROWED token still works - see the reusable sync's
      # adaptive handling of missing scopes.
      - name: Require the fleet token
        env:
          PAT: ${{ secrets.REPO_PLATFORM_TOKEN }}
        run: |
          if [ -z "$PAT" ]; then
            echo "::error::push sync cannot run: the REPO_PLATFORM_TOKEN secret is not set, and the default GITHUB_TOKEN cannot write to other repos. Create a fine-grained PAT with the permissions pre-selected at https://github.com/settings/personal-access-tokens/new?name=REPO_PLATFORM_TOKEN&description=repo-platform+fleet%3A+push+sync+and+central+settings&contents=write&pull_requests=write&workflows=write&administration=write&issues=write scoped to the managed repos, then store it with 'gh secret set REPO_PLATFORM_TOKEN' in this repo."
            exit 1
          fi

      # Fast-fail twin of select_sync_repos.ts's recovery scope guard
      # (that script's header states the full contract; its copy is the
      # tested backstop). Presence-only on purpose: the repo value may be
      # a private slug, and step env values print into this public log.
      - name: Require an explicit repo scope for recovery
        if: inputs.recover == 'recopy'
        env:
          REPO_SET: ${{ inputs.repo != '' }}
        run: |
          if [ "$REPO_SET" != "true" ]; then
            echo "::error::recover=recopy needs an explicit scope: dispatch it with repo=<owner/name> to recover one repository, or repo=all to fan the recovery out across every managed repo."
            exit 1
          fi

      - uses: actions/checkout@v7

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: .bun-version

      - name: Install script dependencies
        run: bun install --frozen-lockfile --silent

      - name: Resolve target version
        id: version
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
          REQUESTED: ${{ inputs.version }}
        run: |
          if [ -n "$REQUESTED" ]; then
            version="$REQUESTED"
          elif ! version="$(gh api "repos/${GITHUB_REPOSITORY}/releases/latest" --jq .tag_name 2>/tmp/gh-latest-err)"; then
            # Only HTTP 404 means no release exists (fine for a staging-only
            # fleet; a latest-channel sync leg fails with its own actionable
            # error). Anything else is an API failure that must not read as
            # "no release yet" - that would sync latest-channel repos to
            # nothing (or a notice-only stale version) while staying green.
            if grep -q "HTTP 404" /tmp/gh-latest-err; then
              version=""
              echo "No release yet; syncing without a version."
            else
              echo "::error::reading ${GITHUB_REPOSITORY}'s latest release failed - an API failure, not a missing release; re-run the sync."
              cat /tmp/gh-latest-err
              exit 1
            fi
          fi
          # The release event's tag is never trusted as the sync target: a
          # release published on an older tag must not roll the latest
          # channel backwards, so releases/latest above is the ground truth
          # and a differing event tag only gets a notice.
          if [ -n "$RELEASE_TAG" ] && [ "$RELEASE_TAG" != "$version" ]; then
            echo "::notice::published release ${RELEASE_TAG} is not the newest stable release (${version:-none exists}); latest-channel repos sync to the newest stable release instead."
          fi
          echo "version=${version}"
          echo "version=${version}" >> "$GITHUB_OUTPUT"

      # build-branches also triggers on release:published, with no ordering
      # between the two runs; latest-channel syncs need the templates/v* tag
      # it creates. Wait for it (bounded) - on timeout, sync anyway: the
      # sync's own guard fails with a clear message and the cron heals.
      - name: Wait for the templates build tag
        if: steps.version.outputs.version != ''
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          tag="templates/${VERSION}"
          for _ in $(seq 1 30); do
            if git ls-remote --exit-code origin "refs/tags/${tag}" >/dev/null 2>&1; then
              echo "${tag} exists."
              exit 0
            fi
            echo "waiting for ${tag}..."
            sleep 10
          done
          echo "::warning::${tag} is still missing after 5 minutes because Build Branches has not finished (or did not trigger). Syncing anyway - latest-channel legs will fail with a clear error until the tag exists. If it stays missing, dispatch the Build Branches workflow manually."

      # Build Branches rebuilds staging asynchronously after each main
      # merge; a sync dispatched right after a merge could consume the
      # previous staging tree. Wait (bounded) for a successful push- or
      # schedule-event run at main's HEAD - the run kinds that always
      # rebuild staging, so either proves it (a no-op rebuild creates no
      # staging commit to wait for; a manual dispatch may rebuild only
      # latest, so it proves nothing).
      - name: Wait for a fresh staging build
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          main_sha="$(git ls-remote origin HEAD | cut -f1)"
          for _ in $(seq 1 30); do
            built="$(gh api "repos/${GITHUB_REPOSITORY}/actions/workflows/build-branches.yml/runs?status=success&per_page=30" \
              --jq '.workflow_runs[] | select(.event == "push" or .event == "schedule") | .head_sha' 2>/dev/null || true)"
            if grep -qx "$main_sha" <<<"$built"; then
              echo "staging is built from main HEAD ${main_sha}."
              exit 0
            fi
            echo "waiting for a successful Build Branches push or schedule run at ${main_sha}..."
            sleep 10
          done
          echo "::warning::no successful Build Branches push- or schedule-event run found for main HEAD ${main_sha} after 5 minutes; staging-channel syncs may apply the previous staging tree. The weekly cron heals this on its next run."

      # user/repos with the PAT sees every public repo (fine-grained PATs
      # always read public resources) and its permissions field reflects
      # the USER, not the token - so this only pre-filters to owned,
      # non-archived, user-writable repos; the TOKEN's actual grant is
      # probed per repo in the next step. --paginate emits concatenated
      # page arrays, so --slurp + add makes one array first. Visibility
      # rides along, fail-closed (anything but private: false is treated
      # as private): the selector redacts private repos from this public
      # run's logs and matrix (docs/private-repos.md).
      - name: Discover repos
        env:
          GH_TOKEN: ${{ secrets.REPO_PLATFORM_TOKEN }}
        run: |
          # The implicit runner shell has no pipefail; without it a gh api
          # failure would vanish into jq's success.
          set -o pipefail
          login="$(gh api user --jq .login)"
          gh api user/repos --paginate --slurp \
            | jq -c --arg login "$login" \
                '[add[] | select((.archived | not) and .owner.login == $login and .permissions.push) | {repo: .full_name, private: (.private != false)}]' \
            > "$RUNNER_TEMP/discovered.json"
          echo "discovered $(jq 'length' "$RUNNER_TEMP/discovered.json") writable repos for ${login}"

      # No ONLY_REPO env on purpose: the typed dispatch input may be a
      # private slug, and the runner prints step env values into this
      # public log - the script reads it from the event payload instead.
      # The script also re-runs the recovery scope guard fast-failed above.
      - name: Select repos and check adoption
        id: select
        env:
          GH_TOKEN: ${{ secrets.REPO_PLATFORM_TOKEN }}
          PAT: ${{ secrets.REPO_PLATFORM_TOKEN }}
          # Scheduled and release runs have no inputs context: empty is
          # fine, only the literal "recopy" means recovery.
          RECOVER: ${{ inputs.recover }}
        run: bun .github/scripts/fleet/select_sync_repos.ts

  sync:
    needs: plan
    if: needs.plan.outputs.repos != '[]'
    # Actions read flows to the called workflow's token: its build
    # provenance check reads the build run stamped on the shipped ref
    # (staging tip or templates/vX.Y.Z tag).
    permissions:
      contents: read
      actions: read
    strategy:
      fail-fast: false
      # Every leg writes with the same PAT, and PR creation is
      # content-creating (secondary rate limits): bound the wildcard-grown
      # fleet's burst. Costs a single-repo dispatch nothing.
      max-parallel: 5
      matrix:
        include: ${{ fromJSON(needs.plan.outputs.repos) }}
    # matrix.repo is the redaction hint for a private repo - the real slug
    # must never reach this job name or the called workflow's auto-printed
    # inputs; the leg resolves it from matrix.verify.
    name: sync (${{ matrix.repo }})
    uses: ./.github/workflows/reusable-template-sync.yml
    with:
      target_repo: ${{ matrix.repo }}
      target_redact_name: ${{ matrix.redact_name }}
      target_hide_details: ${{ matrix.hide_details }}
      target_verify: ${{ matrix.verify }}
      version: ${{ needs.plan.outputs.version }}
      channel: ${{ matrix.channel }}
      # The dispatch default is the literal "none"; only "recopy" means
      # recovery downstream.
      recover: ${{ inputs.recover == 'recopy' && 'recopy' || '' }}
      # Scheduled and release runs have no inputs context: default false.
      force_manual: ${{ inputs.manual || false }}
    secrets:
      REPO_PLATFORM_TOKEN: ${{ secrets.REPO_PLATFORM_TOKEN }}
