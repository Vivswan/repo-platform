# Publishes the draft release fleet-release.yml cut, attested when the repository is public and the draft has assets.
#
# The draft is found by its id, so the update-release hook may rename its tag; every later step names the tag the draft
# wears by then.
#
# Attestation needs a public repository, so a non-public release publishes unattested.
#
# The gates are step-level on purpose: whether the draft has assets is only knowable at run time.

name: Fleet Release Publish

on:
  workflow_call:
    inputs:
      release-id:
        description: The draft release's id, as fleet-release.yml reported it.
        required: false
        type: string
        default: ""
      # Read only while a repository's ci.yml still sends the cut's tag and no id, as one the sync has not replaced yet
      # does: the job's first step reads the id from it.
      tag:
        description: The draft release's tag, as fleet-release.yml reported it.
        required: false
        type: string
        default: ""

jobs:
  publish-release:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
      id-token: write
      attestations: write
    env:
      GH_REPO: ${{ github.repository }}
      # The attest action's own bundle file name.
      BUNDLE_NAME: attestation.json
    steps:
      - name: Read the draft's id from the tag
        id: by-tag
        if: inputs.release-id == ''
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag }}
        run: gh release view "$TAG" --json databaseId --jq '"id=\(.databaseId)"' >> "$GITHUB_OUTPUT"
      # A stale bundle from a prior attempt is deleted from the RELEASE, so
      # no later skip path can publish it.
      - uses: $/actions/release-assets
        id: assets
        with:
          release-id: ${{ inputs.release-id || steps.by-tag.outputs.id }}
          bundle-name: ${{ env.BUNDLE_NAME }}
        env:
          GH_TOKEN: ${{ github.token }}
      - name: Download the assets for attestation
        id: download
        if: >-
          steps.assets.outputs.present == 'true'
          && github.event.repository.visibility == 'public'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.assets.outputs.tag }}
        run: |
          mkdir assets
          gh release download "$TAG" --dir assets
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        id: attest
        if: steps.download.outcome == 'success'
        with:
          subject-path: assets/*
      # bundle-path is empty when download/attest skipped: a no-asset or
      # non-public release publishes without a bundle.
      - name: Attach the attestation bundle to the draft
        if: steps.attest.outputs.bundle-path != ''
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.assets.outputs.tag }}
          BUNDLE: ${{ steps.attest.outputs.bundle-path }}
        run: |
          cp "$BUNDLE" "$BUNDLE_NAME"
          gh release upload "$TAG" "$BUNDLE_NAME" --clobber
      - name: Publish the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.assets.outputs.tag }}
        run: gh release edit "$TAG" --draft=false
