# Reusable auto-assign. Callers trigger on issues/pull_request; the caller's
# event context flows through. A workflow_dispatch with an `issue` input
# assigns that one issue (or PR - PRs are issues), for items whose creation
# event fired no workflow. A schedule run, or a dispatch with the input left
# empty, is a sweep instead: every open unassigned issue and PR gets the same
# CODEOWNERS assignment. The sweep runs on the repo's own token, so it also
# picks up bot-authored PRs whose event runs got a read-only GITHUB_TOKEN
# (Dependabot's) - a feature, not a bug. Code scanning alert assignment
# lives in reusable-auto-assign-alerts.yml: a reusable-workflow call is
# statically validated against the permissions of every job in the called
# file regardless of each job's `if:`, so keeping the alert job out of this
# file is what lets callers grant security-events only to that call.
#
# Who gets assigned: the users on the last `*` entry of the repo's own
# CODEOWNERS (teams cannot be assignees), falling back to the repo owner.
# Each repo controls its policy by editing CODEOWNERS.
#
# The job declares the minimum permissions it needs. A called job can only
# downgrade the caller's token, so every scope below must also appear on the
# calling job in the caller template - adding a scope here breaks callers
# that have not synced the matching caller update yet.
#
# This runs in CALLER repos, where repo-platform's scripts do not exist:
# every step stays inline.

name: Reusable Auto Assign

on:
  workflow_call:
    inputs:
      issue:
        description: Issue or PR number to assign (dispatch only; empty means sweep)
        required: false
        type: string
        default: ""

jobs:
  assign:
    # Dependabot PR runs get a read-only GITHUB_TOKEN; the write calls below
    # would fail, so skip them (the nightly sweep assigns those PRs with the
    # repo's own token instead).
    if: >-
      ((github.event_name == 'issues' || github.event_name == 'pull_request') &&
      github.actor != 'dependabot[bot]') ||
      github.event_name == 'workflow_dispatch' ||
      github.event_name == 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read # CODEOWNERS resolution
      issues: write
      pull-requests: write # PR events, and a dispatched number may be a PR
    steps:
      - name: Resolve assignees from CODEOWNERS
        id: who
        uses: actions/github-script@v9
        with:
          script: |
            // Users on the last `*` entry of CODEOWNERS; the repo owner when
            // there is no usable entry or no file.
            async function resolveAssignees() {
              for (const path of ['.github/CODEOWNERS', 'CODEOWNERS', 'docs/CODEOWNERS']) {
                let data;
                try {
                  ({ data } = await github.rest.repos.getContent({
                    owner: context.repo.owner,
                    repo: context.repo.repo,
                    path,
                  }));
                } catch (error) {
                  if (error.status === 404) continue;
                  throw error;
                }
                const text = Buffer.from(data.content, 'base64').toString('utf8');
                let owners = null;
                for (const line of text.split('\n')) {
                  const entry = line.trim();
                  if (!entry || entry.startsWith('#')) continue;
                  const [pattern, ...rest] = entry.split(/\s+/);
                  if (pattern === '*') owners = rest; // last * entry wins
                }
                const users = (owners ?? [])
                  .filter((o) => /^@[A-Za-z0-9-]+$/.test(o))
                  .map((o) => o.slice(1));
                if (users.length) return users;
                break;
              }
              return [context.repo.owner];
            }
            core.setOutput('assignees', JSON.stringify(await resolveAssignees()));

      - name: Assign issue to code owners
        if: github.event_name == 'issues'
        env:
          ASSIGNEES: ${{ steps.who.outputs.assignees }}
        uses: actions/github-script@v9
        with:
          script: |
            await github.rest.issues.addAssignees({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              assignees: JSON.parse(process.env.ASSIGNEES)
            });

      - name: Assign PR to code owners
        if: github.event_name == 'pull_request' && github.event.action == 'opened' && github.event.pull_request.head.repo.full_name == github.repository
        env:
          ASSIGNEES: ${{ steps.who.outputs.assignees }}
        uses: actions/github-script@v9
        with:
          script: |
            await github.rest.issues.addAssignees({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.payload.pull_request.number,
              assignees: JSON.parse(process.env.ASSIGNEES)
            });

      # CODEOWNERS auto-requests reviews on protected-branch PRs, but not on
      # every PR (and never when this workflow itself didn't fire). Request
      # the resolved code owners as reviewers too; GitHub rejects a
      # self-review request with 422, so the PR author is dropped.
      - name: Request review from code owners
        if: github.event_name == 'pull_request' && github.event.action == 'opened' && github.event.pull_request.head.repo.full_name == github.repository
        env:
          ASSIGNEES: ${{ steps.who.outputs.assignees }}
        uses: actions/github-script@v9
        with:
          script: |
            const author = context.payload.pull_request.user.login.toLowerCase();
            const reviewers = JSON.parse(process.env.ASSIGNEES)
              .filter((user) => user.toLowerCase() !== author);
            if (reviewers.length === 0) return;
            await github.rest.pulls.requestReviewers({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: context.payload.pull_request.number,
              reviewers
            });

      # A dispatch with a number assigns that one issue or PR per the
      # CODEOWNERS policy. GitHub fires no workflow for events created with a
      # workflow's own GITHUB_TOKEN, so an issue or PR created by another
      # workflow never triggers the paths above; the creating workflow
      # dispatches this one with the number instead. Only the named item is
      # touched, so unassigning yourself later sticks. A schedule run, or a
      # dispatch with the input left empty, sweeps instead: every open issue
      # and PR still unassigned (filtered server-side; the issues list API
      # covers PRs too) gets the same assignment, page-bounded so a
      # pathological backlog cannot run away - the nightly cadence drains
      # the remainder.
      - name: Assign the dispatched item, or sweep open unassigned items
        if: github.event_name == 'workflow_dispatch' || github.event_name == 'schedule'
        uses: actions/github-script@v9
        env:
          ISSUE: ${{ inputs.issue }}
          ASSIGNEES: ${{ steps.who.outputs.assignees }}
        with:
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const raw = process.env.ISSUE ?? "";
            let numbers;
            if (raw === "") {
              numbers = [];
              for (let page = 1; page <= 10; page++) {
                const { data } = await github.rest.issues.listForRepo({
                  owner, repo, state: 'open', assignee: 'none', per_page: 100, page,
                });
                numbers.push(...data.map((item) => item.number));
                if (data.length < 100) break;
              }
            } else {
              if (!/^\d+$/.test(raw) || !Number.isSafeInteger(Number(raw)) || Number(raw) <= 0) {
                core.setFailed(`issue input is not a positive integer: ${raw}`);
                return;
              }
              numbers = [Number(raw)];
            }
            const assignees = JSON.parse(process.env.ASSIGNEES);
            for (const issueNumber of numbers) {
              await github.rest.issues.addAssignees({
                owner,
                repo,
                issue_number: issueNumber,
                assignees
              });
              core.info(`assigned #${issueNumber} to ${assignees.join(', ')}`);
            }
            core.info(`assigned ${numbers.length} item(s)`);
