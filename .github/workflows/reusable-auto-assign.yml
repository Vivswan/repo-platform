# A called job can only downgrade the caller's token: adding a scope here breaks every caller not yet synced with it.
# This runs in the CALLER's repository, where repo-platform's scripts do not exist, so the steps are gh commands.

name: Reusable Auto Assign

on:
  workflow_call:
    inputs:
      issue:
        description: Issue or PR number to assign (dispatch only; empty means sweep)
        required: false
        type: string
        default: ""

jobs:
  assign:
    # Dependabot PR runs get a read-only GITHUB_TOKEN, so the write below would fail; the nightly sweep assigns those PRs with the repo's own token.
    if: >-
      ((github.event_name == 'issues' || github.event_name == 'pull_request') &&
      github.actor != 'dependabot[bot]') ||
      github.event_name == 'workflow_dispatch' ||
      github.event_name == 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      issues: write # issue events, and the sweep assigns issues and PRs alike
      pull-requests: write # PR events, and a dispatched number may be a PR
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      ASSIGNEE: ${{ github.repository_owner }}
    steps:
      # The issues REST route covers PRs too, so one call serves an issue, a PR, and a dispatched number of either kind.
      # A fork PR's token is read-only, so only same-repository PRs are assigned on open.
      - name: Assign the opened or dispatched item to the repository owner
        if: >-
          github.event_name == 'issues' ||
          (github.event_name == 'pull_request' && github.event.action == 'opened' &&
          github.event.pull_request.head.repo.full_name == github.repository) ||
          (github.event_name == 'workflow_dispatch' && inputs.issue != '')
        env:
          NUMBER: ${{ github.event.issue.number || github.event.pull_request.number || inputs.issue }}
        run: gh api -X POST "repos/$GH_REPO/issues/$NUMBER/assignees" -f "assignees[]=$ASSIGNEE"

      # GitHub fires no workflow for an issue or PR created with a workflow's own GITHUB_TOKEN, so the schedule sweeps every open unassigned one.
      # Filtered client-side: a listing filtered on assignee shrinks as the sweep assigns, so its later pages would shift and skip items.
      - name: Sweep open unassigned issues and PRs to the repository owner
        if: github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.issue == '')
        shell: bash # pipefail, so a failed listing fails the step instead of sweeping nothing
        run: >-
          gh api --paginate "repos/$GH_REPO/issues?state=open&per_page=100" --jq '.[] | select(.assignees == []) | .number' |
          xargs -r -I{} gh api -X POST "repos/$GH_REPO/issues/{}/assignees" -f "assignees[]=$ASSIGNEE"
