# Split from reusable-auto-assign.yml: a reusable-workflow call is validated against the permissions of EVERY job in
# the called file, `if:` or not, so only the caller job for this file has to grant security-events: write.
# A called job can only downgrade the caller's token: adding a scope here breaks every caller not yet synced with it.

name: Reusable Auto Assign Alerts

on:
  workflow_call: {}

jobs:
  # Only default-branch pushes and scheduled re-scans produce new alerts, so other workflow_run deliveries are
  # filtered out; code scanning exists on public repositories alone (or GHAS), hence the visibility clause.
  assign-code-scanning:
    if: >-
      github.event.repository.private == false &&
      (github.event_name != 'workflow_run' ||
        (github.event.workflow_run.conclusion == 'success' &&
          ((github.event.workflow_run.event == 'push' &&
            github.event.workflow_run.head_branch == github.event.repository.default_branch) ||
            github.event.workflow_run.event == 'schedule')))
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read # CODEOWNERS resolution
      security-events: write
    steps:
      - name: Assign open alerts to code owners
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            // Teams cannot be assignees, so only @user entries on the last `*` line count; the repo owner otherwise.
            async function resolveAssignees() {
              for (const path of ['.github/CODEOWNERS', 'CODEOWNERS', 'docs/CODEOWNERS']) {
                let data;
                try {
                  ({ data } = await github.rest.repos.getContent({
                    owner: context.repo.owner,
                    repo: context.repo.repo,
                    path,
                  }));
                } catch (error) {
                  if (error.status === 404) continue;
                  throw error;
                }
                const text = Buffer.from(data.content, 'base64').toString('utf8');
                let owners = null;
                for (const line of text.split('\n')) {
                  const entry = line.trim();
                  if (!entry || entry.startsWith('#')) continue;
                  const [pattern, ...rest] = entry.split(/\s+/);
                  if (pattern === '*') owners = rest; // last * entry wins
                }
                const users = (owners ?? [])
                  .filter((o) => /^@[A-Za-z0-9-]+$/.test(o))
                  .map((o) => o.slice(1));
                if (users.length) return users;
                break;
              }
              return [context.repo.owner];
            }
            const assignees = await resolveAssignees();
            const alerts = await github.paginate(
              github.rest.codeScanning.listAlertsForRepo,
              { owner, repo, state: 'open', per_page: 100 }
            );
            let assigned = 0;
            for (const alert of alerts) {
              if (alert.assignees && alert.assignees.length > 0) continue;
              await github.request(
                'PATCH /repos/{owner}/{repo}/code-scanning/alerts/{alert_number}',
                { owner, repo, alert_number: alert.number, assignees }
              );
              core.info(`assigned alert #${alert.number} to ${assignees.join(', ')}`);
              assigned++;
            }
            core.info(`assigned ${assigned} of ${alerts.length} open alert(s)`);
