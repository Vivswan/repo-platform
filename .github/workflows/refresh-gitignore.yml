# The only place that fetches github/gitignore: nothing pins upstream and no CI job verifies the outputs,
# so the PR's diff IS the upstream change.

name: Refresh gitignore

on:
  schedule:
    - cron: "31 10 * * 1"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

# Schedule and dispatch both force-push the same PR branch; queue runs,
# never cancel one mid-push.
concurrency:
  group: refresh-gitignore
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.repository.default_branch }}
          token: ${{ secrets.REPO_PLATFORM_TOKEN || github.token }}

      - name: Set up bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: .bun-version

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Regenerate from upstream HEAD
        run: bun scripts/generate/build_gitignore.ts

      - name: Detect changes
        id: changes
        # `git diff --quiet` ignores UNTRACKED files: without the add, a brand-new block file would read as no-change
        # and never land. open_automation_pr.ts stages everything itself, so this staging is only the probe's.
        run: |
          git add -A
          if git diff --cached --quiet; then
            echo "gitignore outputs are up to date."
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      # An open refresh PR on a no-change run is stale (main already has these outputs: upstream moved back, or another
      # PR landed them) and would propose stale content forever; the next real change recreates branch and PR
      # (open_automation_pr.ts force-pushes the same name).
      - name: Find a stale refresh PR on no change
        id: stale
        if: steps.changes.outputs.changed == 'false'
        env:
          GH_TOKEN: ${{ secrets.REPO_PLATFORM_TOKEN || github.token }}
          BRANCH: automation/gitignore-refresh
        run: |
          pr="$(gh pr list --head "$BRANCH" --state open --json number --jq '.[0].number // empty')"
          echo "pr=$pr" >> "$GITHUB_OUTPUT"

      - name: Explain why the stale PR is closed
        if: steps.stale.outputs.pr != ''
        uses: marocchino/sticky-pull-request-comment@5770ad5eb8f42dd2c4f34da00c94c5381e49af88 # v3.0.5
        with:
          GITHUB_TOKEN: ${{ secrets.REPO_PLATFORM_TOKEN || github.token }}
          header: repo-platform/refresh-gitignore
          number: ${{ steps.stale.outputs.pr }}
          message: >-
            The latest refresh run produces no change against main, so this PR's content is stale; closing.
            The next run with a real change reopens it.

      - name: Close the stale refresh PR
        if: steps.stale.outputs.pr != ''
        env:
          GH_TOKEN: ${{ secrets.REPO_PLATFORM_TOKEN || github.token }}
          PR: ${{ steps.stale.outputs.pr }}
        run: gh pr close "$PR" --delete-branch

      # Nothing generated records the upstream SHA, so the commit subject
      # and PR body are fixed text - what moved is the diff itself.
      - name: Commit, push, and open PR
        if: steps.changes.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ secrets.REPO_PLATFORM_TOKEN || github.token }}
          BASE_BRANCH: ${{ github.event.repository.default_branch }}
          BRANCH: automation/gitignore-refresh
          PR_TITLE: "chore: refresh gitignore outputs from github/gitignore"
          COMMIT_MESSAGE: "chore: refresh gitignore outputs from github/gitignore"
          PR_BODY: "Automated regeneration of the gitignore outputs (`files/base/.gitignore`, the per-module
            block files, this repo's own `.gitignore`) from
            [github/gitignore](https://github.com/github/gitignore)'s current HEAD. The diff
            is the upstream change to the sections we consume. Merging this moves the stable tag once green; the next
            sync pushes it to the fleet."
        run: bun .github/scripts/shared/open_automation_pr.ts
