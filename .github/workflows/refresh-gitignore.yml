# Weekly: regenerate the gitignore outputs (base skeleton, toolchain
# fragments, this repo's own .gitignore) from github/gitignore's current HEAD
# and open a PR when upstream changed anything we consume. This workflow is
# the only place that fetches upstream: nothing is pinned and no CI job
# verifies the outputs, so the diff below IS the upstream change.
# Merging the PR reaches the build branch automatically via build-branches.

name: Refresh gitignore

on:
  schedule:
    - cron: "31 10 * * 1"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

# Schedule and dispatch both force-push the same PR branch; queue runs,
# never cancel one mid-push.
concurrency:
  group: refresh-gitignore
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          # Base the refresh on the default branch regardless of trigger ref.
          ref: ${{ github.event.repository.default_branch }}
          token: ${{ secrets.REPO_PLATFORM_TOKEN || github.token }}

      - name: Set up bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: .bun-version

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Regenerate from upstream HEAD
        run: bun scripts/build_gitignore.ts

      - name: Detect changes
        id: changes
        # add -A first: `git diff --quiet` ignores UNTRACKED files, so a
        # brand-new fragment (a module newly declaring gitignore_sources)
        # would read as no-change and never land - and this workflow is
        # the generator's only caller. open_automation_pr.ts re-adds
        # everything itself, so the staging here is only the probe's.
        run: |
          git add -A
          if git diff --cached --quiet; then
            echo "gitignore templates are up to date."
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      # A no-change run with an OPEN refresh PR means upstream moved back
      # (or the outputs caught up some other way) since that PR was cut:
      # its branch keeps proposing stale content forever. Close it and
      # delete the rolling branch - the next real change recreates both
      # (open_automation_pr.ts force-pushes the same branch name).
      - name: Close a stale refresh PR on no change
        if: steps.changes.outputs.changed == 'false'
        env:
          GH_TOKEN: ${{ secrets.REPO_PLATFORM_TOKEN || github.token }}
          BRANCH: automation/gitignore-refresh
        run: |
          pr="$(gh pr list --head "$BRANCH" --state open --json number --jq '.[0].number // empty')"
          if [ -n "$pr" ]; then
            gh pr close "$pr" --delete-branch --comment \
              "The latest refresh run produces no change against main, so this PR's content is stale; closing. The next run with a real change reopens it."
          fi

      # Nothing generated records the upstream SHA, so the commit subject
      # and PR body are fixed text - what moved is the diff itself.
      - name: Commit, push, and open PR
        if: steps.changes.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ secrets.REPO_PLATFORM_TOKEN || github.token }}
          BASE_BRANCH: ${{ github.event.repository.default_branch }}
          BRANCH: automation/gitignore-refresh
          PR_TITLE: "chore: refresh gitignore templates from github/gitignore"
          COMMIT_MESSAGE: "chore: refresh gitignore templates from github/gitignore"
          PR_BODY: "Automated regeneration of the gitignore outputs (base skeleton, toolchain fragments, this repo's own `.gitignore`) from [github/gitignore](https://github.com/github/gitignore)'s current HEAD. The diff is the upstream change to the sections we consume. Merging this rebuilds the build branch; the next sync pushes it to the fleet."
        run: bun .github/scripts/shared/open_automation_pr.ts
