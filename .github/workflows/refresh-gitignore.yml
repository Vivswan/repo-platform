# Weekly: regenerate the gitignore outputs (base skeleton, toolchain
# fragments, this repo's own .gitignore) from the latest github/gitignore and
# open a PR when upstream changed anything we consume.
# Merging the PR reaches the template branch automatically via build-branches.

name: Refresh gitignore

on:
  schedule:
    - cron: "31 10 * * 1"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

# Schedule and dispatch both force-push the same PR branch; queue runs,
# never cancel one mid-push.
concurrency:
  group: refresh-gitignore
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          # Base the refresh on the default branch regardless of trigger ref.
          ref: ${{ github.event.repository.default_branch }}
          token: ${{ secrets.REPO_PLATFORM_TOKEN || github.token }}

      - name: Set up bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: .bun-version

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Regenerate from latest upstream
        run: bun scripts/build_gitignore.ts

      - name: Detect changes
        id: changes
        run: |
          if git diff --quiet; then
            echo "gitignore templates are up to date."
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      # The commit subject and body embed the upstream SHA the lock now
      # pins, so they are composed here (expressions cannot substring) and
      # exported over the script's env.
      - name: Commit, push, and open PR
        if: steps.changes.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ secrets.REPO_PLATFORM_TOKEN || github.token }}
          BASE_BRANCH: ${{ github.event.repository.default_branch }}
          BRANCH: automation/gitignore-refresh
          PR_TITLE: "chore: refresh gitignore templates from github/gitignore"
        run: |
          sha="$(cat scripts/gitignore.lock)"
          export COMMIT_MESSAGE="chore: refresh gitignore templates from github/gitignore@${sha:0:12}"
          export PR_BODY="Automated regeneration of the gitignore outputs (base skeleton, toolchain fragments, this repo's own \`.gitignore\`) from [github/gitignore@\`${sha:0:12}\`](https://github.com/github/gitignore/tree/${sha}). Merging this rebuilds the template branch; the next sync pushes it to the fleet."
          bun .github/scripts/shared/open_automation_pr.ts
