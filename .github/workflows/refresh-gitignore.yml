# The only place that fetches github/gitignore: nothing pins upstream and no CI job verifies the outputs,
# so the PR's diff IS the upstream change.

name: Refresh gitignore

on:
  schedule:
    - cron: "31 10 * * 1"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

# Schedule and dispatch both push the same PR branch; queue runs,
# never cancel one mid-push.
concurrency:
  group: refresh-gitignore
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    environment: fleet-operator
    timeout-minutes: 15
    steps:
      # The fleet PAT's push starts the PR's CI; a default-token push would leave it waiting for approval.
      - name: Require the fleet token
        env:
          PAT: ${{ secrets.REPO_PLATFORM_TOKEN }}
        run: |
          if [ -z "$PAT" ]; then
            echo "::error::the refresh cannot run: the REPO_PLATFORM_TOKEN secret is not set. Create a fine-grained PAT with the permissions pre-selected at"\
              "https://github.com/settings/personal-access-tokens/new?name=REPO_PLATFORM_TOKEN&description=repo-platform+fleet%3A+push+sync+and+central+settings&contents=write&pull_requests=write&workflows=write&administration=write&issues=write&actions=read&environments=write"\
              "and store it with 'gh secret set REPO_PLATFORM_TOKEN --env fleet-operator' in this repo."
            exit 1
          fi

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.repository.default_branch }}
          token: ${{ secrets.REPO_PLATFORM_TOKEN }}

      - name: Set up bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: files/bun/.bun-version

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Regenerate from upstream HEAD
        run: bun scripts/generate/build_gitignore.ts

      # Nothing generated records the upstream SHA, so the commit subject and PR body are fixed text: what moved is the diff itself.
      # A no-change run with a refresh PR still open means main already has these outputs (upstream moved back, or another PR
      # landed them): the action closes that PR and deletes its branch, so it runs unconditionally.
      - name: Commit, push, and open PR
        uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1 # v8.1.1
        with:
          token: ${{ secrets.REPO_PLATFORM_TOKEN }}
          branch: automation/gitignore-refresh
          delete-branch: true
          committer: repo-platform-sync <repo-platform-sync@users.noreply.github.com>
          author: repo-platform-sync <repo-platform-sync@users.noreply.github.com>
          commit-message: "chore: refresh gitignore outputs from github/gitignore"
          title: "chore: refresh gitignore outputs from github/gitignore"
          body: >-
            Automated regeneration of the gitignore outputs (`files/base/.gitignore` and the per-module
            block files) from [github/gitignore](https://github.com/github/gitignore)'s current HEAD. The diff
            is the upstream change to the sections we consume. Merging this moves the stable tag once green; the next
            sync pushes it to the fleet, this repository included.
