---
# Edit here, never the rendered .github/settings.yml: the sync never targets this repository, so `bun run settings` renders it.
# The override layer merges ABOVE this file: main and non-bypassable are not redeclared.

repository:
  description: Standards files, CI, and settings for Vivswan's repositories, pushed from one place
  # Declared empty so the apply owns the field and clears an out-of-band value.
  homepage: ""
  topics: github-actions, reusable-workflows, standards
  # Declared so the apply heals an out-of-band flip to private.
  private: false

# A merged pull request's fleet-sync label opts it into an immediate sync (docs/all-green.md): fleet_sync_marker.ts reads this
# list at run time, the suffix naming the scope. One label per pull request.
labels:
  - name: fleet-sync:public
    color: "0052cc"
    description: Sync the public managed repos from this merge's green run
  - name: fleet-sync:all
    color: "b60205"
    description: Sync the whole fleet from this merge's green run

rulesets:
  # The fleet's delivery ref (docs/build-provenance.md); post-green moves it along main with a lease push.
  # Deletion only: a lease move is a force-class update to git, so an update or non_fast_forward rule would need a bypass for the mover.
  # A mover-only ruleset is not expressible (docs/settings.md): GitHub rejects an Integration bypass actor on a user-owned repository.
  - name: stable-tag
    target: tag
    enforcement: active
    conditions:
      ref_name:
        include:
          - stable
        exclude: []
    rules:
      - type: deletion
    # Declared EMPTY on purpose: only the explicit empty list lets the nightly heal clear an out-of-band bypass actor.
    bypass_actors: []

# The fleet PAT (REPO_PLATFORM_TOKEN) is an environment secret here, so only a job declaring this environment can read it,
# and the branch policy lets only a main run do so (docs/all-green.md, "After the gate"). GitHub itself holds the rule.
environments:
  - name: fleet-operator
    wait_timer: 0
    reviewers: []
    deployment_branch_policy:
      protected_branches: false
      custom_branch_policies: true
    deployment_branch_policies:
      - name: main
