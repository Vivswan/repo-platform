---
# Edit here, never the rendered .github/settings.yml: the next sync re-renders it from this file and the fleet layers.
# The override layer merges ABOVE this file: main and non-bypassable are not redeclared.

repository:
  description: Standards files, CI, and settings for Vivswan's repositories, pushed from one place
  # Declared empty so the apply owns the field and clears an out-of-band value.
  homepage: ""
  topics: github-actions, reusable-workflows, standards
  # Declared so the apply heals an out-of-band flip to private.
  private: false

# A merged pull request's fleet-sync label opts it into an immediate sync (docs/all-green.md): fleet_sync_marker.ts reads this
# list at run time, the suffix naming the scope. One label per pull request.
labels:
  - name: fleet-sync:public
    color: "0052cc"
    description: Sync the public managed repos from this merge's green run
  - name: fleet-sync:all
    color: "b60205"
    description: Sync the whole fleet from this merge's green run

rulesets:
  # The fleet's delivery ref (docs/build-provenance.md); post-green moves it along main with a lease push.
  # Deletion only: a lease move is a force-class update to git, so an update or non_fast_forward rule would need a bypass for the mover.
  # A mover-only ruleset is not expressible (docs/settings.md): GitHub rejects an Integration bypass actor on a user-owned repository.
  - name: stable-tag
    target: tag
    enforcement: active
    conditions:
      ref_name:
        include:
          - stable
        exclude: []
    rules:
      - type: deletion
    # Declared EMPTY on purpose: only the explicit empty list lets the nightly heal clear an out-of-band bypass actor.
    bypass_actors: []

  # Requires the pull request branch to be up to date before merging (docs/all-green.md), on this repository alone.
  # Its own ruleset, like pr-title: the override's `main` replaces a same-type rule an overlay declares (docs/settings.md).
  #   two active rulesets on one branch  -> GitHub takes the stricter flag
  #   a ruleset requiring no check       -> GitHub ignores the flag, so all-green is listed again
  - name: main-up-to-date
    target: branch
    enforcement: active
    conditions:
      ref_name:
        include:
          - "~DEFAULT_BRANCH"
        exclude: []
    rules:
      - type: required_status_checks
        parameters:
          strict_required_status_checks_policy: true
          do_not_enforce_on_create: true
          required_status_checks:
            - context: all-green
              integration_id: 15368
    # The main ruleset's own bypass, so direct pushes to main keep working; an admin's merge bypasses this rule as it bypasses all-green.
    bypass_actors:
      - actor_id: 5
        actor_type: RepositoryRole
        bypass_mode: always

# Holds REPO_PLATFORM_TOKEN once the post-green jobs declare this environment: then only a declaring job in a main run can
# read the fleet PAT, and GitHub itself holds the rule. No wait timer and no reviewers: GitHub's defaults, left undeclared.
environments:
  - name: fleet-operator
    deployment_branch_policy:
      protected_branches: false
      custom_branch_policies: true
    deployment_branch_policies:
      - name: main
