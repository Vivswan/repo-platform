---
# Edit here, never the rendered .github/settings.yml: the sync never targets this repository, so `bun run settings` renders it.
# The override layer merges ABOVE this file: main and non-bypassable are not redeclared.

repository:
  description: Standards files, CI, and settings for Vivswan's repositories, pushed from one place
  # Declared empty so the apply owns the field and clears an out-of-band value.
  homepage: ""
  topics: github-actions, reusable-workflows, standards
  # Declared so the apply heals an out-of-band flip to private.
  private: false

rulesets:
  # A publish-only ruleset is not expressible (docs/settings.md), and GitHub rejects an Integration bypass actor on a user-owned repository.
  - name: build-branches
    target: branch
    enforcement: active
    conditions:
      ref_name:
        include:
          - build
        exclude: []
    rules:
      - type: deletion
      - type: non_fast_forward
    # Declared EMPTY on purpose.
    # Only the explicit empty list lets the nightly heal clear an out-of-band bypass actor.
    bypass_actors: []

  # The fleet's coming delivery ref (docs/build-provenance.md); post-green moves it along main with a lease push.
  # Deletion only: a lease move is a force-class update to git, so an update or non_fast_forward rule would need a bypass for the mover.
  - name: stable-tag
    target: tag
    enforcement: active
    conditions:
      ref_name:
        include:
          - stable
        exclude: []
    rules:
      - type: deletion
    # Declared empty so the nightly heal clears an out-of-band bypass actor.
    bypass_actors: []
