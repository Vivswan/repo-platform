---
# Layer 1 of the settings merge: the fleet-wide defaults every managed
# repository starts from. Everything here is OVERRIDABLE - a repository's
# own .github/settings.yml wins over it. Invariants a repository must not
# be able to weaken live in .github/settings-override.yml, which merges
# ABOVE the repo layer.
#
# The full merge order (low to high) and the dialect are in
# docs/settings.md. Identity keys (description, homepage, topics,
# private) never appear in any fleet layer: they are per-repo and live in
# the repository's own settings.yml.
#
# This is a plain settings-as-code document, like every other layer: no
# key here is special to the merge, and no code derives content from it.

repository:
  has_issues: true
  has_wiki: false
  has_projects: false
  has_discussions: false
  default_branch: main
  delete_branch_on_merge: true
  allow_update_branch: true
  enable_automated_security_fixes: true

# The unconditional labels: dependabot's base pair first (the base
# dependabot.yml always carries the github-actions ecosystem, and
# dependabot recreates its labels when missing, so leaving either
# undeclared would loop delete/recreate nightly), then the triage trio.
# Per-ecosystem dependabot labels come from the toolchain modules' own
# settings.yml layers.
labels:
  - name: dependencies
    color: "0366d6"
    description: Dependency updates
  - name: github_actions
    color: "000000"
    description: Pull requests that update GitHub Actions code
  - name: bug
    color: "d73a4a"
    description: Something isn't working
  - name: enhancement
    color: "a2eeef"
    description: New feature or request
  - name: fix-lint
    color: "fbca04"
    description: Lint / formatting fixes

rulesets:
  # The pr-title module's required-check ruleset, DISABLED here so the
  # apply can heal a module deselection: the apply never deletes a whole
  # undeclared ruleset, so without this baseline entry a repo dropping the
  # module would keep a live ruleset requiring a check its render no
  # longer creates - every PR wedged. The module's settings.yml flips
  # enforcement to active (a same-name ruleset merges key by key), so
  # selection and deselection both land through the ordinary apply. The
  # full shape lives here once; the module layer carries only the flip.
  - name: pr-title
    target: branch
    enforcement: disabled
    conditions:
      ref_name:
        include:
          - "~DEFAULT_BRANCH"
        exclude: []
    rules:
      - type: required_status_checks
        parameters:
          strict_required_status_checks_policy: false
          do_not_enforce_on_create: true
          required_status_checks:
            # The managed pr-title.yml workflow's job check run, pinned to
            # the GitHub Actions app (integration_id 15368) like the main
            # ruleset's all-green context: no other app and no plain
            # commit status can satisfy the context by name.
            - context: pr-title
              integration_id: 15368
    bypass_actors:
      - actor_id: 5
        actor_type: RepositoryRole
        bypass_mode: always
