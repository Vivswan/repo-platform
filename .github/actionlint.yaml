# This repository's own actionlint configuration; the fleet starter twin
# lives in templates/base/.github/actionlint.yaml.jinja (generated once,
# then repo-owned).

paths:
  .github/workflows/**/*.{yml,yaml}:
    ignore:
      # GitHub grants Dependabot-alert reads to GITHUB_TOKEN under the
      # vulnerability-alerts permission key (the release-health gate needs
      # it); actionlint's permission-scope list has not caught up yet
      # (rhysd/actionlint#666). Drop this once it knows the scope.
      - 'unknown permission scope "vulnerability-alerts"'
      # job.workflow_sha (the commit of the workflow file that DEFINES the
      # job - reusable-apply-settings pins its repo-platform checkout to
      # it) is documented GitHub context that actionlint's job-context
      # type does not know yet. Drop this once it does. Note the github
      # context's own workflow_sha IS known to actionlint, so this pattern
      # cannot mask a github.workflow_sha mistake.
      - 'property "workflow_sha" is not defined in object type \{check_run_id'
