# This repository's own actionlint configuration; the fleet starter twin
# lives in files/base/.github/actionlint.yaml (written once, then
# repo-owned).

paths:
  .github/workflows/**/*.{yml,yaml}:
    ignore:
      # actionlint's permission-scope list lacks `vulnerability-alerts` (rhysd/actionlint#666); drop when it knows the scope.
      - 'unknown permission scope "vulnerability-alerts"'
  .github/workflows/fleet-ci.yml:
    ignore:
      # actionlint's `job` context type lacks `workflow_sha` as of v1.7.12 (GitHub added the property later); drop when it knows it.
      - 'property "workflow_sha" is not defined in object type'
