# yaml-language-server: $schema=../module.schema.json
# Module manifest (schema and loader: scripts/lib/module_manifests.ts).
description: Rust/cargo toolchain (cargo dependabot, Rust gitignore; no CodeQL)
# Deliberately no toolchain key: rust contributes no CodeQL language and no
# auto-format command, and the schema makes a toolchain without a CodeQL
# language unrepresentable (copier.yml's has_toolchain comment has the story).
dependabot:
  ecosystem: cargo
  label: rust
  color: "000000"
settings_layers:
  - settings.yml
gitignore_sources:
  - Rust.gitignore
lockfiles:
  - 'Cargo\.lock'
# The Pages defaults for a rust-selecting repo: mdBook is the Rust
# ecosystem's site builder. Defaults only - the pages_* copier answers take
# any command (docs/pages.md). The install pins +stable: it runs inside
# the extracted tree, where a repo's own rust-toolchain.toml would select
# a toolchain that may predate mdBook's rust-version and fail the install.
pages:
  install: cargo +stable install mdbook --locked
  build: mdbook build -d dist
