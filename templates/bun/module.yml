# yaml-language-server: $schema=../module.schema.json
# Module manifest (schema and loader: scripts/module_manifests.ts).
description: TypeScript/bun toolchain (gitignore, dependabot, CodeQL JS)
toolchain:
  codeql_language: javascript-typescript
  pin:
    file: .bun-version
    version: 1.3.14
dependabot:
  ecosystem: bun
  label: javascript
  color: "168700"
gitignore_sources:
  - Node.gitignore
  - bun.gitignore
lockfiles:
  - 'bun\.lock'
  - 'bun\.lockb'
pages:
  install: bun install --frozen-lockfile
  build: bun run build
