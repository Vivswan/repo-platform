# yaml-language-server: $schema=../module.schema.json
# Module manifest (schema and loader: scripts/module_manifests.ts).
description: TypeScript/bun toolchain (gitignore, dependabot, CodeQL JS)
ownership:
  - { path: .bun-version, class: managed }
  - { path: .github/workflows/dependabot-bun-lockfile.yml, class: managed }
toolchain:
  codeql_language: javascript-typescript
  pin:
    file: .bun-version
    version: 1.3.14
dependabot:
  ecosystem: bun
  label: javascript
  color: "168700"
settings_layers:
  - settings.yml
  - settings-public.yml
gitignore_sources:
  - Node.gitignore
  - bun.gitignore
lockfiles:
  - 'bun\.lock'
  - 'bun\.lockb'
pages:
  install: bun install --frozen-lockfile
  build: bun run build
