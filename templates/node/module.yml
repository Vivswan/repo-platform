# yaml-language-server: $schema=../module.schema.json
# Module manifest (schema and loader: scripts/module_manifests.ts).
description: JavaScript/Node.js toolchain (gitignore, npm dependabot, CodeQL JS)
ownership:
  - { path: .node-version, class: managed }
toolchain:
  codeql_language: javascript-typescript
  pin:
    file: .node-version
    version: 24.19.0
dependabot:
  ecosystem: npm
  label: javascript
  color: "168700"
gitignore_sources:
  - Node.gitignore
lockfiles:
  - 'package-lock\.json'
pages:
  install: npm ci
  build: npm run build
