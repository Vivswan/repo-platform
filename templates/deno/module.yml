# yaml-language-server: $schema=../module.schema.json
# Module manifest (schema and loader: scripts/module_manifests.ts).
description: Deno toolchain (deno fmt/lint, deno dependabot, CodeQL JS)
ownership:
  - { path: .dvmrc, class: managed }
  - { path: .github/workflows/deno-audit.yml, class: managed }
toolchain:
  codeql_language: javascript-typescript
  pin:
    file: .dvmrc
    version: 2.9.5
dependabot:
  ecosystem: deno
  label: deno
  color: "70ffaf"
gitignore_sources:
  - Deno.gitignore
  # nodeModulesDir auto materializes a real node_modules for npm deps.
  - Node.gitignore
lockfiles:
  - 'deno\.lock'
pages:
  install: deno ci
  build: deno task build
