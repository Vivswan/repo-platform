# Ownership declarations for every file templates/base/ lands in generated
# repositories (schema and loader: scripts/ownership.ts loadBaseOwnership;
# module files declare in their module.yml `ownership:` lists). Paths are
# LANDED paths - filename gates stay on the template filenames and are
# recorded from there. The composer errors when a landed file has no
# declaration here, when a declared path never lands, and when a source's
# text (headers, marker lines) contradicts its declared class.
ownership:
  - path: .editorconfig
    class: split
    grammar: managed-region
    begin: "# BEGIN REPO-PLATFORM MANAGED"
    end: "# END REPO-PLATFORM MANAGED"
  - path: .gitattributes
    class: split
    grammar: managed-region
    begin: "# BEGIN REPO-PLATFORM MANAGED"
    end: "# END REPO-PLATFORM MANAGED"
  - { path: .github/.copier-answers.yml, class: managed }
  - { path: .github/actionlint.yaml, class: starter }
  - path: .github/CODEOWNERS
    class: split
    grammar: managed-region
    begin: "# BEGIN REPO-PLATFORM MANAGED"
    end: "# END REPO-PLATFORM MANAGED"
  - { path: .github/dependabot.yml, class: managed }
  - { path: .github/workflows/auto-format.yml, class: starter }
  - { path: .github/workflows/checks.yml, class: starter }
  - { path: .github/workflows/ci.yml, class: managed }
  - path: .gitignore
    class: split
    grammar: managed-region
    begin: "# BEGIN REPO-PLATFORM MANAGED"
    end: "# END REPO-PLATFORM MANAGED"
  - { path: .gitleaks.toml, class: starter }
  # The registration file is generated once and repo-owned from then on:
  # module selection and the optional `mirrors` declaration LIVE there, so
  # repo-side edits are its purpose - a managed class (hash parity) would
  # flag exactly those edits as drift. The sync reads it, never rewrites it.
  - { path: .repo-platform.yml, class: starter }
  - { path: .typography-allow, class: managed }
  - { path: .yamllint, class: managed }
  - { path: CODE_OF_CONDUCT.md, class: managed }
  - path: CONTRIBUTING.md
    class: split
    grammar: managed-region
    begin: "<!-- BEGIN REPO-PLATFORM MANAGED -->"
    end: "<!-- END REPO-PLATFORM MANAGED -->"
  - path: LICENSE.md
    class: split
    grammar: managed-region
    begin: "<!-- BEGIN REPO-PLATFORM MANAGED -->"
    end: "<!-- END REPO-PLATFORM MANAGED -->"
  - path: SECURITY.md
    class: split
    grammar: managed-region
    begin: "<!-- BEGIN REPO-PLATFORM MANAGED -->"
    end: "<!-- END REPO-PLATFORM MANAGED -->"
