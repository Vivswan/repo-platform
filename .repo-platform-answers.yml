# repo-platform's own copier answers, consumed by scripts/render_dogfood.ts
# to render the template twins this repository dogfoods (bun run dogfood
# writes the copies; bun run dogfood:check fails on drift). Deliberately
# minimal: only the answers the generated pairs consume - the identity
# substitutions plus private and modules, which derive enable_codeql the
# way copier.yml computes it. render_dogfood cross-checks every value here
# against its authoritative source, so a stale answer fails loudly.

# Checked against copier.yml's project_slug derivation (lower, spaces to
# dashes) so the pair of name answers cannot contradict each other.
project_name: repo-platform

# The uses_ref rewrite target; checked against package.json's name, the
# same source check_ssot's jinjaVars reads.
project_slug: repo-platform

# Checked against .github/settings.yml repository.description, the
# field's authoritative home (this repo's own settings starter).
description: Copier template + reusable workflows managing standards across Vivswan's repositories

# Checked against the copier.yml defaults, the source check_ssot's
# jinjaVars reads for the remaining dogfood-parity pairs.
github_username: Vivswan
copyright_holder: Vivswan Shah (https://github.com/Vivswan)

# Checked against .github/settings.yml repository.private; public plus a
# toolchain module makes enable_codeql true.
private: false

# The modules this repository actually dogfoods: agents (AGENTS.md and the
# agent-file symlinks), bun (dependabot-bun-lockfile.yml; the toolchain
# feeding enable_codeql), skills (the hosted agent skills under skills/
# and the validate-skills.yml discovery workflow; the .claude-plugin
# manifests are generated-once starters this repo owns), pr-title (the
# required pr-title.yml workflow), auto-assign (auto-assign.yml). release-please is
# deliberately absent: repo-platform ships the module to clients but runs
# no release pipeline of its own. The tracking-stream modules (fuzzer,
# nightly) are deliberately absent too - their release-gating rode the
# release-please machinery this repo dropped - and so is
# settings-sync: this operator repo hand-writes its .github/settings.yml
# (extra rulesets the starter never renders), and settings-repos.yml
# heals it as its always-included self target.
modules:
  - agents
  - bun
  - skills
  - pr-title
  - auto-assign

# The skills module's directory answer (asked by copier only while skills
# is selected); the validate-skills.yml pair bakes it into the action
# input and the workflow's paths filter.
skills_dir: skills
