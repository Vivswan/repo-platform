# Vale: the docs-discipline shape gate over README.md and docs/*.md (ci.yml's docs-check job).
StylesPath = .vale/styles
MinAlertLevel = error
# Vale drops the text of code spans before a rule sees it (its default list is tt, code, kbd, samp), which reads a
# six-word command as one word, and an empty value is that default again. Vale has no spelling for "ignore nothing",
# so the value is a tag no document carries: every code span's words stay in the count, as the probe counts them.
IgnoredScopes = none

[*.md]
BasedOnStyles = House
