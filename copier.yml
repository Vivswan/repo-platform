# Copier template configuration for Vivswan/repo-platform.
# Downstream repos are generated/updated from the template/ subdirectory,
# which exists only on the generated `build` branch (on main it is a local
# gitignored build artifact; sources live in templates/).

_min_copier_version: "9.8.0"
_subdirectory: template
_answers_file: .copier-answers.yml
_templates_suffix: .jinja
_preserve_symlinks: true

# Conditional landing. The composed tree carries only PLAIN filenames (the
# build branch doubles as the `uses:` delivery channel, and tarball
# extraction dies on jinja-expression path segments), so module and
# visibility gating happens here instead: each pattern renders to the
# literal landed path exactly when the file's gates do NOT hold, and to
# nothing (a no-op pattern) when they do. Evaluated per render with that
# render's answers - copy and update alike - so unselected files are never
# rendered at all, exactly like the retired filename gates.
_exclude:
  # BEGIN GENERATED: conditional-excludes (scripts/generate.ts - edit the module manifests and the base templates' gated filenames, not this block)
  - "{% if not ('bun' in modules) %}/.bun-version{% endif %}"
  - "{% if not ('skills' in modules) %}.claude-plugin/marketplace.json{% endif %}"
  - "{% if not ('skills' in modules) %}.claude-plugin/plugin.json{% endif %}"
  - "{% if not ('deno' in modules) %}/.dvmrc{% endif %}"
  - "{% if not ('issue-templates' in modules) %}.github/ISSUE_TEMPLATE/bug_report.yml{% endif %}"
  - "{% if not ('issue-templates' in modules) %}.github/ISSUE_TEMPLATE/config.yml{% endif %}"
  - "{% if not ('issue-templates' in modules) %}.github/ISSUE_TEMPLATE/feature_request.yml{% endif %}"
  - "{% if not ('agents' in modules) %}.github/agents.md{% endif %}"
  - "{% if not ('agents' in modules) %}.github/copilot-instructions.md{% endif %}"
  - "{% if not ('settings-sync' in modules) %}.github/settings.yml{% endif %}"
  - "{% if not ('auto-assign' in modules) %}.github/workflows/auto-assign.yml{% endif %}"
  - "{% if not (has_toolchain) %}.github/workflows/auto-format.yml{% endif %}"
  - "{% if not ('agents' in modules) %}.github/workflows/copilot-setup-steps.yml{% endif %}"
  - "{% if not ('deno' in modules) %}.github/workflows/deno-audit.yml{% endif %}"
  - "{% if not ('bun' in modules) %}.github/workflows/dependabot-bun-lockfile.yml{% endif %}"
  - "{% if not ('fuzzer' in modules) %}.github/workflows/nightly-fuzz.yml{% endif %}"
  - "{% if not ('nightly' in modules) %}.github/workflows/nightly.yml{% endif %}"
  - "{% if not ('pages' in modules) %}.github/workflows/pages.yml{% endif %}"
  - "{% if not ('pr-title' in modules) %}.github/workflows/pr-title.yml{% endif %}"
  - "{% if not ('release-please' in modules) %}.github/workflows/release.yml{% endif %}"
  - "{% if not ('settings-sync' in modules) %}.github/workflows/settings-sync.yml{% endif %}"
  - "{% if not ('release-please' in modules) %}.github/workflows/update-release-pr.yml{% endif %}"
  - "{% if not ('release-please' in modules) %}.github/workflows/update-release.yml{% endif %}"
  - "{% if not ('skills' in modules) %}.github/workflows/validate-skills.yml{% endif %}"
  - "{% if not ('node' in modules) %}/.node-version{% endif %}"
  - "{% if not ('release-please' in modules) %}/.release-please-manifest.json{% endif %}"
  - "{% if not ('agents' in modules) %}/AGENTS.md{% endif %}"
  - "{% if not ('agents' in modules) %}/CLAUDE.md{% endif %}"
  - "{% if not (not private) %}/CODE_OF_CONDUCT.md{% endif %}"
  - "{% if not (not private) %}/CONTRIBUTING.md{% endif %}"
  - "{% if not ('custom-license' not in modules) %}/LICENSE.md{% endif %}"
  - "{% if not ('release-please' in modules) %}/release-please-config.json{% endif %}"
  - "{% if not ('skills' in modules) %}/.claude-plugin{% endif %}"
  - "{% if not ('issue-templates' in modules) %}.github/ISSUE_TEMPLATE{% endif %}"
  # END GENERATED: conditional-excludes

# Repo-owned starters: generated when absent, never overwritten by template
# sync. checks.yml holds each repo's own CI jobs (the managed ci.yml calls
# it inside the all-green gate); update-release.yml is the repo's hook in
# the managed release.yml pipeline, called between the draft cut and the
# attested publish (packaging, asset uploads, note edits); auto-format
# and copilot-setup-steps run repo-specific commands; the release-please
# config/manifest are release state (release-please bumps the manifest via
# release PRs); issue forms and the chooser config start from the generic
# starters and are then tailored to each repository (dropdowns for its
# components, labels, contact links, etc.).
_skip_if_exists:
  - .github/workflows/checks.yml
  - .github/workflows/update-release.yml
  # Its release-PR twin: release.yml calls it when release-please creates or
  # refreshes the release PR (files regenerated into the release commit).
  - .github/workflows/update-release-pr.yml
  - .github/workflows/auto-format.yml
  - .github/workflows/copilot-setup-steps.yml
  # The fuzzer module's starter: the fuzz/toolchain steps are repo-specific,
  # so only the first sync generates it (docs/fuzzer.md has the contract).
  - .github/workflows/nightly-fuzz.yml
  # The nightly module's starter: same story for the repo's nightly checks
  # (docs/nightly.md).
  - .github/workflows/nightly.yml
  - .github/ISSUE_TEMPLATE/*.yml
  - release-please-config.json
  - .release-please-manifest.json
  # Repos accumulate their own allowlists in it; sync must never reset
  # what a repo has excused.
  - .gitleaks.toml
  # Same story for actionlint ignores.
  - .github/actionlint.yaml
  # The skills module's starters: plugin identity and the skill catalog are
  # repo-owned after the first render (repos list their skills there).
  - .claude-plugin/plugin.json
  - .claude-plugin/marketplace.json
  # The settings-sync module's starter: identity keys plus local overrides,
  # repo-owned after the first render. The managed baseline (policy block,
  # labels, rulesets) is computed centrally at apply time and merged UNDER
  # this file (.github/scripts/fleet/render_managed_settings.ts), so sync
  # never rewrites it.
  - .github/settings.yml

# The _migrations entry stamps the ownership manifest's per-repo hashes:
# they are facts of the rendered tree, so stamping must run after copier
# writes it. Copier runs _migrations only on update and _tasks only on
# copy/recopy, hence the same stamper (shipped inside the build branch's
# actions/shared/ zone, the same relative path it has on main - check_ssot's
# stamp-hook-path rule pins the tie) is wired into both.
_migrations:
  - command: bun "{{ _copier_conf.src_path }}/actions/shared/stamp_manifest.ts"
    when: "{{ _stage == 'after' }}"

_tasks:
  - command: bun "{{ _copier_conf.src_path }}/actions/shared/stamp_manifest.ts"

project_name:
  type: str
  help: Human-readable project name

project_slug:
  type: str
  help: Repository / package identifier (kebab-case)
  default: "{{ project_name | lower | replace(' ', '-') }}"
  # The slug lands in URLs, YAML scalars, and (skills module) kebab-case
  # plugin names; enforce the contract the help text states.
  validator: "{% if not (project_slug | regex_search('^[a-z0-9]+(-[a-z0-9]+)*\\Z')) %}project_slug must be kebab-case (lowercase letters and digits, dash-separated){% endif %}"

description:
  type: str
  help: One-line repository description (used in settings.yml)

# Feature modules: any combination. Each module gates the files/config it
# owns; per-module parameters below are asked only when the module is
# selected. Serialized multiselect answers (-d 'modules=[...]', and loading
# recorded list answers on update) require copier >= 9.8.0 - the floor above.
modules:
  type: str
  help: Feature modules (space toggles, enter confirms; any combination)
  multiselect: true
  # BEGIN GENERATED: module-choices (scripts/generate.ts - edit module.yml manifests, not this block)
  choices:
    agents - AGENTS.md agent instructions, agent-file symlinks, Copilot setup: agents
    bun - TypeScript/bun toolchain (gitignore, dependabot, CodeQL JS): bun
    node - JavaScript/Node.js toolchain (gitignore, npm dependabot, CodeQL JS): node
    deno - Deno toolchain (deno fmt/lint, deno dependabot, CodeQL JS): deno
    uv - Python/uv toolchain (gitignore, dependabot, CodeQL Python): uv
    rust - Rust/cargo toolchain (cargo dependabot, Rust gitignore; no CodeQL): rust
    pages - GitHub Pages deploy (root = latest release, /staging/ = main): pages
    release-please - gate-downstream release job in ci.yml + autorelease labels: release-please
    issue-templates - bug/feature issue forms: issue-templates
    skills - agent skills hosting (plugin manifests, skill validation): skills
    pr-title - Conventional Commit PR title check, its own required workflow: pr-title
    auto-assign - auto-assign issues/PRs/alerts to owner: auto-assign
    fuzzer - nightly fuzz starter with issue filing, replay inputs, auto-close: fuzzer
    nightly - nightly CI starter with failure issue filing and auto-close: nightly
    settings-sync - centrally managed repo settings + repo-owned settings.yml starter: settings-sync
    custom-license - repo carries its own license in LICENSE.md; the fleet license is not rendered: custom-license
  # END GENERATED: module-choices
  # settings-sync is deliberately NOT a default: selecting it is the
  # opt-in to centrally managed settings (the nightly heal computes the
  # baseline and merges the repo's settings.yml over it).
  default: [agents, release-please, issue-templates, pr-title, auto-assign]

# --- settings-sync module parameters (asked only when it is selected) ---
# Both feed the module's rendered .github/settings.yml.

homepage:
  type: str
  help: Homepage URL (optional, used in settings.yml)
  default: ""
  when: "{{ 'settings-sync' in modules }}"

topics:
  type: str
  help: Comma-separated GitHub topics (used in settings.yml)
  default: ""
  when: "{{ 'settings-sync' in modules }}"

# --- pages module parameters (asked only when pages is selected) ---

pages_setup:
  type: str
  help: Toolchain(s) installed on the Pages build runner (comma-separated bun/node/deno/uv, or none)
  # BEGIN GENERATED: pages-setup (scripts/generate.ts - edit module.yml manifests, not this block)
  default: "{{ ((['bun'] if 'bun' in modules else []) + (['node'] if 'node' in modules else []) + (['deno'] if 'deno' in modules else []) + (['uv'] if 'uv' in modules else [])) | join(',') or 'none' }}"
  validator: "{% set ts = pages_setup.split(',') %}{% if '' in ts or ts | map('trim') | list != ts %}pages_setup must be comma-separated with no spaces or empty tokens{% elif ts | reject('in', ['bun', 'node', 'deno', 'uv', 'none']) | list %}pages_setup tokens must be bun, node, deno, uv, or none{% elif ts | unique | list | length != ts | length %}pages_setup tokens must be unique{% elif 'none' in ts and ts | length > 1 %}pages_setup 'none' cannot be combined with toolchains{% endif %}"
  # END GENERATED: pages-setup
  when: "{{ 'pages' in modules }}"

pages_install_command:
  type: str
  help: Dependency install command run before each build (empty to skip)
  # BEGIN GENERATED: pages-install-command (scripts/generate.ts - edit module.yml manifests, not this block)
  default: "{{ 'bun install --frozen-lockfile' if 'bun' in pages_setup.split(',') else ('npm ci' if 'node' in pages_setup.split(',') else ('deno ci' if 'deno' in pages_setup.split(',') else ('uv sync' if 'uv' in pages_setup.split(',') else ''))) }}"
  # END GENERATED: pages-install-command
  when: "{{ 'pages' in modules }}"

pages_build_command:
  type: str
  help: Build command; PAGES_BASE_PATH, PAGES_ORIGIN, PAGES_STAGING are exported
  # BEGIN GENERATED: pages-build-command (scripts/generate.ts - edit module.yml manifests, not this block)
  default: "{{ 'bun run build' if 'bun' in pages_setup.split(',') else ('npm run build' if 'node' in pages_setup.split(',') else ('deno task build' if 'deno' in pages_setup.split(',') else ('uv run mkdocs build --site-dir dist' if 'uv' in pages_setup.split(',') else ''))) }}"
  # END GENERATED: pages-build-command
  validator: "{% if not pages_build_command %}A build command is required for the pages module{% endif %}"
  when: "{{ 'pages' in modules }}"

pages_dist_dir:
  type: str
  help: Build output directory (relative to repo root)
  default: dist
  # An empty/"."/absolute/traversing value (in any spelling: "./", "a/../b",
  # trailing or doubled slashes) would make the deploy publish the whole
  # checkout (including .git) as the Pages artifact. Segment-wise check:
  # empty segments catch absolute/doubled/trailing slashes.
  validator: "{% set parts = pages_dist_dir.split('/') %}{% if not pages_dist_dir or '' in parts or '.' in parts or '..' in parts %}pages_dist_dir must be a plain relative path inside the repo (no leading/trailing/doubled slashes, no '.' or '..' segments){% endif %}"
  when: "{{ 'pages' in modules }}"

pages_production:
  type: str
  help: What the production Pages root is built from
  choices:
    latest release tag (staging preview from main): release
    main HEAD (no separate staging): main
  default: release
  when: "{{ 'pages' in modules }}"

pages_staging:
  type: bool
  help: Also publish main HEAD under /staging/
  default: true
  when: "{{ 'pages' in modules and pages_production == 'release' }}"

# --- fuzzer module parameter (asked only when it is selected) ---
# The label is the tracking-issue stream's identity: the report and resolve
# steps both key on it, so it is asked once here rather than edited in two
# places in the repo-owned starter.

fuzzer_label:
  type: str
  help: Label for the deduplicated nightly-fuzz tracking issue
  default: fuzz-nightly
  # The value lands in gh args (a leading dash would parse as a flag), in the
  # rendered workflow's YAML, and in the settings-sync label list, so the
  # generated validator keeps it to plain label characters within GitHub's
  # 50-char limit (the fuzz-issue action enforces the same shape) and
  # rejects the label names the template already manages (the settings
  # baseline, the release labels, the dependabot labels): reusing one would
  # corrupt label sync and let a green night close unrelated issues.
  # BEGIN GENERATED: fuzzer-label-validator (scripts/generate.ts - edit module.yml manifests, not this block)
  validator: "{% if not (fuzzer_label | regex_search('^[A-Za-z0-9._][A-Za-z0-9._: -]{0,49}\\Z')) %}fuzzer_label must be a plain label: letters, digits, ._:- and spaces, not starting with a dash, at most 50 characters{% elif fuzzer_label | lower in ['dependencies', 'github_actions', 'bug', 'enhancement', 'fix-lint', 'settings-as-code-report', 'javascript', 'deno', 'python:uv', 'rust', 'autorelease: pending', 'autorelease: tagged', 'release-blocker', 'release-override'] %}fuzzer_label must not reuse a label the template already manages (GitHub label names are case-insensitive): a green night would close whatever issues carry it and every settings apply would fight over it{% endif %}"
  # END GENERATED: fuzzer-label-validator
  when: "{{ 'fuzzer' in modules }}"

# --- nightly module parameter (asked only when it is selected) ---
# Same story as fuzzer_label: the tracking-issue stream's identity, shared
# by the starter's report and resolve steps.

nightly_label:
  type: str
  help: Label for the deduplicated nightly-CI tracking issue
  default: nightly-failure
  # Same constraints as fuzzer_label above, plus stream independence: both
  # streams dedup AND auto-close by label, so sharing one label would let
  # either stream's green night close the other's active failure issue
  # (and lift the release-health hold keyed on it), while settings.yml
  # would declare two same-name labels whose colors fight on every apply.
  # BEGIN GENERATED: nightly-label-validator (scripts/generate.ts - edit module.yml manifests, not this block)
  validator: "{% if not (nightly_label | regex_search('^[A-Za-z0-9._][A-Za-z0-9._: -]{0,49}\\Z')) %}nightly_label must be a plain label: letters, digits, ._:- and spaces, not starting with a dash, at most 50 characters{% elif nightly_label | lower in ['dependencies', 'github_actions', 'bug', 'enhancement', 'fix-lint', 'settings-as-code-report', 'javascript', 'deno', 'python:uv', 'rust', 'autorelease: pending', 'autorelease: tagged', 'release-blocker', 'release-override'] %}nightly_label must not reuse a label the template already manages (GitHub label names are case-insensitive): a green night would close whatever issues carry it and every settings apply would fight over it{% elif 'fuzzer' in modules and nightly_label | lower == fuzzer_label | lower %}nightly_label must differ from fuzzer_label (GitHub label names are case-insensitive): each stream needs its own tracking label or a green night in one closes the other's open issue{% endif %}"
  # END GENERATED: nightly-label-validator
  when: "{{ 'nightly' in modules }}"

# --- skills module parameter (asked only when it is selected) ---
# The directory is baked into the managed validate-skills workflow (its
# trigger paths and its action input) and into the starter manifests'
# skill paths, so it is asked once here rather than edited in several
# places after generation.

skills_dir:
  type: str
  help: Directory holding this repository's agent skills (relative, no leading ./)
  default: skills
  # An unsafe value would point the managed validation (the ci.yml gate job
  # and the discovery workflow) outside the repo or at the whole checkout,
  # and the value also lands - tojson-quoted, so quoting is not the concern
  # - in the discovery workflow's pull_request paths filter, where !, *, ?,
  # and [ carry glob meaning: a name like 'foo*' would validate one
  # directory while the workflow triggers on others. The conservative
  # per-segment charset keeps the filter literal; the parts check rejects
  # '.' (a leading ./) and '..' segments, which are within the charset.
  validator: "{% set parts = skills_dir.split('/') %}{% if not (skills_dir | regex_search('^[A-Za-z0-9._-]+(/[A-Za-z0-9._-]+)*\\Z')) or '.' in parts or '..' in parts %}skills_dir must be relative path segments of letters, digits, dots, underscores, or dashes joined by single slashes (no leading ./ or /, no '..', no spaces or glob characters){% endif %}"
  when: "{{ 'skills' in modules }}"

private:
  type: bool
  help: Is the repository private?
  default: false

github_username:
  type: str
  help: GitHub username owning the repository
  default: Vivswan

# The fleet LICENSE.md's Required Notice names the licensor and how to
# reach them. A repo whose rights belong to someone else gets their name
# and contact here; repos with a different license entirely select the
# custom-license module instead (the question is skipped there because
# the fleet LICENSE.md is not rendered).
copyright_holder:
  type: str
  help: Copyright holder and contact for the fleet license's Required Notice (the licensor)
  default: Vivswan Shah (https://github.com/Vivswan)
  when: "{{ 'custom-license' not in modules }}"

# Computed - never asked. Which modules count as language toolchains comes
# from each module.yml manifest's `toolchain` key: it gates the auto-format
# starter and feeds enable_codeql. rust deliberately omits the key: it
# contributes no CodeQL language and no auto-format command, so counting it
# would render an empty codeql block (and a pointless weekly cron) for a
# public rust-only repo.
has_toolchain:
  type: bool
  # BEGIN GENERATED: has-toolchain-default (scripts/generate.ts - edit module.yml manifests, not this block)
  default: "{{ 'bun' in modules or 'node' in modules or 'deno' in modules or 'uv' in modules }}"
  # END GENERATED: has-toolchain-default
  when: false

# Computed - never asked. CodeQL code scanning is available on public repos
# only for personal accounts, and needs at least one analyzable toolchain.
enable_codeql:
  type: bool
  default: "{{ not private and has_toolchain }}"
  when: false
