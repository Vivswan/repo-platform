name: Knip
description: |
  Runs knip over the caller's installed checkout, the fleet's dead-code gate for JavaScript toolchains.

  knip reports unused files, exports, and dependencies. It runs on its own defaults,
  overridden by whatever configuration the repository carries: any of knip's config file
  names, a knip.ts or knip.js among them, or a knip key in package.json. A configured entry
  or project list replaces the default list.

  The run resolves that configuration with knip's own loader and writes a module beside this
  action, inside the caller's workspace so knip analyzes it, which imports a knip.ts or knip.js
  as the repository wrote it, or carries knip's resolution of a JSON one, with the platform
  checkout fleet-ci.yml leaves in the workspace added to `ignoreWorkspaces`. knip runs on that
  module, so its entry and project globs never reach the checkout, whatever the repository's
  .gitignore says, and the module is removed after the run. Configuration hints are not
  printed, since the module carries a key knip would hint about; the repository's own knip run
  shows them.

  The caller installs the toolchain and the dependencies first, since knip resolves imports
  through node_modules.

  A finding fails the step. The only bypass is an ignore entry in the repository's own knip
  configuration, with a reason.

runs:
  using: composite
  steps:
    # The action's pinned bun by absolute path: later steps run
    # steps.action-bun.outputs.path, never `bun` through PATH, where a later
    # setup-bun can put another bun first.
    - name: Set up the action's bun
      id: action-bun
      uses: Vivswan/repo-platform/actions/bun-setup@stable
      with:
        from: ${{ github.action_path }}

    # One knip for the fleet, pinned in package.json: its loader reads the repository's
    # configuration and its CLI runs, and tests/actions/knip exercises this repository's own
    # configuration against the same one.
    - name: Install knip
      shell: bash
      working-directory: ${{ github.action_path }}
      env:
        ACTION_BUN: ${{ steps.action-bun.outputs.path }}
      # --production: dev deps (@types/bun, typescript) are editor/typecheck tooling. No
      # --silent: a failed install must name itself in the caller's log.
      run: '"$ACTION_BUN" install --frozen-lockfile --production'

    - name: Find unused files, exports, and dependencies
      shell: bash
      env:
        ACTION_BUN: ${{ steps.action-bun.outputs.path }}
      run: '"$ACTION_BUN" "${{ github.action_path }}/run.ts"'
