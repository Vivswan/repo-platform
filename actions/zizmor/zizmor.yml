# The fleet's zizmor policy: actions/zizmor renders it into every managed
# repository's workspace, filling {{github_username}} with the caller's
# repository owner.
rules:
  unpinned-uses:
    config:
      policies:
        # The stable tag is the fleet's green-gated delivery channel
        # (docs/build-provenance.md): a moving ref on purpose.
        "{{github_username}}/repo-platform/*": ref-pin
        "*": hash-pin
  dangerous-triggers:
    # The managed auto-assign.yml's workflow_run trigger only calls the
    # reusable assigners, which never check out or run the triggering code.
    ignore:
      - auto-assign.yml
