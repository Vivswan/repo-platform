# The fleet's zizmor policy: actions/zizmor renders it into the runner's
# temp dir, filling {{github_username}} with the caller's repository owner.
rules:
  unpinned-uses:
    config:
      policies:
        # The stable tag is the fleet's green-gated delivery channel
        # (docs/platform/build-provenance.md): a moving ref on purpose.
        "{{github_username}}/repo-platform/*": ref-pin
        "*": hash-pin
