name: Zizmor
description: |
  Audits every workflow and action.yml in the caller's checkout with zizmor, the fleet's GitHub Actions security
  audit, under the fleet policy shipped beside this action (a repository's own zizmor config is not read). A medium or
  low finding neither blocks nor surfaces.

  Two passes of the one pinned zizmor under the same policy: a SARIF pass for code scanning (public repositories only,
  as private personal repositories have none; zizmor exits 0 in SARIF mode whatever it finds) and a plain pass whose
  exit is the verdict, so a high finding fails the step.

  The one bypass is zizmor's own: a `# zizmor: ignore[rule]` comment on the finding's line, with the reason beside it.

  The calling job needs security-events: write for the SARIF upload, when upload-sarif is true.

inputs:
  upload-sarif:
    description: >-
      Whether to upload the findings to code scanning, "true" or "false" (false where the repository has no code
      scanning).
    required: false
    default: "true"

runs:
  using: composite
  steps:
    - name: Install zizmor
      shell: bash
      run: python3 -m pip install --quiet --requirement "$GITHUB_ACTION_PATH/requirements.txt"

    - name: Render the fleet policy
      shell: bash
      env:
        FLEET_POLICY: ${{ github.action_path }}/zizmor.yml
        OWNER: ${{ github.repository_owner }}
      run: sed "s|{{github_username}}|$OWNER|g" "$FLEET_POLICY" > "$RUNNER_TEMP/zizmor.yml"

    - name: Write the high findings as SARIF
      if: inputs.upload-sarif == 'true'
      shell: bash
      env:
        GH_TOKEN: ${{ github.token }}
      run: zizmor --config "$RUNNER_TEMP/zizmor.yml" --min-severity high --format sarif . > "$RUNNER_TEMP/zizmor.sarif"

    - name: Upload the high findings to code scanning
      if: inputs.upload-sarif == 'true'
      uses: github/codeql-action/upload-sarif@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
      with:
        sarif_file: ${{ runner.temp }}/zizmor.sarif
        category: zizmor

    - name: Fail on a high finding
      shell: bash
      env:
        GH_TOKEN: ${{ github.token }}
      run: zizmor --config "$RUNNER_TEMP/zizmor.yml" --min-severity high .
