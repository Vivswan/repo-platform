name: Zizmor
description: >-
  The fleet's GitHub Actions security audit: zizmor over every workflow and
  action.yml in the caller's checkout, under the fleet policy shipped
  beside this action (a repository's own zizmor config is not read). Two
  passes of the pinned upstream action, both at high severity: the first
  uploads the high findings to code scanning as SARIF (public repositories
  only, as private personal repositories have no code scanning), the second
  fails the step on any high finding. A medium or low finding neither
  blocks nor surfaces. zizmor exits non-zero alike on an audit error and on
  a finding, so a failed attempt of either pass runs once more and only the
  retry's result counts. The only bypass is zizmor's own inline
  `# zizmor: ignore[rule]` comment, in the repository, with a reason.

inputs:
  upload-sarif:
    description: >-
      Whether to upload the findings to code scanning ("true"/"false"); pass
      false where the repository has no code scanning.
    required: false
    default: "true"

runs:
  using: composite
  steps:
    # The upstream action runs zizmor in a container that mounts only the
    # workspace, so the fleet policy (outside it, under the action path) is
    # rendered to a workspace dotfile that zizmor's collection never audits,
    # and removed after the passes. --config also suppresses zizmor's own
    # discovery of a repository config.
    - name: Render the fleet policy
      id: policy
      shell: bash
      env:
        FLEET_POLICY: ${{ github.action_path }}/zizmor.yml
        OWNER: ${{ github.repository_owner }}
      run: |
        sed "s|{{github_username}}|$OWNER|g" "$FLEET_POLICY" > .zizmor-fleet-policy.yml
        echo "path=.zizmor-fleet-policy.yml" >>"$GITHUB_OUTPUT"

    # SARIF mode never fails the step on a finding (zizmor suppresses its
    # finding exit codes there), hence the judging pass below. A retry keys
    # on its first attempt's outcome, 'skipped' when that attempt was skipped.
    - name: Upload the high findings to code scanning
      id: sarif
      if: inputs.upload-sarif == 'true'
      continue-on-error: true
      uses: zizmorcore/zizmor-action@cc914d7f3750a2d13d75c7f184a1060aa0e9d482 # v0.6.4
      with:
        config: ${{ steps.policy.outputs.path }}
        version: 1.30.1
        min-severity: high
        advanced-security: true

    - name: Upload the high findings to code scanning (retry)
      if: steps.sarif.outcome == 'failure'
      uses: zizmorcore/zizmor-action@cc914d7f3750a2d13d75c7f184a1060aa0e9d482 # v0.6.4
      with:
        config: ${{ steps.policy.outputs.path }}
        version: 1.30.1
        min-severity: high
        advanced-security: true

    - name: Fail on a high finding
      id: gate
      continue-on-error: true
      uses: zizmorcore/zizmor-action@cc914d7f3750a2d13d75c7f184a1060aa0e9d482 # v0.6.4
      with:
        config: ${{ steps.policy.outputs.path }}
        version: 1.30.1
        min-severity: high
        advanced-security: false

    - name: Fail on a high finding (retry)
      if: steps.gate.outcome == 'failure'
      uses: zizmorcore/zizmor-action@cc914d7f3750a2d13d75c7f184a1060aa0e9d482 # v0.6.4
      with:
        config: ${{ steps.policy.outputs.path }}
        version: 1.30.1
        min-severity: high
        advanced-security: false

    - name: Remove the copied policy
      if: always()
      shell: bash
      run: rm -f .zizmor-fleet-policy.yml
