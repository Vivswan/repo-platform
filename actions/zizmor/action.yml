name: Zizmor
description: |
  Audits every workflow and action.yml in the caller's checkout with zizmor, the fleet's GitHub Actions security
  audit, under the fleet policy shipped beside this action (a repository's own zizmor config is not read). A medium or
  low finding neither blocks nor surfaces.

  Two passes of the zizmor locked in this action's uv.lock, under the same policy: one writes SARIF and uploads it to
  code scanning (public repositories only, as private personal repositories have none; it passes whatever it finds), and
  a plain one whose exit is the verdict, so a high finding fails the step. Both run zizmor's online audits on the job's
  token.

  The one bypass is zizmor's own: a `# zizmor: ignore[rule]` comment on the finding's line, with the reason beside it.

  The calling job needs security-events: write for the SARIF upload, when upload-sarif is true.

inputs:
  upload-sarif:
    description: >-
      Whether to upload the findings to code scanning, "true" or "false" (false where the repository has no code
      scanning).
    required: false
    default: "true"

runs:
  using: composite
  steps:
    - name: Render the fleet policy
      shell: bash
      env:
        FLEET_POLICY: ${{ github.action_path }}/zizmor.yml
        OWNER: ${{ github.repository_owner }}
      run: sed "s|{{github_username}}|$OWNER|g" "$FLEET_POLICY" > "$RUNNER_TEMP/zizmor.yml"

    - name: Set up uv
      uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
      with:
        working-directory: ${{ github.action_path }}
        enable-cache: false

    - name: Write the high findings as SARIF
      if: inputs.upload-sarif == 'true'
      shell: bash
      env:
        GH_TOKEN: ${{ github.token }}
      run: >-
        uv run --isolated --project "$GITHUB_ACTION_PATH" --locked
        zizmor --config="$RUNNER_TEMP/zizmor.yml" --min-severity=high --format=sarif .
        > "$RUNNER_TEMP/zizmor.sarif"

    - name: Upload the high findings to code scanning
      if: inputs.upload-sarif == 'true'
      uses: github/codeql-action/upload-sarif@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
      with:
        sarif_file: ${{ runner.temp }}/zizmor.sarif
        category: zizmor

    - name: Fail on a high finding
      shell: bash
      env:
        GH_TOKEN: ${{ github.token }}
      run: >-
        uv run --isolated --project "$GITHUB_ACTION_PATH" --locked
        zizmor --config="$RUNNER_TEMP/zizmor.yml" --min-severity=high --color=always .
