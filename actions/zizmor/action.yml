name: Zizmor
description: >-
  The fleet's GitHub Actions security audit: zizmor over every workflow and
  action.yml in the caller's checkout, under the fleet policy shipped
  beside this action and rendered into the runner's temp dir (a
  repository's own zizmor config is not read). Two direct passes of the
  one zizmor this action's requirements.txt pins, both at high severity
  and under the same policy, so they cannot disagree on findings, only on
  format: the SARIF pass uploads the high findings to code scanning
  (public repositories only, as private personal repositories have no
  code scanning), and the plain pass's exit is the verdict. zizmor exits 0
  in SARIF mode whatever it finds, so the SARIF pass fails only on an
  audit error, and the plain pass fails on a high finding (its exit 14). A
  medium or low finding neither blocks nor surfaces. The only bypass is
  zizmor's own inline `# zizmor: ignore[rule]` comment, in the
  repository, with a reason.

inputs:
  upload-sarif:
    description: >-
      Whether to upload the findings to code scanning ("true"/"false"); pass
      false where the repository has no code scanning.
    required: false
    default: "true"

runs:
  using: composite
  steps:
    - name: Install zizmor
      shell: bash
      run: python3 -m pip install --quiet --requirement "$GITHUB_ACTION_PATH/requirements.txt"

    - name: Render the fleet policy
      shell: bash
      env:
        FLEET_POLICY: ${{ github.action_path }}/zizmor.yml
        OWNER: ${{ github.repository_owner }}
      run: sed "s|{{github_username}}|$OWNER|g" "$FLEET_POLICY" > "$RUNNER_TEMP/zizmor.yml"

    - name: Write the high findings as SARIF
      if: inputs.upload-sarif == 'true'
      shell: bash
      env:
        GH_TOKEN: ${{ github.token }}
      run: zizmor --config "$RUNNER_TEMP/zizmor.yml" --min-severity high --format sarif . > "$RUNNER_TEMP/zizmor.sarif"

    - name: Upload the high findings to code scanning
      if: inputs.upload-sarif == 'true'
      uses: github/codeql-action/upload-sarif@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4.38.2
      with:
        sarif_file: ${{ runner.temp }}/zizmor.sarif
        category: zizmor

    - name: Fail on a high finding
      shell: bash
      env:
        GH_TOKEN: ${{ github.token }}
      run: zizmor --config "$RUNNER_TEMP/zizmor.yml" --min-severity high .
