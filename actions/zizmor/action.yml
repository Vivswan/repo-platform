name: Zizmor
description: |
  Audits every workflow and action.yml in the caller's checkout with zizmor, the fleet's GitHub Actions security
  audit,
  under the fleet policy shipped beside this action (a repository's own zizmor config is not read). A medium or low
  finding neither blocks nor surfaces.

  Two passes of the one pinned zizmor under the same policy: a SARIF pass for code scanning (public repositories only, as
  private personal repositories have none) and a plain pass whose exit is the verdict. Why two, what each fails on, and
  the bypass are docs/fleet-guidelines.md's, "How to bypass a check".

  The calling job needs security-events: write for the SARIF upload, when upload-sarif is true.

inputs:
  upload-sarif:
    description: >-
      Whether to upload the findings to code scanning, "true" or "false" (false where the repository has no code
      scanning).
    required: false
    default: "true"

runs:
  using: composite
  steps:
    - name: Install zizmor
      shell: bash
      run: python3 -m pip install --quiet --requirement "$GITHUB_ACTION_PATH/requirements.txt"

    - name: Render the fleet policy
      shell: bash
      env:
        FLEET_POLICY: ${{ github.action_path }}/zizmor.yml
        OWNER: ${{ github.repository_owner }}
      run: sed "s|{{github_username}}|$OWNER|g" "$FLEET_POLICY" > "$RUNNER_TEMP/zizmor.yml"

    - name: Write the high findings as SARIF
      if: inputs.upload-sarif == 'true'
      shell: bash
      env:
        GH_TOKEN: ${{ github.token }}
      run: zizmor --config "$RUNNER_TEMP/zizmor.yml" --min-severity high --format sarif . > "$RUNNER_TEMP/zizmor.sarif"

    - name: Upload the high findings to code scanning
      if: inputs.upload-sarif == 'true'
      uses: github/codeql-action/upload-sarif@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4.38.2
      with:
        sarif_file: ${{ runner.temp }}/zizmor.sarif
        category: zizmor

    - name: Fail on a high finding
      shell: bash
      env:
        GH_TOKEN: ${{ github.token }}
      run: zizmor --config "$RUNNER_TEMP/zizmor.yml" --min-severity high .
