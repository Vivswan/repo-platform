name: Zizmor
description: |
  Audits every workflow and action.yml in the caller's checkout with zizmor, the fleet's GitHub Actions security
  audit, under the fleet policy shipped beside this action (a repository's own zizmor config is not read). A medium or
  low finding neither blocks nor surfaces.

  Two passes of zizmor's own action at one pin, under the same policy: one writes SARIF and uploads it to code scanning
  (public repositories only, as private personal repositories have none; it passes whatever it finds), and a plain one
  whose exit is the verdict, so a high finding fails the step.

  The action pin is the zizmor pin: each release of the action carries one exact zizmor with its wheel hashes, so the
  `version` input stays unset and Dependabot's bump of the pin is the zizmor bump.

  The one bypass is zizmor's own: a `# zizmor: ignore[rule]` comment on the finding's line, with the reason beside it.

  The calling job needs security-events: write for the SARIF upload, when upload-sarif is true.

inputs:
  upload-sarif:
    description: >-
      Whether to upload the findings to code scanning, "true" or "false" (false where the repository has no code
      scanning).
    required: false
    default: "true"

runs:
  using: composite
  steps:
    - name: Render the fleet policy
      shell: bash
      env:
        FLEET_POLICY: ${{ github.action_path }}/zizmor.yml
        OWNER: ${{ github.repository_owner }}
      run: sed "s|{{github_username}}|$OWNER|g" "$FLEET_POLICY" > "$RUNNER_TEMP/zizmor.yml"

    - name: Upload the high findings to code scanning
      if: inputs.upload-sarif == 'true'
      uses: zizmorcore/zizmor-action@45d7276c9ca790aabd705e31ca99c6185c3e76dd # v0.8.1
      with:
        config: ${{ runner.temp }}/zizmor.yml
        min-severity: high
        advanced-security: "true"

    - name: Fail on a high finding
      uses: zizmorcore/zizmor-action@45d7276c9ca790aabd705e31ca99c6185c3e76dd # v0.8.1
      with:
        config: ${{ runner.temp }}/zizmor.yml
        min-severity: high
        advanced-security: "false"
