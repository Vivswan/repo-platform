name: Validate Commit Names
description: >-
  Fails when any commit subject in the push/PR range is not a Conventional
  Commit (feat/fix/chore/docs/...). Merge commits are skipped. Requires the
  repository to be checked out with fetch-depth: 0 so the base..head range
  is resolvable on pull_request events.

runs:
  using: composite
  steps:
    - name: Check for a caller-installed bun
      id: bun
      shell: bash
      run: echo "present=$(command -v bun >/dev/null && echo true || echo false)" >> "$GITHUB_OUTPUT"

    # Skipped when the calling job already installed bun: reusing it keeps
    # the caller's version pin and avoids a second network fetch.
    - name: Set up bun
      id: setup-bun
      if: steps.bun.outputs.present != 'true'
      continue-on-error: true
      uses: oven-sh/setup-bun@v2

    # One retry: the setup's network fetch is a known transient flake, and
    # on nightly reporting paths a flake here turns a green night red.
    - name: Set up bun (retry)
      if: steps.setup-bun.outcome == 'failure'
      uses: oven-sh/setup-bun@v2

    - name: Validate commit subjects
      shell: bash
      run: bun "${{ github.action_path }}/validate-commit-names.ts"
