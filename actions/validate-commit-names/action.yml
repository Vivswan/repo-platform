name: Validate Commit Names
description: >-
  Fails when commitlint refuses a commit message under the action's
  commitlint.config.mjs (@commitlint/config-conventional plus one scope per
  subject); both feeders run that one judge. Without `title`, judges every
  commit in the push/PR range (commitlint ignores merge commits), which needs
  the repository checked out with fetch-depth: 0 so base..head resolves on
  pull_request events. With `title`, judges that one string instead and needs
  no checkout.

inputs:
  title:
    description: >-
      A PR title to judge in place of the commit range: it becomes the squash
      subject, so the same grammar holds it. Empty (the default) judges the range.
    required: false
    default: ""

runs:
  using: composite
  steps:
    # The action's pinned bun by absolute path: later steps run
    # steps.action-bun.outputs.path, never `bun` through PATH, where a later
    # setup-bun can put another bun first.
    - name: Set up the action's bun
      id: action-bun
      uses: Vivswan/repo-platform/actions/bun-setup@stable
      with:
        pin: ${{ github.action_path }}/.bun-version

    - name: Install the action's dependencies
      shell: bash
      env:
        ACTION_BUN: ${{ steps.action-bun.outputs.path }}
        ACTION_PATH: ${{ github.action_path }}
      run: '"$ACTION_BUN" install --frozen-lockfile --production --cwd "$ACTION_PATH"'

    - name: Validate the subjects
      shell: bash
      env:
        ACTION_BUN: ${{ steps.action-bun.outputs.path }}
        PR_TITLE: ${{ inputs.title }}
      run: '"$ACTION_BUN" "${{ github.action_path }}/validate-commit-names.ts"'
