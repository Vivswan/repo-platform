name: Check Typography
description: >-
  Fails on typographic look-alike and invisible unicode characters (curly
  quotes, dash look-alikes, Trojan-Source bidi controls, VS Code's ambiguous
  confusables). Per-repo exemptions via .typography-allow and
  .typography-allow.local files listing relative path prefixes to skip.

inputs:
  path:
    description: Directory to scan
    required: false
    default: "."

runs:
  using: composite
  steps:
    # The action's pinned bun by absolute path: later steps run
    # steps.action-bun.outputs.path, never `bun` through PATH, where a later
    # setup-bun can put another bun first.
    - name: Set up the action's bun
      id: action-bun
      uses: Vivswan/repo-platform/actions/bun-setup@build
      with:
        pin: ${{ github.action_path }}/.bun-version

    - name: Install character tables (monaco-editor)
      shell: bash
      working-directory: ${{ github.action_path }}
      env:
        ACTION_BUN: ${{ steps.action-bun.outputs.path }}
      # --production: dev deps (@types/node, typescript) are editor/typecheck
      # tooling, not needed to run the check. No --silent: a failed install
      # must name itself in the caller's log (a lockfile the caller's bun
      # could not parse once hid behind a bare exit 1).
      run: '"$ACTION_BUN" install --frozen-lockfile --production'

    - name: Check typography
      shell: bash
      env:
        SCAN_PATH: ${{ inputs.path }}
        ACTION_BUN: ${{ steps.action-bun.outputs.path }}
      run: '"$ACTION_BUN" "${{ github.action_path }}/check-typography.ts" "$SCAN_PATH"'
