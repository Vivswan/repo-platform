name: Check Typography
description: >-
  Fails on typographic look-alike and invisible unicode characters (curly
  quotes, dash look-alikes, Trojan-Source bidi controls, VS Code's ambiguous
  confusables). Per-repo exemptions via .typography-allow and
  .typography-allow.local files listing relative path prefixes to skip.

inputs:
  path:
    description: Directory to scan
    required: false
    default: "."

runs:
  using: composite
  steps:
    - name: Check for a bun matching the action's pin
      id: bun
      shell: bash
      env:
        BASH_ENV: ""
        SHELLOPTS: ""
        PIN_FILE: ${{ github.action_path }}/.bun-version
      run: |
        pin="$(<"$PIN_FILE")"
        path="$(command -v bun || true)"
        case "$path" in /*) ;; *) path="" ;; esac
        have=""
        if [ -n "$path" ]; then have="$("$path" --version 2>/dev/null)" || have=""; fi
        if [ -z "$pin" ] || [ "$have" != "$pin" ]; then path=""; fi
        echo "bun ${pin:-(no pin)}: ${path:-none on PATH}"
        echo "path=$path" >> "$GITHUB_OUTPUT"
        echo "pinned=$([ -n "$path" ] && echo true || echo false)" >> "$GITHUB_OUTPUT"

    # Skipped only when the caller's bun already IS the pinned version
    # (reuse then just skips a second network fetch): the action's scripts
    # and lockfile run on the action-local .bun-version pin (generated
    # from the manifests' bun pin), never on whatever the CALLER resolves
    # - a caller pinning an older bun cannot parse the lockfiles
    # repo-platform's bun writes.
    - name: Set up bun
      id: setup-bun
      if: steps.bun.outputs.pinned != 'true'
      continue-on-error: true
      uses: oven-sh/setup-bun@v2
      with:
        bun-version-file: ${{ github.action_path }}/.bun-version

    # One retry: the setup's network fetch is a known transient flake, and
    # on nightly reporting paths a flake here turns a green night red.
    - name: Set up bun (retry)
      if: steps.setup-bun.outcome == 'failure'
      uses: oven-sh/setup-bun@v2
      with:
        bun-version-file: ${{ github.action_path }}/.bun-version

    # Re-resolved after the setup so the recorded path is the bun it
    # installed; every later step runs that path, never bun through PATH.
    - name: Resolve the action's bun
      id: action-bun
      if: always()
      shell: bash
      env:
        BASH_ENV: ""
        SHELLOPTS: ""
        PIN_FILE: ${{ github.action_path }}/.bun-version
      run: |
        pin="$(<"$PIN_FILE")"
        path="$(command -v bun || true)"
        case "$path" in /*) ;; *) path="" ;; esac
        have=""
        if [ -n "$path" ]; then have="$("$path" --version 2>/dev/null)" || have=""; fi
        if [ -z "$pin" ] || [ "$have" != "$pin" ]; then path=""; fi
        echo "bun ${pin:-(no pin)}: ${path:-none on PATH}"
        echo "path=$path" >> "$GITHUB_OUTPUT"
        echo "pinned=$([ -n "$path" ] && echo true || echo false)" >> "$GITHUB_OUTPUT"

    - name: Install character tables (monaco-editor)
      shell: bash
      working-directory: ${{ github.action_path }}
      env:
        BASH_ENV: ""
        SHELLOPTS: ""
        ACTION_BUN: ${{ steps.action-bun.outputs.path }}
      # --production: dev deps (@types/node, typescript) are editor/typecheck
      # tooling, not needed to run the check. No --silent: a failed install
      # must name itself in the caller's log (a lockfile the caller's bun
      # could not parse once hid behind a bare exit 1).
      run: '"$ACTION_BUN" install --frozen-lockfile --production'

    - name: Check typography
      shell: bash
      env:
        BASH_ENV: ""
        SHELLOPTS: ""
        SCAN_PATH: ${{ inputs.path }}
        ACTION_BUN: ${{ steps.action-bun.outputs.path }}
      run: '"$ACTION_BUN" "${{ github.action_path }}/check-typography.ts" "$SCAN_PATH"'
