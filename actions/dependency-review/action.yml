name: Dependency Review
description: >-
  The fleet's dependency-review gate: wraps actions/dependency-review-action
  so the upstream version pin and the severity threshold live in one place
  instead of in every rendered ci.yml. Diffs the dependency graph between
  the PR's base and head; only PR events have a diff to review, so callers
  put the pull_request condition on their steps.

inputs:
  fail-on-severity:
    description: Lowest vulnerability severity that fails the gate
    required: false
    # Pinned here so an upstream default change cannot move the gate silently.
    default: high

runs:
  using: composite
  steps:
    - name: Review the dependency diff
      uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
      with:
        fail-on-severity: ${{ inputs.fail-on-severity }}
