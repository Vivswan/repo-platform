name: Check Shell Complexity
description: >-
  Fails on a shell body that is more than a straight line of commands: a
  branch, a loop, a function, `||` error handling, or a command substitution
  whose result is tested belongs in a TypeScript script run by bun. Judges
  every inline body in the caller's checkout: workflow and composite-action
  `run:` steps (bash, sh, zsh, pwsh, powershell, cmd), moon task scripts,
  Containerfile RUN instructions, and *.sh, *.bash, *.zsh, *.ps1, *.psm1,
  *.bat, *.cmd files, plus a tracked extensionless file whose shebang names
  one of those shells (a git hook). bash/sh/zsh parse with mvdan/sh (shfmt's parser);
  PowerShell parses with pwsh's own parser, so pwsh must be on PATH when a
  PowerShell body exists (the step fails naming it otherwise); cmd, which no
  parser serves, is judged by tokens after dropping rem lines, so a keyword
  inside a quoted argument is refused too. Findings are written ONCE as one
  every event, the step summary and the log annotations, plus a sticky PR
  comment on pull_request events (deleted when there is nothing to say).
  Files carrying repo-platform's managed header are skipped and counted
  (the caller cannot fix them); a yaml file the reader cannot parse warns and
  is skipped (yamllint owns yaml validity). Repo-owned exemptions live in
  .shell-complexity-allow.local, one path per line with a `# reason`. The
  calling job needs pull-requests: write for the comment.

runs:
  using: composite
  steps:
    # The action's pinned bun by absolute path: later steps run
    # steps.action-bun.outputs.path, never `bun` through PATH, where a later
    # setup-bun can put another bun first.
    - name: Set up the action's bun
      id: action-bun
      uses: Vivswan/repo-platform/actions/bun-setup@stable
      with:
        from: ${{ github.action_path }}

    - name: Install the action's dependencies
      shell: bash
      env:
        ACTION_BUN: ${{ steps.action-bun.outputs.path }}
        ACTION_PATH: ${{ github.action_path }}
      run: '"$ACTION_BUN" install --frozen-lockfile --production --cwd "$ACTION_PATH"'

    # continue-on-error so the comment steps run first; the last step
    # re-raises. The script records report=findings|clean|error itself; a
    # crash before that leaves it empty, which posts no comment.
    - name: Check shell complexity
      id: check
      continue-on-error: true
      shell: bash
      env:
        ACTION_BUN: ${{ steps.action-bun.outputs.path }}
        REPORT_PATH: ${{ runner.temp }}/check-shell-complexity-report.md
      run: '"$ACTION_BUN" "${{ github.action_path }}/check-shell-complexity.ts"'

    # The comment is a convenience sink: the summary and annotations carry
    # the same table, so a token without pull-requests write (a fork or
    # Dependabot PR) must not turn the verdict red.
    - name: Post the findings as a sticky PR comment
      if: github.event_name == 'pull_request' && steps.check.outputs.report == 'findings'
      continue-on-error: true
      uses: marocchino/sticky-pull-request-comment@5770ad5eb8f42dd2c4f34da00c94c5381e49af88 # v3.0.5
      with:
        header: repo-platform/check-shell-complexity
        path: ${{ runner.temp }}/check-shell-complexity-report.md

    - name: Remove a stale sticky comment
      if: github.event_name == 'pull_request' && steps.check.outputs.report == 'clean'
      continue-on-error: true
      uses: marocchino/sticky-pull-request-comment@5770ad5eb8f42dd2c4f34da00c94c5381e49af88 # v3.0.5
      with:
        header: repo-platform/check-shell-complexity
        delete: true

    - name: Fail on a refused construct
      if: steps.check.outcome == 'failure'
      shell: bash
      run: |
        echo "::error::check-shell-complexity failed; see the annotations above, the step summary, or the PR comment."
        exit 1
