name: Nightly Issue
description: |
  Files, refreshes, or closes the tracking issue of a nightly stream (fuzz, plain CI, security, link rot): the fleet's
  issue mechanism, as the sticky PR comment is its comment mechanism (docs/modules/tracking-issues.md).

  - report: files the stream's issue, or refreshes the open one, the body replaced and never appended to.
  - resolve: after a green run, comments on and closes the open labeled issues.

  Which issue a refresh takes, how many a resolve closes, and who is assigned and why are docs/modules/tracking-issues.md's.

  No stream's wording is a default: every caller names its mode and stream, and in report mode its title and label
  tuple.
  With an artifacts-dir the body is built from failure reports under docs/modules/fuzzer.md's contract; without one it
  is a generic report (workflow, commit, run link).

  The calling job needs issues: write, and gh on the runner.

inputs:
  mode:
    description: report (file/update from artifacts-dir) or resolve (close after a green run)
    required: true
  label:
    description: Label identifying the issue stream, one open issue per label
    required: true
  title:
    description: Title of the issue, required in report mode, and set again on a refresh
    required: false
  artifacts-dir:
    description: >-
      Directory of per-failure subdirectories (contract v1), or empty for a stream without failure artifacts, which
      report mode files as a generic nightly-failure report.
    required: false
    default: ""
  artifact-name:
    description: >-
      Name of the uploaded workflow artifact carrying the full reports, which the issue body summarizes and points at,
      or empty to make the body the only record (every report whole, cut at GitHub's body limit).
    required: false
    default: ""
  label-color:
    description: >-
      Color report mode creates the label with or repaints an existing one to (required in report mode).
    required: false
  label-description:
    description: >-
      Description report mode creates the label with or resets an existing one to (required in report mode).
    required: false
  stream:
    description: >-
      Which nightly stream the issue tracks: fuzz speaks of failure reports, crashing inputs, and unpinned regression
      seeds, while generic carries no fuzz notions.
    required: true

outputs:
  issue-number:
    description: The issue refreshed or created (empty in resolve mode)
    value: ${{ steps.issue.outputs.issue-number }}

runs:
  using: composite
  steps:
    # The action's pinned bun by absolute path: later steps run
    # steps.action-bun.outputs.path, never `bun` through PATH, where a later
    # setup-bun can put another bun first.
    - name: Set up the action's bun
      id: action-bun
      uses: $/actions/bun-setup
      with:
        from: ${{ github.action_path }}

    - name: Install the action's dependencies
      shell: bash
      env:
        ACTION_BUN: ${{ steps.action-bun.outputs.path }}
        ACTION_PATH: ${{ github.action_path }}
      run: '"$ACTION_BUN" install --frozen-lockfile --production --cwd "$ACTION_PATH"'

    # The label and the report tuple ride along for the script's requirement
    # check: a composite's `required: true` only documents, and the later
    # steps would otherwise list issues under an empty label, create a label
    # with an empty color, or file an issue with no title.
    - name: Assemble the issue body or the close comment
      id: body
      shell: bash
      env:
        MODE: ${{ inputs.mode }}
        LABEL: ${{ inputs.label }}
        ARTIFACTS_DIR: ${{ inputs.artifacts-dir }}
        ARTIFACT_NAME: ${{ inputs.artifact-name }}
        STREAM: ${{ inputs.stream }}
        TITLE: ${{ inputs.title }}
        LABEL_COLOR: ${{ inputs.label-color }}
        LABEL_DESCRIPTION: ${{ inputs.label-description }}
        ACTION_BUN: ${{ steps.action-bun.outputs.path }}
      run: '"$ACTION_BUN" "${{ github.action_path }}/fuzz-issue.ts"'

    # Every gh call names the repository: the starters' report jobs run
    # this action without a checkout.
    # gh lists newest first, and humans can label extra issues into the
    # stream, so one open issue per label is a goal, not an invariant.
    - name: Find the stream's open issue
      if: inputs.mode == 'report'
      id: open
      shell: bash
      env:
        GH_TOKEN: ${{ github.token }}
        LABEL: ${{ inputs.label }}
      run: >-
        number=$(gh issue list --repo "$GITHUB_REPOSITORY" --label "$LABEL" --state open --limit 1 --json number --jq '.[0].number // empty') &&
        echo "number=$number" >> "$GITHUB_OUTPUT"

    # --force repaints an existing label to the stream's tuple, which is the
    # tuple the module's settings layer declares; the plan refuses a stream
    # label the fleet layers already manage, so no other label is touched.
    - name: Create the stream's label
      if: inputs.mode == 'report'
      shell: bash
      env:
        GH_TOKEN: ${{ github.token }}
        LABEL: ${{ inputs.label }}
        LABEL_COLOR: ${{ inputs.label-color }}
        LABEL_DESCRIPTION: ${{ inputs.label-description }}
      run: gh label create "$LABEL" --repo "$GITHUB_REPOSITORY" --color "$LABEL_COLOR" --description "$LABEL_DESCRIPTION" --force

    - name: File or refresh the issue
      if: inputs.mode == 'report'
      id: issue
      uses: peter-evans/create-issue-from-file@fca9117c27cdc29c6c4db3b86c48e4115a786710 # v6.0.0
      with:
        token: ${{ github.token }}
        issue-number: ${{ steps.open.outputs.number }}
        title: ${{ inputs.title }}
        content-filepath: ${{ steps.body.outputs.file }}
        labels: ${{ inputs.label }}
        assignees: ${{ github.repository_owner }}

    # Up to 100 open labeled issues, not only the newest: release-health
    # blocks while any carries the label, so one left open would keep
    # releases blocked under a log saying all was resolved.
    - name: Close the stream's open issues
      if: inputs.mode == 'resolve'
      shell: bash
      env:
        GH_TOKEN: ${{ github.token }}
        LABEL: ${{ inputs.label }}
        COMMENT_FILE: ${{ steps.body.outputs.file }}
      run: >-
        gh issue list --repo "$GITHUB_REPOSITORY" --label "$LABEL" --state open --limit 100 --json number --jq '.[].number' |
        xargs -r -I{} gh issue close {} --repo "$GITHUB_REPOSITORY" --reason completed --comment "$(cat "$COMMENT_FILE")"
