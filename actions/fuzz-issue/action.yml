name: Fuzz Issue
description: >-
  Files or updates a label-deduplicated tracking issue from a directory of
  nightly-fuzz failure reports (report mode), or comments on and closes the
  open issue after a green run (resolve mode). The failure-report contract
  the artifacts directory must follow is documented in repo-platform's
  docs/fuzzer.md. Needs issues: write and gh on the runner (preinstalled on
  GitHub-hosted runners).

inputs:
  mode:
    description: report (file/update from artifacts-dir) or resolve (close after a green run)
    required: false
    default: report
  label:
    description: Label identifying the issue stream; one open issue per label
    required: true
  title:
    description: Title used when a new issue is created
    required: false
    default: Nightly fuzz failures
  artifacts-dir:
    description: Directory of per-failure subdirectories (contract v1); required in report mode
    required: false
    default: ""
  artifact-name:
    description: Name of the uploaded workflow artifact to point readers at (optional)
    required: false
    default: ""
  token:
    description: Token used by gh; needs issues write
    required: false
    default: ${{ github.token }}

outputs:
  issue-number:
    description: The issue commented on or created (empty in resolve mode)
    value: ${{ steps.file.outputs.issue-number }}

runs:
  using: composite
  steps:
    - name: Set up bun
      uses: oven-sh/setup-bun@v2

    - name: File, update, or resolve the fuzz issue
      id: file
      shell: bash
      env:
        GH_TOKEN: ${{ inputs.token }}
        MODE: ${{ inputs.mode }}
        LABEL: ${{ inputs.label }}
        TITLE: ${{ inputs.title }}
        ARTIFACTS_DIR: ${{ inputs.artifacts-dir }}
        ARTIFACT_NAME: ${{ inputs.artifact-name }}
      run: bun "${{ github.action_path }}/fuzz-issue.ts"
