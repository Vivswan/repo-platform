name: Yamllint
description: |
  The fleet's YAML lint step: runs the yamllint locked in this action's uv.lock over the caller's checkout in strict
  mode, so warnings fail too; the repository's own .yamllint config is honored.

  One implementation for every managed repository, so the install, the version, and the invocation cannot drift per
  repository.

  The one bypass is yamllint's own: a `# yamllint disable-line rule:<name>` comment on the line. The `.yamllint` config
  itself is managed.

runs:
  using: composite
  steps:
    - name: Set up uv
      uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
      with:
        working-directory: ${{ github.action_path }}
        enable-cache: false

    - name: Lint YAML
      shell: bash
      run: uv run --isolated --project "$GITHUB_ACTION_PATH" --locked yamllint -s .
