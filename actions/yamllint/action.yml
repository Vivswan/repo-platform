name: Yamllint
description: |
  Installs the yamllint pinned in this action's requirements.txt and lints the caller's checkout with it, the fleet's YAML lint step.

  It lints in strict mode, so warnings fail too. The repository's own .yamllint config is honored.

  One implementation for every managed repository, so the install, the version, and the
  invocation cannot drift per repository.

runs:
  using: composite
  steps:
    - name: Install yamllint
      shell: bash
      run: python3 -m pip install --quiet --requirement "$GITHUB_ACTION_PATH/requirements.txt"

    # yamllint's own file selection (its yaml-files patterns and the repository's ignore list) minus the platform
    # checkout fleet-ci.yml makes beside the caller's files (actions/shared/platform.ts), which it would otherwise
    # read under the caller's config.
    - name: Lint YAML
      shell: bash
      run: yamllint --list-files . | grep -v '^\./\.repo-platform-checkout/' | tr '\n' '\0' | xargs -0 yamllint -s
