name: Dedupe Bun Lockfile
description: >-
  Regenerates every tracked bun.lock from scratch in the calling checkout
  and pushes the fix commit to a Dependabot PR's head: Dependabot bumps the
  target package but leaves stale nested entries behind, so `bun install
  --frozen-lockfile` fails with mixed-version errors, and bun keeps a stale
  lockfile as a valid resolution, so only a delete-then-resolve drops them.
  Nothing changed is a no-op. The commit carries the `[dependabot skip]`
  trailer so Dependabot keeps rebasing over it. GitHub holds the new head's
  `pull_request` run for approval after a github.token push, so after a push
  the action warns and sets `notice` to the text the caller posts as its
  sticky comment, but stays green. The calling job needs contents write and
  a checkout of the PR head with persist-credentials off.

inputs:
  token:
    description: The token the push authenticates with (github.token).
    required: true
  head-ref:
    description: The PR head branch the fix commit is pushed to.
    required: true

outputs:
  notice:
    description: How to release the held run, when a fix commit was pushed; empty otherwise.
    value: ${{ steps.dedupe.outputs.notice }}

runs:
  using: composite
  steps:
    # The action's pinned bun by absolute path: later steps run
    # steps.action-bun.outputs.path, never `bun` through PATH, where a later
    # setup-bun can put another bun first. The same bun lands on PATH for
    # the lockfile regeneration, which runs `bun install` by name.
    - name: Set up the action's bun
      id: action-bun
      uses: Vivswan/repo-platform/actions/bun-setup@stable
      with:
        pin: ${{ github.action_path }}/.bun-version

    - name: Regenerate, commit, and push the deduped lockfiles
      id: dedupe
      shell: bash
      env:
        TOKEN: ${{ inputs.token }}
        HEAD_REF: ${{ inputs.head-ref }}
        ACTION_BUN: ${{ steps.action-bun.outputs.path }}
      run: '"$ACTION_BUN" "${{ github.action_path }}/dedupe-bun-lockfile.ts"'
