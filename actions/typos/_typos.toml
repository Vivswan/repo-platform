# The fleet's typos allowlist: actions/typos passes this file as --config,
# and a repository's own _typos.toml extends it.

[files]
# Lockfiles and generated bundles carry hashes and minified identifiers,
# never prose.
extend-exclude = ["*.lock", "*.lockb", "package-lock.json", "*.min.js", "*.min.css", "*.svg"]

[default]
extend-ignore-re = [
  # Hex digests (commit shas, checksums) of seven or more nibbles.
  "\\b[0-9a-f]{7,}\\b",
  # A line ending in `# typos: ignore` or `// typos: ignore` opts itself out.
  "(?Rm)^.*(#|//)\\s*typos:\\s*ignore.*$",
]
