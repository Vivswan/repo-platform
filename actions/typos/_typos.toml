# The fleet's typos allowlist: actions/typos passes this file as --config,
# and a repository's own _typos.toml extends it.

[files]
# Lockfiles, minified bundles, installed packages, and a packaged action's
# committed build output at the checkout root carry hashes and mangled
# identifiers, never prose. A root lib/ is source in a Node repository, so
# a repository that generates it excludes it in its own _typos.toml.
extend-exclude = ["*.lock", "*.lockb", "package-lock.json", "*.min.js", "*.min.css", "*.svg", "/dist/", "node_modules/"]

[default]
extend-ignore-re = [
  # Hex digests (commit shas, checksums) of seven or more nibbles.
  "\\b[0-9a-f]{7,}\\b",
  # A line ending in `# typos: ignore` or `// typos: ignore` opts itself out.
  "(?Rm)^.*(#|//)\\s*typos:\\s*ignore.*$",
]
