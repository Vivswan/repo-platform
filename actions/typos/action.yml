name: Typos
description: |
  Spell-checks the caller's checkout with the typos locked in this action's uv.lock and the fleet allowlist shipped
  beside this action; typos layers that allowlist as --config over the repository's own file, which extends it without
  replacing it.

  A finding fails the step and is a warning annotation on its line, through the problem matcher shipped beside this
  action. The bypasses are the repository's own: an entry in its `_typos.toml` (`typos.toml` and `.typos.toml` are
  read too), where `[default.extend-words]` holds its vocabulary, `[files] extend-exclude` the fixtures spelled wrong
  on purpose, and `[default.extend-identifiers]` one identifier; or a trailing `typos: ignore` comment for a one-off.

runs:
  using: composite
  steps:
    - name: Set up uv
      uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
      with:
        working-directory: ${{ github.action_path }}
        enable-cache: false

    - name: Annotate each finding
      shell: bash
      run: echo "::add-matcher::$GITHUB_ACTION_PATH/typos-matcher.json"

    # One line a finding, the same under every locale and with no color, which is what the matcher reads.
    - name: Check spelling
      shell: bash
      run: uv run --isolated --project "$GITHUB_ACTION_PATH" --locked typos --config "$GITHUB_ACTION_PATH/_typos.toml" --format brief --color never .
