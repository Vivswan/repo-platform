name: Typos
description: |
  Spell-checks the caller's checkout with the pinned typos action and the fleet allowlist shipped beside this action;
  typos layers that allowlist as --config over the repository's own file, which extends it without replacing it.

  A finding fails the step. The repository's own extensions, the only bypass, are docs/fleet-guidelines.md's, "How to
  bypass a check".

runs:
  using: composite
  steps:
    - name: Check spelling
      uses: crate-ci/typos@7f9d0819ca1c008ade73f4b41fa9d258d48f605b # v1.51.1
      with:
        config: ${{ github.action_path }}/_typos.toml
