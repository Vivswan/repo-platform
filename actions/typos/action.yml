name: Typos
description: |
  Spell-checks the caller's checkout with the pinned typos action and the fleet allowlist shipped beside this action;
  typos layers that allowlist as --config over the repository's own file, which extends it without replacing it.

  A finding fails the step. The bypasses are the repository's own: an entry in its `_typos.toml` (`typos.toml` and
  `.typos.toml` are read too), where `[default.extend-words]` holds its vocabulary, `[files] extend-exclude` the
  fixtures spelled wrong on purpose, and `[default.extend-identifiers]` one identifier; or a trailing `typos: ignore`
  comment for a one-off.

runs:
  using: composite
  steps:
    - name: Check spelling
      uses: crate-ci/typos@7f9d0819ca1c008ade73f4b41fa9d258d48f605b # v1.51.1
      with:
        config: ${{ github.action_path }}/_typos.toml
