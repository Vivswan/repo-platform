name: Lychee
description: |
  The fleet's link check: runs the lychee locked in this action's uv.lock with the arguments given, so one version
  judges every link the platform checks, and nothing on the runner's PATH decides which lychee runs.

  - lychee runs anonymously: a GITHUB_TOKEN in the job's environment is not handed to it.
  - `args` is read with no shell: each line is one argument as lychee receives it, an empty line is skipped, a value
    is written unquoted, and an option takes its value as `--option=value` or on the next line.
  - Its markdown report is written to `report`, printed in the log, and appended to the step summary.
  - A report that counts no link at all fails the step, whatever `fail` says: excluded links count, so a zero is a
    check that read nothing.
  - With `fail: "false"` the caller judges by `exit-code`: 0 is clean, 2 is broken links, and any other code is
    lychee's own error.

inputs:
  args:
    description: lychee's arguments, one per line.
    required: true
  working-directory:
    description: The directory lychee runs in, where it reads `lychee.toml` and `.lycheeignore`.
    required: true
  report:
    description: Absolute path the markdown report is written to; its directory is created.
    required: true
  fail:
    description: Whether a non-zero exit of lychee fails the step.
    required: false
    default: "true"

outputs:
  exit-code:
    description: lychee's exit code; empty when lychee never ran.
    value: ${{ steps.lychee.outputs.exit-code }}

runs:
  using: composite
  steps:
    # The action's pinned bun by absolute path: later steps run
    # steps.action-bun.outputs.path, never `bun` through PATH, where a later
    # setup-bun can put another bun first.
    - name: Set up the action's bun
      id: action-bun
      uses: $/actions/bun-setup
      with:
        from: ${{ github.action_path }}

    - name: Install the action's dependencies
      shell: bash
      env:
        ACTION_BUN: ${{ steps.action-bun.outputs.path }}
        ACTION_PATH: ${{ github.action_path }}
      run: '"$ACTION_BUN" install --frozen-lockfile --production --cwd "$ACTION_PATH"'

    - name: Set up uv
      uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
      with:
        working-directory: ${{ github.action_path }}
        enable-cache: false

    # uv puts the locked lychee on the script's PATH, in the process it starts: nothing a shell profile resets.
    - name: Check the links
      id: lychee
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      env:
        ACTION_BUN: ${{ steps.action-bun.outputs.path }}
        ACTION_PATH: ${{ github.action_path }}
        INPUT_ARGS: ${{ inputs.args }}
        INPUT_REPORT: ${{ inputs.report }}
        INPUT_FAIL: ${{ inputs.fail }}
      run: uv run --isolated --project "$ACTION_PATH" --locked "$ACTION_BUN" "${{ github.action_path }}/lychee.ts"
