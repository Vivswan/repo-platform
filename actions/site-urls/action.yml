name: Site URLs
description: |
  Resolves where GitHub Pages serves the calling repository, for reusable-site.yml's deploy (docs/modules/site.md):
  the base path the site-build hook builds for, the origin, and the edit and tree patterns the nightly link-rot check reads.

  - With `site-url`, the origin and the base path are that address's: a custom domain's site sits at `/`.
  - Without it, they follow the rule for a site with no custom domain: `https://<owner>.github.io` and `/<repo>/`, or
    `/` for the owner's user site, the repository named `<owner>.github.io`.
  - The host is lowercase either way: Pages serves it so and lychee reports hosts that way.

inputs:
  site-url:
    description: The address GitHub reports for the site (configure-pages' base_url), or empty where no Pages API can be asked
    required: false
    default: ""

outputs:
  base-path:
    description: The URL path the site is served under, with a trailing slash, "/<repo>/" or "/"
    value: ${{ steps.urls.outputs.base-path }}
  origin:
    description: The site's origin, https://<owner>.github.io or the custom domain's
    value: ${{ steps.urls.outputs.origin }}
  edit-links:
    description: The regex matching the theme's "Edit this page" links, which an anonymous crawl cannot judge
    value: ${{ steps.urls.outputs.edit-links }}
  tree-links:
    description: >-
      lychee's remap (pattern, a space, the replacement) turning a github.com link into this repository's default
      branch into the checkout's path, so the tree judges it
    value: ${{ steps.urls.outputs.tree-links }}

runs:
  using: composite
  steps:
    # The action's pinned bun by absolute path: later steps run
    # steps.action-bun.outputs.path, never `bun` through PATH, where a later
    # setup-bun can put another bun first.
    - name: Set up the action's bun
      id: action-bun
      uses: $/actions/bun-setup
      with:
        from: ${{ github.action_path }}

    - name: Install the action's dependencies
      shell: bash
      env:
        ACTION_BUN: ${{ steps.action-bun.outputs.path }}
        ACTION_PATH: ${{ github.action_path }}
      run: '"$ACTION_BUN" install --frozen-lockfile --production --cwd "$ACTION_PATH"'

    - name: Resolve the site URLs
      id: urls
      shell: bash
      env:
        ACTION_BUN: ${{ steps.action-bun.outputs.path }}
        DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        SITE_URL: ${{ inputs.site-url }}
      run: '"$ACTION_BUN" "${{ github.action_path }}/urls.ts"'
