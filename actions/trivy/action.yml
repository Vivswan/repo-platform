name: Trivy
description: |
  Scans the caller's checkout with Trivy (lockfiles, Dockerfiles, infrastructure files) on every push and pull
  request; the configuration lives here once, so no managed repository carries a Trivy file.

  Advisory: a HIGH or CRITICAL vulnerability with a fix available, and any HIGH or CRITICAL misconfiguration
  (ignore-unfixed filters vulnerabilities only, since a misconfiguration has no fixed version), is a warning
  annotation on its target, never a red step. A scan error is the one red. A MEDIUM or LOW finding appears nowhere.

  A repository's `.trivyignore` is not read, and its `trivy.yaml` cannot turn a finding red; the remedy for a finding is
  the fix.

runs:
  using: composite
  steps:
    # The action's pinned bun by absolute path: later steps run
    # steps.action-bun.outputs.path, never `bun` through PATH, where a later
    # setup-bun can put another bun first.
    - name: Set up the action's bun
      id: action-bun
      uses: $/actions/bun-setup
      with:
        from: ${{ github.action_path }}

    - name: Install the action's dependencies
      shell: bash
      env:
        ACTION_BUN: ${{ steps.action-bun.outputs.path }}
        ACTION_PATH: ${{ github.action_path }}
      run: '"$ACTION_BUN" install --frozen-lockfile --production --cwd "$ACTION_PATH"'

    # The database cache lives outside the workspace so the scan never
    # walks it; the wrapper restores it by date.
    #
    # The exit code and the ignore file are explicit, since Trivy otherwise
    # reads them from the repository (a trivy.yaml, a .trivyignore): exit
    # code 0 keeps the step green whatever it finds, and /dev/null is an
    # empty ignore file, so nothing is bypassed.
    - name: Scan for fixable vulnerabilities and any misconfiguration at high and critical
      uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
      env:
        TRIVY_IGNOREFILE: /dev/null
      with:
        version: v0.74.0
        scan-type: fs
        scan-ref: .
        scanners: vuln,misconfig
        severity: HIGH,CRITICAL
        ignore-unfixed: "true"
        exit-code: "0"
        format: json
        output: ${{ runner.temp }}/trivy.json
        cache-dir: ${{ runner.temp }}/trivy-cache

    - name: Annotate the findings
      shell: bash
      env:
        ACTION_BUN: ${{ steps.action-bun.outputs.path }}
        RESULTS: ${{ runner.temp }}/trivy.json
      run: '"$ACTION_BUN" "${{ github.action_path }}/annotate.ts"'
