name: Release Health
description: |
  Gates releases in managed repositories on what says the repository is not release-worthy; any of these, open, fails
  the gate: a tracking issue of a nightly stream (fuzz or CI), a release-blocker issue, or a Dependabot alert at high
  or critical severity.

  Modes, each named by the caller:

  - pull-request: on a release-please PR's CI, in a full-history checkout of the head. Reads whether the head contains
    the base tip into `behind` (a stale release PR would cut a release missing commits, so the caller refreshes it in
    the same run), then runs the gates.
  - after-refresh: there, in the same checkout, after release-please's propose ran against a stale head. Green naming the new
    head when it moved and the base still stands where the checkout fetched it; red when the base moved, since it may carry a
    commit the refresh never saw, and that commit's own run refreshes the PR.
  - after-refresh, head unmoved: beside a merged release PR still pending it fails (release-please proposed nothing).
    Otherwise the PR body was unchanged, so no changelog line is lost: GitHub's update-branch merges the base, and a
    head still unmoved fails.
  - release: on the main-push path. Gates a release-PR merge and reports which push it was through `release-cut`; an
    ordinary push is not gated, and `head-current` says whether the branch still stands at the judged commit.
  - after-propose: after release-please's propose step. Fails when a merged release PR has worn "autorelease: pending"
    for over 30 minutes, since release-please then proposes nothing, green.

  The release-override label on the release PR turns gate failures into warnings; freshness and the pending check are
  never overridden.

  Needs GH_TOKEN with issues read, pull-requests read, and vulnerability-alerts read (an unreadable alerts endpoint
  fails
  the gate), gh >= 2.51 on the runner (GitHub-hosted runners ship current gh), and for after-refresh's branch update
  contents write and pull-requests write.

inputs:
  mode:
    description: >-
      pull-request (on the release PR's CI), after-refresh (there, after release-please's
      propose), release (on the main-push release path), or after-propose (after
      release-please proposed)
    required: true
  tracking-labels:
    description: >-
      Comma-separated labels of the nightly tracking-issue streams, where an open issue carrying any of them blocks
      (empty disables the tracking gates).
    required: false
    default: ""

outputs:
  behind:
    description: 'Pull-request mode only: "true" when the PR head lacks the base branch tip, "false" when it contains it.'
    value: ${{ steps.freshness.outputs.behind }}
  release-cut:
    description: 'Release mode only: "true" when the judged commit is a release-PR merge, "false" otherwise.'
    value: ${{ steps.check.outputs.release-cut }}
  head-current:
    description: >-
      Release mode, ordinary pushes only: "true" when the branch head is still the judged
      commit, "false" when a newer push moved it (that run refreshes the release PR).
    value: ${{ steps.check.outputs.head-current }}

runs:
  using: composite
  steps:
    # The action's pinned bun by absolute path: later steps run
    # steps.action-bun.outputs.path, never `bun` through PATH, where a later
    # setup-bun can put another bun first.
    - name: Set up the action's bun
      id: action-bun
      uses: $/actions/bun-setup
      with:
        from: ${{ github.action_path }}

    - name: Install the action's dependencies
      shell: bash
      env:
        ACTION_BUN: ${{ steps.action-bun.outputs.path }}
        ACTION_PATH: ${{ github.action_path }}
      run: '"$ACTION_BUN" install --frozen-lockfile --production --cwd "$ACTION_PATH"'

    # The merge ref GitHub checks out by default already contains the base
    # tip, so the caller checks out the PR head; GITHUB_BASE_REF names the base.
    - name: Read whether the release PR contains the tip of its base branch
      id: freshness
      if: inputs.mode == 'pull-request'
      shell: bash
      env:
        ACTION_BUN: ${{ steps.action-bun.outputs.path }}
      run: '"$ACTION_BUN" "${{ github.action_path }}/freshness.ts"'

    - name: Check release health
      id: check
      shell: bash
      env:
        MODE: ${{ inputs.mode }}
        TRACKING_LABELS: ${{ inputs.tracking-labels }}
        ACTION_BUN: ${{ steps.action-bun.outputs.path }}
      run: '"$ACTION_BUN" "${{ github.action_path }}/release-health.ts"'
