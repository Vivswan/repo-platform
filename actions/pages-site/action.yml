name: Pages Site
description: >-
  Assembles the fleet's GitHub Pages site (docs/site.md). Two parts, alone
  or together: the repository's own website, prebuilt by its site-build
  hook and handed over as a directory (site-dir), copied to the root; and
  the docs, the repository's docs/ under the central VitePress theme
  (config and theme live in this action, the repository carries only
  markdown), versioned from its plain vX.Y.Z tags - latest/ from HEAD, one
  directory per served tag (a tag whose tree has no docs/ is skipped with a
  notice), the mount root serving the newest served version - at
  /<docs_path>/ beside the website or at the root alone. Other roots of the
  repository (skills/, for one) render inside the docs through the include
  list. Once every part is in place the whole artifact's internal links
  are checked, fragments included, and a broken one fails the step. With
  neither part the step ends green with publish false and no directory.
  With check true it instead builds docs/ once, strictly (dead internal
  links fatal), with the same include roots and link check, as the docs PR
  check. The configuration is the config input, or the repository's
  registration read through the plan action when the input is empty; a
  null docs_path (the registration's site.path: null) turns the docs half
  off, so the website publishes alone whatever docs/ carries and the check
  stands down with a notice. A deploy needs a full checkout (fetch-depth
  0): version tags and per-ref trees come from git history.

inputs:
  site-dir:
    description: The repository's prebuilt website (the site-build hook's dist), a directory relative to the repository root; empty = no website
    required: false
    default: ""
  config:
    description: 'The site configuration as JSON {"site_title", "docs_path", "include", "link_rot_label"} (docs_path null = no docs half); empty reads the registration through the plan action'
    required: false
    default: ""
  check:
    description: Build docs/ once as a strict PR check (no artifact) instead of assembling the site
    required: false
    default: "false"
  custom-domain:
    description: Custom domain ("" = <owner>.github.io/<repo>)
    required: false
    default: ""
  max-versions:
    description: How many newest version tags the docs serve
    required: false
    default: "5"

outputs:
  publish:
    description: '"true" when a site was assembled and site-dir is ready to upload, "false" when there was nothing to publish (empty in check mode)'
    value: ${{ steps.assemble.outputs.publish }}
  site-dir:
    description: The assembled _site directory to upload as the Pages artifact (empty when publish is false or in check mode)
    value: ${{ steps.assemble.outputs.site-dir }}
  link-rot-label:
    description: The nightly external-link check's tracking label from the configuration ("" disables the check)
    value: ${{ steps.assemble.outputs.link-rot-label }}
  site-title:
    description: The docs title as built, the configuration's site_title verbatim
    value: ${{ steps.assemble.outputs.site-title }}

runs:
  using: composite
  steps:
    # The action's pinned bun by absolute path: later steps run
    # steps.action-bun.outputs.path, never `bun` through PATH, where a
    # caller's setup-bun can put another bun first.
    - name: Set up the action's bun
      id: action-bun
      uses: Vivswan/repo-platform/actions/bun-setup@stable
      with:
        pin: ${{ github.action_path }}/.bun-version

    - name: Install the pinned site toolchain
      shell: bash
      env:
        ACTION_BUN: ${{ steps.action-bun.outputs.path }}
      run: '"$ACTION_BUN" install --frozen-lockfile --cwd "${{ github.action_path }}"'

    # The registration-configured call: the plan resolves the docs
    # configuration from .repo-platform.yml in the caller's checkout.
    - name: Plan the site from the registration
      id: plan
      if: inputs.config == ''
      uses: Vivswan/repo-platform/actions/plan@stable
      with:
        mode: site

    - name: Build and assemble the site
      id: assemble
      shell: bash
      env:
        SITE_DIR: ${{ inputs.site-dir }}
        CHECK: ${{ inputs.check }}
        CONFIG: ${{ inputs.config != '' && inputs.config || steps.plan.outputs.config }}
        MAX_VERSIONS: ${{ inputs.max-versions }}
        CUSTOM_DOMAIN: ${{ inputs.custom-domain }}
        DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        ACTION_BUN: ${{ steps.action-bun.outputs.path }}
      run: '"$ACTION_BUN" "${{ github.action_path }}/build.ts"'
