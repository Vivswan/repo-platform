name: Pages Site
description: |
  Assembles the fleet's GitHub Pages site from the repository's own website, its docs/, or both; the layout and the
  versioning rules are docs/modules/site.md's.

  - The website arrives prebuilt by the repository's site-build hook as the site-dir input.
  - The configuration is the config input, or the registration read through the plan action when the input is empty.
  - With neither part the step ends green with publish false and no directory.
  - A deploy needs a full checkout (fetch-depth 0): version tags and per-ref trees come from git history.

inputs:
  site-dir:
    description: >-
      The repository's prebuilt website (the site-build hook's dist) as a directory relative to the repository root,
      or empty for no website.
    required: false
    default: ""
  config:
    description: >-
      The site configuration as JSON {"site_title", "docs_path", "include", "link_rot_label", "link_rot_color",
      "link_rot_description"} with docs_path null for no docs half, or empty to read the registration through the plan
      action.
    required: false
    default: ""
  check:
    description: Build docs/ once as a strict PR check (no artifact) instead of assembling the site
    required: false
    default: "false"

outputs:
  publish:
    description: >-
      "true" when a site was assembled and site-dir is ready to upload, "false" when there was nothing to publish, and
      empty in check mode.
    value: ${{ steps.assemble.outputs.publish }}
  site-dir:
    description: >-
      The assembled site directory to upload as the Pages artifact, empty when publish is false or in check mode.
    value: ${{ steps.assemble.outputs.site-dir }}
  link-rot-ignore:
    description: >-
      The nightly link-rot crawl's .lycheeignore, to stage into the site after the upload: the site's own links on its
      origin (the artifact's top-level entries under the base, and the base itself), judged against the artifact here,
      then the repository's own .lycheeignore when it has one; empty in check mode or with nothing to publish
    value: ${{ steps.assemble.outputs.link-rot-ignore }}
  link-rot-label:
    description: The nightly external-link check's tracking label from the configuration ("" disables the check)
    value: ${{ steps.assemble.outputs.link-rot-label }}
  link-rot-color:
    description: The color the link-rot label is created with, from the configuration
    value: ${{ steps.assemble.outputs.link-rot-color }}
  link-rot-description:
    description: The description the link-rot label is created with, from the configuration
    value: ${{ steps.assemble.outputs.link-rot-description }}
  site-title:
    description: The docs title as built, the configuration's site_title verbatim
    value: ${{ steps.assemble.outputs.site-title }}

runs:
  using: composite
  steps:
    # The action's pinned bun by absolute path: later steps run
    # steps.action-bun.outputs.path, never `bun` through PATH, where a
    # caller's setup-bun can put another bun first.
    - name: Set up the action's bun
      id: action-bun
      uses: $/actions/bun-setup
      with:
        from: ${{ github.action_path }}

    - name: Install the pinned site toolchain
      shell: bash
      env:
        ACTION_BUN: ${{ steps.action-bun.outputs.path }}
      run: '"$ACTION_BUN" install --frozen-lockfile --cwd "${{ github.action_path }}"'

    # The registration-configured call: the plan resolves the docs
    # configuration from .repo-platform.yml in the caller's checkout.
    - name: Plan the site from the registration
      id: plan
      if: inputs.config == ''
      uses: $/actions/plan
      with:
        mode: site

    - name: Build and assemble the site
      id: assemble
      shell: bash
      env:
        SITE_DIR: ${{ inputs.site-dir }}
        CHECK: ${{ inputs.check }}
        CONFIG: ${{ inputs.config != '' && inputs.config || steps.plan.outputs.config }}
        DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        ACTION_BUN: ${{ steps.action-bun.outputs.path }}
      run: '"$ACTION_BUN" "${{ github.action_path }}/build.ts"'

    # Every same-site link of a page built from HEAD must resolve in the
    # artifact as Pages serves it (docs/modules/site.md, "The docs PR check"): the
    # same lychee as reusable-site.yml's nightly link-rot step, offline.
    # It runs in the build's scratch directory: its lychee.toml is the
    # assembly's (the own-links remap, a file since the regex can outgrow an
    # argument), and no .lycheeignore of the caller's is there.
    - name: Check the site's internal links
      if: steps.assemble.outputs.link-check-args != ''
      uses: lycheeverse/lychee-action@e7477775783ea5526144ba13e8db5eec57747ce8 # v2.9.0
      with:
        lycheeVersion: v0.24.2
        workingDirectory: ${{ runner.temp }}/pages-site
        args: >-
          --offline
          --no-progress
          --include-fragments=anchor-only
          --index-files index.html
          --fallback-extensions html,htm
          ${{ steps.assemble.outputs.link-check-args }}
        output: ${{ runner.temp }}/pages-site/link-check.md
