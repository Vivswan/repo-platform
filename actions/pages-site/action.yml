name: Pages Site
description: |
  Assembles the fleet's GitHub Pages site from the repository's own website, its docs/, or both.

  The layout and the versioning rules (the two parts and where each mounts, the docs tiers from the
  vX.Y.Z tags, the include roots, the link check, the pages-exists question, a null docs_path, and
  check mode) are docs/modules/site.md's.

  The website arrives prebuilt by the repository's site-build hook as the site-dir input. The
  configuration is the config input, or the repository's registration read through the plan action
  when the input is empty. With neither part the step ends green with publish false and no directory.

  A deploy needs a full checkout (fetch-depth 0): version tags and per-ref trees come from git history.

inputs:
  site-dir:
    description: >-
      The repository's prebuilt website (the site-build hook's dist), a directory relative to
      the repository root. Empty means no website.
    required: false
    default: ""
  config:
    description: >-
      The site configuration as JSON {"site_title", "docs_path", "include", "link_rot_label",
      "link_rot_color", "link_rot_description"}, docs_path null for no docs half. Empty reads
      the registration through the plan action.
    required: false
    default: ""
  check:
    description: Build docs/ once as a strict PR check (no artifact) instead of assembling the site
    required: false
    default: "false"

outputs:
  publish:
    description: '"true" when a site was assembled and site-dir is ready to upload, "false" when there was nothing to publish (empty in check mode)'
    value: ${{ steps.assemble.outputs.publish }}
  site-dir:
    description: The assembled site directory to upload as the Pages artifact (empty when publish is false or in check mode)
    value: ${{ steps.assemble.outputs.site-dir }}
  pages-exists:
    description: >-
      "true" when the repository has a Pages site to deploy to, "false" with a warning when the
      settings apply has not created it yet, empty when publish is false or in check mode. The
      caller skips its Pages steps on "false", and any other answer from GitHub fails the action.
    value: ${{ steps.pages.outputs.exists }}
  link-rot-label:
    description: The nightly external-link check's tracking label from the configuration ("" disables the check)
    value: ${{ steps.assemble.outputs.link-rot-label }}
  link-rot-color:
    description: The color the link-rot label is created with, from the configuration
    value: ${{ steps.assemble.outputs.link-rot-color }}
  link-rot-description:
    description: The description the link-rot label is created with, from the configuration
    value: ${{ steps.assemble.outputs.link-rot-description }}
  site-title:
    description: The docs title as built, the configuration's site_title verbatim
    value: ${{ steps.assemble.outputs.site-title }}

runs:
  using: composite
  steps:
    # The action's pinned bun by absolute path: later steps run
    # steps.action-bun.outputs.path, never `bun` through PATH, where a
    # caller's setup-bun can put another bun first.
    - name: Set up the action's bun
      id: action-bun
      uses: Vivswan/repo-platform/actions/bun-setup@stable
      with:
        from: ${{ github.action_path }}

    - name: Install the pinned site toolchain
      shell: bash
      env:
        ACTION_BUN: ${{ steps.action-bun.outputs.path }}
      run: '"$ACTION_BUN" install --frozen-lockfile --cwd "${{ github.action_path }}"'

    # The registration-configured call: the plan resolves the docs
    # configuration from .repo-platform.yml in the caller's checkout.
    - name: Plan the site from the registration
      id: plan
      if: inputs.config == ''
      uses: Vivswan/repo-platform/actions/plan@stable
      with:
        mode: site

    - name: Build and assemble the site
      id: assemble
      shell: bash
      env:
        SITE_DIR: ${{ inputs.site-dir }}
        CHECK: ${{ inputs.check }}
        CONFIG: ${{ inputs.config != '' && inputs.config || steps.plan.outputs.config }}
        DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        ACTION_BUN: ${{ steps.action-bun.outputs.path }}
      run: '"$ACTION_BUN" "${{ github.action_path }}/build.ts"'

    # Every same-site link of a page built from HEAD must resolve in the
    # artifact as Pages serves it (docs/modules/site.md, "The docs PR check"): the
    # same lychee as reusable-site.yml's nightly link-rot step, offline.
    # It runs in the build's scratch directory, which holds no lychee.toml
    # or .lycheeignore of the caller's, so neither reconfigures the check.
    - name: Check the site's internal links
      if: steps.assemble.outputs.link-check-args != ''
      uses: lycheeverse/lychee-action@e7477775783ea5526144ba13e8db5eec57747ce8 # v2.9.0
      with:
        lycheeVersion: v0.24.2
        workingDirectory: ${{ runner.temp }}/pages-site
        args: >-
          --offline
          --no-progress
          --include-fragments=anchor-only
          --index-files index.html
          --fallback-extensions html,htm
          ${{ steps.assemble.outputs.link-check-args }}
        output: ${{ runner.temp }}/pages-site/link-check.md

    # Why the deploy asks: pages_exists.ts's header; the three answers: its judgePagesAnswer.
    - name: Ask whether the Pages site exists
      id: pages
      if: steps.assemble.outputs.publish == 'true'
      shell: bash
      env:
        ACTION_BUN: ${{ steps.action-bun.outputs.path }}
        GH_TOKEN: ${{ github.token }}
      run: '"$ACTION_BUN" "${{ github.action_path }}/pages_exists.ts"'
