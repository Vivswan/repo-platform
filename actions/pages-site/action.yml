name: Pages Site
description: >-
  Assembles the fleet's versioned GitHub Pages site artifact. Enumerates the
  repository's version tags (plain vX.Y.Z) and builds every mount's tiers -
  /latest/ from HEAD, one directory per served tag (a tag that structurally
  cannot build - docs tree missing, build script undeclared - is skipped
  with a notice), and the mount root serving the newest served version (or
  redirecting to latest/ while none serve). A
  mount's content comes from the bundled VitePress build over the caller's
  docs tree (source vitepress; the config and theme live in this action, the
  caller carries only markdown) or from the caller's own build command
  (source command). With check true it instead builds the caller's docs tree
  once, strictly (dead internal links fatal), as the docs PR check. Requires
  a full checkout (fetch-depth 0): version tags and per-ref trees come from
  git history.

inputs:
  mounts:
    description: >-
      JSON list of mounts: [{"path": "/", "source": "vitepress"|"command",
      "versioned": true|false}]. At most one mount per source. Ignored when
      check is true.
    required: false
    default: '[{"path": "/", "source": "vitepress", "versioned": true}]'
  check:
    description: Build the docs tree once as a strict PR check (no artifact) instead of assembling the site
    required: false
    default: "false"
  docs-dir:
    description: The docs tree a vitepress mount renders (repo-relative)
    required: false
    default: docs
  site-title:
    description: Site title for vitepress mounts (empty = the repository name)
    required: false
    default: ""
  install-command:
    description: Dependency install command run before each command-mount build ("" skips)
    required: false
    default: ""
  build-command:
    description: Build command for command mounts; PAGES_BASE_PATH/PAGES_ORIGIN/PAGES_VERSION are exported
    required: false
    default: ""
  dist-dir:
    description: Command-mount build output directory, relative to the repo root
    required: false
    default: dist
  max-versions:
    description: How many newest version tags each versioned mount serves
    required: false
    default: "5"
  custom-domain:
    description: Custom domain ("" = <owner>.github.io/<repo>)
    required: false
    default: ""

outputs:
  site-dir:
    description: The assembled _site directory to upload as the Pages artifact (empty in check mode)
    value: ${{ steps.assemble.outputs.site-dir }}

runs:
  using: composite
  steps:
    # Recorded BEFORE the pinned setup below can prepend the action's own
    # bun: caller-authored command-mount builds run on this PATH, so the
    # toolchain the calling workflow set up (reusable-pages pins it from
    # the checkout's dotfiles) keeps governing the caller's code while the
    # action-local pin governs only action-owned code.
    - name: Record the caller's toolchain PATH
      id: caller
      shell: bash
      run: echo "path=$PATH" >> "$GITHUB_OUTPUT"

    - name: Check for a bun matching the action's pin
      id: bun
      shell: bash
      run: |
        pin="$(cat "${{ github.action_path }}/.bun-version")"
        have="$(command -v bun >/dev/null && bun --version || true)"
        echo "pinned=$([ "$have" = "$pin" ] && echo true || echo false)" >> "$GITHUB_OUTPUT"

    # Skipped only when the caller's bun already IS the pinned version
    # (reuse then just skips a second network fetch): the action's scripts
    # and lockfile run on the action-local .bun-version pin (generated
    # from the manifests' bun pin), never on whatever the CALLER resolves
    # - a caller pinning an older bun cannot parse the lockfiles
    # repo-platform's bun writes.
    - name: Set up bun
      id: setup-bun
      if: steps.bun.outputs.pinned != 'true'
      continue-on-error: true
      uses: oven-sh/setup-bun@v2
      with:
        bun-version-file: ${{ github.action_path }}/.bun-version

    # One retry: the setup's network fetch is a known transient flake, and
    # on nightly deploy paths a flake here turns a green night red.
    - name: Set up bun (retry)
      if: steps.setup-bun.outcome == 'failure'
      uses: oven-sh/setup-bun@v2
      with:
        bun-version-file: ${{ github.action_path }}/.bun-version

    - name: Install the pinned site toolchain
      shell: bash
      run: bun install --frozen-lockfile --cwd "${{ github.action_path }}"

    - name: Build and assemble the site
      id: assemble
      shell: bash
      env:
        MOUNTS: ${{ inputs.mounts }}
        CHECK: ${{ inputs.check }}
        DOCS_DIR: ${{ inputs.docs-dir }}
        SITE_TITLE: ${{ inputs.site-title }}
        INSTALL_COMMAND: ${{ inputs.install-command }}
        BUILD_COMMAND: ${{ inputs.build-command }}
        CALLER_PATH: ${{ steps.caller.outputs.path }}
        DIST_DIR: ${{ inputs.dist-dir }}
        MAX_VERSIONS: ${{ inputs.max-versions }}
        CUSTOM_DOMAIN: ${{ inputs.custom-domain }}
        DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
      run: bun "${{ github.action_path }}/build.ts"
