name: Validate Template Report
description: >-
  The fleet's validate-template job body, three legs in one sticky PR
  comment plus the step summary. INTEGRITY judges the tree by the
  validator of the template it was rendered from (the operator's build
  tree at the recorded `_commit`, run on that tree's own bun) and BLOCKS
  through the `integrity` output; the LATEST pass runs the build tip's
  validator (the validator/ script directory nested in this action) and
  only warns about the rules the next sync brings; FRESHNESS
  reads the integrity leg's build-branch compare and only informs. The
  action never fails on its own - the report step ALWAYS runs, exports the
  verdict as `integrity`, and writes the comment body the sticky steps post
  (deleted when there is nothing to say); the caller fails LAST, so the
  comment is already posted when the gate goes red. The calling job needs
  pull-requests: write for the comment (and nothing else beyond contents:
  read).

inputs:
  github-token:
    description: >-
      Token for the aligned tree fetch and the sticky comment (contents
      read and pull-requests write are enough).
    required: true

outputs:
  integrity:
    description: >-
      The report step's reading of the one verdict: success only for a
      clean verdict, failure for findings, for a run that could not be
      judged, and for a missing or malformed verdict. Nothing else sets it.
    value: ${{ steps.report.outputs.integrity }}

runs:
  using: composite
  steps:
    # The action's pinned bun by absolute path; `required: false` so a
    # missing bun reaches the report step as ready=false instead of ending
    # the action here.
    - name: Set up the action's bun
      id: action-bun
      uses: Vivswan/repo-platform/actions/bun-setup@build
      with:
        pin: ${{ github.action_path }}/.bun-version
        required: "false"

    # Every predictable scratch path, cleared by ONE fixed /bin/rm before
    # anything reads it; any failed removal fails the step.
    - name: Clear the scratch root
      id: clear
      continue-on-error: true
      shell: bash
      env:
        BASH_ENV: ""
        SHELLOPTS: ""
      run: >-
        /bin/rm -rf
        "${{ runner.temp }}/aligned-validator"
        "${{ runner.temp }}/aligned-verdict.json"
        "${{ runner.temp }}/latest-findings.md"
        "${{ runner.temp }}/latest-advisories.md"
        "${{ runner.temp }}/validate-template-report.md"

    # The integrity leg: fetch, the tree's bun, judge. A failed fetch writes
    # its own not-judged verdict and skips the steps behind it. BASE_REF is
    # the vintage floor: `_commit` may not move behind the base ref's.
    - name: Fetch the validator at the recorded _commit
      id: fetch
      if: steps.action-bun.outputs.ready == 'true' && steps.clear.outcome == 'success'
      continue-on-error: true
      shell: bash
      env:
        ACTION_BUN: ${{ steps.action-bun.outputs.path }}
        GH_TOKEN: ${{ inputs.github-token }}
        BASE_REF: ${{ github.base_ref || github.event.repository.default_branch }}
        ALIGNED_DIR: ${{ runner.temp }}/aligned-validator
        VERDICT_FILE: ${{ runner.temp }}/aligned-verdict.json
      run: '"$ACTION_BUN" "${{ github.action_path }}/src/aligned/fetch.ts"'

    # The fetched tree runs on the bun ITS pin names (the fetch step
    # refused any tree without one), not on this action's: an older tree's
    # lockfile is read by the bun that wrote it. Same one-retry pattern as
    # above; a double failure leaves the resolver's path empty.
    - name: Set up the fetched tree's bun
      id: aligned-bun
      if: steps.clear.outcome == 'success' && steps.fetch.outcome == 'success'
      continue-on-error: true
      uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
      with:
        bun-version-file: ${{ runner.temp }}/aligned-validator/tree/actions/validate-template-report/.bun-version

    - name: Set up the fetched tree's bun (retry)
      id: aligned-bun-retry
      if: steps.clear.outcome == 'success' && steps.fetch.outcome == 'success' && steps.aligned-bun.outcome == 'failure'
      continue-on-error: true
      uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
      with:
        bun-version-file: ${{ runner.temp }}/aligned-validator/tree/actions/validate-template-report/.bun-version

    - name: Resolve the fetched tree's bun
      id: aligned-bun-path
      if: steps.fetch.outcome == 'success'
      shell: bash
      env:
        PIN_FILE: ${{ runner.temp }}/aligned-validator/tree/actions/validate-template-report/.bun-version
      run: |
        pin="$(cat "$PIN_FILE")"
        path="$(command -v bun || true)"
        case "$path" in /*) ;; *) path="" ;; esac
        have=""
        if [ -n "$path" ]; then have="$("$path" --version 2>/dev/null)" || have=""; fi
        if [ -z "$pin" ] || [ "$have" != "$pin" ]; then path=""; fi
        echo "path=$path" >> "$GITHUB_OUTPUT"
        echo "ready=$([ -n "$path" ] && echo true || echo false)" >> "$GITHUB_OUTPUT"

    # The judge script runs on the action's bun; only the fetched tree's
    # install and validator run on the tree's (an empty path is a
    # not-judged verdict). Its exit code follows the verdict for the step's
    # colour; the gate reads the report step's output.
    - name: Judge the tree by the validator at its recorded _commit
      id: integrity
      if: steps.fetch.outcome == 'success'
      continue-on-error: true
      shell: bash
      env:
        ALIGNED_DIR: ${{ runner.temp }}/aligned-validator
        VERDICT_FILE: ${{ runner.temp }}/aligned-verdict.json
        ORCHESTRATOR_BUN: ${{ steps.action-bun.outputs.path }}
        ALIGNED_BUN: ${{ steps.aligned-bun-path.outputs.path }}
      run: '"$ORCHESTRATOR_BUN" "${{ github.action_path }}/src/aligned/judge.ts"'

    # Advisory only (report.ts renders it as warnings; its outcome is read by
    # nothing). The build tip's validator is this action's own validator/
    # directory, installed from and run on this action's package and bun.
    - name: Run the build tip's validator
      id: latest
      if: steps.action-bun.outputs.ready == 'true' && steps.clear.outcome == 'success'
      continue-on-error: true
      shell: bash
      env:
        ACTION_BUN: ${{ steps.action-bun.outputs.path }}
        ACTION_PATH: ${{ github.action_path }}
        FINDINGS_FILE: ${{ runner.temp }}/latest-findings.md
        ADVISORIES_FILE: ${{ runner.temp }}/latest-advisories.md
      run: |
        "$ACTION_BUN" install --frozen-lockfile --production --cwd "$ACTION_PATH"
        "$ACTION_BUN" "$ACTION_PATH/validator/validate_generated_files.ts" .

    # The ONE place the verdict is read and `integrity` is set, whatever
    # happened above. Bash so that the no-bun path can still export the
    # failure and one summary line.
    - name: Report the findings
      id: report
      if: always()
      shell: bash
      env:
        ACTION_BUN: ${{ steps.action-bun.outputs.path }}
        ACTION_PATH: ${{ github.action_path }}
        VERDICT: ${{ runner.temp }}/aligned-verdict.json
        CLEAR_OUTCOME: ${{ steps.clear.outcome }}
        LATEST_FINDINGS: ${{ runner.temp }}/latest-findings.md
        LATEST_ADVISORIES: ${{ runner.temp }}/latest-advisories.md
        COMPARE_STATUS: ${{ steps.fetch.outputs.compare }}
        AHEAD_BY: ${{ steps.fetch.outputs.ahead-by }}
        COMMENT_FILE: ${{ runner.temp }}/validate-template-report.md
        RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
      run: |
        if [ -n "$ACTION_BUN" ]; then
          exec "$ACTION_BUN" "$ACTION_PATH/src/report.ts"
        fi
        reason="the action's pinned bun is unavailable"
        echo "integrity=failure" >> "$GITHUB_OUTPUT"
        echo "report=findings" >> "$GITHUB_OUTPUT"
        echo "::error::$reason"
        printf '### Template check\n\n#### Integrity\n\nNot judged: %s. See the [run log](%s). This FAILS the check.\n' \
          "$reason" "$RUN_URL" | tee "$COMMENT_FILE" >> "$GITHUB_STEP_SUMMARY"

    # The comment is a convenience sink: the summary carries the same body,
    # so a token without pull-requests write (a fork or Dependabot PR) must
    # not turn the verdict red. The caller fails on `integrity`, never here.
    - name: Post the findings as a sticky PR comment
      id: post-comment
      if: github.event_name == 'pull_request' && steps.report.outputs.report == 'findings'
      continue-on-error: true
      uses: marocchino/sticky-pull-request-comment@5770ad5eb8f42dd2c4f34da00c94c5381e49af88 # v3.0.5
      with:
        GITHUB_TOKEN: ${{ inputs.github-token }}
        header: repo-platform/validate-template-report
        path: ${{ runner.temp }}/validate-template-report.md

    - name: Remove a stale sticky comment
      id: delete-comment
      if: github.event_name == 'pull_request' && steps.report.outputs.report == 'clean'
      continue-on-error: true
      uses: marocchino/sticky-pull-request-comment@5770ad5eb8f42dd2c4f34da00c94c5381e49af88 # v3.0.5
      with:
        GITHUB_TOKEN: ${{ inputs.github-token }}
        header: repo-platform/validate-template-report
        delete: true
