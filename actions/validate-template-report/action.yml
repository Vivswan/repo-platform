name: Validate Template Report
description: >-
  The fleet's validate-template job body: runs the validate-template
  integrity action with its verdict DEFERRED, adds the freshness ref
  compare against the operator's build branch, and reports both through
  one sticky PR comment and the step summary. It never fails on its own -
  the caller reads the `integrity` output and fails LAST, so the comment
  is already posted when the gate goes red. The calling job needs
  pull-requests: write for the comment (and nothing else beyond contents:
  read).

inputs:
  github-token:
    description: >-
      Token for the freshness read and the sticky comment (contents read
      and pull-requests write are enough).
    required: true
  template-repo:
    description: >-
      The operator repository whose build branch freshness is measured
      against.
    required: false
    default: Vivswan/repo-platform

outputs:
  integrity:
    description: >-
      The wrapped validate-template action's outcome (success or failure),
      deferred so the caller can fail AFTER the findings are posted.
    value: ${{ steps.integrity.outcome }}

runs:
  using: composite
  steps:
    # Installed once up front: the wrapped validate-template action probes
    # for a bun matching the same generated pin and finds this one, and
    # the freshness and report scripts below need it too.
    - name: Check for a bun matching the action's pin
      id: bun
      shell: bash
      run: |
        pin="$(cat "${{ github.action_path }}/.bun-version")"
        have="$(command -v bun >/dev/null && bun --version || true)"
        echo "pinned=$([ "$have" = "$pin" ] && echo true || echo false)" >> "$GITHUB_OUTPUT"

    # Skipped only when the caller's bun already IS the pinned version
    # (reuse then just skips a second network fetch): the action's scripts
    # and lockfile run on the action-local .bun-version pin (generated
    # from the manifests' bun pin), never on whatever the CALLER resolves
    # - a caller pinning an older bun cannot parse the lockfiles
    # repo-platform's bun writes.
    - name: Set up bun
      id: setup-bun
      if: steps.bun.outputs.pinned != 'true'
      continue-on-error: true
      uses: oven-sh/setup-bun@v2
      with:
        bun-version-file: ${{ github.action_path }}/.bun-version

    # One retry: the setup's network fetch is a known transient flake, and
    # a flake here would block a gate that has nothing to say about the
    # tree under test.
    - name: Set up bun (retry)
      if: steps.setup-bun.outcome == 'failure'
      uses: oven-sh/setup-bun@v2
      with:
        bun-version-file: ${{ github.action_path }}/.bun-version

    # No install step for this action's own scripts: no runtime deps.
    #
    # continue-on-error defers the verdict to the caller's last step; it
    # does not discard it (the wrapped action's own exit code is
    # untouched). The ref is hardcoded because a composite step's `uses:`
    # cannot take expressions.
    - uses: Vivswan/repo-platform/actions/validate-template@build
      id: integrity
      continue-on-error: true
      with:
        findings-file: ${{ runner.temp }}/validate-findings.md
        advisories-file: ${{ runner.temp }}/validate-advisories.md

    - name: Check how far behind the template this repo is
      id: freshness
      continue-on-error: true
      shell: bash
      env:
        GH_TOKEN: ${{ inputs.github-token }}
        TEMPLATE_REPO: ${{ inputs.template-repo }}
        FRESHNESS: ${{ runner.temp }}/freshness.md
      run: bun "${{ github.action_path }}/freshness.ts"

    - name: Report the findings
      shell: bash
      env:
        GH_TOKEN: ${{ inputs.github-token }}
        FINDINGS: ${{ runner.temp }}/validate-findings.md
        ADVISORIES: ${{ runner.temp }}/validate-advisories.md
        FRESHNESS: ${{ runner.temp }}/freshness.md
        FRESHNESS_STATE: ${{ steps.freshness.outputs.state }}
        EVENT_NAME: ${{ github.event_name }}
        PR_NUMBER: ${{ github.event.pull_request.number }}
        RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
      run: bun "${{ github.action_path }}/report.ts"
