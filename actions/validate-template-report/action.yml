name: Validate Template Report
description: >-
  The fleet's validate-template job body, three legs in one sticky PR
  comment plus the step summary. INTEGRITY judges the tree by the
  validator of the template it was rendered from (the operator's build
  tree at the recorded `_commit`) and BLOCKS through the deferred
  `integrity` output; the LATEST pass runs the build tip's validator and
  only warns about the rules the next sync brings; FRESHNESS is a ref
  compare against the build branch and only informs. The action never
  fails on its own - the caller reads `integrity` and fails LAST, so the
  comment is already posted when the gate goes red. The calling job needs
  pull-requests: write for the comment (and nothing else beyond contents:
  read).

inputs:
  github-token:
    description: >-
      Token for the aligned tree fetch, the freshness read, and the sticky
      comment (contents read and pull-requests write are enough).
    required: true
  template-repo:
    description: >-
      The operator repository whose build branch the aligned validator is
      fetched from and freshness is measured against. The latest pass is
      always Vivswan/repo-platform's build tip: a composite step's `uses:`
      cannot take an input.
    required: false
    default: Vivswan/repo-platform

outputs:
  integrity:
    description: >-
      The aligned validator's outcome (success or failure; a refused or
      unreachable `_commit` is a failure), deferred so the caller can fail
      AFTER the findings are posted.
    value: ${{ steps.integrity.outcome }}

runs:
  using: composite
  steps:
    # Installed once up front: the aligned validator runs on this bun (see
    # aligned.ts), the wrapped latest-pass action probes for a bun matching
    # the same generated pin and finds this one, and the freshness and
    # report scripts below need it too.
    - name: Check for a bun matching the action's pin
      id: bun
      shell: bash
      run: |
        pin="$(cat "${{ github.action_path }}/.bun-version")"
        have="$(command -v bun >/dev/null && bun --version || true)"
        echo "pinned=$([ "$have" = "$pin" ] && echo true || echo false)" >> "$GITHUB_OUTPUT"

    # Skipped only when the caller's bun already IS the pinned version
    # (reuse then just skips a second network fetch): the action's scripts
    # and lockfile run on the action-local .bun-version pin (generated
    # from the manifests' bun pin), never on whatever the CALLER resolves
    # - a caller pinning an older bun cannot parse the lockfiles
    # repo-platform's bun writes.
    - name: Set up bun
      id: setup-bun
      if: steps.bun.outputs.pinned != 'true'
      continue-on-error: true
      uses: oven-sh/setup-bun@v2
      with:
        bun-version-file: ${{ github.action_path }}/.bun-version

    # One retry: the setup's network fetch is a known transient flake, and
    # a flake here would block a gate that has nothing to say about the
    # tree under test.
    - name: Set up bun (retry)
      if: steps.setup-bun.outcome == 'failure'
      uses: oven-sh/setup-bun@v2
      with:
        bun-version-file: ${{ github.action_path }}/.bun-version

    # No install step for this action's own scripts: no runtime deps.
    #
    # continue-on-error defers the verdict to the caller's last step; it
    # does not discard it (the step's exit code is what `outcome` reports).
    - name: Judge the tree by the validator at its recorded _commit
      id: integrity
      continue-on-error: true
      shell: bash
      env:
        GH_TOKEN: ${{ inputs.github-token }}
        TEMPLATE_REPO: ${{ inputs.template-repo }}
        ALIGNED_DIR: ${{ runner.temp }}/aligned-validator
        FINDINGS_FILE: ${{ runner.temp }}/aligned-findings.md
        ADVISORIES_FILE: ${{ runner.temp }}/aligned-advisories.md
      run: bun "${{ github.action_path }}/aligned.ts"

    # Advisory only: the build tip's validator knows the rules the next
    # sync PR brings, and report.ts shows them as warnings. Its outcome is
    # read by nothing. The ref is hardcoded because a composite step's
    # `uses:` cannot take expressions.
    - uses: Vivswan/repo-platform/actions/validate-template@build
      id: latest
      continue-on-error: true
      with:
        findings-file: ${{ runner.temp }}/latest-findings.md
        advisories-file: ${{ runner.temp }}/latest-advisories.md

    - name: Check how far behind the template this repo is
      id: freshness
      continue-on-error: true
      shell: bash
      env:
        GH_TOKEN: ${{ inputs.github-token }}
        TEMPLATE_REPO: ${{ inputs.template-repo }}
        FRESHNESS: ${{ runner.temp }}/freshness.md
      run: bun "${{ github.action_path }}/freshness.ts"

    - name: Report the findings
      shell: bash
      env:
        GH_TOKEN: ${{ inputs.github-token }}
        FINDINGS: ${{ runner.temp }}/aligned-findings.md
        ADVISORIES: ${{ runner.temp }}/aligned-advisories.md
        ALIGNED_REASON: ${{ steps.integrity.outputs.reason }}
        LATEST_FINDINGS: ${{ runner.temp }}/latest-findings.md
        LATEST_ADVISORIES: ${{ runner.temp }}/latest-advisories.md
        FRESHNESS: ${{ runner.temp }}/freshness.md
        FRESHNESS_STATE: ${{ steps.freshness.outputs.state }}
        EVENT_NAME: ${{ github.event_name }}
        PR_NUMBER: ${{ github.event.pull_request.number }}
        RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
      run: bun "${{ github.action_path }}/report.ts"
