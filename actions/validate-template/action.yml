name: Validate Template
description: >-
  Runs repo-platform's validate_generated_files.ts against the repository:
  managed-region markers appear exactly once, YAML parses, no unresolved
  conflict markers, and ci.yml follows the all-green + typography convention.

inputs:
  path:
    description: Directory to validate
    required: false
    default: "."
  findings-file:
    description: >-
      Optional path to write the BLOCKING findings to as markdown. It only
      adds a machine-readable copy of what the run already reports; it does
      not make anything advisory, and integrity errors still exit nonzero
      exactly as before. An empty findings set writes an empty file, which
      is how a caller tells "nothing to report" apart from "the validator
      never ran".
    required: false
    default: ""
  advisories-file:
    description: >-
      Optional path to write the NON-blocking advisories to as markdown.
      Advisories never affect the exit code, so a caller can report them
      without treating them as a failure.
    required: false
    default: ""

runs:
  using: composite
  steps:
    - name: Check for a bun matching the action's pin
      id: bun
      shell: bash
      env:
        BASH_ENV: ""
        SHELLOPTS: ""
        PIN_FILE: ${{ github.action_path }}/.bun-version
      run: |
        pin="$(<"$PIN_FILE")"
        path="$(command -v bun || true)"
        case "$path" in /*) ;; *) path="" ;; esac
        have=""
        if [ -n "$path" ]; then have="$("$path" --version 2>/dev/null)" || have=""; fi
        if [ -z "$pin" ] || [ "$have" != "$pin" ]; then path=""; fi
        echo "bun ${pin:-(no pin)}: ${path:-none on PATH}"
        echo "path=$path" >> "$GITHUB_OUTPUT"
        echo "pinned=$([ -n "$path" ] && echo true || echo false)" >> "$GITHUB_OUTPUT"

    # Skipped only when the caller's bun already IS the pinned version
    # (reuse then just skips a second network fetch): the action's scripts
    # and lockfile run on the action-local .bun-version pin (generated
    # from the manifests' bun pin), never on whatever the CALLER resolves
    # - a caller pinning an older bun cannot parse the lockfiles
    # repo-platform's bun writes.
    - name: Set up bun
      id: setup-bun
      if: steps.bun.outputs.pinned != 'true'
      continue-on-error: true
      uses: oven-sh/setup-bun@v2
      with:
        bun-version-file: ${{ github.action_path }}/.bun-version

    # One retry: the setup's network fetch is a known transient flake, and
    # on nightly reporting paths a flake here turns a green night red.
    - name: Set up bun (retry)
      if: steps.setup-bun.outcome == 'failure'
      uses: oven-sh/setup-bun@v2
      with:
        bun-version-file: ${{ github.action_path }}/.bun-version

    # Re-resolved after the setup so the recorded path is the bun it
    # installed; every later step runs that path, never bun through PATH.
    - name: Resolve the action's bun
      id: action-bun
      if: always()
      shell: bash
      env:
        BASH_ENV: ""
        SHELLOPTS: ""
        PIN_FILE: ${{ github.action_path }}/.bun-version
      run: |
        pin="$(<"$PIN_FILE")"
        path="$(command -v bun || true)"
        case "$path" in /*) ;; *) path="" ;; esac
        have=""
        if [ -n "$path" ]; then have="$("$path" --version 2>/dev/null)" || have=""; fi
        if [ -z "$pin" ] || [ "$have" != "$pin" ]; then path=""; fi
        echo "bun ${pin:-(no pin)}: ${path:-none on PATH}"
        echo "path=$path" >> "$GITHUB_OUTPUT"
        echo "pinned=$([ -n "$path" ] && echo true || echo false)" >> "$GITHUB_OUTPUT"

    - name: Install dependencies (yaml)
      shell: bash
      working-directory: ${{ github.action_path }}
      env:
        BASH_ENV: ""
        SHELLOPTS: ""
        ACTION_BUN: ${{ steps.action-bun.outputs.path }}
      # --production: dev deps (@types/bun, typescript) are editor/typecheck
      # tooling, not needed to run the validator. No --silent: a failed
      # install must name itself in the caller's log (a lockfile the
      # caller's bun could not parse once hid behind a bare exit 1).
      run: '"$ACTION_BUN" install --frozen-lockfile --production'

    - name: Validate
      shell: bash
      env:
        BASH_ENV: ""
        SHELLOPTS: ""
        SCAN_PATH: ${{ inputs.path }}
        FINDINGS_FILE: ${{ inputs.findings-file }}
        ADVISORIES_FILE: ${{ inputs.advisories-file }}
        ACTION_BUN: ${{ steps.action-bun.outputs.path }}
      run: '"$ACTION_BUN" "${{ github.action_path }}/validate_generated_files.ts" "$SCAN_PATH"'
