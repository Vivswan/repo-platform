name: Validate Managed Files
description: >-
  The fleet's validate-managed-files step body: judges the caller's checkout
  as repo-platform writes it at the commit the repository was last synced
  with (that commit's own check.ts, run from a checkout of repo-platform the
  action makes beside the tree and removes), then the repository's YAML,
  conflict-marker, and release-as hygiene, and posts the findings as one
  sticky PR comment plus the step summary, exporting the one verdict as the
  `integrity` output. The action never fails on its own - the report step
  ALWAYS runs - so the comment is already posted when the caller fails LAST
  on `integrity`. The calling job needs pull-requests: write for the comment
  (and nothing else beyond contents: read).

inputs:
  private:
    description: >-
      The repository's visibility, `true` or `false`, as the plan action
      resolved it: the visibility side of files.yml's `when` clauses.
    required: true

outputs:
  integrity:
    description: >-
      The report step's reading of the one verdict: success only for a
      clean verdict, failure for findings, for a run that could not be
      judged, and for a missing or malformed verdict. Nothing else sets it.
    value: ${{ steps.report.outputs.integrity }}

runs:
  using: composite
  steps:
    # The action's pinned bun by absolute path; `required: false` so a
    # missing bun reaches the report step as ready=false instead of ending
    # the action here.
    - name: Set up the action's bun
      id: action-bun
      uses: Vivswan/repo-platform/actions/bun-setup@stable
      with:
        pin: ${{ github.action_path }}/../../files/bun/.bun-version
        required: "false"

    # Every predictable scratch path, cleared by ONE fixed /bin/rm before anything reads it; any failed removal fails
    # the step.
    - name: Clear the scratch root
      id: clear
      continue-on-error: true
      shell: bash
      env:
        BASH_ENV: ""
        SHELLOPTS: ""
      run: >-
        /bin/rm -rf
        "${{ runner.temp }}/validate-managed-files"
        "${{ runner.temp }}/validate-managed-files-verdict.json"
        "${{ runner.temp }}/validate-managed-files-report.md"

    # The tarball ships no node_modules. Installed BEFORE the platform checkout exists, so a failed install leaves nothing
    # of repo-platform's in the workspace for the caller's later checks to read; the report step turns it into the verdict.
    - name: Install the action's dependencies
      id: install
      if: steps.action-bun.outputs.ready == 'true' && steps.clear.outcome == 'success'
      continue-on-error: true
      shell: bash
      env:
        ACTION_BUN: ${{ steps.action-bun.outputs.path }}
      run: '"$ACTION_BUN" install --frozen-lockfile --production --cwd "${{ github.action_path }}"'

    # The platform checkout sits in the workspace because actions/checkout places a repository nowhere else; a repository
    # path already there is refused here, so the checkout never replaces the repository's own content.
    - name: Read the commit the repository was synced with
      id: read-commit
      if: steps.install.outcome == 'success'
      continue-on-error: true
      shell: bash
      env:
        ACTION_BUN: ${{ steps.action-bun.outputs.path }}
        PLATFORM_DIR: ${{ github.workspace }}/.repo-platform-judge
      run: '"$ACTION_BUN" "${{ github.action_path }}/src/read_commit.ts"'

    # The caller's token reads a public repository from a private caller too. A failed checkout (a recorded commit
    # repo-platform's history lacks) reaches run.ts as this step's outcome and is reported, never ends the action here.
    - name: Check out repo-platform at that commit
      id: platform
      if: steps.read-commit.outputs.commit != ''
      continue-on-error: true
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        repository: Vivswan/repo-platform
        ref: ${{ steps.read-commit.outputs.commit }}
        path: .repo-platform-judge
        fetch-depth: 0
        persist-credentials: false

    # run.ts installs the platform checkout's dependencies at its root, so that commit's writer renders with its own
    # versions, and removes the checkout on every path of its own.
    - name: Validate the checkout
      id: validate
      if: steps.read-commit.outcome == 'success'
      continue-on-error: true
      shell: bash
      env:
        ACTION_BUN: ${{ steps.action-bun.outputs.path }}
        ACTION_PATH: ${{ github.action_path }}
        COMMIT: ${{ steps.read-commit.outputs.commit }}
        COMMIT_PROBLEM: ${{ steps.read-commit.outputs.problem }}
        PLATFORM_DIR: ${{ github.workspace }}/.repo-platform-judge
        PLATFORM_OUTCOME: ${{ steps.platform.outcome }}
        REPOSITORY: ${{ github.repository }}
        REPOSITORY_PRIVATE: ${{ inputs.private }}
        SCRATCH_DIR: ${{ runner.temp }}/validate-managed-files
        VERDICT_FILE: ${{ runner.temp }}/validate-managed-files-verdict.json
      run: '"$ACTION_BUN" "$ACTION_PATH/src/run.ts"'

    # The ONE place the verdict is read and `integrity` is set, whatever
    # happened above. Bash so that the no-bun path can still export the
    # failure and one summary line.
    - name: Report the findings
      id: report
      if: always()
      shell: bash
      env:
        ACTION_BUN: ${{ steps.action-bun.outputs.path }}
        ACTION_PATH: ${{ github.action_path }}
        VERDICT: ${{ runner.temp }}/validate-managed-files-verdict.json
        CLEAR_OUTCOME: ${{ steps.clear.outcome }}
        COMMENT_FILE: ${{ runner.temp }}/validate-managed-files-report.md
        RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
      run: |
        if [ -n "$ACTION_BUN" ]; then
          exec "$ACTION_BUN" "$ACTION_PATH/src/report.ts"
        fi
        reason="the action's pinned bun is unavailable"
        echo "integrity=failure" >> "$GITHUB_OUTPUT"
        echo "report=findings" >> "$GITHUB_OUTPUT"
        echo "::error::$reason"
        printf '### Managed files check\n\nNot judged: %s. See the [run log](%s). This FAILS the check.\n' \
          "$reason" "$RUN_URL" | tee "$COMMENT_FILE" >> "$GITHUB_STEP_SUMMARY"

    # The comment is a convenience sink: the summary carries the same body,
    # so a token without pull-requests write (a fork or Dependabot PR) must
    # not turn the verdict red. The caller fails on `integrity`, never here.
    - name: Post the findings as a sticky PR comment
      id: post-comment
      if: github.event_name == 'pull_request' && steps.report.outputs.report == 'findings'
      continue-on-error: true
      uses: marocchino/sticky-pull-request-comment@5770ad5eb8f42dd2c4f34da00c94c5381e49af88 # v3.0.5
      with:
        GITHUB_TOKEN: ${{ github.token }}
        header: repo-platform/validate-managed-files
        path: ${{ runner.temp }}/validate-managed-files-report.md

    - name: Remove a stale sticky comment
      id: delete-comment
      if: github.event_name == 'pull_request' && steps.report.outputs.report == 'clean'
      continue-on-error: true
      uses: marocchino/sticky-pull-request-comment@5770ad5eb8f42dd2c4f34da00c94c5381e49af88 # v3.0.5
      with:
        GITHUB_TOKEN: ${{ github.token }}
        header: repo-platform/validate-managed-files
        delete: true
