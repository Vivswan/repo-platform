name: Validate Managed Files
description: |
  Judges the caller's checkout as repo-platform writes it, the body of the fleet's validate-managed-files step.

  The judge is the check.ts of the commit the repository was last synced with, run from a
  clone of repo-platform the action makes under the runner's temp directory. After it, the
  action checks the repository's YAML, conflict-marker, and release-as hygiene.

  The findings are posted as one sticky PR comment plus the step summary, and the one verdict
  is the `integrity` output. A missing bun fails the action before anything runs. Past that it
  never fails on its own: the report step always runs, so the comment is already posted when
  the caller fails last on `integrity`.

  The calling job needs pull-requests: write for the comment, and nothing else beyond
  contents: read.

inputs:
  private:
    description: >-
      The repository's visibility, `true` or `false`, as the plan action
      resolved it: the visibility side of files.yml's `when` clauses.
    required: true

outputs:
  integrity:
    description: >-
      The report step's reading of the one verdict: success for a clean verdict, failure for
      findings, an unjudged run, or a missing or malformed verdict. Nothing else sets it.
    value: ${{ steps.report.outputs.integrity }}

runs:
  using: composite
  steps:
    # The action's pinned bun by absolute path: later steps run
    # steps.action-bun.outputs.path, never `bun` through PATH, where a later
    # setup-bun can put another bun first.
    - name: Set up the action's bun
      id: action-bun
      uses: Vivswan/repo-platform/actions/bun-setup@stable
      with:
        from: ${{ github.action_path }}

    # Every predictable scratch path (the platform clone sits under the scratch root), cleared by ONE fixed /bin/rm
    # before anything reads it; any failed removal fails the step.
    - name: Clear the scratch root
      id: clear
      continue-on-error: true
      shell: bash
      env:
        BASH_ENV: ""
        SHELLOPTS: ""
      run: >-
        /bin/rm -rf
        "${{ runner.temp }}/validate-managed-files"
        "${{ runner.temp }}/validate-managed-files-verdict.json"
        "${{ runner.temp }}/validate-managed-files-report.md"

    # The tarball ships no node_modules; a failed install is the verdict, through the report step.
    - name: Install the action's dependencies
      id: install
      if: steps.clear.outcome == 'success'
      continue-on-error: true
      shell: bash
      env:
        ACTION_BUN: ${{ steps.action-bun.outputs.path }}
      run: '"$ACTION_BUN" install --frozen-lockfile --production --cwd "${{ github.action_path }}"'

    - name: Read the commit the repository was synced with
      id: read-commit
      if: steps.install.outcome == 'success'
      continue-on-error: true
      shell: bash
      env:
        ACTION_BUN: ${{ steps.action-bun.outputs.path }}
      run: '"$ACTION_BUN" "${{ github.action_path }}/src/read_commit.ts"'

    # repo-platform is public, so no token. The commit's whole history and the stable tag come along for the freshness
    # line. A failed fetch (a recorded commit repo-platform's history lacks) reaches run.ts as this step's outcome.
    - name: Clone repo-platform at that commit
      id: platform
      if: steps.read-commit.outputs.commit != ''
      continue-on-error: true
      shell: bash
      env:
        COMMIT: ${{ steps.read-commit.outputs.commit }}
        PLATFORM_DIR: ${{ runner.temp }}/validate-managed-files/platform
      run: |
        git init -q "$PLATFORM_DIR"
        git -C "$PLATFORM_DIR" fetch -q https://github.com/Vivswan/repo-platform "$COMMIT" '+refs/tags/stable:refs/tags/stable'
        git -C "$PLATFORM_DIR" checkout -q "$COMMIT"

    # run.ts installs the clone's dependencies at its root, so that commit's writer renders with its own versions.
    - name: Validate the checkout
      id: validate
      if: steps.read-commit.outcome == 'success'
      continue-on-error: true
      shell: bash
      env:
        ACTION_BUN: ${{ steps.action-bun.outputs.path }}
        ACTION_PATH: ${{ github.action_path }}
        COMMIT: ${{ steps.read-commit.outputs.commit }}
        COMMIT_PROBLEM: ${{ steps.read-commit.outputs.problem }}
        PLATFORM_DIR: ${{ runner.temp }}/validate-managed-files/platform
        PLATFORM_OUTCOME: ${{ steps.platform.outcome }}
        REPOSITORY: ${{ github.repository }}
        REPOSITORY_PRIVATE: ${{ inputs.private }}
        SCRATCH_DIR: ${{ runner.temp }}/validate-managed-files
        VERDICT_FILE: ${{ runner.temp }}/validate-managed-files-verdict.json
      run: '"$ACTION_BUN" "$ACTION_PATH/src/run.ts"'

    # The ONE place the verdict is read and `integrity` is set, whatever
    # happened above, once there is a bun to read it with.
    - name: Report the findings
      id: report
      if: always() && steps.action-bun.outcome == 'success'
      shell: bash
      env:
        ACTION_BUN: ${{ steps.action-bun.outputs.path }}
        VERDICT: ${{ runner.temp }}/validate-managed-files-verdict.json
        CLEAR_OUTCOME: ${{ steps.clear.outcome }}
        COMMENT_FILE: ${{ runner.temp }}/validate-managed-files-report.md
        RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
      run: '"$ACTION_BUN" "${{ github.action_path }}/src/report.ts"'

    # The comment is a convenience sink: the summary carries the same body,
    # so a token without pull-requests write (a fork or Dependabot PR) must
    # not turn the verdict red. The caller fails on `integrity`, never here.
    - name: Post the findings as a sticky PR comment
      id: post-comment
      if: github.event_name == 'pull_request' && steps.report.outputs.report == 'findings'
      continue-on-error: true
      uses: marocchino/sticky-pull-request-comment@5770ad5eb8f42dd2c4f34da00c94c5381e49af88 # v3.0.5
      with:
        GITHUB_TOKEN: ${{ github.token }}
        header: repo-platform/validate-managed-files
        path: ${{ runner.temp }}/validate-managed-files-report.md

    - name: Remove a stale sticky comment
      id: delete-comment
      if: github.event_name == 'pull_request' && steps.report.outputs.report == 'clean'
      continue-on-error: true
      uses: marocchino/sticky-pull-request-comment@5770ad5eb8f42dd2c4f34da00c94c5381e49af88 # v3.0.5
      with:
        GITHUB_TOKEN: ${{ github.token }}
        header: repo-platform/validate-managed-files
        delete: true
