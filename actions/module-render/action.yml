name: Module Render
description: >-
  The fleet's module-render job body. On a pull request that changes the
  module selection (.repo-platform.yml) or a recorded answer
  (.github/.copier-answers.yml), renders the template at the repository's
  recorded build commit with the pull request's selection and compares
  every managed file against the tree. A stale tree fails the step naming
  the files and the one sync dispatch that pushes the render onto the pull
  request's branch; a pull request leaving both files alone is a no-op.
  The recorded _commit must be a published build-branch commit before its
  render hooks run here with --trust, the admission validate-template-report
  makes too. The calling job needs contents read and pull-requests read
  (the file listing), nothing else.

inputs:
  github-token:
    description: >-
      Token for the pull request's file listing (this repository, read)
      and the build-branch compare (the operator repository, public).
    required: true

runs:
  using: composite
  steps:
    # The action's pinned bun by absolute path; the same bun lands on PATH
    # for copier's stamp hook, which runs `bun` by name inside the render.
    - name: Set up the action's bun
      id: action-bun
      uses: Vivswan/repo-platform/actions/bun-setup@build
      with:
        pin: ${{ github.action_path }}/.bun-version

    - name: Install the action's dependencies
      shell: bash
      env:
        ACTION_BUN: ${{ steps.action-bun.outputs.path }}
        ACTION_PATH: ${{ github.action_path }}
      run: '"$ACTION_BUN" install --frozen-lockfile --production --cwd "$ACTION_PATH"'

    # render=false is the no-op pass (no selection change) or a refusal
    # that already failed the step; only an admitted render continues.
    - name: Admit the render
      id: admit
      shell: bash
      env:
        ACTION_BUN: ${{ steps.action-bun.outputs.path }}
        GH_TOKEN: ${{ inputs.github-token }}
      run: '"$ACTION_BUN" "${{ github.action_path }}/src/admit.ts"'

    # pipx is on the hosted runners; the sync installs copier the same way.
    - name: Install copier
      if: steps.admit.outputs.render == 'true'
      shell: bash
      run: pipx install copier

    - name: Render the selection and compare the managed files
      if: steps.admit.outputs.render == 'true'
      shell: bash
      env:
        ACTION_BUN: ${{ steps.action-bun.outputs.path }}
      run: '"$ACTION_BUN" "${{ github.action_path }}/src/render.ts"'
