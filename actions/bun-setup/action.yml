name: Bun Setup
description: >-
  The one bun setup for repo-platform's composite actions: locates the
  .bun-version pin (the file a caller passes as `pin`, or the nearest one at or
  above the directory it passes as `from`, so an action reads its own
  repository's pin without path arithmetic and its scripts and lockfiles never
  ride the CALLING repository's bun resolution), reuses a bun already on PATH
  at that version or installs it with oven-sh/setup-bun, one retry for the
  known network flake, and records the absolute path of the bun that prints
  the pin. One call per job: setup-bun installs every version at the same
  path, so `path` is valid only until another setup-bun runs in that job.

inputs:
  pin:
    description: >-
      Path to the .bun-version file naming the version to run. Exactly one
      of `pin` and `from` is passed.
    required: false
  from:
    description: >-
      A directory inside the action's repository (`github.action_path`); the
      first .bun-version in it or any directory above it is the pin, and the
      step fails when none exists. Exactly one of `pin` and `from` is passed.
    required: false
  required:
    description: >-
      Fail when no bun matching the pin is on PATH after the setup. Pass
      "false" to leave the verdict to the caller through `ready`, for an
      action that must reach its own report step whatever happened.
    required: false
    default: "true"

outputs:
  path:
    description: >-
      Absolute path of the bun that prints the pinned version; empty when
      none does. Callers run this path, never `bun` by name.
    value: ${{ steps.resolve.outputs.path }}
  ready:
    description: Whether `path` is set ("true" or "false").
    value: ${{ steps.resolve.outputs.ready }}
  installed:
    description: Whether setup-bun ran, "true" unless the pin was already satisfied.
    value: ${{ steps.resolve.outputs.installed }}
  version:
    description: What `path` printed for --version when resolved; empty when `path` is.
    value: ${{ steps.resolve.outputs.version }}

runs:
  using: composite
  steps:
    # Shell parameter expansion does the climb, so the walk needs no command beyond bash (there is no bun yet).
    - name: Locate the .bun-version pin
      id: locate
      shell: bash
      env:
        PIN_FILE: ${{ inputs.pin }}
        FROM_DIR: ${{ inputs.from }}
      run: |
        case "${PIN_FILE:+pin}${FROM_DIR:+from}" in
          pin) file="$PIN_FILE" ;;
          from)
            dir="$(cd "$FROM_DIR" && pwd)"
            while [ ! -f "$dir/.bun-version" ]; do
              if [ -z "$dir" ]; then
                echo "::error::no .bun-version in $FROM_DIR or any directory above it"
                exit 1
              fi
              dir="${dir%/*}"
            done
            file="$dir/.bun-version"
            ;;
          *)
            echo "::error::pass exactly one of pin and from (pin='$PIN_FILE', from='$FROM_DIR')"
            exit 1
            ;;
        esac
        echo "file=$file" >> "$GITHUB_OUTPUT"

    # Pinned by the resolver's own test below: an absolute path that prints
    # the pin and exits 0, so the setup is skipped only for a bun the
    # resolver will accept.
    - name: Check for a bun matching the pin
      id: probe
      shell: bash
      env:
        PIN_FILE: ${{ steps.locate.outputs.file }}
      run: |
        pin="$(cat "$PIN_FILE")"
        path="$(command -v bun || true)"
        case "$path" in /*) ;; *) path="" ;; esac
        have=""
        if [ -n "$path" ]; then have="$("$path" --version 2>/dev/null)" || have=""; fi
        echo "pinned=$([ -n "$pin" ] && [ "$have" = "$pin" ] && echo true || echo false)" >> "$GITHUB_OUTPUT"

    - name: Set up bun
      id: setup-bun
      if: steps.probe.outputs.pinned != 'true'
      continue-on-error: true
      uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
      with:
        bun-version-file: ${{ steps.locate.outputs.file }}

    - name: Set up bun (retry)
      id: setup-bun-retry
      if: steps.setup-bun.outcome == 'failure'
      continue-on-error: true
      uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
      with:
        bun-version-file: ${{ steps.locate.outputs.file }}

    # A later setup-bun can put another bun first on PATH, so callers run the path, never the name.
    - name: Resolve the pinned bun
      id: resolve
      shell: bash
      env:
        PIN_FILE: ${{ steps.locate.outputs.file }}
        REQUIRED: ${{ inputs.required }}
        SETUP_OUTCOME: ${{ steps.setup-bun.outcome }}
      run: |
        pin="$(cat "$PIN_FILE")"
        path="$(command -v bun || true)"
        case "$path" in /*) ;; *) path="" ;; esac
        have=""
        if [ -n "$path" ]; then have="$("$path" --version 2>/dev/null)" || have=""; fi
        if [ -z "$pin" ] || [ "$have" != "$pin" ]; then path=""; fi
        echo "path=$path" >> "$GITHUB_OUTPUT"
        echo "version=$([ -n "$path" ] && echo "$have")" >> "$GITHUB_OUTPUT"
        echo "ready=$([ -n "$path" ] && echo true || echo false)" >> "$GITHUB_OUTPUT"
        echo "installed=$([ "$SETUP_OUTCOME" != "skipped" ] && echo true || echo false)" >> "$GITHUB_OUTPUT"
        if [ -z "$path" ] && [ "$REQUIRED" != "false" ]; then
          echo "::error::no bun matching the pin '$pin' ($PIN_FILE) is on PATH after the setup and its retry"
          exit 1
        fi
