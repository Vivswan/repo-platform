name: Semgrep
description: >-
  The fleet's static analysis: semgrep's default registry ruleset over the
  caller's checkout, every finding uploaded to code scanning as SARIF, and
  the step failing on an ERROR-severity finding. Public repositories only:
  the registry needs no token, but code scanning needs a public repository
  or Advanced Security. The only bypass is semgrep's own `// nosemgrep:
  rule-id` comment on the finding, with a reason. Two registry rules are
  excluded from the scan: mutable-action-tag duplicates zizmor's
  unpinned-uses (one tool owns each finding class), permanently;
  secrets-inherit only until the fleet cutover, because managed
  repositories still run the old rendered ci.yml and release.yml, whose
  `secrets: inherit` lines carry no nosemgrep marker (the writer's ci.yml
  marks each one with its reason), and the rule would fail every fleet
  repository until the writer replaces them.

runs:
  using: composite
  steps:
    - name: Install semgrep
      shell: bash
      run: python3 -m pip install --quiet semgrep==1.176.1

    # No --error: the JSON copy is judged by severity below, so WARNING and
    # INFO findings reach code scanning without blocking. The excluded rules
    # are the two the description names: zizmor's, and the one the fleet's
    # old renders cannot mark until the writer cutover. The exit status is
    # a step output, not the step's result, so a fatal scan (a config or
    # engine error) reaches the judge and reads red with its reason.
    - name: Scan
      id: scan
      shell: bash
      run: |
        semgrep scan --config p/default --metrics=off \
          --exclude-rule=yaml.github-actions.security.github-actions-mutable-action-tag.github-actions-mutable-action-tag \
          --exclude-rule=yaml.github-actions.security.secrets-inherit.secrets-inherit \
          --sarif-output="$RUNNER_TEMP/semgrep.sarif" --json-output="$RUNNER_TEMP/semgrep.json" . \
          && status=0 || status=$?
        echo "status=$status" >>"$GITHUB_OUTPUT"

    - name: Upload the findings to code scanning
      if: ${{ !cancelled() }}
      uses: github/codeql-action/upload-sarif@b96794f015dfd88f77b49b1c93e0fa7110f94c63 # v4.38.0
      with:
        sarif_file: ${{ runner.temp }}/semgrep.sarif
        category: semgrep

    # The verdict: a scan that did not exit 0 fails first, naming its status.
    # Then the JSON copy: ERROR-severity findings and fatal analysis errors
    # fail; partial parses and timeouts (level warn) only annotate, so a
    # WARNING or INFO finding reaches code scanning unblocked.
    - name: Fail on an ERROR finding
      if: ${{ !cancelled() }}
      shell: bash
      env:
        SCAN_STATUS: ${{ steps.scan.outputs.status }}
      run: |
        [ "${SCAN_STATUS:-none}" = "0" ] || { echo "::error::semgrep: the scan did not complete (exit status ${SCAN_STATUS:-none}), so there is no verdict; see the scan log above"; exit 1; }
        findings="$(jq '[.results[] | select(.extra.severity == "ERROR")] | length' "$RUNNER_TEMP/semgrep.json")"
        fatal="$(jq '[.errors[] | select(.level == "error")] | length' "$RUNNER_TEMP/semgrep.json")"
        jq -r '[.errors[] | select(.level != "error")] | if length > 0 then "::warning::semgrep: \(length) non-fatal analysis error(s) (partial parses, timeouts); see the scan log above" else empty end' "$RUNNER_TEMP/semgrep.json"
        [ "$findings" = "0" ] && [ "$fatal" = "0" ] || { echo "::error::semgrep: $findings ERROR-severity finding(s), $fatal fatal analysis error(s); see the scan log above"; exit 1; }
