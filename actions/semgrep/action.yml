name: Semgrep
description: |
  Runs semgrep's default registry ruleset over the caller's checkout at ERROR severity, the fleet's static analysis:
  the
  ERROR findings go to code scanning as SARIF, and one of them fails the step (semgrep's own --error).

  - WARNING and INFO rules do not run, so their findings appear nowhere.
  - Public repositories only: the registry needs no token, but code scanning needs a public repository or Advanced Security.
  - One registry rule is excluded for good: mutable-action-tag duplicates zizmor's unpinned-uses, and one tool owns each finding
    class.
  - The bypass marker, how marked findings leave the SARIF upload, and what happens to alerts an earlier upload opened are
    docs/modules/security-scans.md's, "Semgrep".

  The calling job needs security-events: write for the SARIF upload.

runs:
  using: composite
  steps:
    # The action's pinned bun by absolute path: later steps run
    # steps.action-bun.outputs.path, never `bun` through PATH, where a later
    # setup-bun can put another bun first.
    - name: Set up the action's bun
      id: action-bun
      uses: $/actions/bun-setup
      with:
        from: ${{ github.action_path }}

    - name: Install the action's dependencies
      id: install
      shell: bash
      env:
        ACTION_BUN: ${{ steps.action-bun.outputs.path }}
        ACTION_PATH: ${{ github.action_path }}
      run: '"$ACTION_BUN" install --frozen-lockfile --production --cwd "$ACTION_PATH"'

    - name: Install semgrep
      shell: bash
      run: python3 -m pip install --quiet semgrep==1.176.1

    # The verdict is semgrep's exit code: 1 on a finding (--error), 2 and up when the scan itself failed, 0 for a
    # clean completed scan. Parse failures and timeouts are warn-level, reported in semgrep's own summary, and exit 0.
    - name: Scan
      shell: bash
      run: >-
        semgrep scan --config p/default --metrics=off --severity ERROR --error
        --exclude-rule=yaml.github-actions.security.github-actions-mutable-action-tag.github-actions-mutable-action-tag
        --sarif-output="$RUNNER_TEMP/semgrep.sarif" .

    # Both run after a scan that found something (exit 1). The filter needs the install, and the upload needs the
    # filter to have succeeded, or an unfiltered SARIF reaches code scanning.
    - name: Drop the marked findings from the SARIF
      id: filter
      if: ${{ !cancelled() && steps.install.outcome == 'success' }}
      shell: bash
      env:
        ACTION_BUN: ${{ steps.action-bun.outputs.path }}
      run: '"$ACTION_BUN" "${{ github.action_path }}/drop_suppressed.ts"'

    - name: Upload the findings to code scanning
      if: ${{ !cancelled() && steps.filter.outcome == 'success' }}
      uses: github/codeql-action/upload-sarif@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4.38.2
      with:
        sarif_file: ${{ runner.temp }}/semgrep.sarif
        category: semgrep
