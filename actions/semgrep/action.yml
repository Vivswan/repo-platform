name: Semgrep
description: |
  Runs semgrep's default registry ruleset over the caller's checkout at ERROR severity, the fleet's static analysis.

  The ERROR findings are uploaded to code scanning as SARIF, and one of them fails the step
  (semgrep's own --error). WARNING and INFO rules do not run, so their findings appear
  nowhere. An earlier upload may have opened lower-severity alerts, and code scanning marks
  them fixed once a later upload for the same category and branch lacks them.

  Public repositories only: the registry needs no token, but code scanning needs a public
  repository or Advanced Security.

  The only bypass is semgrep's own `// nosemgrep: rule-id` comment on the finding, with a
  reason. semgrep keeps a marked finding in its SARIF as a suppressed result and code scanning
  reads no `suppressions` property, so the upload drops suppressed results first.

  One registry rule is excluded, permanently: mutable-action-tag duplicates zizmor's
  unpinned-uses, and one tool owns each finding class.

  The calling job needs security-events: write for the SARIF upload.

runs:
  using: composite
  steps:
    # The action's pinned bun by absolute path: later steps run
    # steps.action-bun.outputs.path, never `bun` through PATH, where a later
    # setup-bun can put another bun first. The script imports node builtins
    # and actions/shared alone, so there is nothing to install.
    - name: Set up the action's bun
      id: action-bun
      uses: Vivswan/repo-platform/actions/bun-setup@stable
      with:
        from: ${{ github.action_path }}

    - name: Install semgrep
      shell: bash
      run: python3 -m pip install --quiet semgrep==1.176.1

    # The verdict is semgrep's exit code: 1 on a finding (--error), 2 and up when the scan itself failed, 0 for a
    # clean completed scan. Parse failures and timeouts are warn-level, reported in semgrep's own summary, and exit 0.
    - name: Scan
      shell: bash
      run: >-
        semgrep scan --config p/default --metrics=off --severity ERROR --error
        --exclude-rule=yaml.github-actions.security.github-actions-mutable-action-tag.github-actions-mutable-action-tag
        --sarif-output="$RUNNER_TEMP/semgrep.sarif" .

    - name: Drop the marked findings from the SARIF
      if: ${{ !cancelled() }}
      shell: bash
      env:
        ACTION_BUN: ${{ steps.action-bun.outputs.path }}
      run: '"$ACTION_BUN" "${{ github.action_path }}/drop_suppressed.ts"'

    - name: Upload the findings to code scanning
      if: ${{ !cancelled() }}
      uses: github/codeql-action/upload-sarif@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4.38.2
      with:
        sarif_file: ${{ runner.temp }}/semgrep.sarif
        category: semgrep
