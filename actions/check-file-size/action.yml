name: Check File Size
description: |
  Caps file length and comment block length in the caller's checkout.

  Two tiers for length: a sensible size warns, a hard cap fails. One tier for a comment
  block: it warns only, and a comment line `comment-cap: ignore <reason>` exempts its block.
  The caps and the file kinds are check-file-size.ts.

  A comment block is a run of lines opening with a comment prefix, whatever the language. So a
  string line opening with `//` counts toward a block warning, never a red check.

  Findings are written once, as one table, and reported through the sinks the fleet rule sets
  for any check that reports findings:
    - the step summary and the log annotations, on every event
    - a sticky PR comment on pull_request events, deleted when there is nothing to say

  Skipped and counted: a file carrying repo-platform's managed header (the caller cannot fix it).

  Repo-owned exemptions: `.file-size-allow.local`, one path per line with a `# reason`.

  The calling job needs pull-requests: write for the comment.

runs:
  using: composite
  steps:
    # The action's pinned bun by absolute path: later steps run
    # steps.action-bun.outputs.path, never `bun` through PATH, where a later
    # setup-bun can put another bun first.
    - name: Set up the action's bun
      id: action-bun
      uses: Vivswan/repo-platform/actions/bun-setup@stable
      with:
        from: ${{ github.action_path }}

    # The script records report=findings|clean|error itself; a crash before
    # that leaves it empty, which posts no comment. The comment steps read it
    # on !cancelled(), so the comment is posted before the job turns red.
    - name: Check file sizes
      id: check
      shell: bash
      env:
        ACTION_BUN: ${{ steps.action-bun.outputs.path }}
        REPORT_PATH: ${{ runner.temp }}/check-file-size-report.md
      run: '"$ACTION_BUN" "${{ github.action_path }}/check-file-size.ts"'

    # The comment is a convenience sink: the summary and annotations carry
    # the same table, so a token without pull-requests write (a fork or
    # Dependabot PR) must not turn the verdict red.
    - name: Post the findings as a sticky PR comment
      if: ${{ !cancelled() && github.event_name == 'pull_request' && steps.check.outputs.report == 'findings' }}
      continue-on-error: true
      uses: marocchino/sticky-pull-request-comment@5770ad5eb8f42dd2c4f34da00c94c5381e49af88 # v3.0.5
      with:
        header: repo-platform/check-file-size
        path: ${{ runner.temp }}/check-file-size-report.md

    - name: Remove a stale sticky comment
      if: ${{ !cancelled() && github.event_name == 'pull_request' && steps.check.outputs.report == 'clean' }}
      continue-on-error: true
      uses: marocchino/sticky-pull-request-comment@5770ad5eb8f42dd2c4f34da00c94c5381e49af88 # v3.0.5
      with:
        header: repo-platform/check-file-size
        delete: true
