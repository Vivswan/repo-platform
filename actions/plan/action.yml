name: Plan
description: |
  Resolves one managed repository's fleet configuration at run time, so every managed ci.yml can be byte-identical: it
  reads the registration (.repo-platform.yml) in the caller's checkout, checks it against files.yml at the root of the
  delivery commit beside this action, and publishes step outputs. An invalid registration fails closed.

  - default: what fleet.yml's jobs key on (the module selection in canonical order, the visibility, the CodeQL
    languages, the tracking labels).
  - site: the configuration the pages-site action consumes, as one JSON document (the site title, the docs mount path or null
    for no docs half, the include roots, the link-rot label). Given the vars input, it also exports the repository
    variables the registration's site.vars names as environment values of the job.

  - npm: the directory of the package the npm-publish action publishes.

  - autofix: the registration's autofix block, the lists the autofix action judges a fix against, as one JSON document.

inputs:
  mode:
    description: default (the fleet.yml job outputs), site (the pages-site configuration), npm (the package's directory), or autofix (the fix lists).
    required: false
    default: default
  private:
    description: The repository's visibility, "true" or "false" (pass github.event.repository.private), which mode default requires.
    required: false
    default: ""
  path:
    description: The directory holding the registration, relative to the workspace, for a job that checks the repository out beside another tree.
    required: false
    default: "."
  vars:
    description: |
      The caller's `vars` context as JSON (toJSON(vars), which a composite action cannot read), from which mode site exports the variables the registration's site.vars names, and no others, a name the repository has not set as empty; empty exports nothing.
    required: false
    default: ""
outputs:
  modules:
    description: The selected modules in canonical order, a compact JSON array (mode default).
    value: ${{ steps.plan.outputs.modules }}
  private:
    description: The repository's visibility, "true" or "false" (mode default).
    value: ${{ steps.plan.outputs.private }}
  codeql-languages:
    description: CodeQL languages to analyze, a compact JSON array, "[]" when CodeQL is off (mode default).
    value: ${{ steps.plan.outputs.codeql-languages }}
  tracking-labels:
    description: Comma-separated nightly tracking-issue labels of the selected stream modules (mode default).
    value: ${{ steps.plan.outputs.tracking-labels }}
  weekly:
    description: >-
      "true" on Mondays (UTC), the scheduled run that also reruns CodeQL (mode default).
    value: ${{ steps.plan.outputs.weekly }}
  config:
    description: >-
      The site configuration as compact JSON {"site_title", "docs_path", "include", "link_rot_label",
      "link_rot_color", "link_rot_description"}, the pages-site action's config input, with docs_path null when the registration turns the docs half off with site.path: null (mode site).
    value: ${{ steps.plan.outputs.config }}
  site-vars:
    description: The names of the repository variables the registration's site.vars declares, comma-separated and empty for none (mode site).
    value: ${{ steps.plan.outputs.site-vars }}
  npm-path:
    description: The directory of the package to publish, relative to the repository root, "." for the root (mode npm).
    value: ${{ steps.plan.outputs.npm-path }}

  autofix-config:
    description: >-
      The registration's autofix block as compact JSON {"label": {"paths", "delete"}, "push": {"on", "paths", "delete"}},
      the autofix action's config input, with push null when the registration declares none, or `null` when the
      registration does not select the module (mode autofix).
    value: ${{ steps.plan.outputs.autofix-config }}

runs:
  using: composite
  steps:
    # The action's pinned bun by absolute path: later steps run
    # steps.action-bun.outputs.path, never `bun` through PATH, where a later
    # setup-bun can put another bun first.
    - name: Set up the action's bun
      id: action-bun
      uses: $/actions/bun-setup
      with:
        from: ${{ github.action_path }}

    - name: Install the action's dependencies
      shell: bash
      env:
        ACTION_BUN: ${{ steps.action-bun.outputs.path }}
        ACTION_PATH: ${{ github.action_path }}
      run: '"$ACTION_BUN" install --frozen-lockfile --production --cwd "$ACTION_PATH"'

    # files.yml and its files/ tree sit at the delivery commit's root, two
    # levels above this action's directory.
    - name: Resolve the plan
      id: plan
      shell: bash
      working-directory: ${{ inputs.path }}
      env:
        ACTION_BUN: ${{ steps.action-bun.outputs.path }}
        MODE: ${{ inputs.mode }}
        PRIVATE: ${{ inputs.private }}
        VARS: ${{ inputs.vars }}
        FILES_CONFIG: ${{ github.action_path }}/../../files.yml
        FILES_TREE: ${{ github.action_path }}/../../files
      run: '"$ACTION_BUN" "${{ github.action_path }}/plan.ts"'
