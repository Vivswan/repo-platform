name: Plan
description: |
  Resolves one managed repository's fleet configuration at run time, so every managed ci.yml can be byte-identical.

  It reads the repository's registration (.repo-platform.yml) in the caller's checkout,
  checks it against the module data at the root of the delivery commit beside this action,
  and publishes the result as step outputs. That data is files.yml, whose modules block is
  the vocabulary in canonical order. Any invalid registration fails closed.

  Modes:
    - default: what fleet-ci.yml's jobs key on (the module selection in canonical order, the
      visibility, the CodeQL languages, the tracking labels)
    - site: the site configuration the pages-site action consumes, as one JSON document (the
      site title, the docs mount path or null for no docs half, the include roots, the
      link-rot label)

  GH_TOKEN is needed in the environment only when the private input is empty, since the
  visibility is then read from the API.

inputs:
  mode:
    description: default (the fleet-ci job outputs) or site (the pages-site configuration).
    required: false
    default: default
  private:
    description: >-
      The repository's visibility, "true" or "false" (pass github.event.repository.private).
      Empty asks the API with GH_TOKEN.
    required: false
    default: ""
outputs:
  modules:
    description: The selected modules in canonical order, a compact JSON array (mode default).
    value: ${{ steps.plan.outputs.modules }}
  private:
    description: The repository's visibility, "true" or "false" (mode default).
    value: ${{ steps.plan.outputs.private }}
  codeql-languages:
    description: CodeQL languages to analyze, a compact JSON array, "[]" when CodeQL is off (mode default).
    value: ${{ steps.plan.outputs.codeql-languages }}
  tracking-labels:
    description: Comma-separated nightly tracking-issue labels of the selected stream modules, the fleet-wide security stream last (mode default).
    value: ${{ steps.plan.outputs.tracking-labels }}
  security-label:
    description: The fleet-wide security stream's label, the settings baseline's (mode default).
    value: ${{ steps.plan.outputs.security-label }}
  security-label-color:
    description: The security label's color, as the baseline declares it (mode default).
    value: ${{ steps.plan.outputs.security-label-color }}
  security-label-description:
    description: The security label's description, as the baseline declares it (mode default).
    value: ${{ steps.plan.outputs.security-label-description }}
  weekly:
    description: '"true" on Mondays (UTC): the scheduled run that also reruns CodeQL (mode default).'
    value: ${{ steps.plan.outputs.weekly }}
  config:
    description: >-
      The site configuration as compact JSON {"site_title", "docs_path", "include", "link_rot_label",
      "link_rot_color", "link_rot_description"}, the pages-site action's config input (mode site).
      docs_path is null when the registration turns the docs half off with site.path: null.
    value: ${{ steps.plan.outputs.config }}

runs:
  using: composite
  steps:
    # The action's pinned bun by absolute path: later steps run
    # steps.action-bun.outputs.path, never `bun` through PATH, where a later
    # setup-bun can put another bun first.
    - name: Set up the action's bun
      id: action-bun
      uses: $/actions/bun-setup
      with:
        from: ${{ github.action_path }}

    - name: Probe where $/ resolved
      shell: bash
      env:
        PROBE_REPOSITORY: ${{ github.action_repository }}
        PROBE_REF: ${{ github.action_ref }}
        PROBE_PATH: ${{ github.action_path }}
      run: echo "probe repository=$PROBE_REPOSITORY ref=$PROBE_REF path=$PROBE_PATH"

    - name: Install the action's dependencies
      shell: bash
      env:
        ACTION_BUN: ${{ steps.action-bun.outputs.path }}
        ACTION_PATH: ${{ github.action_path }}
      run: '"$ACTION_BUN" install --frozen-lockfile --production --cwd "$ACTION_PATH"'

    # files.yml and its files/ tree sit at the delivery commit's root, two
    # levels above this action's directory.
    - name: Resolve the plan
      id: plan
      shell: bash
      env:
        ACTION_BUN: ${{ steps.action-bun.outputs.path }}
        MODE: ${{ inputs.mode }}
        PRIVATE: ${{ inputs.private }}
        FILES_CONFIG: ${{ github.action_path }}/../../files.yml
        FILES_TREE: ${{ github.action_path }}/../../files
      run: '"$ACTION_BUN" "${{ github.action_path }}/plan.ts"'
