name: Validate Skills
description: >-
  Validates a repository hosting agent skills (the skills module). Two
  modes: structure (offline; the plugin manifests parse and reference real
  skill folders, and every folder under the skills directory satisfies the
  SKILL.md frontmatter contract) and discovery (runs the real `npx skills
  add <repo> --list` against the checkout and asserts every published
  skill appears in the listing - needs network for the npx download, so
  callers give it its own job). An empty skills catalog (the starter's
  seeded state) passes both modes.

inputs:
  skills-dir:
    description: Directory holding the repository's agent skills (relative to the repo root)
    required: false
    default: skills
  plugin-manifest:
    description: Path of the plugin manifest listing the published skills
    required: false
    default: .claude-plugin/plugin.json
  mode:
    description: structure (offline manifest and skill-folder checks) or discovery (npx skills CLI listing)
    required: false
    default: structure

runs:
  using: composite
  steps:
    - name: Check for a bun matching the action's pin
      id: bun
      shell: bash
      env:
        BASH_ENV: ""
        SHELLOPTS: ""
        PIN_FILE: ${{ github.action_path }}/.bun-version
      run: |
        pin="$(<"$PIN_FILE")"
        path="$(command -v bun || true)"
        case "$path" in /*) ;; *) path="" ;; esac
        have=""
        if [ -n "$path" ]; then have="$("$path" --version 2>/dev/null)" || have=""; fi
        if [ -z "$pin" ] || [ "$have" != "$pin" ]; then path=""; fi
        echo "bun ${pin:-(no pin)}: ${path:-none on PATH}"
        echo "path=$path" >> "$GITHUB_OUTPUT"
        echo "pinned=$([ -n "$path" ] && echo true || echo false)" >> "$GITHUB_OUTPUT"

    # Skipped only when the caller's bun already IS the pinned version
    # (reuse then just skips a second network fetch): the action's scripts
    # and lockfile run on the action-local .bun-version pin (generated
    # from the manifests' bun pin), never on whatever the CALLER resolves
    # - a caller pinning an older bun cannot parse the lockfiles
    # repo-platform's bun writes.
    - name: Set up bun
      id: setup-bun
      if: steps.bun.outputs.pinned != 'true'
      continue-on-error: true
      uses: oven-sh/setup-bun@v2
      with:
        bun-version-file: ${{ github.action_path }}/.bun-version

    # One retry: the setup's network fetch is a known transient flake, and
    # on nightly reporting paths a flake here turns a green night red.
    - name: Set up bun (retry)
      if: steps.setup-bun.outcome == 'failure'
      uses: oven-sh/setup-bun@v2
      with:
        bun-version-file: ${{ github.action_path }}/.bun-version

    # Re-resolved after the setup so the recorded path is the bun it
    # installed; every later step runs that path, never bun through PATH.
    - name: Resolve the action's bun
      id: action-bun
      if: always()
      shell: bash
      env:
        BASH_ENV: ""
        SHELLOPTS: ""
        PIN_FILE: ${{ github.action_path }}/.bun-version
      run: |
        pin="$(<"$PIN_FILE")"
        path="$(command -v bun || true)"
        case "$path" in /*) ;; *) path="" ;; esac
        have=""
        if [ -n "$path" ]; then have="$("$path" --version 2>/dev/null)" || have=""; fi
        if [ -z "$pin" ] || [ "$have" != "$pin" ]; then path=""; fi
        echo "bun ${pin:-(no pin)}: ${path:-none on PATH}"
        echo "path=$path" >> "$GITHUB_OUTPUT"
        echo "pinned=$([ -n "$path" ] && echo true || echo false)" >> "$GITHUB_OUTPUT"

    - name: Validate skills
      shell: bash
      env:
        BASH_ENV: ""
        SHELLOPTS: ""
        SKILLS_DIR: ${{ inputs.skills-dir }}
        PLUGIN_MANIFEST: ${{ inputs.plugin-manifest }}
        MODE: ${{ inputs.mode }}
        ACTION_BUN: ${{ steps.action-bun.outputs.path }}
      run: '"$ACTION_BUN" "${{ github.action_path }}/validate_skills.ts"'
