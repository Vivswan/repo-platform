name: Copilot Review Gate
description: >-
  One-shot, fail-fast check that Copilot's automatic PR review has ARRIVED.
  Fails immediately when the review is expected but not yet posted, so the
  re-arm workflow can re-run just this job when it lands - no polling, no
  sleeping, no billed waiting.

inputs:
  head-sha:
    description: The pull request's head sha.
    required: true
  pr-number:
    description: The pull request number.
    required: true
  base-branch:
    description: The pull request's base branch, whose rules decide whether a review is expected.
    required: true
  github-token:
    description: Token used for the gh api reads (contents, checks and pull-requests read are enough).
    required: true
  probe-timeout-ms:
    description: Per-call network deadline in milliseconds.
    required: false
    default: "15000"

runs:
  using: composite
  steps:
    # This job carries no checkout and no toolchain by design, so bun is
    # normally absent and set up here. Keeping the whole job under a minute
    # is what makes it free on private repositories, where Actions bills per
    # job rounded UP to the minute: a 10s job and a 40s job cost the same.
    - name: Check for a caller-installed bun
      id: bun
      shell: bash
      run: echo "present=$(command -v bun >/dev/null && echo true || echo false)" >> "$GITHUB_OUTPUT"

    - name: Set up bun
      id: setup-bun
      if: steps.bun.outputs.present != 'true'
      continue-on-error: true
      uses: oven-sh/setup-bun@v2

    # One retry: the setup's network fetch is a known transient flake, and a
    # flake here would fail a gate that has nothing to do with the review.
    - name: Set up bun (retry)
      if: steps.setup-bun.outcome == 'failure'
      uses: oven-sh/setup-bun@v2

    - name: Install dependencies (zod)
      shell: bash
      working-directory: ${{ github.action_path }}
      run: bun install --frozen-lockfile --production --silent

    - name: Check that the Copilot review arrived
      shell: bash
      env:
        GH_TOKEN: ${{ inputs.github-token }}
        HEAD_SHA: ${{ inputs.head-sha }}
        PR_NUMBER: ${{ inputs.pr-number }}
        BASE_BRANCH: ${{ inputs.base-branch }}
        PROBE_TIMEOUT_MS: ${{ inputs.probe-timeout-ms }}
      run: bun "${{ github.action_path }}/gate.ts"
