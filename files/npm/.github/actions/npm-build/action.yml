# This file is repo-owned, seeded once by the fleet sync and never overwritten by a later sync.

name: npm Build
description: |
  Builds this repository's npm package for the fleet's publish.

  It runs as the npm-build hook of ci.yml's `npm-next` and `npm-latest` legs, on the judged commit, after the fleet
  stamped the version into package.json and before it runs `npm publish`. It does not run when there is nothing to
  publish.

  The contract and examples are the fleet's docs/modules/npm.md.

inputs:
  version:
    description: The version being published, already in package.json, for a build that bakes it in and a check of what was built
    required: true

runs:
  using: composite
  steps:
    # A repository replaces the failing step below with its toolchain setup, its build, and a check that the built
    # package carries the version. A manifest edit the published package needs goes here too. For a bun repository:
    #   - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
    #   - shell: bash
    #     env:
    #       VERSION: ${{ inputs.version }}
    #     run: |
    #       bun install --frozen-lockfile
    #       bun run build
    #       test "$(node dist/cli.js --version)" = "$VERSION"
    #       npm pkg delete scripts.prepare
    - shell: bash
      run: |
        echo "::error::npm-build hook: not configured; fill in .github/actions/npm-build/action.yml before the npm module publishes"
        exit 1
