---
# Layer 1 of the settings merge (docs/settings.md): everything here is OVERRIDABLE by a repository's own .github/settings.local.yml.
# Invariants a repository must not weaken live in files/settings/override.yml, which merges ABOVE the overlay; identity keys (description, homepage, topics, private) live only in the overlay.

repository:
  has_issues: true
  has_wiki: false
  has_projects: false
  has_discussions: false
  default_branch: main
  delete_branch_on_merge: true
  allow_update_branch: true
  enable_automated_security_fixes: true

# dependabot recreates `dependencies` and `github_actions` when missing (the base dependabot.yml always carries the github-actions ecosystem), so leaving either undeclared would loop delete/recreate nightly.
# Per-ecosystem dependabot labels come from the toolchain modules' own settings.yml layers.
labels:
  - name: dependencies
    color: "0366d6"
    description: Dependency updates
  - name: github_actions
    color: "000000"
    description: Pull requests that update GitHub Actions code
  - name: bug
    color: "d73a4a"
    description: Something isn't working
  - name: enhancement
    color: "a2eeef"
    description: New feature or request
  - name: fix-lint
    color: "fbca04"
    description: Lint / formatting fixes
  # The owner's standing approval on a pull request, applied by the owner
  # alone: whoever runs the landing checks that the labeling actor is the
  # repository owner and that no push followed it, then merges once every
  # check is green. A later push voids it; the label comes off and is re-asked.
  - name: merge-when-green
    color: "0e8a16"
    description: "Owner approved: merge once every gate is green"
  # Fleet data, not a module's tracking label: fleet-nightly's Trivy scan files findings under it on every repository (docs/security-scans.md), and the plan step lists it among the tracking labels release-health blocks on.
  - name: security-nightly
    color: "1d76db"
    description: Automated nightly security scan findings

