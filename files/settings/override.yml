---
# Layer 6, the TOP of the settings merge (docs/settings.md): it merges ABOVE the repository's own .github/settings.local.yml, so a key declared or nulled there still gets the fleet value.
# Only genuine fleet invariants belong here; everything a repository may tune lives in files/settings/baseline.yml.

repository:
  allow_squash_merge: true
  allow_merge_commit: false
  allow_rebase_merge: false
  # release-please parses the squash subject and the pr-title check validates the PR title because it becomes that subject;
  # GitHub defaults the subject to the PR title only for single-commit PRs.
  # BLANK because with PR_BODY the whole body (tables, fences, details blocks) becomes the message, which release-please drops
  # from the changelog when it cannot parse it, and whose footers count only in a clean trailing block.
  #   footers a PR needs (BREAKING CHANGE, Release-As) -> a BEGIN_COMMIT_OVERRIDE ... END_COMMIT_OVERRIDE block in the PR body, which release-please reads instead
  squash_merge_commit_title: PR_TITLE
  squash_merge_commit_message: BLANK
  allow_auto_merge: true
  enable_vulnerability_alerts: true

rulesets:
  # ONE required check, all-green (docs/all-green.md); the pr-title module's check rides its own baseline-owned ruleset, so this context never changes with module selection.
  # loadOverrideLayer refuses this file when the all-green context or its integration_id pin is missing.
  #
  #   bypass actor 5 (RepositoryRole admin)   -> direct pushes to main keep working
  #   integration_id 15368 (GitHub Actions)    -> no other app and no plain commit status can satisfy the context by name
  #   files/settings/codeql-public.yml          -> appends the code_scanning rule keyed by `type`; no layer can remove or weaken a rule declared here
  - name: main
    target: branch
    enforcement: active
    conditions:
      ref_name:
        include:
          - "~DEFAULT_BRANCH"
        exclude: []
    rules:
      - type: deletion
      - type: non_fast_forward
      - type: required_linear_history
      - type: required_status_checks
        parameters:
          strict_required_status_checks_policy: false
          do_not_enforce_on_create: true
          required_status_checks:
            - context: all-green
              integration_id: 15368
      - type: pull_request
        parameters:
          required_approving_review_count: 0
          dismiss_stale_reviews_on_push: false
          require_code_owner_review: true
          require_last_push_approval: false
          # An unresolved review thread is an unaddressed finding.
          required_review_thread_resolution: true
          # Squash-only merges (enforced by the ruleset, not just repo
          # settings).
          allowed_merge_methods:
            - squash
    bypass_actors:
      - actor_id: 5
        actor_type: RepositoryRole
        bypass_mode: always

  # Rules with an EMPTY bypass list: nobody - owner and admins included -
  # can violate these on the default branch. A separate ruleset so the
  # main ruleset's admin bypass (which keeps direct pushes working) cannot
  # exempt anyone from these rules.
  - name: non-bypassable
    target: branch
    enforcement: active
    conditions:
      ref_name:
        include:
          - "~DEFAULT_BRANCH"
        exclude: []
    rules:
      - type: deletion
      - type: required_linear_history
    # Declared empty on purpose: an omitted key is invisible to drift
    # detection and preserved by the update, so the empty list is what
    # lets the nightly apply heal an out-of-band bypass actor.
    bypass_actors: []
