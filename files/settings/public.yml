---
# Layer 2 of the settings merge, PUBLIC repositories only (docs/settings.md): a private repository without Advanced Security rejects the security_and_analysis keys with a 422 and cannot use the code_quality feature family.
# GitHub already enables both security_and_analysis keys on public repositories; declaring them lets the apply heal an out-of-band disable.

repository:
  security_and_analysis:
    secret_scanning:
      status: enabled
    secret_scanning_push_protection:
      status: enabled

rulesets:
  # code_quality lives here for every public repo, not beside code_scanning in the toolchain layers: the rule gates on GitHub Code Quality's OWN analysis, and its documented blocking conditions omit "a required tool is not configured".
  # The evidence is the docs' silence plus ONE live specimen, copilot-env, which has carried this rule since 2026-08-21 (ruleset history v47188788).
  #
  #   personal account                                   -> Code Quality (a Team/GHEC-only product) cannot be enabled there
  #   PRs kept auto-merging under the rule               -> auto-merge does not bypass rules, so the rule was not blocking
  #   GitHub starts blocking on an unconfigured analysis -> merges block fleet-wide, loudly, not silently
  #   private repositories                               -> the feature family needs Advanced Security, so the private layer stays silent
  #   rules of a same-name ruleset                       -> append across layers keyed by `type`, adding to the main ruleset in files/settings/override.yml
  #   severity: warnings                                 -> matches the specimen's live rule
  - name: main
    rules:
      - type: code_quality
        parameters:
          severity: warnings
      # Public-only by fleet policy, not by GitHub: private repos can run Copilot reviews (verified live 2026-08). The reviews are ADVISORY; no gate waits on the copilot-pull-request-reviewer check run.
      #
      #   bot-authored PRs (Dependabot)   -> no automatic run despite this rule
      #   a new push to a DRAFT PR        -> no automatic run despite review_draft_pull_requests; request it from the reviewers panel
      - type: copilot_code_review
        parameters:
          review_on_push: true
          review_draft_pull_requests: true
