---
# Layer 2 of the settings merge, PUBLIC repositories only (docs/settings.md): a private repository without Advanced Security rejects the security_and_analysis keys with a 422 and cannot use the code_quality feature family.
# GitHub already enables both security_and_analysis keys on public repositories; declaring them lets the apply heal an out-of-band disable.

repository:
  security_and_analysis:
    secret_scanning:
      status: enabled
    secret_scanning_push_protection:
      status: enabled

rulesets:
  # Code quality results are required on every public repository whatever its toolchain, so the rule lives in this layer, not beside code_scanning in files/settings/codeql-public.yml.
  # Rules of a same-name ruleset append across layers keyed by `type`, so this joins the main ruleset in files/settings/override.yml.
  - name: main
    rules:
      - type: code_quality
        parameters:
          severity: warnings
      # Public-only by fleet policy, not by GitHub: private repos can run Copilot reviews (verified live 2026-08). The reviews are ADVISORY; no gate waits on the copilot-pull-request-reviewer check run.
      #
      #   bot-authored PRs (Dependabot)   -> no automatic run despite this rule
      #   a new push to a DRAFT PR        -> no automatic run despite review_draft_pull_requests; request it from the reviewers panel
      - type: copilot_code_review
        parameters:
          review_on_push: true
          review_draft_pull_requests: true
