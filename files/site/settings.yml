# The settings apply creates the Pages site when absent, so the first deploy needs no manual Pages toggle.
pages:
  build_type: workflow

# reusable-site.yml deploys into this environment from main alone; a required-reviewers rule added by hand parks every
# deploy "waiting for review", so the declared empty roster heals it on the next apply. The branch policy is the one
# GitHub creates the environment with (the default branch alone); the apply refuses an environment update that would
# drop a live policy the layer omits, so it is spelled out.
environments:
  - name: github-pages
    reviewers: []
    wait_timer: 0
    prevent_self_review: false
    deployment_branch_policy:
      protected_branches: false
      custom_branch_policies: true
    deployment_branch_policies:
      - name: main
