# The settings apply creates the Pages site when absent, so the first deploy needs no manual Pages toggle.
pages:
  build_type: workflow

# reusable-site.yml deploys into this environment from main alone. The branch policy is the one GitHub creates the
# environment with (the default branch alone); the apply refuses an environment update that would drop a live policy
# the layer omits, so it is spelled out. The reviewer rule is files/site/settings.public.yml's, merged in by name.
environments:
  - name: github-pages
    deployment_branch_policy:
      protected_branches: false
      custom_branch_policies: true
    deployment_branch_policies:
      - name: main
