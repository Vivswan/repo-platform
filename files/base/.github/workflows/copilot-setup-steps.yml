# Prepares the environment Copilot runs in.
#
# This file is repo-owned, seeded once by the fleet sync and never overwritten by a later sync.
#
# Copilot runs this job, which must be named copilot-setup-steps. The push and PR triggers exist so edits to this
# file are validated in CI.
#
# The one x64 job the platform ships: the Copilot coding agent runs its setup on Ubuntu x64 alone, so the fleet's ARM
# default (docs/fleet-guidelines.md, "ARM runners by default") does not apply here.

name: Copilot Setup Steps

on:
  workflow_dispatch:
  push:
    paths: [.github/workflows/copilot-setup-steps.yml]
  pull_request:
    paths: [.github/workflows/copilot-setup-steps.yml]

permissions:
  contents: read

jobs:
  copilot-setup-steps:
    runs-on: ubuntu-latest
    timeout-minutes: 59
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
{{blocks}}
