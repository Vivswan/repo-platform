# This file is managed by {{github_username}}/repo-platform.
# Local edits are replaced on the next sync.
name: Auto Assign

on:
  workflow_dispatch:
    inputs:
      issue:
        description: Issue or PR number to assign (leave empty to sweep every open unassigned item)
        required: false
        default: ""
  issues:
    types: [opened]
  pull_request:
    types: [opened]
  # Nightly catch-up sweep: assigns every open issue and PR whose creation fired no workflow.
  schedule:
    - cron: "13 6 * * *"

permissions: {}

jobs:
  auto-assign:
    permissions:
      contents: read
      issues: write
      pull-requests: write
    uses: {{github_username}}/repo-platform/.github/workflows/reusable-auto-assign.yml@stable
    with:
      issue: ${{ inputs.issue || '' }}
