# Runs this repository's own work after every green push to main (the contract is the fleet's docs/all-green.md,
# "After the gate").
#
# This file is repo-owned, seeded once by the fleet sync and never overwritten by a later sync.
#
# Every green push to main gets its own run of this hook, and main runs queue in one lane in arrival order: a burst
# replaces the pending run, never the running one, so a replaced commit's run never happens while the newest push always runs.
#
# Replace the no-op job with this repository's work, since it costs a runner allocation on every green push until
# you do.
#
# A job acts on the repository's current state, idempotently, never on "what this commit changed" or "the newest
# commit".
#
# A concurrency group on a job here serializes nothing between commits (main runs queue), so key it per commit
# (inputs.sha): it then never waits on another run, and the release leg that needs this hook is never held.

name: Post Green

on:
  workflow_call:
    inputs:
      sha:
        description: The green main commit the calling run judged.
        required: true
        type: string

jobs:
  noop:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - env:
          SHA: ${{ inputs.sha }}
        run: echo "post-green hook for $SHA - nothing configured"
