# Runs this repository's own checks under the all-green gate.
#
# This file is repo-owned, seeded once by the fleet sync and never overwritten by a later sync, so edit freely.
#
# The caller grants no secrets and caps at contents: read. A check needing more gets its own workflow, wired via
# .github/settings.yml.
#
# A job skipped by its own `if:` stands down from the all-green gate. A job with `continue-on-error: true` is an
# advisory check, whose failures stay out of the gate too.

name: Checks

on:
  workflow_call:

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
{{blocks}}

      - name: Repository-specific checks go here
        run: echo "add this repository's own test and lint jobs to checks.yml"
