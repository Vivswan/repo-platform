# Runs this repository's own checks under the all-green gate.
#
# This file is repo-owned, seeded once by the fleet sync and never overwritten by a later sync, so edit freely.
#
# The caller passes the repository's secrets through (a job reading an environment secret declares its environment) and
# grants contents: write and pull-requests: write. The block below keeps every job at contents: read; the job that keeps
# a sticky comment on the pull request (the fleet's docs/fleet-guidelines.md), or publishes release assets on a push to
# main, raises itself with its own block. A check needing more permissions gets its own workflow, wired via
# .github/settings.yml.
#
# A job skipped by its own `if:` stands down from the all-green gate. A job with `continue-on-error: true` is an
# advisory check, whose failures stay out of the gate too.

name: Checks

on:
  workflow_call:

permissions:
  contents: read

jobs:
  checks:
    runs-on: ${{ github.event.repository.private && vars.CI_RUNS_ON || 'ubuntu-latest' }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
{{blocks}}

      - name: Repository-specific checks go here
        run: echo "add this repository's own test and lint jobs to checks.yml"
