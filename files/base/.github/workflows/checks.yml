# Repo-owned: seeded once by the fleet sync, never overwritten by a later sync - edit freely.
# The caller grants no secrets and caps at contents: read; a check needing more gets its own workflow, wired via .github/settings.yml.
#   a job skipped by its own `if:`   -> stands down from the all-green gate
#   `continue-on-error: true`        -> an advisory check: even its failures stay out of the gate

name: Checks

on:
  workflow_call:

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
{{blocks}}

      - name: Repository-specific checks go here
        run: echo "add this repository's own test and lint jobs to checks.yml"
