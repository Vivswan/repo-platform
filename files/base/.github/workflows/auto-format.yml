# Repo-owned: seeded once by the fleet sync, never
# overwritten by a later sync - adjust the format commands freely. GitHub
# holds the new head's pull_request run for approval after this workflow's
# github.token push; a PAT would start it outright, but any same-repo PR's
# formatter tooling runs in this checkout before the push - only wire in a
# token you would expose to it.

name: Auto Format

on:
  pull_request:
    types: [labeled]

# Per-label group: unrelated labels skip in their own group, while
# re-adding fix-lint cancels the older fix-lint run in favor of the newest.
concurrency:
  group: auto-format-${{ github.event.pull_request.number }}-${{ github.event.label.name }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  format:
    # GITHUB_TOKEN cannot push to a fork's branch, and PR-controlled tool
    # configuration must not run next to write credentials.
    if: github.event.label.name == 'fix-lint' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          persist-credentials: false
{{blocks}}

      - name: Commit and push changes
        id: push
        env:
          GH_TOKEN: ${{ github.token }}
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
          NOTICE: >-
            Formatting commit pushed with the workflow token: GitHub holds the new head's pull_request run
            for approval, so its checks stay unreported. Approve the run from the PR's merge box or the
            Actions tab, or push a commit to this branch.
        run: |
          if git diff --quiet; then
            echo "nothing to format"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "style: apply automated formatting"
          git push "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" HEAD:"$HEAD_REF"
          # The push succeeded: the held run is a notice, not a failure.
          echo "notice=$NOTICE" >> "$GITHUB_OUTPUT"
          echo "::warning::$NOTICE"
      - name: Comment how to release the held run
        if: steps.push.outputs.notice != ''
        uses: marocchino/sticky-pull-request-comment@5770ad5eb8f42dd2c4f34da00c94c5381e49af88 # v3.0.5
        with:
          header: repo-platform/auto-format
          message: ${{ steps.push.outputs.notice }}
      # The label is a one-shot request: remove it even when a step failed,
      # so a broken run cannot loop.
      - name: Remove the fix-lint label
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          PR_URL: ${{ github.event.pull_request.html_url }}
        run: gh pr edit "$PR_URL" --remove-label fix-lint
