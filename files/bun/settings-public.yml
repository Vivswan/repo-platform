---
# GitHub rejects the code_scanning rule on a private repository, so it lives in this PUBLIC-only layer (layer 4, docs/settings.md), not the module's unconditional one.
# Rules of a same-name ruleset append across layers keyed by `type`: this adds to the main ruleset files/settings/override.yml declares, and two analyzable toolchains contribute the rule once.

rulesets:
  - name: main
    rules:
      - type: code_scanning
        parameters:
          code_scanning_tools:
            - tool: CodeQL
              security_alerts_threshold: high_or_higher
              # errors_and_warnings: CodeQL warnings gate merges too. Pinned
              # at the fleet layer so no repo re-declares the tightening in
              # its own settings.yml, where a copy would only shadow it.
              alerts_threshold: errors_and_warnings
