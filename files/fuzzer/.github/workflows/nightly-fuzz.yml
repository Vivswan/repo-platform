# Runs the nightly fuzzing, as the starter written once by {{github_username}}/repo-platform and never overwritten
# by a later sync.
#
# Replace the placeholder fuzz step. Follow the failure-report contract in docs/modules/fuzzer.md, and the issue
# filing, replay, and auto-close steps keep working.
name: Nightly Fuzz

on:
  schedule:
    # Pick your repo's own minute so the fleet's nightlies do not all
    # land on GitHub at once.
    - cron: "11 9 * * *"
  workflow_dispatch:
    inputs:
      seed:
        description: Fuzz seed (blank for a random one)
        required: false
        default: ""
      iterations:
        description: Fuzz iterations
        required: false
        default: "1000"

concurrency:
  group: nightly-fuzz

permissions:
  contents: read

jobs:
  fuzz:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    # Sharding multiplies coverage: uncomment the matrix and suffix the
    # artifact name below with the shard (docs/modules/fuzzer.md).
    # strategy:
    #   fail-fast: false
    #   matrix:
    #     shard: [1, 2, 3]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Set up your fuzzer's toolchain here.

      - name: Fuzz
        env:
          SEED: ${{ inputs.seed }}
          ITERATIONS: ${{ inputs.iterations || '1000' }}
        run: |
          SEED="${SEED:-$RANDOM$RANDOM}"
          echo "fuzzing with seed $SEED, $ITERATIONS iterations"
          # Replace with your fuzzer: seeded with $SEED for $ITERATIONS iterations, writing one
          # .fuzz-failures/<name>/report.md per crash (the contract: docs/modules/fuzzer.md).
          # A green no-op until then: an uncustomized starter must not file issues.
          echo "::warning::nightly-fuzz starter not customized yet - replace the placeholder fuzz step (see repo-platform's docs/modules/fuzzer.md)"

      # A job that hits timeout-minutes is cancelled, not failed, and its
      # later steps still run under this condition.
      - name: Upload failure artifacts
        if: failure() || cancelled()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: fuzz-failures-${{ github.run_attempt }}
          # Point this at your failure-report directory.
          path: .fuzz-failures/
          # Hidden paths are skipped by default since upload-artifact v4.4.
          include-hidden-files: true
          if-no-files-found: ignore

  # A CANCELLED fuzz job counts as red: hitting the timeout cancels rather
  # than fails, and a hang is exactly what a fuzzer exists to find.
  report:
    needs: [fuzz]
    if: always()
    runs-on: ubuntu-latest
    # A hung reporter is the residual silence window; keep this tight.
    timeout-minutes: 5
    # issues: write is for the fuzz-issue action; an issue it creates fires no issues:opened event, so it assigns the owner itself.
    permissions:
      issues: write
    steps:
      # A pattern download of nothing succeeds, so a night that wrote no
      # artifact still files the bare notice.
      - name: Download the failure artifacts
        if: needs.fuzz.result == 'failure' || needs.fuzz.result == 'cancelled'
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: fuzz-failures-*
          path: .fuzz-failures
          merge-multiple: true

      - name: File or update the fuzz issue
        if: needs.fuzz.result == 'failure' || needs.fuzz.result == 'cancelled'
        uses: {{github_username}}/repo-platform/actions/fuzz-issue@stable
        with:
          mode: report
          label: "{{fuzzer_label}}"
          title: Nightly fuzz failures
          artifacts-dir: .fuzz-failures
          artifact-name: fuzz-failures-${{ github.run_attempt }}
          label-color: "{{fuzzer_label_color}}"
          label-description: "{{fuzzer_label_description}}"
          stream: fuzz

      - name: Close the fuzz issue on a green night
        if: needs.fuzz.result == 'success'
        uses: {{github_username}}/repo-platform/actions/fuzz-issue@stable
        with:
          mode: resolve
          label: "{{fuzzer_label}}"
          stream: fuzz
