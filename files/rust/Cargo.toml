# Repo-owned workspace root. Written once by {{github_username}}/repo-platform, never overwritten by a later sync: add members, dependencies, and this repository's own lints freely.
#
# The lint floor every Rust repository in the fleet carries.
# `cargo new` inside this workspace writes `[lints] workspace = true` into each new crate, so every member inherits it.
# A lint exception is `#[expect(lint, reason = "...")]`: it says why, and it fails once the lint no longer fires there.

[workspace]
# Cargo 1.84 or newer: nothing older parses resolver 3, and `#[expect(.., reason)]` below needs 1.81.
resolver = "3"
members = []

[workspace.lints.rust]
# Unsafe is quarantined: denied everywhere, re-admitted at the top of an audited module with `#![expect(unsafe_code, reason = "...")]`, and reached from safe code only through that module's safe API.
unsafe_code = "deny"
# An unsafe fn body is not an unsafe scope: each unsafe operation in it sits in its own block, with its own SAFETY comment.
unsafe_op_in_unsafe_fn = "deny"
# The fleet's ASCII typography rule, applied to identifiers.
non_ascii_idents = "deny"
# A `///` line on every public item: what it returns and what its arguments mean, never a narrative of its body.
missing_docs = "deny"
# A stale `#[expect]` fails on every run, the local one included, where its default would only warn.
unfulfilled_lint_expectations = "deny"

[workspace.lints.clippy]
# `// SAFETY:` above every unsafe block, stating the invariant it depends on.
undocumented_unsafe_blocks = "deny"
# One unsafe block, one operation: a comment that covers several cannot be checked.
multiple_unsafe_ops_per_block = "deny"
# Every public unsafe fn carries a `# Safety` doc section: the contract its safe wrapper must uphold.
missing_safety_doc = "deny"
# The duals: a SAFETY comment on a safe block, or a `# Safety` section on a safe fn, is a claim the code no longer makes.
unnecessary_safety_comment = "deny"
unnecessary_safety_doc = "deny"
# `allow` hides a lint for good; `expect` with a reason records why and fails when the cause is gone.
allow_attributes = "deny"
allow_attributes_without_reason = "deny"
# Every assert says what broke.
missing_assert_message = "deny"
# A match on an enum lists every variant, so a new one is a compile error at each site, never a silent fallthrough.
wildcard_enum_match_arm = "deny"
match_wildcard_for_single_variants = "deny"
# A struct pattern that binds every field carries no `..`, so a `..` always marks a deliberate skip.
rest_pat_in_fully_bound_structs = "deny"

# The readability floor: a function reads as the list of its steps. The thresholds live in the managed root clippy.toml.
# Its three lints warn where the rest deny: a threshold is a hint, and a forced split can read worse. The checks starter keeps them at warn under `-D warnings` with `--force-warn`.
# A ninth parameter is a struct argument or a builder.
too_many_arguments = "warn"
# A function past a hundred lines holds two nameable concepts: split it into named steps.
too_many_lines = "warn"
# Nested branching that a guard, a `continue`, or a split would flatten. Off in clippy's default set; naming it here turns it on, on stable.
cognitive_complexity = "warn"
# `let Some(x) = o else { return };` reads once, where `let x = if let ... else` reads twice.
manual_let_else = "deny"
# A nested `if` with nothing between it and its parent is one condition.
collapsible_if = "deny"
collapsible_else_if = "deny"
# The last expression is the value; a trailing `return` is noise.
needless_return = "deny"
# `if !x { a } else { b }` reads inverted: swap the branches.
if_not_else = "deny"
# A `Result` says `# Errors` and a function that can panic says `# Panics`: what the signature cannot.
missing_errors_doc = "deny"
missing_panics_doc = "deny"

[workspace.lints.rustdoc]
# A doc link to an item that is not there fails, as the docs site's link check does for pages.
broken_intra_doc_links = "deny"
