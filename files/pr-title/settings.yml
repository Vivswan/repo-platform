---
# Its own ruleset, not a rule in `main`: rules append across layers keyed by type, so the override's required_status_checks would replace it there; active rulesets on one branch union their required checks.
# Deselecting the module drops it from the render and the next apply deletes it (files/settings/override.yml declares `_undeclared: delete` for rulesets).

rulesets:
  - name: pr-title
    target: branch
    enforcement: active
    conditions:
      ref_name:
        include:
          - "~DEFAULT_BRANCH"
        exclude: []
    rules:
      - type: required_status_checks
        parameters:
          strict_required_status_checks_policy: false
          do_not_enforce_on_create: true
          required_status_checks:
            # The managed pr-title.yml workflow's job check run, pinned to
            # the GitHub Actions app like the main ruleset's all-green
            # context: no other app and no plain commit status can satisfy
            # the context by name.
            - context: pr-title
              integration_id: 15368
    bypass_actors:
      - actor_id: 5
        actor_type: RepositoryRole
        bypass_mode: always
