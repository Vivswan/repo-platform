---
# One key on purpose: files/settings/baseline.yml carries the full pr-title ruleset DISABLED and this flips it active, so deselecting the module heals it back through the ordinary apply.
# A full copy living only here would outlive the module (the apply never deletes an undeclared ruleset) and wedge every PR on a check nothing creates.
#
#   a rule in `main` instead   -> rules append across layers keyed by type, so the override layer's required_status_checks would replace it
#   its own active ruleset      -> active rulesets on one branch union their required checks

rulesets:
  - name: pr-title
    enforcement: active
