# This file is managed by {{github_username}}/repo-platform.
# Local edits are replaced on the next sync.
#
# Dependabot's deno ecosystem does version updates only, so this run is
# the advisory coverage (GitHub Advisory Database via `deno audit`).

name: Deno Audit

on:
  pull_request:
    paths: ["**/deno.lock"]
  push:
    branches: [main]
    paths: ["**/deno.lock"]
  schedule:
    - cron: "37 7 * * 1"
  workflow_dispatch:

permissions:
  contents: read

# Newest audit per ref wins; a superseded run's verdict is stale anyway.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      DENO_NO_UPDATE_CHECK: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: denoland/setup-deno@22d081ff2d3a40755e97629de92e3bcbfa7cf2ed # v2.0.5
        with:
          deno-version-file: .dvmrc
      # Every tracked lockfile, nested ones included, each from its own directory; the script's
      # header carries the fleet's audit policy. Its permissions are exactly the two it spends.
      - name: Audit dependencies (deno)
        run: deno run --allow-run=git,deno --allow-env .github/scripts/deno-audit.ts
