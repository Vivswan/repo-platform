---
# This repository's OWN settings, applied by Vivswan/repo-platform's
# central settings-repos run (and by the settings-sync workflow on pushes
# to this file, when the repo carries its own REPO_PLATFORM_TOKEN; without
# one that self-apply skips with a warning).
#
# Rendered ONCE by the settings-sync module, repo-owned from then on:
# template sync never rewrites or deletes this file. The managed baseline
# (the shared repository policy block, the module-derived label roster,
# the fleet rulesets) is NOT in this file - repo-platform computes it per
# repository at apply time and deep-merges this file OVER it:
#
# - Keys here win; objects merge key by key.
# - Setting a key to null opts this repository out of that part of the
#   baseline entirely.
# - labels and rulesets are name-keyed unions: an entry here replaces the
#   same-name baseline entry wholesale, and both sides' other entries are
#   kept - declare only this repository's own additions and overrides.
#
# Undeclared labels are deleted by the apply (against the MERGED roster,
# so baseline labels are always safe); undeclared rulesets are left alone.

repository:
  description: "Golden render fixture"
  # homepage, topics, and private are always declared, even when empty or
  # public: the apply manages only declared keys, so this keeps it healing
  # out-of-band edits (an empty value declares-and-clears).
  homepage: ""
  topics: ""
  private: false

# This repository's own labels (the baseline already carries the
# dependabot, release, and tracking labels its modules need):
# labels:
#   - name: my-label
#     color: "0e8a16"
#     description: What it marks

# This repository's own rulesets, or whole-entry overrides of baseline
# ones (an entry named like a baseline ruleset replaces it wholesale):
# rulesets:
#   - name: my-ruleset
#     target: branch
#     enforcement: active
