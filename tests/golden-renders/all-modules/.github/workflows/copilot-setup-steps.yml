# Copilot runs this job (it MUST be named copilot-setup-steps) to prepare
# its environment; the push/PR triggers exist so edits to this file are
# validated in CI. Generated once by Vivswan/repo-platform,
# never overwritten by template sync.

name: Copilot Setup Steps

on:
  workflow_dispatch:
  push:
    paths: [.github/workflows/copilot-setup-steps.yml]
  pull_request:
    paths: [.github/workflows/copilot-setup-steps.yml]

permissions:
  contents: read

jobs:
  copilot-setup-steps:
    runs-on: ubuntu-latest
    timeout-minutes: 59
    steps:
      - uses: actions/checkout@v7

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: .bun-version
      - uses: actions/cache@v6
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('**/bun.lock') }}
          restore-keys: bun-${{ runner.os }}-
      - name: Install dependencies (bun)
        run: bun install --frozen-lockfile

      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          package-manager-cache: false
      - name: Install dependencies (npm)
        run: npm ci

      - uses: denoland/setup-deno@v2
        with:
          deno-version-file: .dvmrc
          cache: true
      - name: Install dependencies (deno)
        env:
          DENO_NO_UPDATE_CHECK: "1"
        run: deno ci

      - uses: astral-sh/setup-uv@v10.0.1
      - name: Install dependencies (uv)
        run: uv sync
