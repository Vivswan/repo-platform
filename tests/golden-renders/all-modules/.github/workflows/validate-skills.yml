# This file is managed by Vivswan/repo-platform.
# Local edits may be replaced during template updates.
#
# Advisory on purpose: npx needs the network and can flake, and an
# advisory red must never block merges; the offline structural validation
# runs inside the gate (ci.yml's validate-skills job).

name: Validate Skills

on:
  pull_request:
    # The workflow's own path too, so a pin bump to this file runs it.
    paths: ["skills/**", ".claude-plugin/**", ".github/workflows/validate-skills.yml"]

permissions:
  contents: read

jobs:
  discovery:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: Vivswan/repo-platform/actions/validate-skills@build
        with:
          skills-dir: "skills"
          mode: discovery
