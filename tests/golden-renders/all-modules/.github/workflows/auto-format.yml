# Repo-owned: generated once by Vivswan/repo-platform, never
# overwritten by template sync - adjust the format commands freely. The
# push uses github.token, which starts no workflows; a PAT would
# re-trigger CI, but any same-repo PR's formatter tooling runs in this
# checkout before the push - only wire in a token you would expose to it.

name: Auto Format

on:
  pull_request:
    types: [labeled]

# Per-label group: unrelated labels skip in their own group, while
# re-adding fix-lint cancels the older fix-lint run in favor of the newest.
concurrency:
  group: auto-format-${{ github.event.pull_request.number }}-${{ github.event.label.name }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  format:
    # GITHUB_TOKEN cannot push to a fork's branch, and PR-controlled tool
    # configuration must not run next to write credentials.
    if: github.event.label.name == 'fix-lint' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          persist-credentials: false

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: .bun-version
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('**/bun.lock') }}
          restore-keys: bun-${{ runner.os }}-
      - name: Format (biome)
        run: bun x @biomejs/biome@2 check --write .

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
          package-manager-cache: false
      - name: Format (biome via npm)
        run: npx --yes @biomejs/biome@2 check --write .

      - uses: denoland/setup-deno@22d081ff2d3a40755e97629de92e3bcbfa7cf2ed # v2.0.5
        with:
          deno-version-file: .dvmrc
          cache: true
      - name: Format (deno)
        env:
          DENO_NO_UPDATE_CHECK: "1"
        run: |
          deno lint --fix || true
          # Markdown prose is never re-wrapped: documents carry no width limit.
          deno fmt --prose-wrap preserve

      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
      - name: Format (ruff)
        run: |
          uvx ruff check --fix . || true
          uvx ruff format .

      - name: Commit and push changes
        id: push
        env:
          GH_TOKEN: ${{ github.token }}
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
        run: |
          if git diff --quiet; then
            echo "nothing to format"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "style: apply automated formatting"
          git push "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" HEAD:"$HEAD_REF"
          # Checks will not re-run on the new head (github.token): flag it
          # for the sticky PR comment below and as an annotation, but stay
          # green - the push itself succeeded.
          echo "no_retrigger=true" >> "$GITHUB_OUTPUT"
          echo "::warning::formatting commit pushed with github.token - checks will not re-run on the new head; close/reopen the PR to re-run them"
      # One comment per PR, edited in place on later runs; a failed post
      # fails the step.
      - name: Comment that checks will not re-run
        if: steps.push.outputs.no_retrigger == 'true'
        uses: marocchino/sticky-pull-request-comment@5770ad5eb8f42dd2c4f34da00c94c5381e49af88 # v3.0.5
        with:
          header: repo-platform/auto-format
          message: >
            Pushed a formatting commit with the default workflow token, which starts no workflows,
            so checks will not re-run on the new head. Close and reopen this PR to re-run them.
      # The label is a one-shot request: remove it even when a step failed,
      # so a broken run cannot loop.
      - name: Remove the fix-lint label
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          PR_URL: ${{ github.event.pull_request.html_url }}
        run: gh pr edit "$PR_URL" --remove-label fix-lint
