# This file is managed by Vivswan/repo-platform.
# Local edits may be replaced during template updates.
#
# workflow_run fires same-repo only (hence this thin trigger; the
# judgment is repo-platform's reusable), and it executes the DEFAULT
# branch's copy of this file - changes land only after they merge.

name: All Green

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
  # Copilot's review submission is the wake that re-judges a verdict left
  # pending on the owed review (a check run's completion fires no event).
  pull_request_review:
    types: [submitted]
  workflow_dispatch:
    inputs:
      sha:
        description: Commit whose newest completed CI run should be re-judged (the unwedge path for a lost workflow_run event).
        required: true
        type: string

permissions: {}

# Serialize judgments per sha so their check-run POSTs stay ordered. Never
# cancel: a verdict cancelled between judging and posting is a lost check.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.workflow_run.head_sha || github.event.pull_request.head.sha || inputs.sha }}
  cancel-in-progress: false

jobs:
  verdict:
    permissions:
      checks: write
      actions: read
    uses: Vivswan/repo-platform/.github/workflows/reusable-all-green.yml@build
    with:
      sha: ${{ github.event_name == 'workflow_dispatch' && inputs.sha || '' }}
      # Must have SUCCEEDED or the verdict fails closed: without this
      # anchor, editing the ci: job out of the managed ci.yml would disarm
      # every fleet gate.
      require-job: ci / validate-template
      # Renders true only on public repos - Copilot reviews are off on
      # private ones, so true there would pend forever.
      require-copilot-review: true
      conditional-workflows: '[]'

  # This wrapper runs the default branch's copy, so the leg goes live on
  # the first main push after the sync PR delivering it merges.
  release:
    needs: [verdict]
    # result is spelled out so the release never depends on GitHub's
    # implied-success() rule; conclusion is empty on a pending verdict and
    # unset on a refused one, so neither can release.
    if: >-
      needs.verdict.result == 'success' &&
      needs.verdict.outputs.conclusion == 'success' &&
      github.event_name == 'workflow_run' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_branch == 'main'
    # Deliberately a lane no group inside the called release.yml takes:
    # this job HOLDS it while its called jobs run, so one name would
    # deadlock.
    concurrency:
      group: post-green-release
      cancel-in-progress: false
    permissions:
      contents: write
      pull-requests: write
      packages: write
      id-token: write
      attestations: write
      issues: read
      vulnerability-alerts: read
    uses: ./.github/workflows/release.yml
    with:
      # Never github.sha: on workflow_run events that is main's CURRENT
      # tip, which can already be a newer - even red - commit.
      sha: ${{ github.event.workflow_run.head_sha }}
    secrets: inherit
