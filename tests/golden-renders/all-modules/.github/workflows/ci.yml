# This file is managed by Vivswan/repo-platform.
# Local edits may be replaced during template updates.
#
# The gate jobs live in fleet-ci.yml@build: an edit there changes this
# repository's CI with no PR here. Branch protection requires only the
# `all-green` check run the verdict workflow creates; every job gates
# unless named `info-*`, and a skipped job stands down.

name: CI

on:
  push:
    branches: [main]
  # `edited` too: a PR title edit must re-run title-sensitive checks.
  pull_request:
    types: [opened, edited, reopened, synchronize]
  workflow_dispatch:
  # Weekly CodeQL re-scan with refreshed query packs.
  schedule:
    - cron: "3 8 * * 1"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Repo-owned: edit checks.yml, not this file (no secrets; permissions
  # cap at contents: read).
  checks:
    uses: ./.github/workflows/checks.yml

  # This caller's permissions are the ceiling for every called job and
  # must stay UNCONDITIONAL: GitHub validates skipped jobs' grants too.
  ci:
    uses: Vivswan/repo-platform/.github/workflows/fleet-ci.yml@build
    permissions:
      contents: read
      # validate-template posts its sticky findings comment.
      pull-requests: write
      # The ceiling for the CodeQL analysis calls.
      security-events: write
      actions: read
      # The ceiling for release-health's issue and Dependabot-alert reads.
      issues: read
      vulnerability-alerts: read
    with:
      modules: '["agents", "bun", "node", "deno", "uv", "rust", "pages", "release-please", "issue-templates", "skills", "pr-title", "auto-assign", "fuzzer", "nightly", "settings-sync"]'
      private: false
      skills-dir: "skills"
      codeql-languages: '["javascript-typescript", "python"]'
      tracking-labels: "fuzz-nightly,nightly-failure"
