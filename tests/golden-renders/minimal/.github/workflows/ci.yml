# This file is managed by Vivswan/repo-platform.
# Local edits may be replaced during template updates.
#
# The all-green convention: branch protection requires the `all-green`
# check, which needs every other job here, so the required-checks list never
# changes as jobs come and go (its one sibling required check is Copilot's
# own per-sha review check run - settings data, never a CI job). This
# repository's own test and lint jobs live
# in checks.yml (repo-owned, never overwritten by sync) and run inside the
# gate through the `checks` job. Module checks (the pr-title title check,
# CodeQL analysis) run inside the gate too, so branch protection blocks on
# them without extra required checks.
#
# The base checks (typography, commit-names, actionlint, yamllint, gitleaks)
# render as one job each on public repositories and as steps of a single
# base-checks job on private ones, where every job bills a rounded-up minute.

name: CI

on:
  push:
    branches: [main]
  # `edited` on top of the default three: a PR title edit must re-run the
  # gate so title-sensitive checks (the pr-title module) stay honest. The
  # cancel-in-progress concurrency below bounds the extra runs.
  pull_request:
    types: [opened, edited, reopened, synchronize]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Repo-owned checks: edit .github/workflows/checks.yml, not this file. No
  # secrets are passed and permissions cap at contents: read; a check that
  # needs either belongs in its own workflow (see
  # https://github.com/Vivswan/repo-platform/blob/main/docs/all-green.md).
  checks:
    uses: ./.github/workflows/checks.yml

  # TWO checks, one job, different consequences - both live in the
  # validate-template-report action, which wraps the validate-template
  # integrity action with the freshness ref compare and the reporting.
  #
  # INTEGRITY validates the tree against the state it was stamped with. A
  # failure means managed content changed out of band, so it BLOCKS - on
  # pull requests and on main pushes alike, because a red gate is the
  # owner's signal that something edited files the next sync will
  # overwrite. Restore the file from history, or run a recovery sync.
  #
  # FRESHNESS is only "how far behind the template is this repo", which is
  # never the repository's fault and never its blocker - the next sync PR
  # closes it. It is one ref compare, no copier and no render, and its OWN
  # failures (network, an operator repo this token cannot read) skip with a
  # notice rather than going red.
  #
  # What stays here is the shape a composite action cannot carry: the job
  # name and its all-green needs entry, the comment permission scoped to
  # this one job, and the LAST step re-raising the action's deferred
  # verdict - so the findings comment is already posted when the gate goes
  # red, readable in the PR conversation instead of only in the run log.
  validate-template:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      # Only for the sticky comment, and only on this job.
      pull-requests: write
    steps:
      - uses: actions/checkout@v7
      - uses: Vivswan/repo-platform/actions/validate-template-report@build
        id: template
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          template-repo: Vivswan/repo-platform
      # Last, so the comment above is already posted when the gate goes red.
      # Fail-closed: != 'success' re-raises on 'failure' AND on an output
      # that resolved empty (a broken mapping must never read as green).
      - name: Fail on an integrity finding
        if: steps.template.outputs.integrity != 'success'
        run: |
          echo "::error::validate-template found managed content that changed outside a sync; see the findings on this PR (or the job summary) and the step log above."
          exit 1

  typography:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: Vivswan/repo-platform/actions/check-typography@build

  commit-names:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: Vivswan/repo-platform/actions/validate-commit-names@build

  actionlint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: raven-actions/actionlint@v2

  yamllint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      # The pip install and the strict lint invocation live in the action.
      - uses: Vivswan/repo-platform/actions/yamllint@build

  gitleaks:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      # Secret scanning: a committed credential fails the gate. The action
      # scans the event's commit range (fetch-depth 0 above lets any range
      # resolve); audit the OLD history once with a local `gitleaks git`.
      # Personal-account repos need no GITLEAKS_LICENSE; allowlist false
      # positives in the repo-owned .gitleaks.toml at the repository root
      # (seeded by the template, never overwritten by sync).
      # pull-requests read on this job: the action lists the PR's commits
      # to build the scan range. Comments off keeps that scope at read;
      # leaks still land in the job summary and SARIF artifact.
      - uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_ENABLE_COMMENTS: "false"
          # The action's default binary (8.24.3) predates .gitleaks.toml's
          # minVersion floor AND skips that check silently; pin one meeting
          # the floor so CI honors the same config local runs do.
          GITLEAKS_VERSION: "8.30.1"

  # Fails when a PR introduces dependencies with known vulnerabilities, by
  # diffing the dependency graph between base and head. Public renders only:
  # the dependency-graph API behind it is free just for public repositories.
  # Only PR events have a diff to review, so the skip lives on the steps:
  # all-green treats a skipped needed job as failure, so the job itself
  # stays unconditional.
  dependency-review:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        if: github.event_name == 'pull_request'
      # The severity threshold and the upstream pin live in the wrapper.
      - uses: Vivswan/repo-platform/actions/dependency-review@build
        if: github.event_name == 'pull_request'
  all-green:
    name: all-green
    if: always()
    needs:
      - checks
      - typography
      - commit-names
      - actionlint
      - gitleaks
      - yamllint
      - dependency-review
      - validate-template
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: All jobs green
        env:
          NEEDS: ${{ toJson(needs) }}
        run: |
          set -o pipefail
          jq -r 'to_entries[] | "\(.value.result)\t\(.key)"' <<< "$NEEDS"
          failed="$(jq -r 'to_entries[] | select(.value.result != "success") | .key' <<< "$NEEDS" | tr '\n' ' ')"
          if [ -n "$failed" ]; then
            echo "::error::all-green failed: ${failed% } did not succeed. Open the failing job's log in this run, fix the failure, and push again."
            exit 1
          fi
