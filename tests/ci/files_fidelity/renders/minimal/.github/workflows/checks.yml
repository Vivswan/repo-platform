# Repo-owned: generated once by Vivswan/repo-platform, never
# overwritten by template sync - edit freely. Jobs here get no secrets and
# cap at contents: read; a job skipped by its own `if:` stands down from
# the all-green gate, and `continue-on-error: true` keeps even a job's
# failures out (an advisory check). A check needing more belongs in its
# own workflow wired via .github/settings.yml.

name: Checks

on:
  workflow_call:

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: No repository checks yet
        run: echo "add this repository's test and lint jobs to checks.yml"
