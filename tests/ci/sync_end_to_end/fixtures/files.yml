# The end-to-end fixture's files.yml, paired with the seeded checkout in tests/ci/sync_end_to_end.test.ts:
# each entry exists for one state that test asserts.
placeholders:
  - project_name
  - project_slug
  - description
  - github_username
  - github_username_lower
  - copyright_holder
  - year
  - fuzzer_label
  - private
modules:
  bun:
    gitignore_sources: [Node, Bun]
    dependabot_ecosystems: [bun]
    checks_examples: [bun]
  deno:
    gitignore_sources: [Node]
    dependabot_ecosystems: [deno]
  pages: {}
  docs-site: {}
  fuzzer:
    gitignore_sources: [fuzzer]
    tracking_label: {key: fuzzer, default: fuzz-nightly, color: B60205, description: Automated nightly fuzz failure}
settings:
  baseline: files/settings/baseline.yml
  layers:
    - {source: files/settings/public.yml, when: {private: false}}
    - {source: files/settings/private.yml, when: {private: true}}
    - {source: files/bun/settings.yml, when: {modules: [bun]}}
  override: files/settings/override.yml
files:
  - path: .github/workflows/ci.yml
    class: managed
  - path: LICENSE.md
    class: managed
    source: files/base/LICENSE.txt
  - path: .github/SECURITY.md
    class: managed
  - path: .gitignore
    class: split
    region: hash
    blocks: gitignore_sources
    upstream:
      repository: github/gitignore
      sha: 0123456789abcdef0123456789abcdef01234567
      always: [Windows, macOS, Linux]
      paths:
        Windows: Global/Windows.gitignore
        macOS: Global/macOS.gitignore
        Linux: Global/Linux.gitignore
        Node: Node.gitignore
        Bun: Bun.gitignore
  - path: AGENTS.md
    class: split
    region: html
  - path: .github/dependabot.yml
    class: managed
    blocks: dependabot_ecosystems
    source: files/base/.github/dependabot.template
  - path: .github/workflows/checks.yml
    class: starter
    blocks: checks_examples
  - path: .github/actions/site-build/action.yml
    class: starter
  - path: .github/settings.local.yml
    class: starter
  - path: .github/settings.yml
    class: managed
    render: settings
    overlay: .github/settings.local.yml
  - path: .editorconfig
    class: split
    region: hash
  - path: .gitattributes
    class: split
    region: hash
  - path: .yamllint
    class: split
    region: hash
  - path: constructor
    class: managed
  - path: .dockerignore
    class: split
    region: hash
  - path: .github/workflows/docs-site.yml
    class: managed
    when: {modules: [docs-site], without: [pages]}
    source: files/docs-site/docs-site.standalone.yml
  - path: .github/workflows/docs-site.yml
    class: managed
    when: {modules: [docs-site, pages]}
    source: files/docs-site/docs-site.with-pages.yml
  - path: .github/workflows/nightly-fuzz.yml
    class: starter
    when: {modules: [fuzzer]}
  - path: .github/workflows/private-only.yml
    class: managed
    when: {private: true}
  - path: docs/NOTES.md
    class: managed
    when: {modules: [pages]}
mirrors:
  - source: AGENTS.md
    kind: symlink
    targets: [CLAUDE.md, .github/agents.md, .github/copilot-instructions.md]
