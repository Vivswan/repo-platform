# The end-to-end fixture's data file: one entry per class, blocks on a
# split, a managed, and a starter entry (two modules declaring one block
# value), a same-path pair split by module conditions, a visibility-gated
# entry, two links, three class flips (one from a hash-less record, which
# is held), and the retirements: clean, edited, moved, a starter, a move to
# an unselected home, and a split file with repository-owned content around
# its region.
placeholders:
  - project_name
  - project_slug
  - description
  - github_username
  - github_username_lower
  - copyright_holder
  - year
  - skills_dir
  - fuzzer_label
modules:
  bun:
    gitignore_sources: [Node, Bun]
    dependabot_ecosystems: [bun]
    checks_examples: [bun]
  node:
    gitignore_sources: [Node]
    dependabot_ecosystems: [npm]
  pages: {}
  docs-site: {}
  fuzzer:
    tracking_label: {key: fuzzer, default: fuzz-nightly}
  skills:
    skills_dir: {default: skills}
files:
  - path: .github/workflows/ci.yml
    class: managed
  - path: LICENSE.md
    class: managed
    source: files/base/LICENSE.txt
  - path: .github/SECURITY.md
    class: managed
  - path: .gitignore
    class: split
    region: hash
    blocks: gitignore_sources
  - path: AGENTS.md
    class: split
    region: html
  - path: CLAUDE.md
    class: link
    target: AGENTS.md
  - path: .github/agents.md
    class: link
    target: ../AGENTS.md
  - path: .github/dependabot.yml
    class: managed
    blocks: dependabot_ecosystems
    source: files/base/.github/dependabot.template
  - path: .github/workflows/checks.yml
    class: starter
    blocks: checks_examples
  - path: .editorconfig
    class: split
    region: hash
  - path: .gitattributes
    class: split
    region: hash
  - path: .yamllint
    class: split
    region: hash
  - path: constructor
    class: managed
  - path: .dockerignore
    class: split
    region: hash
  - path: .github/workflows/docs-site.yml
    class: managed
    when: {modules: [docs-site], without: [pages]}
    source: files/docs-site/docs-site.standalone.yml
  - path: .github/workflows/docs-site.yml
    class: managed
    when: {modules: [docs-site, pages]}
    source: files/docs-site/docs-site.with-pages.yml
  - path: .github/workflows/nightly-fuzz.yml
    class: starter
    when: {modules: [fuzzer]}
  - path: .github/workflows/validate-skills.yml
    class: managed
    when: {modules: [skills]}
  - path: .github/workflows/private-only.yml
    class: managed
    when: {private: true}
  - path: docs/NOTES.md
    class: managed
    when: {modules: [pages]}
retired:
  - path: .github/.copier-answers.yml
  - path: .github/workflows/release.yml
  - path: SECURITY.md
    moved_to: .github/SECURITY.md
  - path: .github/workflows/old-starter.yml
  - path: OLD_NOTES.md
    moved_to: docs/NOTES.md
  - path: CONTRIBUTING.md
