# Fleet config for the push sync: which repos are managed.
# Validated and resolved by .github/scripts/fleet/repos_registry.ts.
#
# - managed: owner/name slugs, or one quoted "*" wildcard. The wildcard
#   auto-discovers every owned, non-archived repo the PAT can WRITE to
#   (granting the fleet PAT a repository is what enrolls it)
#   (quoted because a bare * is YAML alias syntax).
# - exclude: discovered repos that must NOT be synced (opt-outs).
# - Modules are NOT fleet config: each repo selects them in its own
#   .repo-platform.yml.
# - Settings: every managed repo (a .repo-platform.yml on its default
#   branch) gets the managed baseline + its own .github/settings.yml
#   applied (docs/settings.md).

managed:
  - "*"

exclude: []
